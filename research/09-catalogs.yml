- id: CAT-182
  claim: GENCODE changed a biotype rule outright and gave its reason. Protein-coding genes carrying a loss-of-function
    mutation in the reference sequence had been annotated as polymorphic pseudogenes; from release 40 onwards
    they are annotated as protein-coding genes instead, with the affected transcripts carrying a protein-coding
    loss-of-function flag. The trigger was the pangenome, where the same gene exists as functional and non-functional
    alleles on different assemblies and a pseudogene label on the reference would misdescribe the rest.
