- id: CAT-185
  claim: Biotype changes in GENCODE run in both directions and sometimes reverse. Of 10,718 transcripts that
    moved between the protein-coding and lncRNA labels across the releases audited, 6,560 moved from protein-coding
    to lncRNA and 5,463 moved the other way; 650 lncRNA annotations returned to lncRNA after a spell as protein-coding,
    and 688 protein-coding annotations returned to protein-coding after a spell as lncRNA. The lncRNA label
    in that audit is a pooled class of 23 sub-biotypes that includes retained intron, processed transcript
    and several pseudogene classes, so a move to lncRNA is a move out of protein-coding rather than a move
    to a long non-coding RNA.
