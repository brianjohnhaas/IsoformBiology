- id: CAT-194
  claim: 'The minimum size for admission to the Phase I ORF catalogue was 16 amino acids, and the consortium
    says the number is a convenience rather than a biological boundary: the source studies reported shorter
    ORFs inconsistently, very short ORFs are nominated unreliably by Ribo-seq pipelines, and mass spectrometry
    cannot place very short peptides unambiguously. Those authors note in the same place that no reference
    annotation project applies a minimum protein size at all, and that shorter ORFs are numerous in Ribo-seq
    data and some of them do replicate.'
