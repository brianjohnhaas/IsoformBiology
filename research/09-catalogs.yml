- id: CAT-296
  claim: 'One long-read benchmark built its discovery test by hiding truth rather than finding it: forty isoforms
    were removed at random from the synthetic spike-in annotation and tools were asked to recover them from
    downsampled nanopore cDNA data. On the full data with the complete annotation bambu gave the highest recall
    at about 0.91 and precision about 0.62; on the downsampled data StringTie2 recovered 80 per cent of the
    removed isoforms and about 76 per cent of the retained ones, and across tools recovery of the removed isoforms
    ran from about 0.28 for FLAIR to 0.80 for Cupcake and StringTie2.

    '
