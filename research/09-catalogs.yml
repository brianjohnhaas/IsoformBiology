  claim: GENCODE's long-read pipeline was tuned against a stated error budget rather than against an agreement
    rate. TAGENE filters and merges long-read datasets, clusters the surviving transcripts into loci, then
    filters again on other transcriptomic evidence including RNA-seq-supported introns and the existing annotation,
    and, as of GENCODE's 2021 report, the clustering and final filtering steps were iterated under manual review
    until the false-positive rate for adding a spurious model fell below 0.1 per cent.
