claims:
  - id: CAT-001
    claim: >
      ENCODE4 built its long-read transcriptome from 264 PacBio libraries drawn
      from 81 human and mouse tissue or cell-line samples, which the authors
      reduce to 49 unique tissues or cell types once mouse developmental
      time-points are collapsed.
    topic: ENCODE4 long-read RNA-seq
    source:
      doc_id: bio_ad940b766ccc
      title: "The ENCODE4 long-read RNA-seq collection reveals distinct classes of transcript structure diversity"
      authors: "Reese, F., Williams, B., Balderrama-Gutierrez, G., Wyman, D., Celik, M. H., Rebboah, E., et al. (Mortazavi, A.)"
      journal: "bioRxiv"
      year: 2023
      doi: 10.1101/2023.05.15.540865
      bibkey: reese2023encode4
    evidence:
      text_access: full_text
      lines: L43
      anchor: https://paperclip.gxl.ai/citations/papers/bio_ad940b766ccc#L43
      quote: >
        profiled 81 tissues or cell lines by using the PacBio sequencing platform on 264 human and mouse libraries that include replicate samples
    confidence: high
    figure_idea: >
      A single panel showing, for the main human isoform catalogs side by side,
      how many biological samples each rests on versus how many transcripts it
      reports - making the point that catalog size and sampling breadth are
      decoupled.

  - id: CAT-002
    claim: >
      In the ENCODE4 human long-read data, 206,806 transcripts from
      polyadenylated genes were detected at or above 1 TPM, and 76,469 of them -
      about 37 per cent - used an exon junction chain annotated in neither
      GENCODE v29 nor v40.
    topic: ENCODE4 long-read RNA-seq
    source:
      doc_id: bio_ad940b766ccc
      title: "The ENCODE4 long-read RNA-seq collection reveals distinct classes of transcript structure diversity"
      authors: "Reese, F., Williams, B., Balderrama-Gutierrez, G., Wyman, D., Celik, M. H., Rebboah, E., et al. (Mortazavi, A.)"
