- id: CAT-162
  claim: 'The two main human references handle incomplete evidence by opposite rules, and the difference is
    editorial rather than technical: where several RefSeq transcripts at a locus share a first and last exon,
    RefSeq gives them all the same start and end coordinates, while GENCODE stops each model where its evidence
    stops and tags the result start_not_found or end_not_found. GENCODE therefore carries many deliberately
    truncated transcripts that RefSeq would have extended.'
