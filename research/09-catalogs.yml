- id: CAT-192
  claim: 'Faced with ORF lists that disagreed between studies, the consortium made recurrence the criterion
    rather than any single experiment''s statistics: an ORF counted as replicated if more than one dataset
    reported it. That left 3,085 replicated ORFs out of the 7,264 collapsed ORFs in the Phase I catalogue,
    and the pass rate differed sharply by ORF class, 62.8 per cent of overlapping upstream ORFs and 57.3 per
    cent of upstream ORFs against 30.1 per cent of ORFs in annotated lncRNAs, 13.6 per cent of internal out-of-frame
    ORFs and 12.8 per cent of downstream ORFs.'
