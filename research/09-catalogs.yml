      quote: >
        Altogether, we detected 206,806 transcripts expressed >= 1 TPM from polyA genes, 76,469 of which have exon junction chains unannotated in GENCODE v29 or v40.
    confidence: high

  - id: CAT-003
    claim: >
      ENCODE4 novelty was unevenly distributed across the three structural axes
      of a transcript: splice patterns were far more often unannotated than
      transcript start or end sites.
