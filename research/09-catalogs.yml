  claim: 'The retained-intron and processed-transcript labels in GENCODE are, by the project''s own account,
    often a statement about the evidence rather than about the molecule: these models usually rest on truncated
    RNA evidence, so a coding sequence cannot be assigned confidently, and the transcript is labelled as carrying
