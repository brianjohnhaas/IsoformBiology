    is noted. What remains missing is a count: no source read states a transcript total or a per-gene average
    for GENCODE Basic. The closest available figure is the ratio in CAT-109, where the exact per-set sizes
    are in an UpSet plot (PMC13689501 Figure 6C) and so are not citable. The 87,814 of CAT-142 must not be
