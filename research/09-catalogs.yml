- id: CAT-190
  claim: RefSeq's removal rule follows from a split in the database that outsiders often miss. Pipeline-generated
    model records, whose accessions begin with X, are created or updated only when a genome is re-annotated,
    but they can be deleted at any time after manual review; the separately maintained known subset is not
    governed that way. A review of the human model set revised gene type designations, replaced model records
    with known ones and removed records judged insufficiently supported, and between releases 43 and 49 some
    2,068 model RefSeqs met the evidence criteria to be promoted to known records.
