    which returned nothing on a bounded scan; a grep of PMC9007741 for the patterns Select, updated, stable,
    ''Ensembl 92'' and ''RefSeq 109''; a grep for canonical across the Ensembl 2022 to Ensembl 2026 papers;
    and a grep for ''MANE Select'' across the GENCODE 2021, 2023 and 2025 reports and the Ensembl 2025 and
    2026 papers, whose hits were read. Semantic search was degraded throughout, so this is a negative from
    keyword search only. What exists is policy, not behaviour: MANE states at PMC9007741 L20, a line already
    cited by CAT-017, that most Select transcripts will be stable with updates allowed on rare occasions, and
    CAT-127 records the plan to finalise Select while extending Plus Clinical. PMC9007741 L61 describes a comparison
    of MANE Select against the earlier RefSeq 109 and Ensembl 92 annotation sets, binned into identical, UTR-only,
    CDS-changed and no-equivalent-splice-pattern categories, but its result could not be located in the body
    text and is presumably in Extended Data or Supplementary Table 1, neither read. The versioned MANE summary
    files on the NCBI FTP site would give the replacement rate directly.'
  why: This is the editorial-policy question the chapter's title implies. The chapter can report the policy
    and the identifier churn around it (CAT-145, CAT-142) and the instability of the expression-based alternative
    (CAT-148), but not the replacement rate itself.
- note: MANE's scope has quietly stopped being protein-coding only. CAT-110 records the first MANE Select transcripts
    for clinically important lncRNAs in MANE v1.4, and CAT-111 records MANE v1.4 as containing 50 disease-associated
    non-coding genes, naming RNU4ATAC. No paper describing the selection rule for a non-coding MANE Select
    was found by keyword search, so the rule behind those 50 genes is unrecorded.
  why: The chapter defines MANE Select as one transcript per protein-coding gene, which is now incomplete,
    and the extension is a catalogue decision of exactly the kind this chapter is about.
- note: Pozo et al. exists in the corpus both as PMC9579139 (NPJ Genomic Medicine, 2022) and as an earlier
    bioRxiv preprint at bio_6725fd266c55 titled 'APPRIS principal isoforms and MANE Select transcripts in clinical
    variant interpretation'. All lines cited by CAT-122 to CAT-126 were read in the journal version, so preprint
    is not set on those records. The preprint was not read and its numbers were not compared.
  why: Worth one check before publication, because the preprint predates the journal version by a year and
    the ClinVar release the analysis maps against is dated 4 April 2021.
- note: 'Independence, by source. Papers whose authors built one of the sets being compared: Harrow et al.
    (CAT-119, CAT-120) and Frankish et al. (CAT-108, CAT-115, CAT-133, CAT-134, CAT-135, CAT-146, CAT-149,
    CAT-150), both GENCODE''s own annotators; Morales et al. (CAT-102 via its Ensembl co-authors, CAT-106,
    CAT-127, CAT-130, CAT-140, CAT-147) by MANE''s; Hunt et al. (CAT-101, CAT-102) and Dyer et al. (CAT-107,
    CAT-110) and Yates et al. (CAT-111) by Ensembl''s; Pujar et al. (CAT-103, CAT-104, CAT-105) by the CCDS
    collaboration''s; Pozo et al. (CAT-122 to CAT-126) by APPRIS''s; Mudge et al. (CAT-116, CAT-117) by GENCODE''s.
    Papers whose authors built none of the sets they measured: McCarthy et al. (CAT-112, CAT-131, CAT-132),
    Srikanth et al. (CAT-109, CAT-128, CAT-129, CAT-136), Page et al. (CAT-113, CAT-114, CAT-137, CAT-138,
    CAT-139, CAT-141), Tung and Lin (CAT-121, CAT-142, CAT-143, CAT-144, CAT-145, CAT-148) and Jalali et al.
    (CAT-118). CAT-140 adds a second-order dependence the chapter does not yet state: APPRIS concordance is
    a scoring component of the pipeline that nominates MANE Select, and prior clinical use is the top-ranked
    RefSeq Select parameter, so both the APPRIS agreement of CAT-022 and the ClinVar agreement of CAT-130 are
    partly agreement with an input. CAT-150 adds a third pattern: a cross-database disagreement resolved by
    the other database moving.'
  why: The project's reviewers find more defects in sentences about independence than in sentences about biology,
    and this chapter is largely resource papers evaluating themselves.
- note: 'The MANE Plus Clinical series now has three version-labelled values but not three comparable ones:
    55 genes at MANE v0.95 (CAT-018, restated for Ensembl release 104 in CAT-102), 58 transcripts at MANE v1.0
    (CAT-143 and, more authoritatively, CAT-149), and 64 transcripts at MANE v1.3 and GENCODE v47 (CAT-052,
    CAT-110). The first is a gene count and the other two are transcript counts, and no source read gives all
    three in one unit. The MANE summary files carry both counts per release and would settle it.'
  why: Plus Clinical growth is the chapter's best evidence for how often one transcript per gene is insufficient,
    and a trend drawn across two units would be a defect.
- note: One-home risk flagged for the orchestrator rather than resolved. CAT-122 to CAT-126 and CAT-147 concern
    pathogenic variants and reference transcripts and could be read as chapter 10's clinical-variant-classification
    territory; they are recorded here because each measures what a catalogue's selection rule costs, not how
    a laboratory classifies a variant. CAT-138, CAT-139, CAT-144 and CAT-148 quantify isoform expression across
    tissues and could be read as chapter 5's measured diversity; they are recorded here because the quantity
    being measured is the effect of an annotation or data release change, not the diversity itself. CAT-128
    and CAT-129 are CRISPR interference library design, which no other chapter's brief claims.
  why: Several chapter 9 records that will look out of place to a reviewer are out of place for a reason, and
    the reason should be on the record before the writing pass.
- note: 'New source blocks in this file carry author strings exactly as paperclip''s meta.json gives them,
    in ''Firstname Lastname; Firstname Lastname'' form with metadata_source paperclip_meta, whereas the existing
    records in research/09-catalogs.yml use Crossref''s ''Lastname, A. B.'' form with metadata_source crossref.
    Eleven source blocks are affected: hunt2021vep, pujar2017ccds, dyer2024ensembl, yates2025ensembl, frankish2015comparison,
    mccarthy2014transcriptchoice, srikanth2026crispri, pozo2022clinicalreference, frankish2020gencode2021,
    frankish2022gencode2023 and harrow2012gencode. Source blocks for works already cited in the book were copied
    verbatim from the repository, so their bibkeys and metadata are unchanged.'
  why: scripts/resolve_metadata.py --write should be run over the merged file before build_bib.py, or the bibliography
    will carry two author formats.
- note: Anchored and read but not written up as claims because the record range was full; each is reusable
    without re-reading. (1) GENCODE's transcribed-pseudogene rule requires a best-in-genome alignment and clear
    differences from the parent locus, and had identified 171 transcribed processed and 309 transcribed unprocessed
    pseudogenes (PMC3431492 L42). (2) GENCODE 7 held about 2,200 non-consensus introns, down from about 3,300
    in release 3c, of which 13 per cent had good cDNA support and 2 per cent could be converted to canonical
    splice sites by known dbSNP 132 variants (PMC3431492 L65). (3) Of 84,408 GENCODE 7 transcripts annotated
    as translated, 30,148, 35.7 per cent, would yield proteins with fewer or damaged Pfam domains, and the
    rate was 79.5 per cent for transcripts predicted to be NMD targets, 71.5 per cent for the putative biotype
    and 62.7 per cent for the novel biotype (PMC3431492 L59,L60). (4) PhyloCSF over 3,689 Ensembl Human BodyMap
    loci that did not overlap GENCODE returned 136 with positive scores, of which only five had enough support
    for manual reannotation as coding (PMC3431492 L73). (5) Mass-spectrometry peptides mapped unambiguously
    to 8,098 of 20,700 GENCODE 7 annotated protein-coding genes, with multiple isoforms detected for 194 genes
    (PMC3431492 L76).
  why: Item 3 of this set is the nearest thing located to a biotype-stratified figure for GENCODE; items 4
    and 5 bound how much of an annotation any single evidence type can reach.
- note: 'RefSeq rules located and read but not recorded: endogenous retroviral loci are out of scope unless
    they are full-length protein-coding, map to a single genomic location, and have either evolved a host function,
    been linked to disease, or been given nomenclature by an official committee (PMC4702849 L81); and the Consensus
    CDS collaboration requires every member to agree before any change to a CDS''s genomic coordinates, with
    the human set then holding 26,473 distinct protein identifiers for 18,471 genes (PMC3245008 L60).'
  why: The ERV rule is the most explicit statement found of a rule that admits a model on function rather than
    on evidence of transcription; the CCDS consensus requirement is the governance mechanism behind MANE.
- note: 'CHESS 3 filters read but not recorded: a transcript was kept only if it was assembled both from individual
    GTEx samples and from the same tissue''s TieBrush-aggregated alignments, a recurrence requirement (PMC10614308
    L24); and the structure-based candidate pipeline ran ColabFold on 194,780 predicted proteins under 1,000
    aa, kept those scoring pLDDT 70 or above, and then cut candidates from 54,205 to 31,772 by protein-substring
    and score comparisons, to 13,133 by removing proteins under 70 aa or under two thirds of the locus maximum,
    to 12,075 by deduplication and to 11,225 by removing read-through overlaps (PMC10614308 L26,L27,L28,L29,L30).'
  why: That six-step funnel is the most completely documented inclusion pipeline found for any human catalogue
    and would make a strong figure on its own.
- note: 'The Titin locus is a ready-made named case for three catalogues'' policies on the same gene: GENCODE
    v41 lists 15 protein-coding transcripts from 48 to 35,991 amino acids with eight shorter than 1,000 aa,
    which GENCODE itself tags as having incomplete coding sequences; RefSeq v110 lists 22 isoforms from 23,564
    to 35,991 aa plus one at 5,604 aa; CHESS lists 8 with the shortest also at 5,604 aa, and no isoform under
    1,000 aa exists in either RefSeq or CHESS (PMC10614308 L46,L64).'
  why: One locus where the policy difference is visible without any statistics, and where the short isoform
    that all three keep has published transcription and translation evidence.
- note: 'Capture long-read annotation rules read but not recorded: under conservative filters 73 per cent of
    human and 64 per cent of mouse reads of insert carried an identifiable polyadenylation site, giving 16,961
    and 12,894 novel sites against GENCODE end positions; and the project''s anchored merging deliberately
    preserves confirmed internal transcript start and polyA sites rather than collapsing them, yielding 179,993
    human and 129,556 mouse transcript models of which 86 and 87 per cent had their entire intron chain supported
    by captured short-read split reads (PMC5709232 L37,L38).'
  why: The anchored-merging decision is a design choice that inflates model counts on purpose, which is the
    chapter's subject in miniature.
- note: 'GENCODE''s own statements about annotating further genomes, read but not recorded: manual annotation
    of additional assemblies is called impractical and unnecessary, with computational mapping between same-species
    genomes via the Comparative Annotation Toolkit and liftover judged broadly effective, and the open problems
    named as segmental duplications with copy-number variation and regions absent from the reference such as
    the acrocentric p-arms (PMC11701607 L125). The same paper reports a gold-standard list of 173 proteins
    of no more than 70 amino acids with high confidence of protein-level function, assembled because earlier
    candidate lists carried many false positives (PMC11701607 L112).'
  why: The first is the policy that will govern pangenome annotation; the second is a positive control set
    that any short-ORF inclusion rule could be scored against.
- note: 'Ribo-seq ORF rules read but not recorded. Near-cognate, non-AUG-initiating ORFs were excluded from
    the Phase I catalogue because only four of the seven source datasets reported them: those four held 10,412
    unique near-cognate ORFs, with CUG at 49 per cent and GUG at 19 per cent of non-AUG initiation sites, about
    17 per cent had an overlapping AUG-initiated translation reported by another study, and only about 6 per
    cent replicated across two or more datasets (bio_12f0efcd6fff L86). The mapping pipeline excluded 1,767
    ORFs that could not be placed on any Ensembl v101 transcript, 423 overlapping pseudogenes and 560 falling
    in-frame within coding sequences of protein-coding or NMD transcripts, then collapsed variants sharing
    90 per cent or more of their amino-acid sequence, arriving at 7,264 (bio_12f0efcd6fff L123).'
  why: The near-cognate exclusion is the clearest case found of a class left out because the source studies
    reported it inconsistently rather than because the evidence was weak.
- note: 'LRGASP''s benchmarking limitations, anchored and still unrecorded here as in the file''s existing
    leads: no long-read mapping method was benchmarked because every tool used minimap2, and the resulting
    mapping errors were identified by GENCODE manual curation; participants submitted a single configuration
    per dataset and chose which data modalities to enter, leaving participation unbalanced (PMC11543605 L150).
    GENCODE manually created reference annotation of about 1,300 transcripts from LRGASP reads for use as ground
    truth (PMC9825462 L111).'
  why: The manual curation that caught the mapping errors is itself a measurement of what automation misses,
    and the 1,300-transcript ground truth is the denominator behind the LRGASP validation rates.
- note: 'TAGENE''s internal method comparison, read but not recorded: after iterative testing led by manual
    annotators, tmerge replaced PASA for clustering reads into prospective transcript models, and across over
    1,000 tested TAGENE models tmerge produced notably fewer clustering errors (PMC9825462 L89). GENCODE also
    identified 895 putative missing human transcripts from an integrated analysis of RefSeq, UniProtKB, published
    predictions, large-scale proteomics peptides, human variation data, APPRIS conflicts and coding-exon evolutionary
    history, of which 441 were added during manual review (PMC9825462 L116).'
  why: The tmerge comparison is the only head-to-head tool comparison inside a reference project's own pipeline
    that was located; it gives a model count but no error rate, which is why it was not recorded as a claim.
- note: 'GENCODE''s database merge gave annotators a new power worth a sentence: manual annotation and computational
    annotation moved into a single database per species, which lets manual annotators directly bless, update
    or remove computationally annotated models, and new models now receive Ensembl stable identifiers at creation
    rather than interim ones (PMC7778937 L79).'
  why: This is the mechanism by which an automated model becomes a curated one, which the chapter currently
    has no account of.
- note: 'Downstream-cost measurements located, read and not recorded for lack of record ids. (1) Junction reads
    are where annotation choice bites: with 75 bp reads from the Human Body Map, about 95 per cent of non-junction
    reads mapped to exactly the same location whichever gene model was used, against 53 per cent of junction
    reads, and about 30 per cent of junction reads failed to align at all without a gene model (PMC4339237
    L8). (2) Differential-expression performance rises monotonically with transcript mappability, with area
    under the ROC curve improving by 0.15 to 0.22 across mappability terciles in the low-abundance group and
    quantification-step Spearman correlation improving by 0.29 to 0.35, across five pipelines on simulated
    data (PMC8501603 L85). (3) The newer Ensembl and RefSeq annotations left more fragments unassigned both
    for failing to overlap any gene and for overlapping more than one, and nearly 60 per cent of Ensembl 100
    genes were absent from both RefSeq annotations tested, with 25,496 genes common to all three (PMC8969366
    L54,L65,L66,L74).'
  why: Item 1 localises the whole annotation-choice effect to spliced reads, which is why it matters more for
    isoform work than for gene-level work.
- note: 'A downstream consumer''s own inclusion rule, read and not recorded: a 2026 genome-wide CRISPR interference
    library catalogued all transcripts of protein-coding genes in GENCODE release 48 of May 2025 and reports
    that MANE Select and Ensembl Canonical, being one transcript per gene, together comprise less than one
    seventh of the Comprehensive set, with GENCODE Primary, GENCODE Basic and the protein-coding subset each
    adding roughly 20,000 transcripts (PMC13689501 L47). In designing the library the authors removed 39 transcripts
    that lacked a corresponding protein identifier, all of them typed retained_intron or protein_coding_CDS_not_defined,
    and targeted 20,120 Ensembl Canonical transcripts plus 1,927 from a CAGE-selected set (PMC13689501 L134).'
  why: A current, release-anchored statement of the relative sizes of GENCODE's published views, and a concrete
    example of a laboratory choosing a view and discarding two biotypes by name.
- note: 'Not found, and the search is specific enough that it need not be repeated: no source states what fraction
    of a named annotation release carries the processed_transcript biotype. The open question recorded in the
    leads of research/01-foundations.yml is now partly answered by CAT-181, which carries CHESS 3''s counts
    of 33,750 retained-intron and 20,933 NMD transcripts in GENCODE release 41, but that source does not count
    processed_transcript, and GENCODE''s own release tables (CAT-179, CAT-180) are tabulated by gene biotype
    and so cannot be broken down this way. What was searched: a whole-word corpus grep on retained_intron and
    processed_transcript restricted to the PMC source, which returned 53 papers and was inspected down the
    list; a whole-word grep on protein_coding_CDS_not_defined, which returned exactly two papers; and keyword
    searches on GENCODE biotype counts. Semantic search returned the keyword-only warning on every query in
    this pass, so these negatives are scoped as not found by keyword search or grep.'
  why: A clean negative that bounds what the chapter may assert, and the one remaining figure that would have
    to be computed from a release rather than cited.
- note: 'The nearest biotype-share figure found with a different denominator: in one 2025 analysis of unproductive
    splicing, splice junctions classified as unproductive fell in transcripts annotated nonsense_mediated_decay
    in 48 per cent of cases, protein_coding_CDS_not_defined in 33 per cent and retained_intron in 7 per cent
    (PMC12026817, located by grep on protein_coding_CDS_not_defined, lines not read in this pass). The denominator
    is annotated unproductive junctions in one analysis, not transcripts in a release, so it does not answer
    the question above and was not recorded.'
  why: Worth reading if the chapter wants the newer protein_coding_CDS_not_defined label, which replaced part
    of what processed_transcript used to cover; it also shows the term in current use.
- note: Metadata caution for the four Nucleic Acids Research database-issue papers cited here. meta.json gives
    pub_year 2020 for GENCODE 2021 (PMC7778937, gkaa1087), 2022 for GENCODE 2023 (PMC9825462, gkac1071), 2011
    for the RefSeq policy paper (PMC3245008, gkr1079) and 2015 for the 2016 RefSeq paper (PMC4702849, gkv1189),
    because each was published online in the preceding calendar year. The years recorded in these claims are
    the journal issue years, which is how the papers are cited; resolve_metadata.py should be run and its output
    checked rather than assumed.
  why: If the issue years are wrong the bibkeys need changing too, and a bibkey change after the chapter is
    written costs a rewrite of every citation.
- note: Two preprint-versus-journal cases in this file. The Ribo-seq ORF roadmap was read as the June 2021
    bioRxiv preprint bio_12f0efcd6fff; source.doi carries the 2022 Nature Biotechnology version, and the journal
    name was taken from reference strings in other corpus papers rather than from the preprint's own metadata,
    which has no journal field. The selenoprotein annotation audit was read as the October 2024 bioRxiv preprint
    bio_a487cb086e36; corpus metadata lists a 2026 journal version at doi 10.1371/journal.pcbi.1013885 whose
    full text was not located, so journal is left as RESOLVE_FROM_DOI. Every figure from either should be re-checked
    against the published version.
  why: Both carry numbers the chapter would use in its argument, and in both cases the published version may
    have changed them.
- note: 'A non-human annotation project whose inclusion decision is documented and which was read but not recorded:
    the Physcomitrella patens V1.6 reannotation incorporated alternative splicing into a released genome annotation
    for the first time, producing 3,500 loci with alternative splicing, 10.8 per cent of the total, at an average
    of 2.52 transcripts per locus and a maximum of 11, with 1,775 loci, 51 per cent of alternatively spliced
    transcripts and 5.5 per cent of all genes, having an altered coding sequence as a result (PMC3729371 L90).'
  why: Chapter 3 owns plants as biology, but this is the decision to put alternative splicing into a reference
    at all, taken in a non-model organism, and the per-locus transcript average is directly comparable with
    GENCODE Primary's two.
- note: 'Not found by keyword search in this pass: any statement of RefSeq''s or Ensembl''s deletion rate per
    release comparable to the GENCODE figures in CAT-184 and CAT-186; any published account of a reference
    transcript model that was deleted and later restored, other than the biotype reversals in CAT-185, which
    are reassignments rather than deletions followed by restoration; and any agreement rate between TAGENE
    output and manual curation on the same locus set, which would be the direct measurement the chapter''s
    TAGENE sentence needs. Searched: whole-word corpus grep on TAGENE, which returned 21 PMC papers of which
    three are GENCODE or Ensembl reports and the rest are an unrelated reagent supplier; keyword searches on
    RefSeq curation, annotation policy and the eukaryotic genome annotation pipeline.'
  why: The missing TAGENE agreement rate is the single gap that would most improve the chapter's account of
    automation, and it may simply not have been published.
- note: 'Displaced from the claims for lack of record ids, all anchored and read. (1) The GENCODE capture long-read
    project states that its pipeline produces transcript models with quality approaching that of human annotators
    at the throughput of computational transcriptome reconstruction, attributing the gain to confident exon
    connectivity, higher rates of completeness at both ends and the polyA tail fragments carried in the reads;
    no agreement rate with manual curation is given anywhere in the paper (PMC5709232 L54). This is the project''s
    own characterisation and was dropped in favour of CAT-207, which is a measurement. (2) Jalali and colleagues
    report that across the GENCODE versions they compiled, 114,114 transcripts were annotated protein-coding
    and 120,864 were annotated in their pooled lncRNA class at least once, with 11,069 carrying clashing annotations
    between the two across releases (PMC5084464 L26). (3) The per-release reassignment peaks: V3b produced
    20,499 changes in protein-coding transcript annotation, V4 moved 10,044 transcripts into the pooled lncRNA
    class while 4,498 moved out of it, and V20 in 2014 produced the largest protein-coding-to-other move at
    7,212 transcripts (PMC5084464 L68). (4) Two named instability cases: ENST00000256463 at C3orf10 was protein-coding
    in V1, lncRNA in V2 to V2a and V3c to V6, protein-coding again, and dropped from V20 onwards, with the
    gene symbol also changing (PMC5084464 L148); and ENST00000413529 at SDHAP3 was the most inconsistent transcript
    in the compendium, with nine transitions and six different biotypes between V3b and V19 (PMC5084464 L150).
    (5) The variant-overlap denominators behind CAT-216: GENCODE Comprehensive and RefSeq NXR share 68 per
    cent of the 1.36 million 1000 Genomes variants mapping to at least one geneset, while GENCODE Basic and
    RefSeq NXR share 82 per cent of 1.1 million; for the exome set the shares are 93 per cent of 1.4 million
    and 98 per cent of 1.33 million (PMC4502323 L40). Discordant consequence calls among variants mapping to
    both genesets were 29,376, 3.1 per cent, for Comprehensive against RefSeq NXR and 9,974, 1.1 per cent,
    for Basic, with 22,499, 1.7 per cent, and 11,147, 0.9 per cent, in the exome set; 404,145 variants mapped
    only to GENCODE Comprehensive transcripts against 84,464 only to RefSeq NXR (PMC4502323 L41).'
  why: Item 5 is the quantitative skeleton of the variant-annotation comparison and the chapter will want at
    least the unique-variant asymmetry, 404,145 against 84,464, which is the clearest single number for what
    a permissive annotation does to a variant report. Items 2 to 4 give the reassignment mechanism named cases,
    which the chapter currently has only in aggregate.
- note: 'No peer-reviewed journal version of the ENCODE4 long-read collection was found. The corpus holds it
    only as the May 2023 bioRxiv preprint (bio_ad940b766ccc, also deposited as PMC10245583). A corpus-wide
    grep for the exact title returned 65 citing papers, every one citing it as a bioRxiv preprint, including
    papers ingested in 2026 and including Monzo, Frankish and Conesa 2025 (PMC12047247 L122), which is co-authored
    by a GENCODE lead. A SQL query over all documents with Balderrama-Gutierrez in the author list returned
    32 records with no journal version of this work. The searches run were: grep --source abstracts on the
    exact title (no match), a plain corpus grep on the exact title, and that SQL query. This is "not found",
    not proven absent.

    '
  why: Every ENCODE4 figure in the chapter rests on the preprint, and the chapter should say the absence of
    a journal version was checked rather than assumed.
- note: 'The GTEx long-read journal version IS in the corpus, as abstract-only record 175536821 (2022, doi
    10.1038/s41586-022-05035-y), found by grep --source abstracts on the exact title. Its pmcid PMC10337767
    is not held, so there is no full text and no access to the release, threshold or per-tissue figures of
    the published version. The chapter''s callout saying both long-read catalogues are preprints is therefore
    right for ENCODE4 and wrong for GTEx. All six GTEx records in this file now carry the journal doi; the
    four read from preprint lines carry preprint: true, per SCHEMA.md. The existing CAT-038 and CAT-039 in
    research/09-catalogs.yml still carry the PREPRINT doi under the same bibkey, so the orchestrator must change
    those two, and research/ALLOCATION.md should list this source as a case where the doi and the lines read
    differ. The published count is 70,000-odd against the preprint''s 98,372 (CAT-221, CAT-222), so the chapter''s
    "just under 100,000" sentence needs rewriting whichever version it ends up citing.

    '
  why: Two dois under one bibkey will render as whichever build_bib.py reads last, and the chapter currently
    states a figure the published paper does not.
- note: 'Eight records in this file share a (doc_id, lines) anchor with another record, and each says so in
    its note: CAT-221 with CAT-223, CAT-234 with CAT-235, CAT-246 with CAT-247, CAT-248 with CAT-249, CAT-266
    with CAT-267, CAT-273 with CAT-274. CAT-227 also shares bio_68a8e7ff6c37 L31 with the existing CAT-039.
    SCHEMA.md writes its shared-anchor exception for abstract-only records; the cases here are long full-text
    paragraph lines, where two genuinely different findings sit in one line and the quotes do not overlap.
    A records reviewer should decide whether that reading of the exception stands.

    '
  why: A reviewer who finds these unannounced would read them as double-counting, and the decision is the project's,
    not this agent's.
- note: 'Catalogues seen in search results and NOT opened, so they are candidates rather than absences: Patowary
    et al. developmental human neocortex (bio_cea1c1676f0e, published in Science 2024), long-read transcriptomics
    of purified human cortical cell types (bio_150a97869122), the zebrafish long-read annotation (PMC6120630),
    the equine bronchoalveolar transcriptome (PMC9602388), a breast-cancer isoform-level eQTL study with long-read
    assemblies (bio_61a35a576c4e) and the multi-species farm-animal annotation PMC6936065. Each would add a
    catalogue with its own denominators; the neocortex one is the largest.

    '
  why: Six more catalogues exist in this corpus than this pass recorded, and naming them saves the next agent
    the search.
- note: 'Searches that found nothing usable. For a second-LABORATORY reproduction of a catalogue: "overlap
    of novel transcripts between independent long-read catalogs reproducibility" was the only query run, and
    it returned the heart atlas and the renal study instead. The ceiling measurements recorded here are second
    donors (CAT-234), second protocol on the same RNA (CAT-243, CAT-254), second cohort (CAT-236, CAT-250,
    CAT-251) and second platform (CAT-263, CAT-274), not second laboratory. For published guidance on choosing
    between a catalogue''s exploratory and validated sets, no dedicated search was run at all; CAT-277 was
    found inside a paper already in the file. For quantified agreement between ENCODE4 and GTEx on shared tissues,
    no search was run; neither paper reports it in the lines read. All of these are "not searched" or "not
    found by keyword search", not absent.

    '
  why: The brief asked for three of these specifically, and an unscoped absence in the chapter is a worse defect
    than a gap in the records.
- note: 'Every paperclip search call in this pass printed "semantic search was too slow or failed; results
    are from keyword search only", so all six searches were keyword-only. Title-word and tool-name queries
    worked; conceptual queries such as the reproducibility one returned loosely related papers. Negative results
    in this file should all be read with that caveat, and a later pass that finds semantic search working should
    repeat the queries listed in the lead above.

    '
  why: Keyword-only retrieval is why the non-human and confidence-tier questions came back thin.
- note: 'No study was found that recomputed one catalogue''s novel fraction against a series of successive
    releases of the same annotation. The two nearest things are a third party''s statement that about 50,000
    new isoforms have been added to the annotation since 2016, the release GTEx scored against (CAT-246), and
    one sample rescored against two different projects'' current releases (CAT-273). A direct series, one dataset
    against GENCODE v26 through v47, would be the chapter''s strongest single figure and was not found.

    '
  why: The chapter's spine is that the denominator moves; a time series of one denominator is the measurement
    nobody appears to have published.
- note: 'The ESPRESSO 30-tissue catalogue (PMC9858503) states no donor count and no per-transcript expression
    threshold for its 340,149 isoforms, and never states which annotation release was supplied to its own discovery
    run; the methods name GENCODE v34 on GRCh37/hg19 for other tools and Ensembl 106 with GENCODE v40 for the
    tissue-specificity analysis. Any table in the book putting that catalogue beside ENCODE4 or GTEx has to
    say so.

    '
  why: The chapter's own rule is that a count without its release and threshold is not usable, and this is
    otherwise the largest tissue panel available.
- note: 'Two numbers worth having that were left unrecorded only because another record already cites their
    line: Leung et al. (PMC8609283 L52) report 80 per cent of novel cortex transcripts within 50 bp of a FANTOM5
    CAGE peak, and the breast cancer resource (PMC8769553 L20) reports novel isoforms at 37 and 31 per cent
    in tumours from primary tissue against 26 and 16 per cent in cell lines and xenografts. The second is the
    only figure found in this pass for sample provenance changing a novel fraction within one study, which
    bears on ENCODE4''s panel mixing tissues with cell lines.

    '
  why: Both are usable if the project decides a second record on a long paragraph line is acceptable.
- note: 'The Isopedia records in this file carry preprint: true because PMC13041807 is the PMC deposit of a
    bioRxiv preprint. The existing CAT-031 to CAT-033 cite the same document without that flag, so the file
    is internally inconsistent until the orchestrator picks one.

    '
  why: build_bib.py and verify_claims.py treat the flag differently, and a mixed file will emit one work two
    ways.
- note: The denominators behind the 100, 90 and 50 per cent validation rates of existing record CAT-028 are
    not in the body text of PMC11543605. Line L139 gives the rates and the reproducibility counts but no group
    sizes; those appear only in Fig. 5e, which was not read because figure panels are not citable here. The
    whole experiment is 178 targets across three comparison groups (CAT-322).
  why: The chapter's most striking number has no n, and a reader cannot tell whether 90 per cent means nine
    of ten or ninety of a hundred.
- note: PMC11543605 L118 gives the 2.74 and 3.27 NRMSE factors for quantification under an inaccurate annotation
    (CAT-331) but never says how that annotation was made inaccurate. The simulation methods at L162 and the
    quantification metrics at L171 to L196 were read and do not define it; the only pointer is Supplementary
    Fig. 43, which is not in the corpus text.
  why: Without the size of the perturbation the factors are a direction, not a cost, and the chapter should
    not present them as a measured penalty for a wrong catalogue.
- note: The LRGASP study design was published in advance and IS in the corpus, as abstract-only record 7428628,
    doi 10.21203/rs.3.rs-777702/v1, 2021, with the same title as the 2024 Nature Methods paper and no author
    list or journal in meta.json. Its single line L1 commits in advance to the three challenges, to evaluators
    from different institutions, and to benchmarks comprising spike-in synthetic transcripts, simulated data
    and a set of undisclosed, manually curated GENCODE transcripts, and describes planned platform-specific
    and tool-specific experimental validation. It was not recorded as a claim because its title is identical
    to that of pardopalacios2024lrgasp and a second bibkey for what a gate may treat as one work would fail
    that gate.
  why: It is the strongest available support for the claim that the benchmarks were fixed before the submissions
    were seen, and it can be promoted to a claim if the bibliography can carry two entries for the design and
    the results.
- note: No second round of the LRGASP exercise and no re-analysis of its submissions by a group outside it
    was found. `grep LRGASP /papers/` matched 82 papers, `--source biorxiv` 9 and `--source abstracts` 2, and
    the thirteen snippets read were citations or re-use of the datasets rather than re-evaluations. The substantial
    re-use found is Paniagua et al. (PMC12047274, CAT-313 to CAT-315, CAT-335, CAT-336), five of whose eight
    authors are authors of the consortium paper. The consortium's own stated continuation is OpenEBench (CAT-282).
    The remaining 69 matched papers were not opened.
  why: The chapter should not imply the exercise has been superseded or independently audited; what exists
    is a standing platform and re-use by overlapping groups.
- note: 'The Lexogen SIRV design documentation and the exact composition of SIRV-Set 4 are not held as a citable
    source. PMC11543605 cites them only as a URL at L323, and its reference list at L201 of PMC11978509 points
    to a 2016 bioRxiv SIRV preprint that keyword search did not retrieve. The only size figure available is
    an output rather than a composition: the 28 to 136 spike-in transcripts tools reported above zero TPM (CAT-288).'
  why: The argument that a spike-in panel is not a transcriptome would be stronger with the SIRV panel's own
    stated composition beside a sourced GENCODE release count.
- note: PMC13040695, Wissel et al., Genome Biology 2026, was opened and two lines recorded (CAT-333, CAT-334).
    Its transcript-discovery comparison against short SIRVs at intron-chain level (L158) and its two proposed
    reasons for cross-platform quantification discordance (L60) were found but not read in full, and may hold
    a better number for the chapter's quantification section.
  why: Found and partly read, not rejected; a second pass should finish it.
- note: Dong et al. was read as the bioRxiv preprint bio_5ad22e916d23 (CAT-296 to CAT-298). A 2023 Nature Methods
    version exists at doi 10.1038/s41592-023-02026-3, Nat Methods 20:1810-21, which other corpus papers cite,
    but `lookup doi` on it returns nothing and its full text is not in the corpus; chapter 5 cites the same
    preprint under bibkey dong2022benchmarking, which this file reuses. Mehrotra et al. (bio_ca3891427093,
    CAT-295) has no journal version in the corpus either. The bambu paper was read as bio_b55d14c66e9f, with
    the journal DOI in source.doi, matching chapter 5's bibkey chen2023context.
  why: Three records rest on preprint text; the independence claim in CAT-298 in particular should be re-checked
    against the journal version's author and reference lists.
- note: No source was found that reports how many PCR-confirmed transcripts a standard transcript-level filter
    discards. The closest measurements recorded are the removed counts and composition shift of CAT-309, the
    11 per cent false discovery rate on a 67-transcript PCR set in CAT-311, the sensitivity-for-precision trade
    on a corrupted spike-in reference in CAT-318, and the 89 per cent of discarded models that a rescue step
    matched back to an existing transcript in CAT-317. PMC12047274 reports no BUSCO score for its unfiltered
    461,040 models, so CAT-313 cannot be read as a measured loss.
  why: The chapter can say what a filter removes and what it buys, but not yet how many real transcripts it
    throws away.
- note: SQANTI-reads (PMC12047275) and SQANTI-browser (bio_81aadd3c91de), both from the same group as SQANTI3,
    and the LongBench cross-platform reference dataset (bio_a4290325739b, already used in chapter 5 as you2025longbench)
    were found by search and not opened. LongBench in particular profiles cancer cell lines across platforms
    and may carry a tool-agreement number this chapter could use.
  why: Found, not read; listed so they need not be searched for again.
- note: 'No quantitative projection of how many transcripts a typical human protein-coding gene will end up
    carrying was found. Keyword searches of the full-text corpus for saturation and projection phrasings (''average
    number of transcripts per gene will'', ''human transcriptome contains at least'', ''has not yet saturated'')
    returned nothing relevant, and an evidence query for a projected per-gene transcript count judged 264 passages
    with zero supporting it. Semantic search was failing throughout this pass, so this is a keyword-only negative,
    not an absence.

    '
  why: 'The chapter can still only say where annotation has been, not where it is going; the qualitative ''tens
    or even hundreds'' of CAT-011 remains the only anchored statement.

    '
- note: 'No person-year, cost-per-locus or budget figure for genome annotation curation was found anywhere
    in the corpus. Corpus-wide greps for ''manual annotation is not'', ''manual curation cannot'' and person-year
    phrasings returned only machine-learning preprints about data labelling. The closest anchored facts are
    CAT-382 (a manual gold standard limited to 50 loci per species), CAT-383 and CAT-384. Mudge and Harrow''s
    review of higher-eukaryote annotation (doi 10.1038/nrg.2016.119) is in the corpus as abstract only, doc
    56460470, and PMC5876476 is not held, so its account of annotation effort could not be read.

    '
  why: 'The chapter treats annotation as an editorial choice without saying who makes it or what it costs,
    and a single person-year or FTE figure would close that gap.

    '
- note: 'CAT-047 states that a comprehensive annotation ''degrades'' isoform-level quantification. The cited
    line (PMC12047247 L32) says it ''may instead hinder'' accurate isoform-level quantification and offers
    no citation and no measurement for the claim. The measurements found in this pass split: CAT-341 to CAT-343
    and CAT-351 support a cost, CAT-349, CAT-355 and CAT-357 find the larger or extended annotation more accurate,
    and CAT-347 and CAT-353 find isoform count not to be the operative variable.

    '
  why: 'The chapter''s closing argument currently rests on one hedged sentence in a review whose second author
    also co-authored CAT-365 to CAT-368.

    '
- note: 'The ''one transcript considered for 96 per cent of genes'' figure that is often quoted alongside the
    292-gene epilepsy panel result appears in PMC7335342 L20 as a description of another study, not as that
    paper''s own result, and the primary for it (doc 37046564, recorded as CAT-369) is held in the corpus as
    abstract only, where that percentage does not appear. The full text would also give the panels compared
    and the expression threshold used.

    '
  why: 'A clinical-practice percentage of this kind would be quotable only from the primary full text, which
    is not held.

    '
- note: 'Zhao and Zhang (CAT-358, CAT-359) attribute to Wu et al. the recommendation that a less complex annotation
    suits reproducible quantification while a more complex one suits exploratory work (PMC4339237 L91). That
    primary was not retrieved, and the recommendation is the chapter''s own argument stated a decade earlier.

    '
  why: 'If the chapter wants to say the trade-off has been standing advice since 2013, it needs the primary
    rather than this secondhand mention.

    '
- note: 'Chisanga et al.''s accuracy coefficients (CAT-355), Bambu''s quantification-error reduction (CAT-357),
    the per-group accuracy endpoints behind CAT-346, LIQA''s over-annotation and under-annotation curves (CAT-351)
    and SUPPA''s per-method accuracies (CAT-352) are all in figures or supplementary files rather than in text.
    Each claim therefore carries direction and ground truth but not a full effect size.

    '
  why: 'A reviewer checking whether the chapter''s numbers exist in the records should know which effect sizes
    were never available in prose.

    '
- note: 'Angelini, De Canditiis and De Feis (PMC4098781) simulate five isoform-detection tools under complete,
    incomplete and absent annotation and in three modes of action (L9, L22). It was read and not recorded,
    because every precision, recall and F-measure result is in bar plots (L101, L102) and the text gives only
    the direction, that annotation-supported inference beats fully data-driven inference and that complete
    beats incomplete.

    '
  why: 'It is a fourth independent demonstration that annotation incompleteness costs more than annotation
    surplus, but no effect size can be quoted from it.

    '
