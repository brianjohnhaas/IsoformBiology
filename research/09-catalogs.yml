- id: CAT-195
  claim: The two kinds of evidence that annotation projects use to admit a coding region point in opposite
    directions for these ORFs. Only 75 of the 3,085 replicated Phase I Ribo-seq ORFs, 2.4 per cent, carried
    a positive PhyloCSF score indicating evolution as protein-coding sequence. Those authors argue the signal
    is genuinely hard to read in very short coding sequences, where constraint on the protein is difficult
    to separate from conservation of the DNA, rather than treating the low rate as settling the question.
