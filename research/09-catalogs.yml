    It can have about a dozen release-labelled points from four projects, several of them undated and not all
    counted the same way, which is a different and more honest figure.
- note: 'Two different quantities are both called protein-coding transcript counts in this chapter''s sources
    and they must never be plotted together. GENCODE''s release tables count by gene functional biotype, so
    167,599 at GENCODE 41 and 170,270 at GENCODE 47 are every transcript at a protein-coding gene whatever
    the transcript''s own biotype (captions at PMC7778937 L85, PMC9825462 L90, PMC11701607 L84). Page et al.
    count transcripts whose own biotype is protein-coding, giving 79,431 at Ensembl v76 and 89,374 at v109
    (PMC12679773 L29), and PMC12679773 L30 shows why the two differ: at Ensembl v109 the retained-intron, CDS-not-defined
    and nonsense-mediated-decay transcript biotypes together hold about 82,000 further models. The 87,814 of
    CAT-142 sits on the second series, not the first. Any table in the chapter that puts these side by side
    must state each one''s counting rule, per the conflict rule in research/SCHEMA.md.'
