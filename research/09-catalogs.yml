  - id: CAT-023
    claim: >
      Benchmarked against the dominant isoform seen in proteomics, curated
      representative transcripts clearly beat the two convenient heuristics:
      agreement was about 94.6 per cent for MANE Select and 96.1 per cent for
      APPRIS core principal isoforms, 86.4 per cent for simply taking the
      longest isoform, and 70.1 per cent for taking the most-expressed transcript.
      The four rates are computed over different gene subsets, and randomly
      chosen isoforms agreed only about 30 per cent of the time.
