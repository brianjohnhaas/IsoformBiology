  claim: The first published attempt to measure automatic annotation against manual curation set the target
    explicitly. The manual GENCODE annotation of all 44 ENCODE pilot regions, about 1 per cent of the human
    genome, comprised 2,471 transcripts at 434 protein-coding loci, of which 1,097 transcripts encoded 993
    distinct proteins, an average of 5.7 transcripts and 2.52 coding transcripts per locus, with 393 of the
    434 loci containing multi-exon transcripts and 86 per cent of the multi-exon loci showing alternative splicing.
