- id: CAT-291
  claim: 'The manually annotated loci were chosen at random within constraints, and the constraints are substantial:
    the locus had to be multi-exonic and compact, loci with very long introns were excluded, a maximum number
    of aligned reads per locus was imposed, candidate loci were pre-screened for putative transcripts whose
    every intron was supported by at least two GTEx short reads in recount3, and the shortlist was then reviewed
    to maximise genuine alternative splicing events and, where possible, to pick loci orthologous between human
    and mouse.

    '
