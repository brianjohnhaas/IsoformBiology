- id: CAT-218
  claim: The clearest evidence that expansion has a price comes from comparing one catalogue with its own earlier
    self. On the SEQC benchmark, gene-level quantification against the August 2020 RefSeq annotation, release
    109.20200815, was more accurate than against the April 2020 Ensembl annotation, version 100, judged overall
    across titration monotonicity, TaqMan RT-PCR correlation and microarray correlation, but quantification
    against the April 2015 RefSeq annotation shipped as the Rsubread default beat the 2020 RefSeq in almost
    every comparison. Those authors suspect transcript-reconstruction errors introduced once short-read data
    entered the RefSeq pipeline around 2013, during which period RefSeq's vertebrate mammalian transcript count
    rose from 3.6 million in March 2015 to 7.8 million in July 2020.
