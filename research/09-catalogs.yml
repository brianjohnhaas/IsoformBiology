    human gene and transcript counts and carry none in prose, and the GENCODE 2018 report carries none in prose
    either. What is anchorable is single releases and endpoints: CAT-113, CAT-114 and CAT-141 on the Ensembl
    releases, CAT-115, CAT-116, CAT-117, CAT-119, CAT-120, CAT-146 and the existing CAT-053 on GENCODE, CAT-111
    and CAT-142 as single later points, and CAT-118 on the disputed GENCODE v1 value. Several of those releases
    carry no calendar date in their source: GENCODE 3c, 3d, 7, 35 and 41, CCDS Release 20 and 21, MANE v1.0,
    and Ensembl 112, 114 and 115. Pulling counts from the GENCODE and Ensembl release files or statistics pages
    directly remains the only way to get a curve.'
