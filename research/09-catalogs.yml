- id: CAT-217
  claim: 'Quantification is not insulated from the annotation either, even at gene level and even on genes
    both annotations contain. At a read length of 75 bases, of the 21,958 genes common to RefGene, Ensembl
    and UCSC, 20 per cent had no expression at all in either annotation and only 16.3 per cent gave identical
    read counts; 28.1 per cent of genes differed by 5 per cent or more between RefGene and Ensembl, and a further
    9.3 per cent, which that paper equates to 2,038 genes, differed by at least half. Named cases trace the
