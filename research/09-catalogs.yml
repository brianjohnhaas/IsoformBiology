- id: CAT-219
  claim: The mechanism behind the cost of a large annotation can be measured directly as mappability, the fraction
    of reads simulated from a transcript that align back to that transcript and nowhere else. At a simulated
    read length of 100 bases, mean transcript mappability was 0.58 for GENCODE Basic against 0.44 for the full
    GENCODE release 31, and the low-mappability peak in RefSeq release 109 of 7 June 2019 came specifically
    from automatically annotated transcripts, which are the ones absent from the curated RefSeq subset. A filtered
    view is therefore not merely smaller; its transcripts are individually easier to assign reads to.
