- id: CAT-198
  claim: GENCODE put conservation between ribosome profiling and the annotation. In the work reported in its
    2023 update, running PhyloCSF over more than 230,000 novel unannotated ORFs taken from Ribo-seq analysis
    alongside mass spectrometry of MHC class I-bound peptides, it found that the vast majority showed no detectable
    constraint at the protein level and that about 70 carried strong signals of having evolved as all or part
    of a coding gene, which the paper does not express as a proportion. Those roughly 70 led to real annotation
    changes, including complete ORFs added as coding sequence, N-terminal extensions, alternative 3' ends and
    exon extensions.
