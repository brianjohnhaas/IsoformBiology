leads:
  - note: >
      The corpus holds the ENCODE4 long-read collection only as the May 2023
      bioRxiv preprint (bio_ad940b766ccc, also deposited as PMC10245583). A
      peer-reviewed journal version may now exist; all ENCODE4 numbers in these
      claims come from the preprint text and should be re-checked against the
      journal version before publication.
    why: "Citing a preprint for the chapter's anchor dataset is a resolvable weakness, and figures can shift between preprint and final version."
  - note: >
      The GTEx long-read paper was read as the January 2021 bioRxiv preprint
      (bio_68a8e7ff6c37). Corpus metadata lists a 2022 journal version at
      doi 10.1038/s41586-022-05035-y; the full text of that version was not in
      the corpus, and an abstracts-scope search returned only the preprint
      record. CAT-038 and CAT-039 are marked medium confidence for this reason.
    why: "The bibliography should cite the journal version, but the quoted lines are from the preprint."
  - note: >
      GENCODE Basic is defined in prose only as "all models annotated as
      protein-coding that are considered as full-length" (PMC11701607 L122); no
      per-gene transcript count for Basic was found, and Ensembl Canonical is
      described only in a browser-view figure legend, which was not citable.
    why: "The chapter may want to contrast Basic against Primary quantitatively; only Primary has a published average."
  - note: >
      Jalali et al. carry a transcript-count series across GENCODE v1-V24
      (CAT-053), but no source was found that continues it to the present, and
      that paper is internally inconsistent about the v1 count (83,725 at L18
      versus 87,852 at L23). Composing one 2008-to-now growth curve therefore
      needs counts pulled from the successive GENCODE reports directly.
    why: "Transcripts per gene over release number is the chapter's most natural figure and currently has no single anchorable source."
  - note: >
      LRGASP's own limitations section states that long-read mapping methods were
      not benchmarked at all (all tools used minimap2) and that submitters chose
      which data modalities to enter, leaving participation unbalanced. This is
      anchored at PMC11543605 L150 and was not written up as a separate claim.
    why: "Any statement that LRGASP settled a question should be qualified by what it did not test."
  - note: >
      Searches for a GENCODE or Ensembl statement of how many transcripts a
      typical protein-coding gene is expected to end up with, once long-read data
      are fully incorporated, returned only the qualitative "tens or even
      hundreds" of CAT-011.
    why: "A quantitative projection would let the chapter say where annotation is heading rather than only where it has been."
