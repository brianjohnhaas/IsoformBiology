- id: CAT-196
  claim: 'The most consequential sentence in the Ribo-seq annotation effort is a statement of the standard
    of proof reference projects actually apply: calling a gene protein-coding does not require certainty, only
    the judgement that coding is the most likely reading of the available evidence. On that standard GENCODE
    annotated 10 ORFs from the Phase I catalogue as protein-coding, with 15 more having become protein-coding
    over the preceding two years, and those authors say the decisions rested largely on PhyloCSF, which shows
    protein evolution rather than protein function.'
