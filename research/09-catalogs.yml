- id: CAT-209
  claim: RefSeq curation is a triage process driven by automated conflict detection, not a sweep through the
    genome. Curators work from lists of genes flagged by quality-assurance tests and follow a written set of
    guidelines whose stated purpose is consistency between people; they then create reference transcripts and
    proteins, resolve sequence errors, remove inaccurate information and add functional detail. Manual curation
    and literature review are described as producing variants and isoforms that computational analysis alone
    would not predict, the project's example being a longer mitochondrial PTEN isoform initiating at an upstream
    in-frame CUG codon.
  topic: 'other reference projects: what RefSeq curation actually is'
