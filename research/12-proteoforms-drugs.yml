  note: "tier: correlation of isoform ratio with a phenotype only. No perturbation; the measurement is PCR\
    \ and capillary electrophoresis on patient blasts. Recorded as the bound on DRG-114 to DRG-117: an isoform\
    \ that lacks the therapeutic epitope is not automatically the reason an antigen is lost, and in this cohort\
    \ it tracks with antigen presence. Independent of the Ang laboratory (Mainz, not Philadelphia). The D393-CD20\
    \ isoform was originally described in follicular and mantle cell lymphoma; that primary was not located\
    \ in this corpus and is in leads.\n Moved here from the chapter 6 research pass that recorded it, because\
    \ chapter 12 owns antigen loss under therapy and already holds CD19."
leads:
- note: 'The Nature Reviews Genetics review is abstract-only in this corpus, so only its abstract-level statements
    are cited. Its author list and journal were not in meta.json and are marked RESOLVE_FROM_DOI for scripts/resolve_metadata.py
    to fill from Crossref.

    '
  why: Everything beyond the abstract must come from primary papers, not from the review.
- note: 'Cui et al. cite mutant KRAS proteoforms (G12D and G12V) as selectively degradable by a PROTAC-like
    molecule while wild-type KRAS is spared, attributing it to Popow et al. and Su et al. Not read.

    '
  why: It would be the single best concrete example of proteoform-selective degradation if the primary paper
    can be read.
- note: 'The CLDN18.2 review reports objective response rates for a long list of next-generation biologics
    against the same isoform, several higher than the approved antibody, and names the phase of each. Not recorded
    here.

    '
  why: A table of these would date quickly, but it is the best available picture of what is in development.
- note: 'Reported positivity rates for CLDN18.2 differ substantially by diagnostic antibody and cut-off, from
    roughly 38 to 49 per cent of patients in clinical studies. The numbers were read but not recorded as claims.

    '
  why: A companion diagnostic that reads an isoform is itself an isoform-biology problem, and the spread is
    the point.
- note: 'A 3DisoTarget resource for expanding target space from genes to disease-relevant molecular forms surfaced
    in search but was not read.

    '
  why: Would bear directly on the forward-looking section.
- note: 'Alternative splicing of the TrkC receptor intracellular domain was reported to change the ectodomain
    conformation, enabling isoform-selective ligands (PMC7452315). Not read.

    '
  why: A mechanism by which an intracellular difference becomes druggable from outside the cell.
- note: 'CONFLICT INSIDE ONE PAPER, AND THE ABSTRACT IS THE MISLEADING ONE. Mehlferber et al. PMC9721438 abstract
    (L11) says "We found 2,597 protein isoforms supported through unique peptides". The body (L160) shows 2,597
    is a count of GENES, not isoforms: "For the remaining 2,703 (26%) of genes with multiple isoforms annotated,
    2,597 (25%) of genes have a single isoform with unique peptide evidence." Anything that cites 2,597 as
    a number of protein isoforms is wrong by a unit.

    '
  why: 'This is a number a reader or a later pass would lift straight from the abstract. The records here use
    the body figures (MSR-014, MSR-015) and never the abstract''s phrasing.

    '
- note: 'CONFLICT INSIDE ONE PAPER. Gao et al. PMC13425565 abstract (L5) reports "Up to 500 proteoforms and
    nearly 1300 proteins" from lysate equivalent to about 25 HeLa cells, while its own results summary (L12)
    reports over 600 and 2600 proteins for about 25 and about 250 cells, and about 270 and about 780 proteoforms
    for the same two inputs. The two statements for the 25-cell input do not agree. grep -E "2600|780 proteoforms|~250
    proteins" finds these numbers only at L12, so the Results section does not restate them.

    '
  why: 'MSR-006 uses the L12 figures. A human should resolve which input the abstract''s 500 and 1300 refer
    to before either number reaches the chapter.

    '
- note: 'OPEN QUESTION, NOT A SETTLED ONE. McCool et al. (PMC9770947 L24, L57) cap their survey at 30 kDa on
    a Thermo Q-Exactive HF and attribute the loss of large proteoforms to signal-to-noise in a complex sample;
    Melby et al. (PMC10175728 L11, L17) resolve proteoforms above 200 kDa in single muscle fibres on a Bruker
    maXis II. The two differ in sample complexity, in species, and in instrument, so this corpus does not establish
    which factor sets the ceiling.

    '
  why: 'A chapter sentence saying intact-molecule measurement cannot reach large proteins is false as a general
    claim, and a sentence attributing the difference to sample complexity alone is not supported by what was
    read. Both studies have to appear together, with the instrument difference stated.

    '
- note: 'THE ISOFORM-LEVEL PROPORTION, PARTLY FOUND. The question "what proportion of annotated isoforms is
    distinguishable by any tryptic peptide" was not found stated per isoform in these sources with these searches.
    The closest anchored figures are per gene, from Mehlferber et al. PMC9721438 L158 and L160-L161 (recorded
    as DRG-058 and DRG-059), and per peptide, from Dou et al. PMC10509223 L24-L25 (DRG-052, DRG-053). Searches
    run: search -s papers "proportion of protein isoforms distinguishable by unique tryptic peptide bottom-up
    proteomics"; greps for "unique peptide", "isoform-specific peptide", "distinguish", "indistinguishab",
    "cannot be distinguished" on PMC10509223 and PMC8892804.

    '
  why: 'The per-gene figure (57 per cent of genes with peptide evidence had no confirmable isoform) is the
    strongest form of this number now available to the book. A true per-isoform denominator, if one exists,
    would be stronger still.

    '
- note: 'Read in search results but never opened, and both bear directly on the per-isoform proportion: PMC3424414
    (Ezkurdia et al., Comparative Proteomics Reveals a Significant Bias Toward Alternative Protein Isoforms
    with Conserved Structure and Function, 2012, matched at L49-50 on "Identifying Alternatively Spliced Isoforms")
    and bio_7fd117fe7c04 (Kedan et al., An integrated landscape of mRNA and protein isoforms, bioRxiv, matched
    at L111-112, journal DOI 10.1016/j.celrep.2026.117898 listed, preprint text only).

    '
  why: 'Ezkurdia is a whole-proteome analysis of which annotated isoforms are detectable at all, which is exactly
    the missing denominator. Kedan reports proteolytic processing as an underestimated source of proteome complexity,
    which would complicate the chapter''s splicing-centred framing.

    '
- note: 'Cut at the 22-record budget, reusable without re-reading: Drown et al. PMC9087339 L48 - of 11,466
    proteoforms identified across five human tissues, 7373 (64.3%) were absent from the Human Proteoform Atlas,
    while at protein level only 198 of 740 (26.8%) were first reported there.

    '
  why: 'It quantifies how incomplete the reference resource is, and shows the new material is mostly new modified
    forms of already-known proteins rather than new proteins.

    '
- note: 'Cut at the 22-record budget, reusable without re-reading: Dou et al. PMC10509223 L22 - most isoforms
    of the same gene share more than 90 per cent sequence similarity, but among the 11,809 genes with three
    or more isoforms, 6165 (52.2%) have at least one isoform pair below 90 per cent similarity.

    '
  why: 'The first half is the mechanistic reason the isoform-distinguishing peptide is scarce; the second half
    is the counterweight that stops the section reading as a dead end.

    '
- note: 'Cut at the 22-record budget, reusable without re-reading: Miller et al. PMC8892804 L64 - besides the
    673 cases (21%) recorded in DRG-057, 873 cases (27%) gave partially overlapping protein isoform groups
    and 382 (12%) gave groups entirely absent from the reference-database result.

    '
  why: 'The 12 per cent category is the strongest statement that a reference-database search can report a protein
    group with no overlap at all with what the sample contains.

    '
- note: 'Not recorded because the chapter already carries "about 20,000 coding genes" from proteoformmedicine2026:
    Hollas et al. PMC8728143 L13 puts the UniProt count of canonical human proteins at 20,386 and states the
    proteoform number is larger and difficult to estimate. The same paper at L15 says KRAS admits thousands
    of theoretical proteoforms with fewer than forty mapped, but attributes that to its own reference 5 (Aebersold
    et al., How many human proteoforms are there, Nat. Chem. Biol. 2018, L60), so it is secondhand. DRG-061
    uses the primary (Adams et al., 39 completely characterised KRAS proteoforms) instead.

    '
  why: 'Useful if the chapter wants the gene-count denominator attributed to UniProt rather than to a review.
    The secondhand KRAS figure should not be cited to the atlas paper.

    '
- note: 'NOT IN THE CORPUS BY TITLE, both tried with lookup title and both central to the chapter''s premise:
    Aebersold et al., "How many human proteoforms are there?", Nat. Chem. Biol. 14, 206-214 (2018), and Ntai
    et al., "Precise characterization of KRAS4b proteoforms in human colorectal cells and tumors reveals mutation/modification
    cross-talk", PNAS 115, 4140-4145 (2018). The Ntai paper exists only as an abstract-only record, doc id
    42005936, doi 10.1073/pnas.1716122115, found with search -s abstracts.

    '
  why: 'Aebersold et al. is the source of the million-proteoforms-per-cell estimate the chapter already uses
    secondhand through proteoformmedicine2026. Getting it directly would put the chapter''s opening number
    on its primary.

    '
- note: 'The Human Proteoform Atlas paper (PMC8728143) does not state a total proteoform count anywhere the
    searches reached. grep -o -E "[0-9][0-9,.]+ (unique |experimentally verified |human )?proteoforms" returned
    no matches; the text at L10 describes the registry without sizing it. The atlas size would have to come
    from the live resource or a later paper, and a broader grep might still find it.

    '
  why: 'Priority 4 asked for a proteoform atlas with counts. The tissue and cell-line studies supply counts;
    this atlas paper, as read, does not.

    '
- note: 'Tissue-level long-read proteogenomics, surfaced in search and not read, which would stop the proteogenomic
    records here generalising from cell culture: PMC11450717 (proteogenomic atlas of the human neural retina,
    reported as about 60,000 transcript isoforms with roughly one third novel), PMC13534637 (long-read proteogenomic
    atlas of human neuronal differentiation), PMC13725750 (LRP2, a long-read-informed proteogenomics pipeline).

    '
  why: 'Every proteogenomic record in this file is from a cultured cell line, Jurkat or HUVEC.

    '
- note: 'bioRxiv preprints not read, all bearing on priority 3: bio_6c9a4c8ea043 (Lehe et al. 2026, targeted
    proteomics informed by long-read RNA sequencing, protein isoform expression and bone mineral density; shares
    authors with korchak2024isprm and is the direct follow-on), bio_2ae064717625 (ProteomeGenerator3, reported
    as over 3,000 non-canonical proteoforms in cancer cells), bio_789f01e46fd4 (draft atlas of the human plasma
    proteome at isoform resolution), bio_72300633db5d (a strategy for large proteoform identification in top-down,
    2026, which would show whether the 30 kDa constraint in DRG-046 has moved).

    '
  why: 'The targeted-methods priority is the thinnest part of this file: it rests on one Ras SRM assay (MSR-012)
    and the chapter''s existing korchak2024isprm.

    '
- note: 'THE PER-PEPTIDE COST OF A SYNTHETIC STANDARD IS NOT ANCHORED. No source found gives a price or a per-assay
    cost. Mageean et al. (PMC4641634 L27) state only that they used isotope-labelled whole-protein standards
    spiked in at the start rather than synthetic peptides added at the end, and give the reason. PMC4691067
    (Rauniyar) covers internal peptide standards but is a review.

    '
  why: 'The chapter''s existing claim that korchak2024isprm needed a standard for each of 192 peptides already
    carries the cost argument; a unit cost would make it concrete but must not come from memory.

    '
- note: 'The five-level proteoform classification system itself is not in the corpus. Only Rolfs and Smith''s
    implementation paper was found (bio_011b54626f2f, bioRxiv), which cites the primary as its reference 3.
    lookup title "Automated Assignment of Proteoform Classification Levels" returns the preprint only, so the
    journal version (10.1021/acs.jproteome.1c00417) is not held as a separate document.

    '
  why: 'MSR-020 therefore rests on a preprint for a standard that should be cited to its own primary paper.

    '
- note: CONFLICT, unresolved, and the most important thing in this file. Poulikakos et al. 2011 (PMC3266695,
    L20) report no intragenic somatic deletion by array CGH in the vemurafenib-resistant clones and call the
    shortened BRAF a splicing product; Salton et al. 2015 (PMC4435825, L16) locate a branch-point mutation
    that shifts splicing; but Cell Reports 2024, doc_id 153452796, abstract-only, L1, reports that the same
    alternative BRAF isoforms are generated through genomic deletions, found matching deletions in patient
    tumours, and calls this a major shift in understanding. The 2024 paper is abstract-only here, so the resolution
    cannot be read. Both accounts are recorded as claims (DRG-077 and DRG-080); do not pick a winner.
  why: If the BRAF case is genomic, it is not a second example of a drug selecting a splice isoform and it
    cannot stand beside AR-V7 as the brief intends. The whole weight this section puts on BRAF depends on which
    account holds.
- note: The 2024 genomic-deletion paper (doc_id 153452796, L1) also reports alternative BRAF isoforms in BRAF
    wild-type melanoma and in melanoma never exposed to MAPK inhibitors. Its author list and journal are absent
    from meta.json and are marked RESOLVE_FROM_DOI; the DOI is 10.1016/j.celrep.2024.114048. Full text was
    not reachable in this corpus.
  why: It removes the clean before-and-after contrast that makes the Poulikakos result persuasive, and it needs
    the full text to assess.
- note: 'Poulikakos et al. 2011, PMC3266695, L25, close their patient analysis with a caveat: their assay cannot
    exclude that the BRAF splice variants were expressed in small amounts before treatment and then selected
    under continuous drug. Set beside DRG-072 on pre-existing CD19 exon 2 skipping, neither anchor case has
    demonstrated de novo induction of an isoform, only enrichment of one.'
  why: It fixes what the chapter may claim. 'The drug selects an isoform the tumour was already making' is
    supported; 'the tumour switches isoform under the drug' is not, in either case.
- note: 'Sotillo et al. 2015, doc_id 62242331, L1, abstract-only, frame the mechanism as selection for pre-existing
    alternatively spliced CD19 isoforms with a compromised CAR epitope, and report that exon 2 skipping bypasses
    exon 2 mutations and allows a truncated CD19 that fails to trigger CAR killing but partly rescues the defects
    of losing CD19 altogether. They identify SRSF3 as the splicing factor involved and report lower SRSF3 in
    relapsed leukaemia. Verified quote available: ''the selection for preexisting alternatively spliced CD19
    isoforms with the compromised CART-19 epitope'' at L1.'
  why: It is the conceptual framing the section needs and the only place a splicing factor is named for CD19,
    but it is abstract-only and its claims overlap RES-006, so it was cut for budget rather than for doubt.
- note: Chen et al. 2022, PMC9808313, L10, state in their introduction that there is little evidence alternative
    splicing represents an independent mechanism of antigen escape from somatic mutations, and that splicing
    was seen at very low frequencies in the Orlando cohort. Verified quote available at L10. Recorded here
    rather than as a claim because it is an introduction-level assessment of the field rather than a result
    of that paper.
  why: It is the most direct published statement that this mechanism is less established than the chapter implies,
    and a human may well decide it belongs in the text as an attributed opinion.
- note: Antonarakis et al. 2014 (New England Journal of Medicine, doi 10.1056/nejmoa1315815) is the origin
    of the AR-V7 outcome literature and sits in the corpus as abstract-only, doc_id 73435914, full abstract
    at L1. The abstract states the variant lacks the ligand-binding domain targeted by enzalutamide and abiraterone
    while remaining constitutively active as a transcription factor. Author list and journal are absent from
    meta.json. Author names were NOT read and must not be written from memory.
  why: It is the paper this clinical argument is normally attributed to, and the structural reason AR-V7 escapes
    these two drugs but not a taxane.
- note: Bernemann et al. 2017 (European Urology, doi 10.1016/j.eururo.2016.07.021), abstract-only, doc_id 56600556,
    L1. Six of 21 AR-V7-positive men benefited from abiraterone or enzalutamide, four with a prostate-specific
    antigen decline over 50 per cent, progression-free survival 26 to 188 days; only one of the six had received
    a next-generation antiandrogen before the blood draw. Conflicts in direction with PROPHECY and supplies
    the prior-treatment confounder that may reconcile them. Anchored and reusable without re-reading. Author
    names were NOT read.
  why: Priority-five counter-evidence, already located, and the cleanest argument against using AR-V7 as a
    rule-out test.
- note: 'Cheng et al. 1994 (Science, doi 10.1126/science.7510905), abstract-only, doc_id 122434460, L1. The
    original soluble Fas: a human Fas messenger RNA variant lacking the transmembrane-encoding exon, whose
    secreted product blocked anti-Fas antibody-induced apoptosis, with raised levels in lupus patients and
    autoimmune features in injected mice. Author names were NOT read.'
  why: The chapter currently takes the FAS example from the review choi2025asresistance, and CONTRIBUTING forbids
    citing a review for a primary finding. This is the primary.
- note: 'Armstrong et al. 2019, PMC6494355, carry three numbers not recorded as claims: AR-V7 positivity in
    10 to 24 per cent of men depending on assay and 82 per cent agreement between the two assays (L15, L54);
    multivariable adjusted hazard ratios of 1.9 and 2.4 for progression and 4.2 and 3.5 for death (L15, L45,
    L46); and the statement that AR-V7 likely explains up to 25 per cent of resistance to androgen receptor
    therapy (L55). The 2020 paper (PMC7608579, L50, L51) updates the same 118 men with longer follow-up to
    adjusted hazard ratios of 1.7 and 2.1 for progression and 3.3 and 3.0 for death.'
  why: 'The 25 per cent bounds the claim: isoform switching is one route among several. The assay-dependent
    prevalence parallels the antibody-dependent CLDN18.2 positivity range already noted in this file''s leads,
    and the two should be made in the same breath.'
- note: Salton et al. 2015, PMC4435825, L24 and L28, give an estimated 30 per cent of vemurafenib-resistant
    patient tumours expressing resistance-mediating BRAF splicing isoforms, but attribute that to their references
    9, 13 and 19 rather than measuring it; the 2024 genomic-deletion abstract repeats 'up to 30%' for the same
    quantity. Poulikakos's own six of nineteen is 32 per cent in one series. These may all be the same observation.
  why: A sentence putting 6 of 19 and 'about 30 per cent' side by side as independent would be double-counting.
- note: Salton et al. 2015 (PMC4435825, L20 to L26) show that the SF3B1-directed compounds spliceostatin A
    and meayamycin B reduce the resistance-causing BRAF isoform, resensitise the resistant line to vemurafenib,
    and block xenograft formation at doses far below those used in the E7107 trials. Read but not recorded,
    because it belongs to therapeutics rather than resistance.
  why: It is the one place in this material where a splicing-directed drug reverses an isoform-mediated resistance,
    which would join this chapter to the spliceosome-modulator material in chapter 6.
- note: 'Cortes-Lopez et al. exists in this corpus only as bioRxiv preprint bio_73c5008c6bf6 (preprint DOI
    10.1101/2021.10.08.463671); the journal version is Nature Communications, doi 10.1038/s41467-022-31818-y,
    and paperclip lookup title does not resolve it. The preprint has a results section headed ''CART-19 patients
    show increased CD19 intron 2 retention after relapse'' at L30 and reports roughly 200 mutations altering
    CD19 splicing from high-throughput mutagenesis. Not recorded: a section heading is not evidence, and the
    body text under it was not read.'
  why: It is the only systematic map of which sequence changes shift CD19 splicing, and it would independently
    support the Asnani intron 2 result in patients.
- note: Gong et al. 2019, PMC6446862, L45, report that the soluble PD-L1 decoy did not reduce the efficacy
    of anti-PD-1 antibody in the same mouse model, so the resistance is specific to the drug whose binding
    site the soluble form carries. Verified text available at L45.
  why: 'It turns the mechanism from a warning into a treatment rule: when the target isoform is soluble, aim
    at the receptor rather than the ligand.'
- note: Gong et al. (PMC6446862, L50, L53) also report a third PD-L1 variant, PD-L1v178, which lacks the transmembrane
    region but is unstable, barely secreted, and does not cause resistance, which they attribute to its missing
    N-glycosylation sites. They separately found TDP-43 mutations previously seen in ALS patients in the relapsed
    tumours and showed TDP-43 can shift PD-L1 splicing.
  why: 'The negative variant is the useful half: losing the membrane anchor is not sufficient to make a decoy,
    the product also has to be stable and secreted. Without it the section overgeneralises.'
- note: Kemper et al. 2016 (PMC4929150) report BRAF V600E kinase-domain duplication in therapy-refractory melanoma
    patient-derived xenografts, a genomic rearrangement that produces a similarly RAS-independent dimerising
    protein. Read only from search output; not opened.
  why: A reader told that a drug selects for a shorter BRAF protein will ask whether the shortening is genomic
    or post-transcriptional. Naming the genomic case is what makes the post-transcriptional case credible.
- note: Ajiro and Zheng 2015 (PMC4687071) report that vemurafenib-resistant BRAF selects branch points in intron
    8 different from those used by wild-type BRAF, the same intron and mechanism class as the Salton substitution.
    Bokharaie et al. 2022 (PMC9312936) profile splicing genome-wide in vemurafenib-resistant cells carrying
    a truncated BRAF transcript. Neither opened.
  why: Two independent groups converging on intron 8 would be the strongest available evidence that this is
    a reproducible splicing lesion rather than one cell line's accident, and it bears directly on the genomic-deletion
    conflict above.
- note: Rabilloud et al. 2021 (PMC7870924) use single-cell profiling to show a pre-existing CD19-negative subclone
    in a patient who relapsed CD19-negative after CAR T-cell therapy. Not read beyond the search summary. This
    is selection of cells that were already antigen-negative, a third mechanism distinct from coding mutation
    and from splicing.
  why: The section needs three labelled mechanisms, not two, or the counter-evidence reads as a quarrel about
    one gene rather than three different things being called antigen escape.
- note: Ng et al. 2019 (PMC6877088) report that soluble PD-L1 produced by exaptation of an endogenous retroelement
    in CD274 acts as a receptor antagonist, which runs opposite to the Gong and Sagawa decoys. Not read; direction
    of effect unverified.
  why: If a soluble PD-L1 form can antagonise the pathway rather than shield it, the generalisation that soluble
    isoforms absorb the signal needs a qualifier.
- note: Secreted CD20 as a mechanism of rituximab resistance is cited twice by Gong et al. (PMC6446862, L36
    and L51) as Smith 2003, and is the precedent their decoy argument is built on. Not located in this corpus;
    no search was run for it.
  why: It would be the earliest antibody-therapy decoy case and the natural opening for the soluble-isoform
    passage, which currently opens on FAS by way of a review.
- note: 'SOURCE INDEPENDENCE. DRG-067 to DRG-070, DRG-074 and DRG-075 draw on overlapping patients from one
    centre: Sotillo, Asnani and Bagashev share the Thomas-Tikhonenko group and the Children''s Hospital of
    Philadelphia trial cohort, and Chen et al. re-sequence six of the same samples (PMC9808313, L27). DRG-071
    and DRG-072 come from Dam et al., who share an author with barnkob2022carisoform, the review the chapter
    already cites for CD19, and who re-analyse a public four-patient dataset rather than new patients. DRG-081
    to DRG-083 share the Katayama group, and DRG-085 to DRG-087 are two reports of one trial.'
  why: A deepening pass that holds two or three sources against each other inside a paragraph will otherwise
    present one laboratory's cohort as independent corroboration. The CD19 disagreement in particular is partly
    a disagreement between neighbours about the same samples.
- note: No record here anchors how often CD19-negative relapse is caused by isoform loss rather than by loss
    of the whole antigen, because no source in this corpus reports that denominator. Sotillo gives 10 to 20
    per cent of responders relapsing with epitope loss; Chen attributes seven of eight CD19-negative relapses
    to coding mutation; Asnani argues some of those calls are subclonal; Dam shows the isoform exists untreated.
    These cannot be combined into a share.
  why: The chapter should state that the split is unresolved rather than imply a proportion. This is the most
    likely place in the section for a number to be invented during the writing pass.
- note: 'The SPOTLIGHT primary publication (Lancet 2023, 401:1655-1668, doi:10.1016/S0140-6736(23)00620-7)
    is NOT in the corpus as a document. It appears only inside other papers'' reference lists. Tried: lookup
    title with the full and truncated titles; search -s abstracts with the full title phrasing; grep --source
    abstracts "gastro-oesophageal junction adenocarcinoma \(SPOTLIGHT\)"; grep --source abstracts "SPOTLIGHT"
    --exhaustive; grep "NCT03504397" /papers/. All SPOTLIGHT numbers in this file therefore come from the FDA
    multi-discipline review (fda_29df95dfc0e2), which is a primary regulatory document, not from a review.
    The ASCO primary-results abstract is doc_id 170883097 and the final-OS abstract is 151565424, both abstract-only,
    if an author-attributed citation is wanted.

    '
  why: the chapter's headline trial has no journal-article anchor in this corpus; a human may want to fetch
    the Lancet paper into the clipboard
- note: 'THE VERIFIER FAILS ON EIGHT RECORDS, FOR A PATH REASON ONLY. Running `python3 scripts/verify_claims.py`
    on this file gives "25 claims checked, 8 with problems", every one of them "QUOTE NOT FOUND in cited lines":
    DRG-092, DRG-093, DRG-094, DRG-098, DRG-099, DRG-100 and DRG-101 (four FDA documents: fda_29df95dfc0e2,
    fda_3205707f0511, fda_0a528a5f7f53, fda_c901861b1c6f) and DRG-110 (the trial registry record NCT05111626).
    The cause is that verify_claims.py hardcodes `/papers/{doc_id}/content.lines`, which does not exist for
    these documents; it also requires a non-empty `source.doi`, which regulatory and registry documents do
    not have, so I put the literal placeholders NO_DOI_FDA_DOCUMENT and NO_DOI_TRIAL_REGISTRY in that field
    plus a real `url` and a `source_type`, to make this detectable rather than silent. I verified all eight
    by hand against /fda/<id>/content.lines and /trials/<id>/content.lines with `paperclip grep -c -F`, each
    returning exactly 1, and separately confirmed each quote sits inside its cited label range. No other research/*.yml
    in the repo cites an fda_ or trials document, so there is no precedent to copy, and build_bib.py will also
    need a rule for a source with no DOI.'
  why: 'a decision is needed: teach verify_claims.py and build_bib.py the /fda/ and /trials/ paths and allow
    DOI-less regulatory sources, or lose the only primary evidence for the approval itself and for the trial
    numbers that have no journal version in this corpus'
- note: 'Trimmed to stay inside the 25-record brief; each is reusable without re-reading. (a) fda_0a528a5f7f53
    L82: HEK293 cells transfected separately with CLDN18.1 and CLDN18.2 both stained, so "the VENTANA CLDN18
    (43-14A) antibody cannot distinguish between CLDN18.1 and CLDN18.2" - the blunt statement of DRG-099. (b)
    fda_0a528a5f7f53 L167 and L169: within-block overall percent agreement 94.5%, and only 6 of 9 cases (66.7%)
    held their CLDN18 status across multiple blocks, overall agreement 89.3% (25/28) - direct evidence that
    the selecting assay is heterogeneous within a patient. (c) fda_0a528a5f7f53 L201 and L203: SPOTLIGHT screened
    2,735 patients, tested 2,433 with the assay, randomised 565. (d) PMC8565817 L77 and L91: in rats, incisor
    dysgenesis at every dose level, explained by FGFR2b signalling controlling rodent incisor regeneration
    - on-target normal-tissue toxicity seen before the cornea. (e) PMC11016503 L208: the FIGHT overall-survival
    hazard ratio moved from 0.58 at primary analysis to 0.77 at final analysis, and in the isoform-high subgroup
    from 0.41 to 0.52.

    '
  why: five anchored findings the section could use immediately; (e) in particular is a conflict between two
    analyses of one trial
- note: 'FORTITUDE-101 (NCT05052801) is marked COMPLETED with "Has Results: false" in the registry, and I could
    find no primary report of its outcome in the corpus. The only corpus statement about it is a 2026 review,
    doc_id 1001561033 (doi:10.1007/s11912-026-01845-9, abstract-only), which says first-line bemarituzumab
    development ended despite a statistically positive primary overall-survival analysis, that hazard-ratio
    estimates in both FIGHT and FORTITUDE-101 drifted toward the null at later cutoffs, that the nivolumab-backbone
    trial was stopped for inadequate efficacy per sponsor communications, and that neither phase 3 has been
    fully reported in a peer-reviewed publication. I did not record any of that as a claim because it is a
    review reporting primary findings, which CONTRIBUTING.md forbids.

    '
  why: this is probably the single most important counter-example for the section - an isoform-selective drug
    that won its trial and was still abandoned - and it currently has no citable primary source
- note: 'Searched for but did not anchor, so not in the corpus as far as I got, or not reachable as a primary:
    the EU approval of the fibronectin extra-domain-B agents (L19-based; EDB is an alternatively spliced fibronectin
    domain) - search -s papers "extradomain B fibronectin alternatively spliced domain antibody L19 tumour
    neovasculature targeting" returned only preclinical radioimmunotherapy work (PMC2359968, PMC2709218) and
    a review (PMC7332215), no approval document; rindopepimut and the ACT IV trial for EGFRvIII, which in any
    case is a genomic deletion rather than a splice isoform and belongs to neither category the chapter contrasts;
    isoform-selective HDAC and AKT inhibitors, where I found no primary establishing selectivity and where
    the selectivity is in any case between paralogous genes.

    '
  why: avoids a repeat of the same searches, and records that the EDB/L19 line would give the section a second
    approved agent whose epitope is an alternatively spliced domain
- note: 'A splice-isoform contrast the section may want and that I did not pursue for lack of budget: MET exon
    14 skipping, where tepotinib and capmatinib are approved for patients whose tumours make the exon-14-skipped
    receptor, but the drugs inhibit both forms. The selectivity there lives in patient selection rather than
    in the molecule, which is a third category alongside "selective between a gene''s isoforms" and "selective
    between paralogues". Same structure for AR-V7 in prostate cancer. Neither searched.

    '
  why: the chapter's taxonomy of isoform-directed therapy is incomplete with only two categories, and conflating
    selection with selectivity is the kind of error the brief warns about
- note: 'PMC12317400 (MONSTAR-SCREEN-2, 2025) is a corpus full-text primary that measured CLDN18 expression
    and isoform distribution by immunohistochemistry and whole-transcriptome sequencing across solid tumours,
    and PMC11563798 is a pan-cancer multi-omic analysis of CLDN18.2. Neither was read. Both bear on whether
    the isoform is gastric-restricted in tumours as well as in normal tissue, which is the premise of the pan-cancer
    claim in DRG-090''s source.

    '
  why: would let the section test a 2008 discovery claim against 2024-2025 transcriptome data instead of restating
    it
- note: Four anchored records were cut only to stay inside the 20-to-25 brief; each is verified byte-exact
    and can be promoted without re-reading. (1) fda_29df95dfc0e2 L114, quote "Interpretation of findings is
    confounded by different thresholds used to defined CLDN18.2 positivity." - the regulator's own statement
    that the published CLDN18.2 prevalence figures (27% of 203 Caucasian patients, 29% of 367 Korean patients,
    52% of Japanese primary tumours) disagree because the thresholds differ. (2) PMC8565817 L19, quote "tissues
    of epithelial origin such as the stomach and skin express the fibroblast growth factor receptor 2 IIIb
    isoform" - the normal-tissue map of FGFR2b, which is where the corneal and skin toxicity comes from. (3)
    122025412 L1, quote "The main toxicity of bivatuzumab mertansine was directed against the skin, most probably
    due to CD44v6 expression in this tissue." - the authors' own on-target reading of the failure. (4) 114760713
    L1, quote "which led to the termination of the development program of bivatuzumab mertansine and the present
    study" - the parallel CD44v6 trial, maximum tolerated dose 300 mg/m2 in 31 patients with three partial
    responses, ended by the death in the companion study rather than by lack of activity.
  why: four ready-to-use records, two of them the mechanistic core of the CD44v6 counter-example
- note: 'LINE LABELS AND `cat --lines` POSITIONS CAN DIFFER BY ONE, PER DOCUMENT. Some documents'' content.lines
    starts at the label L0 and some at L1, and `cat --lines N-N` indexes by position, so for an L0-starting
    document the label equals the position minus one: `cat /fda/fda_29df95dfc0e2/content.lines --lines 581-581`
    prints the line labelled L580. Of the documents cited here, fda_29df95dfc0e2, fda_3205707f0511 and fda_c901861b1c6f
    start at L0, while fda_0a528a5f7f53, NCT05111626 and every /papers/ document start at L1. The `lines` fields
    in this file are LABELS, matching the anchor URLs and the rest of research/. scripts/verify_claims.py fetches
    by `cat --lines` and assumes label equals position, so it must detect the first label per document and
    shift, or it will read the neighbouring line and report false failures. I checked all 25 records this way
    and every quote sits inside its cited label range; the detection is simply `cat --lines 1-1` and read the
    L<n> prefix.'
  why: without the per-document shift, three of the four FDA-anchored records look mis-anchored to the verifier
    even though every quote is byte-exact
- note: 'The four FDA documents carry no url. The accessdata.fda.gov links first recorded for them were constructed
    rather than retrieved and all four returned 404, so they were removed rather than published as dead links.
    The citable identifiers are in the records: BLA 761365 for the Vyloy approval package, multi-discipline
    review and clinical inspection summary, and PMA P230018 for the VENTANA CLDN18 companion diagnostic. A
    real url for each should be retrieved and checked before the bibliography is treated as final.'
  why: A dead link in a published reference list is worse than no link, and an invented one is worse still.
