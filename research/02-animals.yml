    which returned a usable cluster including 131662694 (used here), 128876127 (conserved exon-skipping
    events, NMD-coupled in about one fifth of cases, with conservation concentrated at synonymous sites),
    138983383 ("Low conservation of alternative splicing patterns in the human and mouse genomes") and
    136402697 (selection for reading-frame preservation). The headline species-versus-tissue clustering
    result from the 2012 vertebrate papers was not located and may not be in the corpus.

    '
  why: The function-versus-noise argument usually turns on conservation data, and three further anchored
    sources are sitting one search away.
- note: 'Read and anchored but not written up for lack of claim slots: the Dscam1 parallel to mammalian
    clustered protocadherins, including the asymmetry that specific protocadherin C-type isoforms have
    dedicated roles while Dscam1 isoforms were long treated as interchangeable (PMC10325099 L61, bio_e869b38c6c03
    L73); the tropomyosin TPM1 exon 2 switch at 2 per cent inclusion in heart versus 95 per cent in skeletal
    muscle (PMC2593745 L31), a ready-made anchor for the tropomyosin example; titin isoform shift as a
    double-edged adaptation, possibly good for diastole and costly in systole, with more compliant titin
    in dilated cardiomyopathy hearts (PMC9243441 L20); the estimate that each neuron expresses roughly
    10 to 50 Dscam1 isoforms by probabilistic splicing (PMC10325099 L12), a modern restatement of ANM-004;
    and a C. elegans claim that tissue-regulated exons are shorter, flanked by longer introns, and include
    conserved microexons under 27 nt (PMC7706725 L8).

    '
  why: These lines were opened and read, so they can be promoted to claims cheaply; the tropomyosin and
    protocadherin ones cover examples the brief named.
- note: 'Not anchored: how isoform counts PER GENE are distributed in metazoan genomes. Nothing in this
    file gives a distribution, only aggregate fractions of genes that are spliced at all (ANM-028, ANM-029)
    and a dominance statistic (ANM-033). The catalogs area (research/09-catalogs.yml) is the natural home
    for a per-gene transcript-count distribution and appears to carry transcripts-per-gene material already;
    this file should not duplicate it.

    '
  why: The brief asked for it here, but it belongs with the annotation catalogs and should not be anchored
    twice from different projects' inclusion rules.
- note: 'Not anchored: a vertebrate developmental splicing switch controlling cell fate. The invertebrate
    side is covered by ANM-005, and candidate worm material was found and read (UNC-75/CELF neuron-specific
    repression, PMC3627589; splicing of a single neuron''s sad-1 under a combinatorial transcription-factor
    and RNA-binding-protein code, PMC6641836; alternative splicing controlling pan-neuronal homeobox gene
    expression, PMC11789633), but no vertebrate fate-switch search was run.

    '
  why: A vertebrate developmental switch is the one bullet in the brief with no claim behind it, and three
    worm candidates are already located if the chapter wants more invertebrate depth instead.
- note: 'PMC3238399, the FGFR IIIb/IIIc review behind ANM-025 to ANM-027, has corpus pub_year 2011 and
    pub_date 2011-12-12 but a 2012 DOI, 10.1155/2012/950508. Year 2011 was recorded. Worth one publisher
    check so the printed year and DOI do not disagree.

    '
  why: A year/DOI mismatch in a printed reference reads as a transcription error.
- note: 'CFTR and DMD were deliberately not attempted. Both are mainly stories about mis-splicing of a
    disease allele and about splice-modulating therapy rather than about a normal isoform pair doing two
    different jobs, which is this chapter''s argument; a therapeutics area would carry them better.

    '
  why: So a later pass does not read their absence as an oversight.
- note: 'FULL-TEXT RECOVERY RESULT, PART ONE. Five of the six abstract-only Dscam1 sources have no full
    text anywhere in the corpus and must stay abstract_only: Wojtowicz 2004 homophilic binding (doc 134680986;
    its meta.json names PMC2691713 but ''paperclip ls /papers/PMC2691713/'' returns ''PMC paper not found''),
    Neves 2004 stochastic yet biased (136901354, no pmcid), Graveley 2005 docking site and selector (128751140;
    meta.json names PMC2366815, also absent), Chen 2006 diversity required (125247324, no pmcid) and Matthews
    2007 dendrite self-avoidance (118307705, no pmcid). What was searched: lookup title on all five (no
    documents found); sql on the five journal DOIs (0 rows across PMC, bioRxiv and arXiv); sql on title
    substrings; and an exhaustive paperclip grep of a sentence from each abstract over the whole corpus
    (no matches). The one full-text hit for Graveley''s selector sentence was PMC2741454, a 2009 codon-usage
    paper restating the model, not the paper itself.'
  why: So nobody repeats these searches, and so the writing pass treats these five anchors as permanent
    abstracts rather than an oversight.
- note: 'The sixth, Hong 2021 Cell Reports (doc 7365494, 10.1016/j.celrep.2021.109373), also has no full
    text here: all twelve corpus matches for its title are reference-list entries in other papers. Its
    text is reachable only as the authors'' bioRxiv preprint bio_e869b38c6c03, which DSC-001 to DSC-008
    are anchored on. Those records keep the journal bibkey and DOI (dscam2021splicingbias) with preprint:
    true, so the book still cites Cell Reports, and verify_claims.py still checks the quotes against the
    preprint. Consequence to accept deliberately: ANM-010 and ANM-011 can be retired in favour of DSC-001
    to DSC-004, but the 20 per cent and 2 per cent figures in DSC-001 and DSC-002 and the 19-of-33 count
    in DSC-007 come from the preprint and must be checked against the published version, which was retitled.
    ANM-012 cites the same document under the separate preprint bibkey hong2019dscamsplicingbias with
    the preprint DOI; one document now carries two bibkeys in this project, which is intentional but should
    be a conscious editorial choice rather than an accident.'
  why: This is the only one of the six where an abstract anchor can actually be retired, and the retirement
    is conditional on a check that cannot be done inside the corpus.
- note: CONFLICT TO RESOLVE IN THE BOOK (how the choice is made). The evidence for docking-site and selector
    base pairing is not uniform across the three clusters. For exon 6 it rests on genome mutation and
    compensatory mutation in vivo (DSC-010) and on minigene geometry (DSC-009). For exon 9 it rests on
    correlation between usage change and predicted pairing (DSC-008), and a second group argues from sequence
    alignment that no such pairing partner exists for every exon 9 (DSC-014); they argue the same for
    exon 4 in PMC6379703, which is in this corpus and was not read here. The Hong preprint answers both
    by name, as its references 32 and 33, which were confirmed by reading its reference list. The chapter
    currently states one clean cis mechanism for all three clusters.
  why: The chapter asserts a single mechanism; the evidence is strong for exon 6 and contested for exons
    4 and 9, and that gradient is the interesting part.
- note: 'PRIORITY FOUR, HOW FAR IT IS RESOLVED. The tension between heavy splicing bias and a pure self-avoidance
    account has been answered, but so far only by the laboratory that raised it: DSC-005 is that laboratory''s
    own resolution (number for self-avoidance, particular isoforms for growth and recognition, bias acting
    through non-repulsive signalling) and DSC-015 to DSC-018 are its follow-up paper, whose title states
    the conclusion. Forward citations were checked: twelve corpus documents cite Hong 2021, of which six
    are from the same laboratory (bio_96a4fc8773dd, PMC8791459, PMC10156172, PMC10325099, PMC12431208,
    PMC12962786), three are reviews (PMC9206424, PMC11052237, PMC11802352) and one is a mushroom-body
    review citing it only in its reference list (PMC9880076). The one independent primary, PMC9417601,
    agrees that Dscam1 acts beyond self-avoidance and supplies DSC-022, but does not address isoform bias.
    No independent test of the bias claim was found.'
  why: The chapter says the tension is unresolved. It has an answer, the answer changes what the repertoire
    is for, and it currently has one laboratory behind it.
- note: 'Read and quote-verified but not written up, to stay inside the record budget. PMC3535345 L39:
    pairing the docking site to a selector brings the upstream constitutive donor and the chosen exon''s
    acceptor within under 200 base pairs, below the length at which weak splice sites stop being recognised
    across an intron, which is those authors'' interpretation of their own minigene series and the most
    satisfying statement of why exactly one exon is presented. PMC3535345 L36: strengthening a variable
    exon''s 5'' or 3'' splice site lets it be included with no locus control region at all. PMC12962786
    L79: weakening or strengthening the 3'' splice site of exon 6.5 changes only that variant''s frequency.
    PMC8791459 L61: the balancer structures do not promote inclusion themselves but act on docking-site
    and selector pairing. PMC6800468 L50: exon 9 usage is unchanged by complete knockout or overexpression
    of most canonical SR and hnRNP proteins. PMC12431208 L51: productivity traits are the most diversity-sensitive
    phenotype measured and self/non-self discrimination the least. bio_e869b38c6c03 L39: neither docking-site
    deletion changed dendrite patterning in class I dendritic arborisation neurons. PMC3431597 L65: the
    Pcdh-beta cluster is organised around multiple promoters with a shared conserved element, a long-range
    enhancer and multiple CTCF sites, though that organisation is cited there from earlier mapping work
    rather than measured.'
  why: Each is an opened line with a verified quote available, so a later pass can promote any of them
    without re-reading the paper.
- note: 'Not anchored: the mechanism of stochastic promoter choice in the clustered protocadherins. DSC-006
    and DSC-026 establish that the vertebrate choice is promoter-level and allele-specific, but no record
    here measures how a promoter is chosen. Full-text candidates in the corpus, located and not read:
    PMC11343191 (ZFP661 breaking a CTCF barrier to promote protocadherin diversity), a 2022 bioRxiv on
    cohesin erasing genomic-proximity bias in protocadherin choice, and PMC4151104 (expansion of the stochastic
    expression repertoire by tandem duplication in the mouse Pcdh-alpha cluster).'
  why: The brief asked whether the two mechanisms are genuinely different; the vertebrate side of that
    answer currently rests on statements cited rather than measured.
- note: 'Not anchored: whether anyone has measured a single neuron''s Dscam1 repertoire better than the
    14-to-50-mRNA estimate the chapter quotes from a 2004 abstract (ANM-004). Candidates located but not
    read: PMC4195611 reports PacBio isoform-level profiling of whole flies and of S2 cells and compares
    its repertoire with an earlier deep-profiling study, cited there as its reference 2, which was not
    resolved in the corpus.'
  why: The per-neuron repertoire size is the number the whole self-avoidance argument rests on, and it
    enters the book from an abstract.
- note: 'Also not anchored, and relevant to how specificity is achieved rather than how it is generated:
    PMC4928987 (structural basis of Dscam1 homodimerisation, Science Advances 2016) and PMC11272049 (evolutionary
    paths of Dscam1 proteins toward highly specific homophilic interactions, Molecular Biology and Evolution
    2024) are both full text in the corpus and were located but not read. Either would give a full-text
    primary for the homophilic-specificity statement that ANM-002 currently takes from the Wojtowicz 2004
    abstract, though neither is that paper.'
  why: ANM-002 carries the chapter's central molecular premise on an abstract, and two full-text primaries
    on the same property are one read away.
- note: bio_96a4fc8773dd was read as a preprint. Its journal version, Current Biology 2022, 10.1016/j.cub.2022.05.030,
    PMID 35659864, is not in the corpus, and that DOI, journal and year were read from the reference list
    of PMC10325099 at L126 rather than from Crossref; the author list comes from the preprint's own byline.
    resolve_metadata.py should confirm all of it before the bibliography is built. PMC12962786 is dated
    2026 with a 2026 DOI and was ingested close to publication, so its year is worth one check too.
  why: These bibliographic fields come from another paper's reference list and from a very recent ingest,
    which is one hop further from the record than this project's rules prefer.
- note: 'FULL-TEXT RECOVERY ATTEMPTED AND FAILED for all four sources named in the brief. None of 135661872
    (Novak 1994 CD45 isoforms), 128403124 (Tong 2005 CD45 variable exons), 135912696 (Boise 1993 bcl-x)
    or 152858487 (Minn 1996 Bcl-xS) exists as full text in this corpus. What was tried, per document:
    corpus-wide `grep` on an exact title fragment, which returned only reference-list hits in 18, 3, 100
    and 4 citing papers respectively and no body text; `lookup title` on each of the four exact titles,
    which returned "No documents found" every time; `sql --source pmc` over titles with ILIKE and over
    author pairs, which returned only unrelated papers; `sql --source pmc` with `doi =` and the exact
    DOI for each of the four, 0 rows each (an earlier unqualified DOI query timed out at 15 s and reported
    only arXiv, so it was discarded and rerun); `cat meta.json`, which carries no pmcid for any of the
    four and sets "text_access": "abstract_only"; `cat content.lines --lines 1-5`, which returns a single
    L1 abstract in each case; and `ls /clipboard/` plus a clipboard `grep` for CD45 and Bcl-x, which matched
    nothing. Not tried: `paperclip fetch`, which writes to the user''s clipboard and is not a corpus search.
    These four stay abstract-only. Do not "recover" them by quoting the introduction of a citing paper;
    that is a secondary restatement, not a re-anchor.

    '
  why: So no later pass repeats the search, and so the four records are known to be irrecoverable rather
    than merely un-attempted.
- note: 'CONFLICT TO RESOLVE IN THE BOOK (CD45 isoform versus CD45 amount). Three anchored records now
    contradict the chapter''s sentence that the short exon-null isoform "supported antigen recognition
    best" as a general property. CEL-011 (38135848 L1, 1994) found the opposite polarity in primary CD4
    thymic T cells: the long CD45RABC enhanced signalling and CD45R0 did not. CEL-009 (134808911 L1, 2004)
    rescued CD45-null mice with one isoform at a time and found T cell development and function tracking
    CD45 level, not isoform. CEL-010 (112811158 L1, 2008) compared CD45RO, CD45RB and CD45RABC transgenes
    and got hyper-reactivity from all three. CEL-001 (140690545 L1, 2003) adds that a large ectodomain
    is required for optimal signalling. The defensible statement is that the splice choice changes the
    ectodomain and that what the change does to signalling is disputed, with at least one line of evidence
    for each direction and one for dose rather than identity. The chapter must not assert "short isoform
    signals better".

    '
  why: The chapter's CD45 section currently rests on a single abstract and states as settled a question
    the literature has argued both ways for thirty years.
- note: 'CONFLICT TO RESOLVE IN THE BOOK (Bcl-x mechanism). This supersedes the existing 02-animals lead,
    which says the heterodimer model "rests on the review and not on the primary report". There is a primary:
    CEL-015, 62878572 L1 (1999), reports Bcl-xS forming heterodimers with Bcl-xL in mammalian cells, with
    inhibition of survival tracking the heterodimerisation and requiring an intact BH3 domain. So the
    2019 review cited in ANM-021 is not inventing the mechanism; it is repeating a 1999 result that contradicts
    the 1996 one recorded in ANM-020 and CEL-014. The defensible statement is that two primary reports
    disagree, three years apart, and that the chapter should name both rather than treat the mechanism
    as absent. Downstream, CEL-016 (2005) makes Bak essential and Bax dispensable, and CEL-017 (2012)
    finds no direct Bcl-xS-Bak contact and proposes release of Bak from VDAC2 instead, which is compatible
    with the 1996 negative result about Bak and not with a simple heterodimer-with-everything model. All
    four are abstract-only; the corpus holds no full text for any of them, so no methods detail can be
    compared between them.

    '
  why: A deepening pass would otherwise repeat the existing lead's claim that no primary supports heterodimerisation,
    which is false.
- note: 'NOT ANCHORED, and the brief asked for it: how tight FGFR IIIb/IIIc ligand discrimination actually
    is, quantitatively. CEL-021 anchors absolute specificity for two ligands against FGFR2b from the 2003
    structural paper''s abstract, but no affinity-matrix measurement was located as full text. What was
    tried: a PMC title search for "Receptor specificity of the fibroblast growth factor family" and "the
    complete mammalian FGF family" (0 rows), and an abstracts search on receptor specificity, which returned
    a usable abstract-only cluster not used here: 156548312 (FGFR1-IIIb as a naturally occurring functional
    receptor preferentially expressed in skin and brain, 2000), 153718215 (the glycine box as a determinant
    of FGF specificity, 1998), 151898738 (receptor binding and mitogenic properties of mouse FGF3, 1995)
    and 180653134 (the IIIc variant of FGFR1 conferring responsiveness to heparin and FGF5). A systematic
    FGF-by-FGFR affinity panel, if one exists in the corpus, was not found. Also not searched: whether
    Apert-syndrome FGFR2 mutations relax IIIb/IIIc ligand discrimination, which would be the sharpest
    available test of how much of the specificity is the exon''s doing.

    '
  why: The chapter asserts that the splice choice decides which ligands the receptor can respond to "at
    all", and that word needs a measurement behind it.
- note: 'Read and anchored but deliberately left for a later pass. hnRNP L binding to an RNA carrying
    all three CD45 variable exons rises more than twenty-fold over single-exon RNAs and resists 200 mM
    salt (PMC3384337 L69), which is the evidence for a cross-exon complex that loops exon 5 out; the exon-level
    cis-elements in CD45 exons 5 and 6, each carrying a silencer and an enhancer with an activation-responsive
    motif homologous to the one in exon 4 that binds hnRNP L (128403124 L1, a second statement from the
    abstract ANM-017 already cites); the measured dimensions of the short CD45 ectodomain, about 216 angstroms
    N- to C-terminus with a rigid 80-angstrom mucin segment (PMC4839504 L23); and the observation that
    returning CD45RA and CD45RC epitope levels on human memory CD8 T cells reach only about 60 to 70 per
    cent of naive levels (PMC12358852 L30). All four lines were opened and read and can be promoted to
    claims without re-reading.

    '
  why: Cheap depth, already verified, and the 60 to 70 per cent figure is the one number that keeps "reversible"
    from being read as "fully reversible".
- note: 'NOT ANCHORED: a CD45 claim about reversibility measured at the mRNA isoform level in a time course
    rather than by surface epitope. CEL-007 and CEL-008 rest on antibody staining of the RA, RB, RC and
    RO epitopes plus RT-PCR of transcript classes, and the paper itself says the full-length ABC transcript
    differences are too small to separate naive from memory cells by flow cytometry. A long-read or exon-level
    quantification of the five CD45 isoforms across a human activation time course would settle how complete
    the reversal is; PMC11496083 (IDEIS, a tool for calling PTPRC/CD45 isoforms from single-cell data,
    2024) was seen in search results and not read, and is the obvious place to look for one.

    '
  why: The chapter's claim that CD45 runs a developmental cascade's machinery "reversibly" deserves a
    transcript-level measurement, not only a surface marker.
- note: 'NOT PURSUED, recorded so its absence is not read as an oversight. Three further cases of this
    chapter''s shape were located and not written up: soluble VEGF receptor 1 in preeclampsia, where a
    splice variant acts as a ligand trap (candidates PMC7042122 on U2AF65 and JMJD6 control of sFlt-1
    splicing, PMC3149381, PMC3834253); the dispute over whether the VEGF-A "b" isoforms exist at all,
    which the brief''s counter-evidence bullet points at and which was not searched; and the neurexin-3
    combinatorial splice code acting through dystroglycan at inhibitory synapses (PMC10063607). Also not
    attempted: Robo3.1 and Robo3.2, whose splice variants respond oppositely to Slit; a corpus search
    returned only downstream work (PMC6511866 on m6A control of Robo3.1 translation) and not the primary.
    Also located and not read in detail: PMC3208548, a full-text primary reporting that hnRNPLL deficiency
    alters CD45 splicing in both NKT and conventional T cells but affects the survival of only the conventional
    ones. It is the cheapest available way to replace an abstract-only counter-evidence record (CEL-012)
    with a full-text one if the abstract-only share of this file needs cutting.

    '
  why: Each is a one-search extension of the material here, and the VEGF-A "b" isoform dispute is the
    strongest available counter-example to taking an annotated isoform as a functional entity.
- note: 'BIBLIOGRAPHY. Fifteen of the twenty-eight records here are abstract-only and their source blocks
    carry the literal RESOLVE_FROM_DOI in authors and journal, with title-derived bibkeys: CEL-001, CEL-004,
    CEL-009, CEL-010, CEL-011, CEL-012, CEL-014, CEL-015, CEL-016, CEL-017, CEL-020, CEL-021, CEL-024,
    CEL-026 and CEL-028. Every one carries a DOI. CEL-014 reuses the source block of ANM-020 verbatim,
    including its resolved author list and metadata_source, so the two must stay on one bibkey; a cross-file
    bibkey check against 02-animals.yml found no other shared key and no DOI recorded under two keys.
    Six corpus titles were recorded with markup or special characters normalised and should be checked
    against the DOI record before printing: 14576866 (italic tags around Ptprc), 62878572 (subscript tags
    around S and L), 89313243 (en dash in VDAC2-Bak), 116823055 (Greek alpha), PMC5096029 (non-breaking
    hyphen in "epithelial-specific") and PMC4839504 (curly quotation marks around "close-contacts"). The
    fourteen resolved author strings in this file were tested against build_bib.py''s own author_format_problems()
    and all pass; the only flags are the fifteen RESOLVE_FROM_DOI placeholders, which that check is expected
    to reject until resolve_metadata.py has run.

    '
  why: resolve_metadata.py has to run over this file before any of these become numbered references, and
    the one shared bibkey is the kind of thing that silently becomes two entries.
- note: 'FULL-TEXT RECOVERY, ALL THREE NEGATIVE. The corpus holds no full text for sxl1990trasplicesite
    (doc 138529056, Nature 1990), dsx1993spliceenhancercomplex (135912614, Cell 1993) or dsx1989sexspecificpolypeptides
    (135661199, Cell 1989). Searches run, per document: lookup title on the exact corpus title; lookup
    doi; lookup pmid; paperclip ls of the document, which shows only meta.json, content.lines and sections/ABSTRACT.md.lines;
    and an exhaustive full-text grep of the whole /papers/ corpus on a distinctive mid-abstract phrase
    ("binds specifically to the tra transcript", "individual SR proteins differ significantly in their
    ability", "sex-specific carboxyl termini"), none of which matched anywhere. Exhaustive greps on the
    two exact Cell titles matched 34 and 97 paragraphs across the same numbers of papers; of the six inspected
    in each case, every one was a reference-list entry and none was body text. All three meta.json files
    give source "pubmed" with no pmcid, which is why there is no full text: these are pre-PMC journal
    issues. The three stay abstract_only, and so do ANM-013 to ANM-015. One record of the three recovery
    attempts was dropped to make room when the brief was extended to human sex determination: a record
    on doc 138529056''s co-transfection experiment, formerly SWI-001, which is why the ids in this file
    start at SWI-002. The recovery outcome for that document is fully stated here and ANM-013 still covers
    its finding. SWI-037, the record added in its place, sits at the end of the human sex-determination
    section rather than in id order.

    '
  why: So no later pass repeats this and so the chapter's warning callout can name these three accurately
    rather than vaguely.
- note: 'HOW DEEP THE ANCHORS GO, stated plainly because it is the thing this pass was meant to fix and
    only partly did. THIS LIST IS AUTHORITATIVE; do not rely on the individual notes to be complete. Of
    36 records, 13 are abstract_only, over 12 sources, since doc 135536863 is cited twice: SWI-002 to
    SWI-008, SWI-012, SWI-020, SWI-030, SWI-031, SWI-035 and SWI-037. The other 23 are full_text and none
    is a preprint. Of those 23, only nine sit on a Results line: SWI-010, SWI-011, SWI-013, SWI-014, SWI-017,
    SWI-018, SWI-025, SWI-033 and SWI-034. The other fourteen sit on the paper''s own abstract, except
    SWI-029, which sits on an introduction line summarising two earlier papers: SWI-009, SWI-015, SWI-016,
    SWI-019, SWI-021, SWI-022, SWI-023, SWI-024, SWI-026, SWI-027, SWI-028, SWI-029, SWI-032 and SWI-036.
    No record cites a figure, a figure caption or a supplementary file. Two quotes contain the source''s
    own parenthetical figure references, which are part of the byte-exact span and not a use of the figure.
    Eleven records over ten sources carry the literal string RESOLVE_FROM_DOI in authors and journal,
    because those abstract-only meta.json files hold no author list and no journal name: SWI-004 to SWI-008,
    SWI-012, SWI-020, SWI-030, SWI-031, SWI-035 and SWI-037, where SWI-006 and SWI-007 share doc 135536863.
    build_bib.py''s author_format_problems will flag all eleven until scripts/resolve_metadata.py --write
    has run; its PLACEHOLDER pattern does match that string, checked. Every one of the ten has a DOI,
    so all are resolvable.

    '
  why: An agent reading this file later should not have to re-derive how much of it rests on abstracts,
    and the next pass's cheapest improvement is to move the abstract-anchored full-text records onto Results
    lines.
- note: 'CONFLICT TO RESOLVE IN THE BOOK (how the male state is held). SWI-007 records Bell and colleagues''
    1991 conclusion that the male determined state is "maintained by default", meaning no maintenance
    factor is required. SWI-013 and SWI-014 record that Ssx competes with Sxl for the same U-rich elements
    and that removing ssx lets about 5 per cent of hemizygous males make functional Sxl protein from a
    skipped poison exon. Both are anchored. The defensible statement is that the male state needs no positive
    feedback but is not passive either: it has a competitive inhibitor whose loss makes the switch leak,
    without the leak reaching transformer. Do not write "maintained by default" unqualified.

    '
  why: The chapter's claim that developmental cascades set an isoform once rests on exactly this question,
    and the 1991 and 2018 answers differ in kind.
- note: 'CONFLICT TO RESOLVE IN THE BOOK (how Sxl autoregulation works). SWI-008 (doc 9412684) concludes
    that the 5'' splice site of the Sxl male exon is dominant in regulation and the 3'' site subordinate.
    The 1993 blockage paper in the corpus (63307117, duplicated as 9006472) concludes from the same system
    that the poly(U) run at the male exon 3'' splice site is required for sex-specific splicing. Both
    are abstract-only and neither was read beyond its abstract. They may be compatible, since "required"
    and "dominant" are different claims, but the chapter should not assert either as the mechanism without
    saying the other exists.

    '
  why: Two 1993 papers on one exon reaching different emphases is exactly the sort of thing a single-source
    paragraph would hide.
- note: 'CONFLICT NOT RESOLVED, because only one side was read. SWI-028 is one German cohort finding no
    association between the CD45 exon 4 77C-to-G variant and multiple sclerosis. That paper''s own background
    at L18 says earlier reports were contradictory and cites three of them; none of the three was retrieved
    or read. The chapter must therefore present SWI-028 as one cohort''s null against a divided literature.
    The record''s claim wording was changed from "did not replicate" to "found no association" for this
    reason.

    '
  why: Calling a result a failed replication without reading what it failed to replicate is the kind of
    error no mechanical check can catch.
- note: 'HUMAN SEX DETERMINATION BEYOND WT1: what was searched and what was found. WT1 is covered by SWI-029
    to SWI-035 and SWI-037. Patient denominators are small throughout: two sisters in SWI-037, one carrier
    out of 37 screened children in SWI-031, two unrelated patients in SWI-035, one patient in SWI-036.
    No larger series with stated sex-development outcomes was anchored. PMC8484119 is a systematic review
    of genotype-phenotype correlations in Frasier syndrome and is the place a later pass should go for
    its primaries. One further abstract was read and not recorded for want of a slot: 75998273 (2002),
    a single male patient with the IVS9+4C>T mutation whose transcript analysis showed reversal of the
    normal +KTS to -KTS ratio yet who had predominantly male ambiguous genitalia and NO gonadal dysgenesis,
    which is a ready-made second counterweight to the ratio model alongside SWI-035. For the other genes
    named in the brief: NR5A1/SF1 returned several single-patient splicing cases, of which one is recorded
    as SWI-036 and all appear to be loss-of-function by mis-splicing rather than isoform-ratio shifts;
    also located and not read were PMC13778004 (a non-coding exon 1 splicing variant) and PMC4666572.
    DMRT1 returned no human isoform-ratio case: the human hit was PMC10671459, an intragenic tandem duplication
    in a 46,XX SRY-negative boy, which is a structural and dosage change, not splicing. The DMRT1 splicing
    material in the corpus is non-mammalian, chiefly PMC7085901 on thermosensitive Dmrt1 alternative splicing
    in the painted turtle, which would be a correlative temperature-dependent case and was not read. CYP19A1
    returned no human promoter or first-exon primary: the hits were mouse adipose (PMC2684739), porcine
    (PMC8067493), bovine (PMC4076500), a breast cancer promoter study (PMC6235026) and chicken gonadal
    differentiation (PMC7560524). Androgen receptor returned three developmental splicing cases, none
    read: PMC5016895 (a deep intronic pseudoexon-activating mutation causing complete androgen insensitivity),
    PMC5797100 (a deep intronic mutation creating an alternative acceptor, causing PARTIAL androgen insensitivity,
    which is the one most likely to be a ratio case rather than a loss-of-function case) and PMC13238024
    (a splice site mutation giving an in-frame internal deletion). Also located and not read: PMC7567082,
    on nonsense-associated altered splicing of MAP3K1 in two siblings with 46,XY DSD.

    '
  why: The brief asked for absences to be reported, and the AR partial-insensitivity paper is the single
    highest-value unread source for the human half of this section.
- note: 'Read and judged unusable as primaries, so used only as pointers: PMC8484119 (systematic review
    of genotype-phenotype correlations in Frasier syndrome, which is where a larger patient series with
    denominators would come from and which should be mined for its primaries rather than cited); PMC5488161
    (Sxl regulatory partnerships); PMC11752881 (immune receptor splicing); PMC12179342 ("Splicing to keep
    splicing", the natural source for feedback-stabilised splicing states, but a review); PMC12632421
    (explicitly a hypothesis paper). One corpus document relevant to WT1 is a preprint and was not read:
    med_c2810acd6c16, "High-throughput splicing assays identify known and novel WT1 exon 9 variants in
    nephrotic syndrome", which would need preprint: true and which is the obvious source for how many
    exon 9 variants actually shift the ratio.

    '
  why: So a later pass does not cite the reviews by mistake and knows where the larger WT1 denominators
    live.
- note: 'NOT SEARCHED, as opposed to not found. Three things in this file''s scope were never searched
    for and their absence should not be read as evidence: (1) a demonstration that the CD45 isoform pattern
    returns to the resting state after stimulus withdrawal, which is the direction the chapter''s "reversibly"
    actually asserts; the candidates PMC4053824 and PMC4647460 were located from search summaries but
    not opened; (2) Keyes, Cline and Schedl 1992 on establishing Sxl autoregulation, the primary behind
    the Pe-to-Pm promoter shift that PMC5500889 L46 summarises as background; (3) a "dosage rather than
    isoform identity" sweep using paperclip evidence or phrasings such as "either isoform rescues", which
    is how priority four should have been approached rather than by gene name. Priority four as it stands
    is three PKM records (SWI-025, SWI-026, SWI-027) plus SWI-028 and SWI-035, so the question the chapter
    actually asks, whether PKM is unusual, is not answered here.

    '
  why: The difference between an absent search and an empty search matters to anyone deciding where to
    spend the next pass.
- note: 'Counter-evidence located but not anchored: PMC5977456 reports that isoform-specific deletion
    of PKM2 constrains tumour initiation in a mouse soft tissue sarcoma model. That is a third direction:
    SWI-025 and SWI-026 find no effect, SWI-027 finds that PKM2 loss promotes tumours, and this one finds
    that PKM2 loss restrains them. With those three it would make a four-source paragraph in which the
    sign of the PKM2 deletion phenotype depends on the tissue. It was left out only because the record
    budget was full.

    '
  why: A paragraph that holds four tissue-specific PKM2 deletion results against one another is exactly
    the synthesis CONTRIBUTING.md asks for, and three of the four are already anchored.
- note: 'Two further anchors for the Sxl mechanism exist and were not written up for want of records:
    63307117 and 9006472 are two corpus copies of the same 1993 paper showing that the poly(U) run at
    the male exon 3'' splice site is required and that the mechanism is blockage rather than activation,
    and 142508100 (1994) reports that the 40 nucleotides immediately upstream of the regulated transformer
    splice site are sufficient to direct sex-specific regulation and Sxl binding. Both are abstract-only.
    A later pass must pick one of the two duplicate ids for the 1993 paper or the bibliography will double-count
    it.

    '
  why: The 40-nucleotide sufficiency result is the tightest cis statement in the cascade, and the duplicate-id
    trap would otherwise be found the hard way.
- note: 'Suspected but not established, so not cited: that a developmental splicing state is maintained
    by chromatin rather than by protein feedback. Searches on heritable splicing memory returned bio_75163b5e71a6
    (histone marks as drivers of the splicing changes in an epithelial-to-mesenchymal transition) and
    bio_be8284467455 ("Revisiting Evidence for Epigenetic Control of Alternative Splicing", which reads
    from its title as a challenge to that literature). Both are bioRxiv preprints and neither was read;
    both would need preprint: true. The second may be the more useful of the pair, since the chapter needs
    to know whether the chromatin-memory account survived scrutiny before asserting it.

    '
  why: Chromatin memory is the mechanism a reader will expect for "the switch stays set", and the corpus
    evidence for it appears to be contested.
- note: 'Species and evidence-type coverage, stated so the chapter does not overclaim. The experimental
    vertebrate records are all mouse; the human records (SWI-030, SWI-031, SWI-035, SWI-036, SWI-037)
    are patient genetics with denominators of one to two patients each, apart from SWI-031''s screen of
    37. SWI-032 to SWI-034 reach isoform resolution, because the alleles are isoform-specific and the
    readout is sex reversal, which closes the gap the existing leads of research/02-animals.yml named.
    SWI-022 reaches exon resolution by cis deletion. SWI-023 and SWI-024 manipulate splicing factors rather
    than exons, so they show that a programme is required without isolating an isoform. Everything else
    is insect or cultured cells.

    '
  why: So the chapter does not treat a splicing-factor knockout and an isoform-specific allele as the
    same grade of evidence, which is the distinction the whole chapter turns on.
- note: 'Working-directory hazard, recorded for the orchestrator, and one thing this agent got wrong.
    The stage2 scratch directory is shared between agents on this pass. A file named slice.py that this
    agent wrote there was overwritten by another agent''s version of the same name while this agent was
    still using it. Worse, this agent then DELETED that file while tidying up, believing it to be its
    own, and restored it from the last version it had been shown, which may not have been the current
    one. Any agent relying on stage2/slice.py should check it before use. This agent''s own research was
    unaffected: its quotes were all sliced with a differently named copy, swi_slice.py, and every one
    was re-verified from the written YAML by verify_claims.py. The lesson from CONTRIBUTING.md about giving
    each agent its own scratch directory was not followed on this pass.

    '
  why: Two agents clobbering same-named working files is the exact failure CONTRIBUTING.md records from
    the chapter 5 pass, and it happened again.
- topic: retired records ANM-010 and ANM-011
  note: 'Both read doc 7365494 as an abstract and stated the isoform-bias result. Retired when DSC-001
    to DSC-005 anchored the same findings, with figures, on the authors'' own preprint full text. No citation
    is lost: the new records carry the same bibkey.'
- topic: SWI-030 author list looks truncated
  note: Crossref returns a single author, Klamt, B., for 10.1093/hmg/7.4.709, a 1998 Human Molecular Genetics
    paper that almost certainly has more. The record carries what Crossref gave rather than a guess. Check
    against the publisher page before this is cited in prose, since a one-author citation for a multi-author
    paper misattributes the work.
