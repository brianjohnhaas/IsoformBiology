leads:
- note: 'CONFLICT TO RESOLVE IN THE BOOK (PKM). ANM-034 and ANM-035 disagree about whether a PKM1-to-PKM2
    switch accompanies tumorigenesis. PMC3498831 L8 states that exon 10 use is crucial for aerobic glycolysis
    and tumour growth; PMC3248187 L7 and L13 report absolute mass-spectrometric quantification showing
    PKM2 already predominant in matched normal kidney, lung, liver and thyroid (a minimum of 93 per cent
    of total PKM) and explicitly criticise the earlier Western-blot comparisons against human muscle.
    Both are anchored. The chapter must not assert the switch as established; the defensible statement
    is that forcing the splice choice has a large phenotype in cancer cells, which is a separate question
    from whether tumours naturally change the ratio.

    '
  why: The PKM1/PKM2 switch is one of the most-repeated isoform stories in cancer biology and the primary
    quantification contradicts it.
- note: 'CONFLICT TO RESOLVE IN THE BOOK (Bcl-x mechanism). The 2019 review (PMC6743414 L24) states that
    Bcl-xS inhibits Bcl-xL and Bcl-2 "by forming heterodimers". The 1996 primary paper it rests on says
    the opposite about the mechanism: at 152858487 L1 the authors report that Bcl-xS binds Bcl-xL only
    weakly in vitro, that coimmunoprecipitation showed no observable heterodimers with other Bcl-2 family
    members, and that Bcl-xS therefore "does not appear to function by competitively disrupting the formation
    of dimers". ANM-021 is attributed to the review and marked medium for this reason. The functional
    antagonism is not in doubt; the mechanism is, and the chapter should say that Bcl-xS antagonises Bcl-xL
    without asserting heterodimerisation.

    '
  why: Reviews of this locus repeat a mechanism the cited primary paper argues against; the book would
    inherit the error.
- note: 'Several pre-2010 classics exist in the corpus only as abstract-only records whose meta.json carries
    title, DOI, PMID and year but NO author list and NO journal name. Affected claims: ANM-002, ANM-003,
    ANM-004, ANM-006, ANM-007, ANM-009, ANM-010, ANM-011, ANM-013 through ANM-015, ANM-017 through ANM-020,
    ANM-029. Their source.authors and source.journal fields say so rather than guessing, and their bibkeys
    were derived from title plus year rather than from a first author. Every one has a DOI, so the bibliography
    pass can resolve author, journal, volume and pages mechanically; it must do so before any of these
    become numbered references. Checked: the abstract-only records are not present in the SQL-queryable
    documents table (which unions only bioRxiv/medRxiv, arXiv and PMC), so there is no in-corpus route
    to the author lists.

    '
  why: A reference list cannot be built from these records as they stand, and inventing author names from
    memory is exactly what this workflow exists to prevent.
- note: 'RESOLVED, recorded for audit. The Dscam1 splicing-bias work was first read as the bioRxiv preprint
    bio_e869b38c6c03 (preprint DOI 10.1101/622217 only). A targeted abstracts search on the distinctive
    title words then found the journal version: doc_id 7365494, Cell Reports 2021, doi 10.1016/j.celrep.2021.109373,
    PMID 34260933, retitled "RNA pairing architecture-driven splicing bias". ANM-010 and ANM-011 were
    re-anchored to that version''s abstract. ANM-012, the authors'' argument that heavy bias is uneconomical
    for self-avoidance, appears only in the preprint''s introduction (bio_e869b38c6c03 L17) and is marked
    medium; it should be re-checked against the Cell Reports full text, which the corpus does not hold.

    '
  why: So no one re-does this search, and so the one remaining preprint-only claim is visible.
- note: 'Conservation of isoform USAGE across species is only partly anchored (ANM-005 for Caenorhabditis,
    ANM-009 for human-mouse exons). What was tried: lookup title on the 2012 vertebrate comparative-splicing
    paper (nothing); a full-text topic search, which returned adjacent work (cross-mammalian RNA modification
    and transcript diversity, evolutionary splicing graphs, tissue-specific splicing versus tissue-specific
    expression in repurposed ancestral genes); and an abstracts search on human-mouse orthologue comparisons,
    which returned a usable cluster including 131662694 (used here), 128876127 (conserved exon-skipping
    events, NMD-coupled in about one fifth of cases, with conservation concentrated at synonymous sites),
    138983383 ("Low conservation of alternative splicing patterns in the human and mouse genomes") and
    136402697 (selection for reading-frame preservation). The headline species-versus-tissue clustering
    result from the 2012 vertebrate papers was not located and may not be in the corpus.

    '
  why: The function-versus-noise argument usually turns on conservation data, and three further anchored
    sources are sitting one search away.
- note: 'Read and anchored but not written up for lack of claim slots: the Dscam1 parallel to mammalian
    clustered protocadherins, including the asymmetry that specific protocadherin C-type isoforms have
    dedicated roles while Dscam1 isoforms were long treated as interchangeable (PMC10325099 L61, bio_e869b38c6c03
    L73); the tropomyosin TPM1 exon 2 switch at 2 per cent inclusion in heart versus 95 per cent in skeletal
    muscle (PMC2593745 L31), a ready-made anchor for the tropomyosin example; titin isoform shift as a
    double-edged adaptation, possibly good for diastole and costly in systole, with more compliant titin
    in dilated cardiomyopathy hearts (PMC9243441 L20); the estimate that each neuron expresses roughly
    10 to 50 Dscam1 isoforms by probabilistic splicing (PMC10325099 L12), a modern restatement of ANM-004;
    and a C. elegans claim that tissue-regulated exons are shorter, flanked by longer introns, and include
    conserved microexons under 27 nt (PMC7706725 L8).

    '
  why: These lines were opened and read, so they can be promoted to claims cheaply; the tropomyosin and
    protocadherin ones cover examples the brief named.
- note: 'Not anchored: how isoform counts PER GENE are distributed in metazoan genomes. Nothing in this
    file gives a distribution, only aggregate fractions of genes that are spliced at all (ANM-028, ANM-029)
    and a dominance statistic (ANM-033). The catalogs area (research/09-catalogs.yml) is the natural home
    for a per-gene transcript-count distribution and appears to carry transcripts-per-gene material already;
    this file should not duplicate it.

    '
  why: The brief asked for it here, but it belongs with the annotation catalogs and should not be anchored
    twice from different projects' inclusion rules.
- note: 'Not anchored: a vertebrate developmental splicing switch controlling cell fate. The invertebrate
    side is covered by ANM-005, and candidate worm material was found and read (UNC-75/CELF neuron-specific
    repression, PMC3627589; splicing of a single neuron''s sad-1 under a combinatorial transcription-factor
    and RNA-binding-protein code, PMC6641836; alternative splicing controlling pan-neuronal homeobox gene
    expression, PMC11789633), but no vertebrate fate-switch search was run.

    '
  why: A vertebrate developmental switch is the one bullet in the brief with no claim behind it, and three
    worm candidates are already located if the chapter wants more invertebrate depth instead.
- note: 'PMC3238399, the FGFR IIIb/IIIc review behind ANM-025 to ANM-027, has corpus pub_year 2011 and
    pub_date 2011-12-12 but a 2012 DOI, 10.1155/2012/950508. Year 2011 was recorded. Worth one publisher
    check so the printed year and DOI do not disagree.

    '
  why: A year/DOI mismatch in a printed reference reads as a transcription error.
- note: 'CFTR and DMD were deliberately not attempted. Both are mainly stories about mis-splicing of a
    disease allele and about splice-modulating therapy rather than about a normal isoform pair doing two
    different jobs, which is this chapter''s argument; a therapeutics area would carry them better.

    '
  why: So a later pass does not read their absence as an oversight.
