leads:
- note: 'The corpus record for Parsons et al. 1984 (PMC7133311) is a PMC reprint listing: title, authors,
    the summary at L5, then the reference list from L7 onward, with no body text. Its header line reads
    "Cell (2004)" while meta.json carries the original 1984 DOI 10.1016/0092-8674(84)90552-X. The claim
    drawn from it is marked abstract_only and the bibliography should cite the 1984 Cell paper, not a
    2004 date.

    '
  why: A 1984 date on a foundational trans-splicing citation is load-bearing for the chapter's history,
    and the corpus record disagrees with itself about it.
- note: 'The symbiosis claim (PFO-034) is anchored on a bioRxiv preprint, bio_3530267271b7, whose meta.json
    lists only the preprint DOI 10.1101/2023.09.20.558436. The corpus search result reports a 2024 published
    version at doi 10.1038/s41467-024-51512-5 (Nature Communications), which was not in the corpus as
    full text. Cite the journal version and re-check the effector-target list against it.

    '
  why: The claim names specific interaction partners (SR45, U170K, U2AF35) and those are exactly the details
    a peer-review round changes.
- note: 'Four different denominators for plant AS prevalence appear across the sources read for this file
    and they are not interchangeable: 61.2 per cent of intron-containing Arabidopsis genes (PFO-001; 2012
    deep RNA-seq, flower and seedling only), about 49 per cent of intron-containing genes under salt stress
    (PFO-010; 2014, ~200x coverage), 60 to 70 per cent of intron-containing genes (bio_3530267271b7 L16,
    citing a review), and about 70 per cent of multi-exon plant genes against over 95 per cent in animals
    (PMC13136898 L17, a review statement that was not written up as a claim). Denominator, tissue, stress
    state and depth all differ.

    '
  why: Any table putting a plant AS percentage beside a human one will read as an error unless each row
    states its denominator and its sampling depth.
- note: 'The claim that intron retention is the dominant plant AS mode needs its own qualifier, and one
    source states it directly: PMC8195531 L12 says the most frequent AS mode in plants is intron retention,
    "however that depends on the tissues sampled and growth conditions of the plants". Read alongside
    PFO-003, this means the plant-versus-mammal event-type contrast is real but condition-dependent.

    '
  why: The chapter's cleanest contrast with the mammalian picture is the event-type one, so the condition
    dependence has to be stated or a reviewer will supply it.
- note: 'The FLM-delta mechanism is genuinely contested, and within one paper. PFO-004 records the CRISPR
    result arguing against a dominant-negative role at native expression, while the same paper''s L47
    states that 35S-driven FLM-delta in an flm-3 background does flower significantly earlier than controls
    at 16 degrees, confirming the earlier Pose and Lee results. Both positions are the same authors''.

    '
  why: FLM should be presented as a case where the isoform ratio matters and the dominant-negative label
    is dose-dependent, not as a settled textbook example.
- note: 'Trypanosome trans-splicing is anchored here on a 1984 Cell paper (PFO-027) and a 2026 bioRxiv
    preprint (PFO-028, bio_bf815ebe4432, doi 10.64898/2026.10.18.760011). No journal version of the preprint
    was found in the corpus. Its mechanistic proposal - that polyadenylated SL RNA precursors rather than
    mature SL RNPs are the trans-splicing substrate - is novel and should be re-checked before the chapter
    asserts it as established mechanism.

    '
  why: The architectural contrast (polycistronic transcription resolved by trans-splicing) is safe; the
    specific substrate model is not yet peer-reviewed.
- note: 'Chen et al. 2014 is internally inconsistent about its own sample. L5 says over 39 million ESTs
    for 47 eukaryotic species with fully sequenced genomes; L17 says over 39 million partial transcripts
    representing 112 eukaryotes (20 protists, 18 plants, 23 fungi, 51 metazoans). PFO-032 cites both lines
    and states the 47-genome figure, which is the one the abstract uses.

    '
  why: If the chapter quotes a species count for the largest coverage-corrected AS comparison, the two
    numbers in the same paper mean different things and the text should say which.
- note: 'Fission yeast appears here only through Mmi1-mediated meiotic regulation (PFO-018). No genome-wide
    Schizosaccharomyces pombe AS prevalence figure was anchored, although PFO-019''s source cites earlier
    work placing S. pombe in the 0 to 5 per cent band alongside S. cerevisiae (PMC3925392 L16). No genome-wide
    Plasmodium AS percentage was anchored either.

    '
  why: The intron-poor-to-intron-rich fungal axis is the chapter's cleanest comparative figure and currently
    has a gap where fission yeast should sit.
- note: 'Candida and Amoebozoa have no claim in this file. For Candida, a comparative AS study of human
    fungal pathogens surfaced in search as PMC6176087 (Sieber et al. 2018) and was not opened. For Amoebozoa,
    precise intron loss counts for Dictyostelium discoideum and D. purpureum are anchorable at PMC4683709
    L11 (441 and 202 losses), and an alternative-promoter study of the acaA gene sits at PMC2952602, but
    neither is an alternative splicing prevalence figure or a developmental isoform switch.

    '
  why: Amoebozoa is a whole eukaryotic supergroup with no isoform example here, and Candida is the fungal
    pathogen a reader will expect to see named.
- note: 'Trimmed at the 35-claim cap but anchored and reusable: Arabidopsis isoform-specific peptide evidence
    (PMC13136898 L14: 32,110 isoform-specific peptides resolved into 2,442 AS events from over 900 LC-MS/MS
    datasets); yeast reanalysis recovering 170 non-annotated introns out of 447 predicted, 71 of them
    alternative splice sites at known introns (PMC4607428 L33); weak branch-point and 5'' splice-site
    consensus in yeast meiotic genes, making them spliceosome-competition substrates (PMC5570110 L12);
    FLM first-intron insertion polymorphisms as the causal natural variant for cool-temperature flowering
    (PMC4619661 L8); Chlamydomonas AS being lower than land plants but higher than unicellular heterotrophs
    (PMC2830987 L11); ciliate introns per gene, 1.6 to 2.3 in Paramecium and Oxytricha versus 4.8 in Tetrahymena
    (PMC5014332 L15); the coverage-independent finding that vertebrates exceed invertebrates in AS (PMC1802581
    L5); and alternative splicing peaking in genomes with roughly 50 per cent intergenic content, which
    plants exceed without gaining isoforms (PMC12534046 L59).

    '
  why: If the chapter needs more depth in any of these sections the lines are already located and verified.
