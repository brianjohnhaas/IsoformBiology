    which is squarely in this topic.

    '
  why: 'Priority 3 and priority 5 of this brief are the thinnest parts of the return, and some of that
    thinness is unsearched rather than absent.

    '
- note: 'Doc PMC8893660 reports that in rice, CRISPR frameshifting indels commonly induce novel frame-restoring
    splice variants, and that these sometimes rescue organism-level traits. Not recorded because it is
    a general phenomenon rather than a named case, and because the paper''s own conclusion is that such
    rescue is rare.

    '
  why: 'Relevant to any chapter passage about interpreting CRISPR knockouts in plants, and a caution about
    reading a weak mutant phenotype as weak gene function.

    '
- note: 'Irimia, Rukov, Penny and Roy 2007, BMC Evolutionary Biology 7:188, is in the corpus as PMC2082043
    and was opened for this pass. It does NOT supply the per-species Schizosaccharomyces pombe alternative
    splicing figure the book is missing. The species is in the study - it is one of twelve, and one of
    four fungi, listed in the methods at L74 and in the KOG set at L80 - but every per-species percentage
    lives inside Figure 1A, a scatter plot of percentage of alternatively spliced genes against mean introns
    per gene, whose numbers appear nowhere in the body text. The four readable supplementary files carry
    no per-species percentage either. The strongest anchorable statement in the text is qualitative: a
    positive relationship between mean intron number per gene and the occurrence of alternative splicing
    across the twelve species, and within each of the eight species that show significant alternative
    splicing, with a steady rise among genes having up to six to ten introns (L22). The figure caption
    at L23 lists the twelve species but does not say which eight are the high-AS set, so it cannot even
    be established from the text whether S. pombe is among them. Conclusion for the coordinator: stop
    looking here. PFO-234 (montanes2022fissionyeast) remains the only anchorable primary genome-wide figure
    for S. pombe in this corpus, and nothing in Irimia sits beside it as a number. Topic: cross-species
    comparisons - the qualitative intron-number-to-AS relationship at L22, and the "early eukaryotic origin
    of alternative splicing" argument, belong to the comparative section, not to this file.

    '
  why: 'The 0-to-5-per-cent fungal band the chapter inherited traces back to this paper, and a writer
    who cites it for a number will be citing a figure panel. If the band is to be stated at all it has
    to be attributed as a reading of a plot, or dropped in favour of PFO-234.

    '
- note: 'HOW TO READ THIS FILE. Only the records whose note carries a "tier:" line are cases in the chapter''s
    sense. They are PFO-200, 201, 203, 204, 205 (frq); PFO-206, 209, 210, 211, 212, 216, 246, 247 (named-locus
    cases); PFO-214, 215, 220, 222, 225, 226, 227 (yeast intron and isoform cases); and PFO-240 (correlation
    only). The rest are one of three other things, and a writer must not present them as cases. BOUNDS
    AND CONTRADICTIONS, each deliberately recorded as its own claim: PFO-202 bounds PFO-201; PFO-207 and
    PFO-208 bound PFO-206; PFO-217 is contradicted by PFO-214; PFO-218 bounds PFO-216; PFO-223 characterises
    PFO-222; PFO-224 bounds PFO-220 and PFO-221; PFO-232 bounds the existing PFO-018; PFO-236 and PFO-235
    disagree with each other; PFO-237 revises the existing PFO-022; PFO-248 bounds PFO-247. MECHANISM
    RECORDS at a named locus that do not have an isoform-restricted perturbation: PFO-213, PFO-219, PFO-221,
    PFO-228, PFO-229, PFO-230, PFO-231, PFO-233, PFO-238, PFO-239, PFO-245. MEASUREMENT-ARGUMENT RECORDS,
    which are prevalence or comparative figures and were recorded because this pass covered the intron-poor
    to intron-rich axis and the pathogen comparison: PFO-234, PFO-235, PFO-236, PFO-239, PFO-241, PFO-242,
    PFO-243, PFO-244. Of those, PFO-242 is the weakest - every functional consequence in it is a computational
    prediction - and it should be dropped rather than padded around if the section does not need it.

    '
  why: 'The brief asks for cases, not coverage, and 49 records in one file invite a writer to treat them
    all as equivalent. They are not.

    '
- note: 'Three named fungal alternative splicing cases are cited inside corpus papers but their primaries
    are NOT in the corpus, so the chapter cannot anchor them. (1) glaA of Aspergillus niger, reported
    as the first fungal alternative splicing event, giving two glucoamylase isoforms - cited at https://paperclip.gxl.ai/citations/papers/PMC5034255#L11;
    the primary is Boel et al., and a grep of the abstracts corpus for "glucoamylase" returns no matching
    record. (2) ZAS1+ of Schizosaccharomyces pombe, whose two transcripts encode two versus three zinc-finger
    domains - same line. (3) PTC7 of Saccharomyces cerevisiae, primary Juneau, Nislow and Davis, Genetics
    2009, doi 10.1534/genetics.109.105155 - absent, as recorded in the note on PFO-216.

    '
  why: 'glaA would give the chapter a first-in-the-field date for fungal alternative splicing, and the
    PTC7 primary is the only direct source for the dual-localisation experiment the book will want to
    describe.

    '
- note: 'The best-characterised functional alternative splicing case in fission yeast is rem1, a meiotic
    cyclin whose retained intron both prevents protein production before meiosis and encodes a 17-kDa
    product with a role in recombination during premeiotic S phase. Reported at https://paperclip.gxl.ai/citations/papers/PMC9248878#L10,
    citing Malapeira et al. 2005 and Moldón et al. 2008. Searching the corpus for those primaries ("rem1
    cyclin fission yeast intron retention meiotic recombination splicing regulated" and variants) returned
    Cremona 2011, McPheeters 2009, Chen 2012 and reviews, but neither rem1 primary.

    '
  why: 'This is the one fission yeast locus that would pass the inclusion test outright - named gene,
    splicing-specific regulation, two products with different jobs - and the chapter currently has no
    fission yeast case at all, only Mmi1 regulation.

    '
- note: 'The Aspergillus nidulans GATA factor areB makes three protein isoforms from one locus by a combination
    of alternative splicing, two promoters and three start codons, and the proportions of the three transcripts
    shift with carbon and nitrogen regime (RT-qPCR, four regimes): https://paperclip.gxl.ai/citations/papers/PMC6494665#L54
    and #L57. The paper deletes areB entirely and gets carbon-utilisation phenotypes, but it never tests
    an individual isoform; the isoform-specific functions are explicitly proposed, not measured. Related:
    the Fusarium fujikuroi areB isoforms are reported to differ in subcellular localisation and the longest
    to interact with AreA in the nucleus under nitrogen starvation, attributed to Michielse et al. 2014
    at the same line - that paper is not in the corpus and a search of the Fusarium fujikuroi nitrogen
    literature (Pfannmüller 2017, PMC5404775) found no isoform-level data in it.

    '
  why: 'If the Michielse paper can be obtained it would be the only Aspergillus or Fusarium case with
    isoform-specific localisation, and the chapter has no filamentous-ascomycete carbon-metabolism case.

    '
- note: 'Candida albicans alternative splicing changes between isogenic azole-sensitive and azole-resistant
    clinical isolates, presented as a drug-resistance mechanism: https://paperclip.gxl.ai/citations/papers/PMC7426172#L9
    (Muzafar et al., mSphere 2020, doi 10.1128/mSphere.00608-20 per corpus metadata; 4 to 6 per cent of
    C. albicans genes have introns). A grep of that paper for the standard azole-resistance loci (MDR1,
    CDR1, ERG11, RTA2) found them only in the reference list, so no named gene''s isoform is tied to the
    resistance phenotype.

    '
  why: 'A clinical isolate pair is an attractive setting, but as it stands this is a transcriptome-wide
    comparison and fails the inclusion test. Worth re-reading in full if the chapter wants a drug-resistance
    angle.

    '
- note: 'No functional alternative splicing case was found in Ustilago maydis or at any fungal mating-type
    locus. Searches run: "Ustilago maydis alternative splicing isoform specific function virulence maize
    smut" (8 results, all effector-biology papers with no splicing content) and "fungal mating type locus
    alternative splicing isoform homeodomain pheromone receptor transcript variant" (8 results: Hirsutella
    sinensis mating-type transcription, Cryptococcus heveanensis MAT structure, basidiomycete homothallism,
    Flammulina velutipes MAT organisation - none with an isoform-specific perturbation). jeon2022riceblast''s
    introduction at https://paperclip.gxl.ai/citations/papers/PMC8942408#L21 states only that two Ustilago
    species and Sporisorium reilianum "generate alternatively spliced transcripts presumably to adapt
    to their hosts".

    '
  why: 'Records the negative so the topic is not searched again. If the chapter wants a smut-fungus case
    it will need sources outside this corpus.

    '
- note: 'Two further Magnaporthe oryzae loci are named as alternatively spliced and virulence-relevant
    but were not opened: MoSOM1, for which multiple isoforms were detected in planta (https://paperclip.gxl.ai/citations/papers/PMC8942408#L99),
    and MoHMT1, RBP35 and MoGrp1, which encode spliceosome-interacting proteins whose deletion reduces
    virulence (#L22). The last three are trans-acting regulators and would not pass the inclusion test;
    MoSOM1 might.

    '
  why: 'MoSOM1 could be a third rice-blast case alongside MoPTEN (PFO-209) and MoYpd1 (PFO-210), which
    would let the chapter make the point with one pathogen and three loci rather than one locus.

    '
- note: 'Transcriptome-wide fungal measurements found but deliberately not recorded as claims, since the
    chapter already carries grutzmann2013fungal and jeon2022riceblast for this argument: Sieber 2018''s
    per-species intron counts and splice-site statistics, which single out the Candida species for few,
    long introns with more alternative splice sites (https://paperclip.gxl.ai/citations/papers/PMC6176087#L11);
    Lash 2024''s intron-retention tables for Candida albicans filaments (#L84, #L87); Muzafar 2020''s
    genome-wide event counts; Hooks et al. 2014 "Intron Evolution in Saccharomycetaceae" (PMC4202332)
    and Skelly et al. 2009 "Population Genomics of Intron Splicing in 38 Saccharomyces cerevisiae Genome
    Sequences" (PMC2839277), both unopened.

    '
  why: 'Listed with document ids and lines so none of these needs re-finding if a later pass decides the
    measurement argument should be expanded.

    '
- note: 'Two mitochondrial-splicing papers in budding yeast look relevant to the intron-function argument
    but concern group I and group II self-splicing introns, not spliceosomal ones: Rudan et al. 2018,
    "Normal mitochondrial function in Saccharomyces cerevisiae has become dependent on inefficient splicing"
    (PMC5898908), and Koster et al. 2023, long-read direct RNA sequencing of the yeast mitochondrial transcriptome
    showing condition-dependent intron turnover (bio_555592316c6c). Neither was opened.

    '
  why: 'The Rudan title is a strong claim that would sit well beside PFO-220 and PFO-222, but a chapter
    paragraph mixing spliceosomal and self-splicing introns would be wrong, so this needs a deliberate
    editorial decision rather than a research one.

    '
- note: 'Outside this topic but inside the chapter. The betz2024mycorrhizal preprint''s plant-side detail
    belongs to the plant sections: it states at https://paperclip.gxl.ai/citations/papers/bio_3530267271b7#L16
    that 60 to 70 per cent of intron-containing plant genes are estimated to undergo alternative splicing,
    and that potato has more than 44,000 predicted transcripts from about 33,000 genes with 7,000 genes
    carrying more than one, attributed to Phytozome v13. The same paper''s SR45 interactome includes the
    NineTeen Complex members MAC3a/Prp19 and MAC5a and the polyadenylation factors CPSF30 and CstF77 (#L30),
    and reports that Arabidopsis SR45 exists as two splice variants, both of which the effectors bind
    (#L32). Topic: plants - splicing regulators and plant immunity.

    '
  why: 'The potato transcript figures and the plant alternative splicing prevalence estimate duplicate
    ground the flowering section owns, and the two-splice-variants-of-SR45 point is a plant isoform fact,
    not a fungal one.

    '
- note: 'Outside this topic but inside the chapter. A review in the corpus, PMC13596872, summarises SP7-like
    effectors as part of a broader class of fungal proteins that modify host RNA regulation. It is a review,
    so it cannot be cited for a primary finding, but it is the only corpus document that frames effector-mediated
    splicing interference across pathogens and symbionts together.

    '
  why: 'Might be useful to whoever writes the cross-kingdom framing paragraph, as a pointer to primaries
    rather than as a citation.

    '
- note: 'Lichen rDNA introns slow growth and raise desiccation tolerance when moved into yeast, by reducing
    ribosome production: Armaleo and Chiou, PMC8527467, unopened beyond the search summary.

    '
  why: 'It would be a second independent demonstration that an intron''s effect runs through ribosome
    output, which is the mechanism PFO-221 and PFO-226 both land on, and it comes from a symbiotic organism
    rather than a model one.

    '
- note: 'Negatives recorded so the ground is not re-covered. (1) Cryptococcus neoformans MAR1 and PBX1:
    a search for "Cryptococcus neoformans MAR1 PBX1 intron splicing isoform virulence" returned only MAR1
    papers about intracellular trafficking, cell wall composition and granulomatous response (PMC6002136,
    bio_314bc4576f24) with no splicing or isoform content at all, and nothing on PBX1. (2) Candida albicans
    white-opaque switching: a search for "Candida albicans alternative splicing isoform white-opaque switching
    filamentation intron" returned the white-opaque literature (bio_0a402f0d6c0c, PMC3972085, PMC5126165)
    with no splicing content; the switch is transcriptional in every corpus document found. (3) The HSH155
    half of the "SRC1/HSH155" pairing in the brief: Hsh155 is the yeast SF3b1 orthologue, a core spliceosome
    subunit, and the two corpus papers on it (bio_e31a1a546ebc on cancer-associated HEAT-repeat mutations,
    bio_c3406b2e6c46 on Cus2) are splicing-fidelity studies with no isoform case, so HSH155 does not belong
    in a list of genes whose isoforms do different jobs.

    '
  why: 'Three of the brief''s named leads do not exist as cases in this corpus, and saying so precisely
    is worth more than a weak record for each.

    '
- note: 'Four budding yeast autoregulatory intron cases are named with primaries in the introduction of
    hooks2016intronicrna at https://paperclip.gxl.ai/citations/papers/PMC4937481#L9 and were not chased:
    RNA structures in the RPL30 pre-mRNA (Li et al. 1996) and the RPS14B pre-mRNA (Fewell and Woolford
    1999) that regulate splicing of their own host genes; intronic hairpins in RPL18A and RPS22B pre-mRNAs
    recognised by the RNase III Rnt1p, which promote mRNA degradation (Danin-Kreiselman et al. 2003);
    and RNA structures in the RPS9A and RPS9B introns described as components of an autoregulatory circuit
    (Plocik and Guthrie 2012). The same line also names an RNA-based splicing enhancer in the RPS17B intron.

    '
  why: 'This is the "intron-mediated regulation of ribosomal protein genes" item in this pass at single-gene
    resolution. RPS22B in particular would pair directly with PFO-226, which uses the same gene''s 5''-leader
    intron for a different purpose, and the Rnt1p result would be a mechanism for it.

    '
- note: 'Three records here rest on preprints and should be re-checked against their journal versions
    before the chapter is finalised: PFO-205 (Pelham et al., FRQ isoform-specific disordered region),
    PFO-210 (Bühring et al., MoYpd1 single-isoform mutants, reported published 2024 in Communications
    Biology) and PFO-214 (Capella et al., Heh1-S and ESCRT, reported published 2020 in Journal of Cell
    Science). For PFO-210 and PFO-214 the journal doi in source.doi came from the corpus search listing,
    not from meta.json, so the bibliography entries in particular need checking. The fourth preprint anchor,
    betz2024mycorrhizal, no longer needs re-checking: its journal version turned out to be in the corpus
    as PMC11333574, and PFO-246 and PFO-249 are both anchored on it.

    '
  why: 'Three of the strongest isoform-restricted-mutant results in this file are preprint-only in this
    corpus, which is a concentration of risk in exactly the records the chapter will want to lean on.

    '
- note: 'The original description of the two FREQUENCY protein forms is cited in the reference list of
    chen2023frqisoforms as Garceau, Liu, Loros and Dunlap, "Alternative initiation of translation and
    time-specific phosphorylation yield multiple forms of the essential clock protein FREQUENCY", Cell
    89, 469-476 (1997), with the companion Liu, Garceau, Loros and Dunlap paper on thermally regulated
    translational control at 477-486, both at https://paperclip.gxl.ai/citations/papers/PMC10140173#L105,L108.
    Neither was looked for in the corpus.

    '
  why: 'It would give the chapter the discovery paper for the fungal isoform pair it is about to use as
    its headline fungal case, and the 1997 pair are the papers the "temperature compensation" interpretation
    that PFO-202 contradicts originally came from.

    '
- note: 'Dictyostelium discoideum acaA is transcribed from three alternative promoters with distinct spatial
    and temporal activity (aggregation, the posterior region, and the tip-organiser), shown by promoter-lacZ
    reporters, in situ hybridisation and transcript-specific qRT-PCR. PMC2952602, title at L1, promoter
    assignments and the decisive sentence at L60.

    '
  why: 'Opened because the brief named it, and it FAILS the inclusion test, so I did not record it. L60
    states that the three mRNAs code for the same protein; there is no isoform-restricted allele, no isoform-specific
    knockout, and no phenotype attributed to any one transcript, because acaA null mutants arrest at aggregation
    and could not be used. It is an alternative-promoter expression study, not isoform biology. Worth
    one sentence only if the chapter wants an example of alternative five-prime ends that change where
    a gene is expressed without changing its product.

    '
- note: 'Oomycete effectors that reprogram the splicing of their plant host rather than their own: PsAvr3c
    of Phytophthora sojae binds soybean GmSKRP proteins and alters host pre-mRNA splicing including defence
    genes (PMC5727057, abstract at L1-L10); the effector family is dissected in PMC6069499; PsFYVE1 targets
    host RZ-1A and changes transcription and splicing of immunity genes (bio_1b127f1e6c3c, preprint, published
    2023 in Plant Physiology). Also potato resistance-gene alternative splicing balancing development
    and immunity (bio_24c54c1b717a).

    '
  why: 'Belongs to the plant-immunity topic, not protists -- the isoform choice happens in the plant.
    Flagged here with doc ids so it need not be searched again; I did not write it up.

    '
- note: 'Further Plasmodium falciparum isoform surveys I located but did not open in depth, all candidates
    for a long-read prevalence figure if PFO-253''s nanopore number is judged too thin: Shaw et al. 2022,
    long-read sequencing, 12,495 novel isoforms (PMC9635732); Yang et al. 2021, single-molecule full-length
    transcriptome with alternative splicing and polyadenylation (PMC7942025); Otto et al. 2010 blood-stage
    RNA-seq with an alternative splice site section (PMC2859250, L67-L75); Turnbull et al. 2017 exon-focused
    microarrays (PMC5675406); Gabriel et al. 2015, high levels of stage-specific alternative splicing
    at the single FPPS/GGPPS locus (PMC4685265), which is the one most likely to contain a named case.

    '
  why: 'PFO-253''s denominators are small because nanopore throughput was low, and a second independent
    prevalence figure would let the chapter bracket the Plasmodium number instead of asserting it. The
    FPPS/GGPPS paper is the only one of the five that is about a single named gene.

    '
- note: 'PfSR1, the Plasmodium falciparum SR protein that Toxoplasma SR2 was named after, is essential
    for proliferation in erythrocytes and its overexpression changes alternative splicing (Eshar et al.
    2012, PMC3479193); the same protein is required for recovery from DNA damage and artemisinin exposure
    (Goyal et al. 2021, PMC8435287, with the preprint at bio_85a843876cdd). Neither was opened past the
    abstract.

    '
  why: 'This pass looked for PfSR1. It is a regulator-knockout or overexpression phenotype in both papers,
    so neither would pass the inclusion test on what the abstracts state, and I spent the time on the
    intron-deletion work instead. Worth opening if the chapter wants the artemisinin link, which is the
    only drug-resistance connection to a splicing factor I saw anywhere in this topic.

    '
- note: 'Toxoplasma bradyzoite differentiation is controlled through translation, not isoform choice,
    as far as the corpus shows. BFD1 is a Myb-like transcription factor whose protein is absent from unstressed
    parasites although the transcript is present throughout the cycle (PMC6978799; bio_0228c30171d8 L19).
    BFD2 is a cytosolic CCCH zinc-finger protein that binds the BFD1 transcript in a stress-dependent
    way and licenses its translation, forming a positive feedback loop (bio_0228c30171d8, published 2023
    Nat Microbiol). Cap-independent translation via BFD2/ROCY1 (PMC11697163) and translation initiation
    factor eIF1.2 (bio_c07651257186) act on the same axis.

    '
  why: 'Recorded as a negative so it need not be searched again: I looked for isoform choice in BFD1 and
    BFD2 regulation and found none. If the chapter wants to say something about how this parasite switches
    state, the mechanism is translational control, which belongs to a different chapter.

    '
- note: 'Plasmodium sexual commitment and var-gene regulation: md1 acts as a bistable transcriptional
    switch for male fate (PMC9750867); gdv1 and ap2-g activation, including the gdv1 antisense element,
    are transcriptional and chromatin mechanisms (PMC6202401, PMC6514009, bio_3f8026fa7096, PMC10071754
    for sex-specific heterochromatin).

    '
  why: 'This pass made the ApiAP2 and gdv1 antisense story conditional on isoform choice being the mechanism.
    It is not: none of these papers reports a splice-isoform switch. Reported as empty.

    '
- note: 'Ciliates have no functional isoform case in the corpus that I could find. The closest is Tetrahymena
    TTHERM_00558310 (DYH2, a non-axonemal dynein heavy chain), which undergoes alternative five-prime
    splice-site selection and intron retention and whose gene is independently known to be needed for
    the cortical microtubule cytoskeleton and ciliary length: PMC3274533 L117. The same sentence states
    that the isoform-specific test is "readily testable" in Tetrahymena and has not been done.

    '
  why: 'This is the honest answer to the request for a functional isoform case in a ciliate: as of this
    corpus there is none, and the obvious candidate''s own authors flagged the experiment as outstanding
    in 2012. Worth a sentence in the chapter precisely because the absence is informative. Related: Tetrahymena
    NMD is EJC-independent and uses a protozoa-specific nuclease Smg6L (PMC5499736); Paramecium bursaria
    splicing regulation and short-intron evolution (PMC12862383, with preprint bio_9c27425072fc) and its
    genome (PMC12569599); MAGO and the exon-junction complex controlling tiny Paramecium intron splicing
    (abstract-only 41865671); GC content rather than nucleosome positioning driving Paramecium splicing
    efficiency (PMC8997360); intronisation signatures in Paramecium coding exons (PMC9612004).

    '
- note: 'Entamoeba beyond PFO-271: full-length intronic circular RNAs (flicRNAs) produced post-splicing
    and proposed to act in gene silencing (PMC6085484); the EhSyf1 homologue splicing both AG-dependent
    and AG-independent transcripts (PMC6046404); a genomic analysis of intron gain, unbiased intron loss,
    transformed splicing signals and a coevolved snRNA (bio_21118bfb6bf6, preprint, Roy and Bowser).

    '
  why: 'Entamoeba has an unusually well-worked splicing-factor literature for a parasite with few introns,
    and the AG-independent splicing in PMC6046404 is a genuine mechanistic oddity. None of the three contains
    a named isoform case, so none was recorded.

    '
- note: 'Trypanosomatid splicing regulators not written up: the hnRNP F/H homologue differentially expressed
    between life stages, regulating splicing and mRNA stability through a purine-rich motif (PMC3711420);
    a reporter system showing PTB proteins inhibit and SR-domain proteins promote alternative splice-site
    use, argued to be conserved from the last eukaryotic common ancestor (bio_d063dd66768c, published
    2022 PLoS NTD); DRBD18 maintaining correct trans-splicing and polyadenylation patterns; the T. brucei
    MitoCarta with its developmental splicing patterns (PMC2995047); genome-wide splice and polyadenylation
    site maps for two life stages (PMC2926603, Siegel et al. 2010, 267 citations) and a comprehensive
    trypanosomatid mRNA annotation preprint (bio_3a9b888176c7).

    '
  why: 'PMC2926603 is the obvious modern primary if the chapter wants a reviewed source with genome-wide
    site maps alongside the 1994 mutagenesis paper in PFO-261. The MitoCarta paper is the place to look
    for a second dual-targeting case of the PFO-262 kind, since it reports splicing patterns for 468 predicted
    mitochondrial proteins.

    '
- note: 'Giardia has trans-spliced introns: a transcriptomic survey of diplomonads found one new trans-spliced
    intron in a helicase gene in G. lamblia and none in Spironucleus salmonicida (PMC5224939, Roy 2017).
    A conserved non-coding RNA processing motif mediates three-prime end formation for both ncRNAs and
    trans-spliced introns (PMC3510501). Intron retention in Giardia has been argued to follow from sense-antisense
    gene overlap rather than intron function (PMC6545626), a cis-spliced intron was lost during the divergence
    of assemblages (PMC4085374), and the intron set has since been revisited (PMC10711314).

    '
  why: 'This pass looked about trans-spliced introns in Giardia. They exist and are counted in single
    digits. I recorded the cis-intron scarcity instead (PFO-272) because it is the better-anchored and
    more load-bearing fact, but a sentence on Giardia trans-splicing would be supportable from PMC5224939.

    '
- note: 'Toxoplasma stage-conversion transcriptome comparing tachyzoite and bradyzoite with an alternative-splicing
    component, over half of genes differentially expressed: PMC6042387 (Chen et al. 2018). Not opened.

    '
  why: 'The obvious place to look for the named bradyzoite transcript that PFO-250 says is missing from
    the SR2 story. If it contains a named stage-specific isoform, that would be the Toxoplasma case this
    return does not have.

    '
- note: 'Toxoplasma SR3 overexpression affects alternative splicing of over a thousand genes (yeoh2015toxoplasma,
    PMC4482073) and causes a growth defect; the chapter cites that paper only for the method-dependence
    argument in PFO-025.

    '
  why: 'If the chapter wants a Toxoplasma splicing-regulator phenotype that at least measured splicing,
    SR3 in the paper already cited is a better choice than SR2, whose paper measured none. It is still
    a regulator-level phenotype and would not pass the inclusion test.

