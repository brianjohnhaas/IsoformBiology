- note: 'PART 4, RESOLVED - parsons1984splicedleader is 1984, not 2004. The corpus record PMC7133311 has
    pub_year 2004 and pub_date 2004-04-29 in meta.json and a header line at L2 reading "Cell (2004)",
    but the same meta.json carries doi 10.1016/0092-8674(84)90552-X and pmid 6088073. The evidence from
    inside the document, which I grepped for every four-digit year: the reference list runs from L7 to
    the end and its latest-dated entry is 1984 (Buck et al., Nature 307, 1984, at L11; Milner et al.,
    PNAS 81, 1984, at L21; Nelson et al., Nature 308, 1984, at L24). Nothing in the document post-dates
    1984. A 2004 paper could not have a reference list that stops twenty years before publication, so
    1984 is the publication year and the 2004 stamp belongs to the back-catalogue deposit - which also
    explains why this record is a listing with the summary at L5 and no body text. The bibliography entry
    on PFO-027 already says 1984 and is correct; nothing needs changing, but the corpus record will keep
    contradicting it, so do not let a metadata-resolution script take pub_year from this doc_id.

    '
  why: 'A metadata resolver run against this doc_id would silently date a foundational trans-splicing
    citation twenty years late.

    '
- note: 'The primary for the 0 to 5 per cent fungal and microsporidian band is Irimia, Rukov, Penny and
    Roy 2007, "Functional and evolutionary analysis of alternatively spliced genes is consistent with
    an early eukaryotic origin of alternative splicing", BMC Evolutionary Biology 7:188, doi 10.1186/1471-2148-7-188,
    corpus doc_id PMC2082043, cited at PMC3925392 L138. That is where a Schizosaccharomyces pombe prevalence
    figure should come from. I did not open it. The search for a primary S. pombe figure was run separately;
    PFO-307 records only the citing statement. Note that the fungal survey''s own uniform estimate for
    S. pombe, 0.6 per cent, is at PMC3925392 L37 inside Table 1, alongside 0.18 per cent for S. cerevisiae,
    and the table footnote confirming the column is at L54.

    '
  why: 'Fission yeast is the hole in the chapter''s cleanest comparative ladder and the primary is now
    named with a doc_id.

    '
- note: 'Not opened, and the best remaining candidate for a uniform cross-kingdom reanalysis: McGuire,
    Pearson, Neafsey and Galagan 2008, "Cross-kingdom patterns of alternative splicing and splice recognition",
    Genome Biology, corpus doc_id PMC2397502. It surveys 42 eukaryotes by one method; L8 gives the intron-density
    framing (5 per cent of S. cerevisiae genes spliced, just over one intron per gene in S. pombe to about
    five in Cryptococcus neoformans, over seven per gene in vertebrates, about four in rice and Arabidopsis),
    and L157 and L209 define its cassette-exon fraction and relate it to the proportion of introns longer
    than 200 base pairs across animals, fungi, plants and protists with an R-squared of 0.73. That long-intron-to-exon-skipping
    relationship would give the chapter a mechanistic reason for the intron-retention-versus-exon-skipping
    contrast rather than a bare observation. I read only those three lines and wrote no claim from them.

    '
  why: 'It would convert the chapter''s event-type contrast from a list of percentages into an explanation,
    and it is a single uniform method across all four groups the chapter covers.

    '
- note: 'NOT IN THE CORPUS, and it is the only candidate primary behind the widely repeated "70 per cent
    of plant multi-exon genes" figure (PFO-302): Zhang, Jia and Zhai 2023, "Plant intron-splicing efficiency
    database (PISE): exploring splicing of approximately 1,650,000 introns in Arabidopsis, maize, rice,
    and soybean from approximately 57,000 public RNA-seq libraries", Science China Life Sciences 66:602-611,
    doi 10.1007/s11427-022-2193-3, pmid 36409390, cited at PMC13136898 L124. An exact-title lookup returns
    "No documents found" and a keyword search for the database returns unrelated soybean and mitochondrial
    splicing papers, so it cannot be read here. Someone with outside access should check whether it states
    a gene-level prevalence at all or only intron-level splicing efficiencies; the title suggests the
    latter, in which case the 70 per cent figure has no primary and the chapter should say so rather than
    repeat it. Do not let anyone fill this in from memory.

    '
  why: 'The chapter''s most quotable plant-animal contrast may rest on a figure that no paper measured,
    which is worth a sentence either way.

    '
- note: 'The pre-correction coefficients for the splicing-versus-complexity relationship in Chen et al.
    2014 are at PMC4032128 L23 (r-squared 0.76 for proportion of genes spliced and 0.83 for events per
    gene against cell type number, and 0.71 and 0.81 when restricted to the metazoan-fungi lineage). PFO-323
    records the post-correction figures from L49 but its anchor does not include L23, so a paragraph stating
    the before-and-after pair must cite L23 as well. I read L23 and L49; no separate claim was written
    for L23 because on its own it is the number the chapter should not quote without the correction.

    '
  why: 'A writing pass reaching for "0.76" will find it in a note rather than a claim, and needs to know
    which line carries it.

    '
- note: 'Outside this section''s scope, found while reading and belonging elsewhere in the chapter. (1)
    PLANTS: PMC13136898 reports a phenotype for a plant splicing mutant - the acinus pinin double mutant
    shows reduced chlorophyll, impaired growth and increased anthocyanin, with intron retention regulating
    transcript and protein abundance nonlinearly (L14), and 91 unannotated retained introns that are translated.
    That is close to the inclusion test but the perturbation is a splicing-factor mutant rather than isoform-restricted,
    so it needs the plant sections''s judgement, not mine. (2) PROTISTS: the only Plasmodium falciparum
    prevalence figure anchored anywhere in these records is now 3 per cent of genes at 0.09 events per
    gene, from PMC4032128 L54 (PFO-317). It is NOT genome-wide: it is an EST-based index computed only
    over genes with more than ten ESTs, at a ten-transcript sampling ceiling, and it is not an RNA-seq
    measurement. The protist section should decide whether that is the number the chapter wants beside
    sorber2011plasmodium, and if it is used, the denominator has to travel with it.

    '
  why: 'Both sit in other sections'' topics and would otherwise be found twice or not at all.

