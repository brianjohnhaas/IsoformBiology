    RESOLVED 2026-11-22: Candida now has PFO-245, PFO-247 and PFO-248, and the comparative pathogen study
    PMC6176087 was opened as PFO-243 and PFO-244. Amoebozoa has PFO-270 and PFO-271. The acaA promoter
