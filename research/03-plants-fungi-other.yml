    dispute, and jeon2023coolaircbf calls its own negative result surprising on exactly these grounds.
  why: The conservation argument is the strongest prior against the negative results recorded in PFO-123,
    PFO-124 and PFO-143.
- note: 'The strongest contradiction to the "both isoforms are required" reading of the tobacco N gene
    is a 2013 paper that is NOT in this corpus: Sasaki, "The splice variant Ntr encoded by the tobacco
    resistance gene N has a role for negative regulation of antiviral defense responses", Physiological
    and Molecular Plant Pathology 84:92-98, doi 10.1016/j.pmpp.2013.08.002. The reference line was read
