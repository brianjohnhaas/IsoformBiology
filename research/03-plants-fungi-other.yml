- note: 'Plant abiotic-stress isoform biology in this corpus is thinner than the chapter''s framing assumes.
    Searches for an isoform-specific transgenic or splice-site perturbation with a measured cold, drought
    or salt phenotype in a named plant gene returned transcriptome-wide surveys: doc PMC8048671 (genome-wide
    natural variation in rice pre-mRNA splicing and salt stress), PMC9633917 (variety-specific splicing
    and salt tolerance), PMC6971990 (tea cold acclimation), PMC4814823 and PMC6399358 (rice stress transcriptomes).
    None names a gene whose isoform ratio was perturbed on its own. Doc PMC8068108, Ganie and Reddy 2021,
    is a review that indexes rice stress isoform functions and would be the fastest route to candidate
    primaries.

    '
  why: 'The chapter should say plainly that the abiotic-stress literature in plants is mostly prevalence
    rather than function, which is itself a finding, instead of implying that cases like the resistance
    genes exist for cold and salt.

    '
- note: 'Not pursued and outside this topic: doc PMC12525425 reports genome-wide isoform switching between
    mature and senescent Arabidopsis leaves with 269 genes switching, and attributes normal senescence
    timing to the SR45.1 isoform. Developmental timing is covered in the flowering section.

    '
  why: 'It is an isoform-specific claim about SR45 and so overlaps PFO-176; whoever writes the SR45 paragraph
    should know both exist.

    '
- note: 'Required by SCHEMA.md for the three records read as preprints: PFO-179, PFO-180 and PFO-181 were
    read from doc bio_c16561b06c07, the 2019 bioRxiv posting, while the recorded DOI 10.1038/s41477-020-0724-1
    is the 2020 published version that the corpus listing names. Every figure number, line number and
    quoted sentence in those three records comes from the preprint and should be re-checked against the
    published paper before the chapter cites a figure or a number from them.

    '
  why: 'The gates cannot see this difference: the quote is verified against the preprint and the bibliography
    is built from the journal DOI.

