    perturbation of any other FLC-clade gene: rosloski2012maf2variants reports MAF3 and MAF4 only as co-suppression
    casualties (PFO-144), the Ll-2 accession fails to express MAF3 and MAF4 at all (paperclip PMC3527738
    L43), and the only other MAF-specific paper found acts through histone modification rather than splicing
    (paperclip PMC10093928). No MAF gene other than MAF2 has an isoform-specific perturbation in this
    corpus.'
  why: 'Settles the chapter''s question of whether any other MAF gene does what MAF2 does: on this corpus,
    no.'
- note: Searched specifically for an isoform-specific perturbation of a PRR or RVE family clock gene and
    found none beyond the records here. The corpus offers filichkin2012clock, clock2012astemperature (PRR7,
    abstract-only, PFO-131), calixto2016barley, Kwon and colleagues (paperclip PMC4035800) and a circadian
    splicing-atlas preprint (paperclip bio_bc939a8c6d0b), all surveys; the XAP5 CIRCADIAN TIMEKEEPER papers
    (paperclip PMC13227948, bio_bf36f0166c2c) are splicing-factor work and belongs to another section
    of this chapter. PRR5 and ELF4 appear only as downstream isoforms in PFO-134.
  why: States the negative result so the search need not be repeated; the PRR family has no isoform allele
    in this corpus.
- note: 'Ran a barley-specific query for a clock splice variant with a transgenic or isoform-specific
    test and found none: no named barley clock gene in this corpus has an isoform-specific allele with
    a measured period, phase or amplitude. Within calixto2016barley itself the only allele used is the
    eam8.w near-isogenic line homozygous for a premature-stop HvELF3 allele, and it serves as a positive
    control for the cycloheximide decay assay rather than as a test of an isoform (paperclip PMC5154542
    L82). The nearest monocot alternatives are the rice OsCCA1 splicing lead above and the maize ZmCCA1
    variants (paperclip PMC6353190), the latter tested by overexpression in Arabidopsis for drought tolerance
    rather than for clock parameters in maize.'
  why: Closes the barley question, names what is inside the barley paper, and names the two monocot alternatives,
    none of which passes.
- note: Alternative splicing of FT is associated with halving of time to flowering in dwarf coconut varieties
    (paperclip PMC7363896) and four CmFTL1 splice variants from Chrysanthemum morifolium were functionally
    compared (paperclip PMC5120556). The coconut case is a varietal correlation with no isoform-specific
    perturbation and fails the inclusion test; the chrysanthemum case was not read far enough to judge
    whether its variant comparison is an isoform-specific transgenic test.
  why: Either would extend the Brachypodium FT2 records (PFO-135 to PFO-137) to a second and third species
    if the perturbation holds up.
- note: Calixto and colleagues report that roughly 900 isoform switches are engaged on cooling in Arabidopsis,
    about 500 of them within six hours, cited at paperclip bio_04dd8f5c6cd0 L28 and published separately.
    A transcriptome-wide count, so not a claim; it is the denominator from which the RVE2 case (PFO-132
    to PFO-134) was picked.
  why: Gives the selection logic behind the one clock isoform switch that was followed up.
- note: Lutz and colleagues followed their 2015 paper with a haplotype analysis of FLM non-coding sequence
    (paperclip PMC5388537), reporting that FLM-beta abundance correlates directly with flowering time
    in spring temperatures. Same group as lutz2015flmnatural, so it replicates rather than independently
    confirms PFO-110 to PFO-112 and PFO-140; not recorded, to avoid presenting one group's two papers
    as agreement between laboratories.
  why: A writing pass may want to cite it, but only with the shared-authorship caveat stated.
- note: Single-molecule structure probing of COOLAIR in vivo (paperclip PMC9452300) reports that the isoforms
