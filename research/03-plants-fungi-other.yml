    are intron retention over expressed genes in one nanopore run, not an alternative-splicing rate.

    '
  why: The intron-poor-to-intron-rich fungal axis is the chapter's cleanest comparative figure and currently
    has a gap where fission yeast should sit.
- note: 'Candida and Amoebozoa have no claim in this file. For Candida, a comparative AS study of human
    fungal pathogens surfaced in search as PMC6176087 (Sieber et al. 2018) and was not opened. For Amoebozoa,
