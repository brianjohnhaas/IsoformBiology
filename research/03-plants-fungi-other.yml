- note: 'Doc bio_467cf4f17420, "At-RS31 orchestrates hierarchical cross-regulation of splicing factors
    and integrates alternative splicing with TOR-ABA pathways", is a transcriptome-wide and iCLIP study:
    4,034 binding sites across 1,421 genes (L20), with no named target whose isoform ratio change was
    tied to a measured phenotype. Rejected under the inclusion test. It also overlaps the chapter''s existing
    record on light-to-root signalling through TOR.

    '
  why: 'Recorded so the next pass does not re-read it hoping for a case, and because it would deepen the
    existing TOR record if the chapter wants the binding-site numbers.

    '
- note: 'Searched and rejected as crop cases because the causal variant is not a splicing change. What
    I read, per locus. Rice Ghd7: doc PMC12027456, lines L6, L13 and L19 read, which describe structural
    variations and large fragment deletions at the locus and nothing about splicing. Maize ZmCCT: doc
    PMC5777075 L6 read, which attributes the effect to a distant Harbinger-like transposon acting as a
    cis-regulatory element to repress expression. Rice IPA1/OsSPL14: doc PMC5364388 L1 read, whose title
    attributes the superior allele to a natural tandem array relieving epigenetic repression; for doc
    PMC4811884 I read L75, which is general background on miR156, and the heading naming a mutation of
    the miR156 site in IPA1 came from a search result rather than from the line, so that one is less than
    fully checked. Wheat Ppd-D1 and VRN1: doc PMC4092236 L52 and L53 read, which treat these loci as allele
    types whose combinations shift heading date and say nothing about a causal mechanism. I did not find
    and did not read a paper in this corpus reporting the Ppd-D1 or VRN1 causal variant, so the correct
    statement is that no splice-site causal variant turned up for them, not that one has been ruled out.

    '
  why: 'This pass looked whether these loci pass the splicing test. On the evidence read, four do not
    and two were not run to ground, and distinguishing those two states saves the next pass from repeating
    the wrong search.

    '
- note: 'Candidate crop case not read: doc PMC12910859, "Q allele overexpression and alternative splicing
    can improve wheat yield by increasing thousand-kernel weight and grain number per spike", with a results
    heading at L120 reading "G542A leads to alternative splicing of Qc1-Q1". If that G-to-A change is
    a splicing-regulatory variant with a measured yield effect it would pass the inclusion test and sit
    beside PFO-174.

    '
  why: 'It was found late and left unread rather than recorded badly; the heading and document id are
    enough to resume without a search.

