    structural perturbation the COOLAIR records here lack.
  why: Would give the COOLAIR records a structural mechanism rather than only a processing-choice mechanism.
- note: Castaings and colleagues report COOLAIR-like cold-induced antisense RNAs in perennial Arabidopsis
    relatives (paperclip PMC4109010) and Jiao and colleagues find cold-induced FLC antisense in distant
    grasses (paperclip PMC6367677). Conservation evidence rather than isoform-specific perturbation; cross-species
