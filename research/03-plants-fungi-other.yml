- note: 'Not searched at all, so the chapter should not read my report as evidence these are empty: rice
    Hd1; soybean loci of any kind; SKIP and the SNW/SKIP family; polypyrimidine-tract binding protein
    homologues in plants; U1 snRNP components other than the incidental U1-70K splicing control in PFO-169;
    auxin signalling; and brassinosteroid signalling. One brassinosteroid lead did surface without being
