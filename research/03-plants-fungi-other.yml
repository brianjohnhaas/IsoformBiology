- note: 'Barley Mla6 and Mla13 alternatively splice their 5'' UTRs, which contain three upstream open
    reading frames, and mutating the uORFs changes Mla13 synthesis; whether resistance requires the UTR
    splicing is unknown. Read at PMC4100160 L40. Rice Pi-ta has twelve identified transcript isoforms
    predicted to encode eleven proteins, with no known function for any of them; PMC4100160 L39.

    '
  why: 'Both are candidate cases for a later pass if primaries can be retrieved, and both are currently
    reasons not to claim that alternative splicing of resistance genes is generally functional.

    '
- note: 'The RBM25 primary IS in the corpus as abstract-only doc 62989897 and is now recorded as PFO-192.
