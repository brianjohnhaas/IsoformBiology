- id: PRO-193
  claim: Part of the published evidence for unannotated frames rests on a broken statistical control. In yeast,
    reversed-sequence decoys tend to end in methionine while predicted peptides from short unannotated frames
    tend to begin with the initiator methionine, so targets outnumbered decoys at every match rank for unannotated
    frames while behaving normally for canonical ones; with decoys reversed only after the leading methionine
    no list of unannotated proteins could be assembled at a 10 per cent false-discovery threshold at all, and
    after weighing evolutionary and translation evidence the study reported strong support for four unannotated
    yeast proteins.
  topic: frames the annotation missed - the decoy control was biased, and what survived correcting it
