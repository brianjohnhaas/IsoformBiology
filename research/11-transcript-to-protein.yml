    at L7. Not independent of PRO-186 to PRO-192: both of this paper''s authors appear in the author list read
    at bio_dd6f4fc16e2a L2.'
- id: PRO-194
  claim: Many short proteins cannot be reached by bottom-up proteomics at all. Of 18,947 proteins predicted
    from unannotated yeast frames, 2,496, or 13 per cent, yield no tryptic peptide of detectable size, against
    11 canonical yeast proteins, or 0.2 per cent; the average unannotated protein offers 6.7 such peptides
    and the average canonical one 62; and simulation at the observed 6 per cent per-peptide detection rate
    predicts that only 22 per cent of the unannotated proteins would be seen even so.
