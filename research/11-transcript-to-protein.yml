    corrected decoy control, in one species, so the ratio rather than either number carries the argument.
  note: 'tier: diagnosis of a statistical artefact followed by reanalysis under a corrected control. Species
    is Saccharomyces cerevisiae and the objects are unannotated frames, so neither part transfers directly
    to human annotated isoforms; it bounds how much weight a peptide count for a novel frame can carry. The
