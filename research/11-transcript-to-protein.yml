leads:
- note: 'The mapping from each microexon combination to each protein C-terminus could not be stated from any
    single line in the corpus. Park and Nam name junctions (ex4:ex6, ex4:22bp, ex4:3bp, ex4:18bp), Magadi names
    transcripts and proteins (Rps24a/b/c, S24-3K/2K/PKE), and Kerry names only long and short (RPS24L, RPS24S).
    Magadi''s Supplementary Discussion sets out to reconcile them and within one paragraph equates the 22 bp
    exon with two different exons of the original scheme. The book therefore reports each study in its own
    labels and does not assert a combined mapping.

    '
  why: A reader trying to connect the papers will hit this, and the book should say so rather than paper over
    it.
- note: 'Kerry et al. was read as the bioRxiv preprint although a journal version exists in FEBS Letters. Magadi
    et al. is preprint-only in this corpus. Every number from either needs re-checking against the published
    version.

    '
  why: Same treatment as the ENCODE4 and GTEx long-read sources.
- note: 'Magadi reports S24-PKE staining in human post-mortem tissue as two of three Alzheimer''s sections
    in the text and as n = 2 for Alzheimer''s in the figure legend. The book states the result without a denominator.

    '
  why: Both numbers would pass the citation gate; neither can be preferred from what was read.
- note: 'Kerry speculates that the RPS24 forms could constitute specialised ribosomes directing translation
    of particular transcripts. Not demonstrated, and flagged as speculation by those authors.

    '
  why: Attractive and quotable, which is exactly why it should not be upgraded.
- note: 'A further RPS24 paper reports the microexon isoform as a biomarker in oestrogen-receptor-positive
    breast cancer and therapeutic resistance (PMC12686416), and a hypoxia study reports altered splicing of
    ribosomal protein mRNAs generally (PMC7025504). Neither was read.

    '
  why: Would extend the RPS24 case into endocrine therapy if the chapter needs more.
- note: 'BRCA1 is described in the alternative-TSS literature as having two isoforms with different leaders,
    the longer and translationally inactive one appearing in tumour tissue. This is a secondary attribution
    inside PMC4965872, not a result of that paper.

    '
  why: Would be a strong named example for the 5' UTR section if the primary source can be found.
- note: 'Floor and Doudna are reported, again secondhand within PMC4965872, to have concluded that 3'' UTR
    properties outweigh 5'' UTR properties in isoform-specific translation. That directly bears on how this
    chapter balances its two UTR sections.

    '
  why: If true and citable, it reorders the chapter's emphasis.
- note: 'The experimental isoform interactome itself, the 2016 work recorded as PRO-101 to PRO-103, is abstract-only
    in this corpus. PMC4882190 is absent, and a body grep for the paper''s own coined term "functional alloforms"
    returns only citing papers. So the exact pair counts the chapter''s headline needs, how many isoform pairs
    were tested, how many shared most partners and how many shared almost none, are not retrievable here. PRO-104
    gives the dataset''s interaction and non-interaction counts as described by the group that reanalysed it,
    which is the best available substitute. A human with journal access should read the published figures and
    supplementary tables before the chapter quotes a pair count.

    '
  why: This is the chapter's intended headline and the brief asked for exact denominators.
- note: 'Isoform-specific protein degradation was searched for and not found as a class-level result. Greps
    for "isoform-specific degron", "splicing-dependent degron", "exon encodes a degron" and "isoform-resolved
    protein turnover" returned nothing usable; a boolean grep for "splice isoform" AND "degron" returned 75
    documents too diffuse to triage, and the one paperclip hit for proteoform half-lives (PMC8626426) measures
    modification-level proteoforms of PPIA, not splice isoforms, and belongs to chapter 12 in any case. The
    chapter''s only isoform-specific protein stability result therefore remains the RPS24 hypoxia work it already
    carries. A targeted search of the global protein stability and N-degron screening literature for splice-isoform
    pairs would be worth one agent''s time.

    '
  why: Item 5 of the assignment is otherwise answered only for localisation and modification sites.
- note: 'Two case studies in ghadie2017isoforminteractome at L34 and L36 work through protein pairs that bind
    different subsets of one gene''s isoforms, for EGFR, where EGF binds all four isoforms on the ligand-binding
    domain and GRB2 only the one retaining the kinase domain, and for CASP9, where APAF1 and XIAP bind different
    isoform subsets through the CARD and catalytic domains and the catalytic-domain-less isoform acts as an
    endogenous inhibitor of apoptosis. Both are predictions the authors then check against published experiments
    rather than new measurements. Not recorded because EGFR and CASP9 both already appear in the book''s research
    files (zheng2023egfrviii, kim2022caspase9b), so the cases belong to those chapters; the CASP9 one is a
    textbook dominant-negative architecture if chapter 6 or 7 wants it.

    '
  why: Avoids a cross-chapter collision while preserving the line numbers so nobody re-reads for it.
- note: 'lambourne2025tfisoforms carries two further results that belong elsewhere. At L77 it reports that
    191 isoforms in the collection differ significantly in abundance between paired breast tumour and normal
    samples in TCGA, with negative regulators over-represented among them, 34 of 114 against 10 of 114 rewirers,
    and works CREB1 through as an example at L78. At L76 it intersects its classification with another group''s
    over-expression screen of more than 3,000 transcription factor isoforms in human embryonic stem cells.
    The cancer expression analysis is chapter 6''s and the differentiation screen is another group''s work.

    '
  why: Both are strong material in the wrong chapter; the line numbers save a re-read.
- note: 'steuer2026splisoforms annotates two further layers over every modelled isoform that chapter 12 owns
    rather than chapter 11: predicted neoantigen potential, with 7,983,830 peptide-HLA predictions over 1,944,194
    distinct candidate peptides across 66,895 isoforms and 92,790 peptides in 40,617 isoforms at the top priority
    tier (L25, L26), and drug-pocket integrity plus dimerisation-interface disruption read from an existing
    structure database (L28).

    '
  why: Isoform-selective drugs and isoform-derived epitopes are chapter 12's by the one-home rule.
- note: 'sommer2022structureguided contains three worked single-gene cases where a non-reference isoform folds
    far better than the annotated primary one, with score gaps of 24 points for CRYGN (L40), 40 points for
    TXNDC8 (L50) and 43 points for IL36B (L55), the last of which also has the better cross-species conservation
    and far higher expression. These bear on whether the annotation picked the right primary isoform, which
    is chapter 9''s question rather than this chapter''s, and none of the three has an isoform-specific experiment.

    '
  why: Chapter 9 owns annotation composition; recorded here only so the cases are not lost.
- note: Still missing, after PRO-159. No study was found that partitions isoform differences three ways at
    once, into those touching a globular domain, those touching a disordered region, and those touching neither,
    over a current annotation release. PMC3045584 comes closest and is now recorded, but it partitions by domain
    and by disorder in separate analyses over a 2008 Swissprot release, and PRO-123 and PRO-124 partition by
    annotated element type over transcription factor genes only. This was searched by exact-phrase greps for
    the partition language and by boolean greps combining disorder with splicing, not by a systematic survey,
    so the negative is scoped to keyword search.
  why: Scopes the gap honestly and tells the next agent how little searching the negative rests on.
- note: 'Searched and not found: a study that looked for functional divergence between two splice isoforms
    of one gene and concluded they were interchangeable. Greps for "isoforms are functionally interchangeable"
    return six papers, all about paralogous gene products (histone variants, Toc34, GSK3, transducin subunits,
    Rab1) rather than splice isoforms of one gene. The negative evidence this chapter can actually cite is
    therefore of a different shape: the 9 per cent of isoforms indistinguishable from their reference in PRO-113,
    the absence of evidence rather than evidence of absence in PRO-152, and the sceptical annotation-wide readings
    in PRO-153 and PRO-158. Those authors'' own warning that a negative result is not evidence of interchangeability
    (PMC6114036 L20) is the reason the stronger claim may not exist.

    '
  why: Item 6 of the assignment; the shape of the available negative evidence matters to the writer.
- note: 'The three sources behind the interactome argument are not three independent groups. ghadie2017isoforminteractome
    and lambourne2025tfisoforms share two authors, Luke Lambourne and Marc Vidal, verifiable from the two meta.json
    author lists. Whether the 2016 experimental isoform interactome shares authors with either could not be
    checked, because its corpus record carries no author list at all; the 2017 paper treats it throughout as
    another group''s dataset. Any chapter sentence calling these independent lines of evidence needs that checked
    against the published author lists.

    '
  why: The project's reviewers find more defects in sentences about independence than in sentences about biology.
- note: 'bhuiyan2018fdsi at L104 and L147 compares its curated gene set against a machine-learning classifier
    that predicted 2,419 of 15,639 genes to have more than one functional isoform: only ten of the curated
    genes with functionally distinct isoforms appear among those predictions, none appear in the classifier''s
    212-gene validation set, and the classifier missed twelve. The authors caution that the numbers are too
    small to interpret. Left as a lead because the comparison is about a predictor''s performance rather than
    about what two proteins do differently, and because the authors themselves scope it so tightly.

    '
  why: Would be a strong record if the chapter ever argues about predicting isoform function from sequence.
- note: Correction to an earlier negative in this pass. The Nucleic Acids Research paper on verifying isoform
    variants by domain integrity, truncation length and intrinsic disorder IS held in full text, as PMC3045584,
    and is now recorded as PRO-136 and PRO-159. It was missed by a bounded grep --source abstracts on its title
    phrase and by a plain full-text grep on the phrase 'domain integrity, truncation length', both of which
    returned only reference-list hits in citing papers; paperclip lookup doi 10.1093/nar/gkq843 found it at
    once. Anyone repeating this search should try lookup doi before concluding a classic is absent.
  why: A failed grep is not absence, and this turned out to be the best source in the corpus for the domain
    question.
- note: 'Overflow from PMC3045584, which the id range could not hold. Four further findings, each read and
    line-anchored, are reusable without re-reading. (1) L5: of about 4,000 human proteins in the Protein Data
    Bank, only 14 have solved structures for at least two alternative isoforms, and the largest insertion accommodated
    inside a fully ordered domain was 5 amino acids, the other domain changes involving intrinsic disorder.
    That is a harder number than the ''exceedingly rare'' of PRO-130. (2) L81: among variants where a domain
    lost at least 10 per cent of its length, 310 of 380 structural matches, 81.6 per cent, had the truncation
    site close to a local minimum of newly exposed hydrophobic surface, over 331 isoforms of 187 proteins matched
    to 154 Protein Data Bank chains. (3) L107 with L83: among the 505 isoforms with protein-level evidence
    only 12 had a domain truncated against a solved structural domain, and 11 of the 12 were predicted to survive
    it. (4) L73: the largest structural difference seen between two isoforms of one protein was a 44-amino-acid
    substitution in ketohexokinase, where mutually exclusive exons of 135 base pairs each descend from a local
    exon duplication, the two structures are similar at 35 per cent sequence identity, and no physiological
    function had been found for the minor isoform. KHK appears in no existing research file.'
  why: Item 2 and item 4 material that was verified and then could not be recorded; the ketohexokinase case
    is also an unused named case.
- note: 'What a partial domain does, from lambourne2025tfisoforms L47, verified and not recorded because the
    id range ran out. Alternative transcription factor isoforms completely missing the DNA-binding domain completely
    lose DNA binding in the yeast one-hybrid assay, and in almost every case isoforms carrying only part of
    the domain also lose DNA binding. The single exception is ZIC3, whose two alternative isoforms lose three
    amino acids from a zinc finger at the end of a five-finger array and bind a different subset of DNA baits
    rather than none; one of them is conserved in mouse and co-expressed with the reference isoform in development,
    which those authors attribute to earlier work. L45 of the same paper gives the per-assay denominators the
    chapter may want: DNA binding assayed for 171 isoforms of 80 genes, protein binding for 253 of 87, regulatory
    activity for 580 of 224. ZIC3 appears in no existing research file.'
  why: This is the explicit 'what a partial domain does' ask in the assignment, verified but unrecorded.
- note: ZNF268 as a predicted dominant negative, from steuer2026splisoforms L42, dropped from the records to
    make room for PMC3045584. The 193-residue isoform ZNF268-209 reproduces the canonical sequence through
    the KRAB effector domain, modelled at a per-residue confidence of about 83, but stops before the 24-finger
    array that binds DNA, giving an effector-only protein those authors call a candidate dominant-negative
    regulator and say is consistent with a transcription-repressing KRAB-only ZNF268 isoform reported previously
    by another group. Dropped because it is a prediction with no measurement, and because PRO-127, PRO-149
    and PRO-157 already carry the class with measurements.
  why: Named, uncollided and reusable if the chapter wants a predicted-architecture example.
- note: PMC3996537, a 2014 Nature Communications isoform-resolved protein interaction network built around
    autism risk genes, was opened and not recorded. Its author list includes Vidal, Hill and Hao, so it is
    not independent of ghadie2017isoforminteractome or lambourne2025tfisoforms, and an interaction network
    built around a disease gene set belongs to chapter 7 under the one-home rule. Noted so that a later pass
    does not mistake it for an independent third isoform interactome.
  why: Prevents a false independence claim and points the paper at the chapter that owns it.
- note: SCHEMA requires this for sources read as preprints. Every number in the lambourne2025tfisoforms records,
    PRO-105 to PRO-115, PRO-123 to PRO-127, PRO-129, PRO-130, PRO-142 to PRO-146, PRO-148 and PRO-149, was
    read from the bioRxiv version PMC11014633, doi 10.1101/2024.03.12.584681. The journal version, Molecular
    Cell 85, 1445-1466.e13, 2025, doi 10.1016/j.molcel.2025.03.004, is not in this corpus; its journal, volume,
    pages and DOI were read from the reference lists of PMC13658809, PMC13534637 and PMC13545013, not supplied
    from memory. Every figure should be checked against the published version and resolve_metadata.py should
    confirm the bibliographic fields. The same applies to steuer2026splisoforms, PRO-128, PRO-131 to PRO-135
    and PRO-147, which is preprint-only in this corpus with no journal version found, and to PMC3045584, whose
    meta.json gives 2010 while citing reference lists give 2011 with volume 39 and pages 1208-1219.
  why: The chapter already carries two preprint-read RPS24 sources; this pass adds more and they must be listed.
- note: 'HOW FAR THE TWO ROUTES AGREE AT ISOFORM LEVEL IS MEASURED ONCE, AT A CORRELATION OF 0.4, AND NOT BY
    KEYWORD SEARCH ANYWHERE ELSE. PRO-171 is the only measurement found in which both sides come from the same
    cell lines: the share of a gene''s translation against the share of its protein abundance, over the few
    dozen genes where more than one protein isoform was detected at all. No study found here cross-tabulated
    isoform-level translation calls against peptide identifications for annotated isoforms in the same samples,
    which is the stronger thing a sentence about two independent directions would want. The next nearest are
    each weaker in a stated way: PRO-168 used public mouse peptide sets from different experiments on matching
    tissues and mixes P-site with peptide evidence in one percentage; PRO-170 matched GTEx proteomes to long-read
    transcript models from GTEx tissues but not the same material; PRO-184 confirmed 603 of 7,767 frames against
    456 independent datasets; and PRO-189 found 88.7 per cent of 691 already peptide-supported frames had adequate
    footprint signal, which is the reverse question. Searches run: search -s papers ''concordance between ribosome
    profiling and mass spectrometry protein isoform detection same cell line matched samples''; greps for ''peptide|mass
    spectrom|proteomic|PRIDE'' on PMC7156646; greps for ''ribosome|Ribo-seq|translatom'' on PMC10713452, which
    returned only L54 and the reference at L172; greps for ''label-free|proteom|protein abundance|Figure 5|correlat''
    on bio_68c4bad06c08, which returned L44 to L47, L50, L53, L98, L99 and supplementary figure descriptions.
    Semantic search failed on every query this session, so all of this is scoped as not found by keyword search.'
  why: The chapter says the protein-level evidence arrived from two independent directions. The one same-system
    number is 0.4 over a few dozen genes, and PRO-215 shows the deep-proteomics paper's own claim of consistency
    with ribosome profiling cites two of its own authors. The pairing that does share no authors is PRO-030
    to PRO-032 against PRO-033 to PRO-037, and even there PRO-164 shows one route's thresholds were calibrated
    on genes chosen for protein evidence including mass spectrometry, so a sentence should say 'no shared authors'
    rather than 'independent'.
- note: 'THE PER-ISOFORM UNDETECTABILITY NUMBER, NOW PARTLY FOUND. A lead in the chapter 12 file records that
    the proportion of annotated isoforms distinguishable by any tryptic peptide was not found per isoform.
    Three isoform-level figures were found on this pass and none is that number. PRO-205 (PMC8892804 L81) gives
    73 per cent, but over isoforms drawn from groups that peptide evidence had already failed to separate,
    so the subset is selected for undetectability. PRO-206 (PMC6961840 L24) gives 23 per cent of translated
    isoform entries in a heart-specific database as pinned down by a unique peptide. PRO-210 (PMC4298651 L152)
    gives 55.0 per cent of 148,042 human UniProtKB sequences in release 2012_10 with at least one unique tryptic
    peptide, but that denominator mixes canonical, isoform and unreviewed entries. No source stating ''the
    fraction of annotated human isoforms with no distinguishing tryptic peptide'' on one clean denominator
    was found. Searches run: search -s papers ''fraction of human protein isoforms without any unique tryptic
    peptide theoretical detectability bottom-up''; greps for ''no unique peptide|unique peptide|indistinguishable|proteotypic''
    on PMC10840079.'
  why: The chapter's whole argument is bounded by this number. The three found figures bracket it but each
    carries a different denominator, so any sentence stating one of them has to state which, and the 73 per
    cent in particular must not be presented as a property of annotated isoforms in general.
- note: 'THE PEPTIDE-LENGTH DISTRIBUTION WAS NOT FOUND AS A DISTRIBUTION. Several sources state the detectable
    window - 7 to 35 residues at PMC10713452 L24, 8 to 25 at PMC5836368 L44, 7 to 50 at PMC8892804 L81 - and
    PRO-213 gives one named case outside it, but no source found here plots the length distribution of junction-spanning
    tryptic peptides against that window. Searches run: greps for ''length distribution|peptide length|too
    short|too long'' on PMC5836368 and PMC10713452, which returned only methods and workflow lines.'
  why: A figure showing where junction peptides fall relative to the detectable window would carry this part
    of the chapter better than any of the proportions, and the inputs appear to sit in the supplementary material
    of PMC5836368 and PMC10713452 rather than in their text.
- note: SIX SOURCES ON THIS PASS ARE PREPRINTS AND TWO OF THEM ARE BRAND NEW. PRO-172 and PRO-173 come from
    a 2026 bioRxiv preprint with no citations at the time of reading (bio_7cb3e4f0b587), and PRO-183 from another
    (bio_553e5edce278); both are tool papers whose benchmarks were run by the tool's own authors, and all three
    are recorded at medium confidence. PRO-186 to PRO-192 come from a preprint (bio_dd6f4fc16e2a) whose journal
    version appeared in 2026; PRO-169, PRO-177 and PRO-171 come from the SaTAnn preprint (bio_68c4bad06c08)
    whose journal version is the ORFquant paper; and PRO-161 is a 2015 bioRxiv record held in this corpus as
    an abstract only, while PRO-170 is a sixth preprint already cited elsewhere in the book. Every number from
    all six needs re-checking against the published version, and the journal names for the Deutsch and SaTAnn
    records are not in meta.json and are left as RESOLVE_FROM_DOI.
  why: Same treatment as the ENCODE4, GTEx and RPS24 preprint sources already flagged in this file and in research/ALLOCATION.md.
- note: 'OVERLAP WITH THE CHAPTER 12 FILE, SO A MERGE DOES NOT DOUBLE-COUNT. DRG-052 holds the in-silico tryptic
    digest of RefSeq at the peptide level, DRG-053 the observed discriminating fraction, DRG-056 the effect
    of a long-read database on isoform assignment, DRG-057 the 57 per cent of genes with no confirmable isoform
    and DRG-058 the 1 per cent with two. None of their anchors is reused here: PMC10509223 L24 and L25, PMC9721438
    L158 and PMC8892804 L53, L57 and L64 are untouched. PRO-205 uses PMC8892804 L78, L81 and L108, and PRO-211
    uses L69 and L71. One further non-independence: the senior author of PMC5836368 (PRO-201 to PRO-204) also
    leads the work behind DRG-051 to DRG-053, so the peptide-level and the junction-level halves of that argument
    come from one laboratory.'
  why: The writer will want to hold the chapter 11 and chapter 12 figures against each other in one paragraph,
    and both the shared laboratory and the differing denominators have to be stated when that happens.
- note: 'SIX VERIFIED FINDINGS WERE LEFT OUT BECAUSE THE ID RANGE RAN OUT, AND ALL SIX ARE REUSABLE WITHOUT
    RE-READING. (0) PMC13010147 L143: of the 10,127 frames in the primary catalogue subset, 5,981, or 59.0
    per cent, are no longer than 16 codons, 3,943, or 38.9 per cent, start at a codon other than AUG, 6,437,
    or 63.6 per cent, are upstream frames in 5-prime untranslated regions and 2,108, or 20.8 per cent, sit
    in long non-coding RNA genes, so the catalogue is mostly very short leader frames rather than candidate
    new genes. (1) PMC13010147 L144: 3,303 of the 10,127 primary unannotated frames, 32.6 per cent, partly
    share amino-acid sequence with another frame in the same set, and only 332 overlap another by 90 per cent
    or more, so unannotated frames have an isoform-assignment problem of their own. (2) PMC11155197 L68: against
    an outside set of 3,085 reproducibly detected small frames distributed through GENCODE, only 156 were called
    by all five tools, and the two tools calling the fewest frames had the highest proportion of their calls
    inside the set, so sensitivity and accuracy trade against each other. (3) bio_7cb3e4f0b587 L89 and L90:
    translation-efficiency estimates from genome and transcript-set alignment correlate at a median Spearman
    coefficient of 0.969, yet 10,727 of 11,589 transcripts come out lower under genome alignment, with a median
    shift of 0.063 log-two units. (4) PMC7156646 L23: 96 per cent of genes with a translated frame had protein
    evidence from mass spectrometry, staining or UniProt, and the 1,005 held-out single-frame genes that failed
    the thresholds generally had none. (5) PMC7156646 L29: from 15,824 one-to-one human-mouse gene orthologues
    the study identified 18,574 orthologous protein isoform pairs, and 7,112, or 64 per cent, of those gene
    pairs had more than one such pair.'
  why: The brief said there is no quota and 59 ids is not one either. These five were verified against their
    lines and cut only to fit PRO-161 to PRO-219; a human should widen the range rather than lose them.
- note: 'FOUND BUT NOT READ, AND ONE DELIBERATE GAP. PMC8921622 benchmarks seven Ribo-seq tools against bacterial
    ground truth and reports that no tool reached high sensitivity for novel small frames, which would be the
    only true-ground-truth benchmark in the chapter; PMC7085969 reports a workflow combining transcriptome
    assembly with Ribo-seq for human small frames; bio_12f0efcd6fff is the community roadmap preprint behind
    the 7,264-frame catalogue that PRO-186 to PRO-192 all use as their denominator; PMC10730196 and bio_22cf20687ff3
    both bear on frame calling. Separately, the junction-spanning share of what a long-read search database
    adds was not established by any source read. PRO-211 gives 14 novel peptides with no breakdown by junction
    and PRO-170 gives 2,397 validated transcripts with none either. Searches run for it: greps for ''peptide|proteom|mass
    spectrom'' on bio_0dcfa48e6c1f (abood2024longread), bio_cea1c1676f0e (patowary2024neocortexisoforms), bio_68a8e7ff6c37
    (glinos2021transcriptome) and PMC9721438 (the HUVEC proteogenomics paper already cited in the chapter 12
    file). Those greps found proteomics sections at bio_0dcfa48e6c1f L81 and bio_cea1c1676f0e L56 and L58 which
    were not read, and the glinos hit which became PRO-170; none of the four reports a junction-spanning breakdown
    in the lines seen.'
  why: The bacterial benchmark and the roadmap preprint are the two most useful of these. The junction-spanning
    breakdown is the one piece of the long-read proteogenomics assignment this pass did not deliver, and the
    two unread proteomics sections are where to look next.
- note: 'Verified against its lines but left out of the claim file because the PRO-221 to PRO-279 allocation
    had no room left, not because the finding is weak. In Wang and colleagues (PMC4965872, L46): of 166 genes
    known to carry a pyrimidine tract at the cap, 33 expressed more than one start-site isoform in mouse fibroblasts
    with the tract in only one of them, and the tract-bearing isoform was the one translated less efficiently,
    in cells growing normally rather than arrested. A 25-word audit quote was sliced from L46 and would be
    "Among these, 33 genes expressed multiple TSS isoforms in 3T3 cells, of which one isoform contained 5".

    '
  why: a fourth named leader feature, and the only one whose known regulator is growth state
- note: 'Also verified but displaced by the same id ceiling. Noderer and colleagues (PMC4299517, L39) applied
    their measured context scale to 21,579 human protein-coding start codons and 37,474 upstream-reading-frame
    start codons: coding start codons average 15.2 plus or minus 0.4 per cent above a random context, with
    42 per cent in the top quartile of the measured space against 7 per cent in the bottom, while upstream
    start codons average only 1.6 plus or minus 0.4 per cent above random, which the authors read as no preference.
    That would give the chapter a genome-scale denominator for start-codon context.

    '
  why: the only genome-scale statement found on how strong real start codons are, with both denominators
- note: 'Ma and Mayr, "A Membraneless Organelle Associated with the Endoplasmic Reticulum Enables 3''UTR-Mediated
    Protein-Protein Interactions" (doc 36805337, Cell 2018, doi 10.1016/j.cell.2018.10.007) is in the corpus
    abstract-only. It places the tail-dependent SET contact inside a TIS11B granule interwoven with the endoplasmic
    reticulum and extends the result from CD47 to PD-L1. Left as a lead on content: it is abstract-only, carries
    no usable effect size, and is the same laboratory as berkovits2015udpl, so it would add a third non-independent
    record to that cluster.

    '
  why: names the compartment the tail-to-protein hand-off happens in, and adds PD-L1
- note: 'Merritt and colleagues, "3'' UTRs Are the Primary Regulators of Gene Expression in the C. elegans
    Germline" (doc 110095856, Current Biology 2008, doi 10.1016/j.cub.2008.08.013), abstract-only in the corpus,
    report that in the worm germline 3'' UTRs rather than promoters are sufficient for most of the regulation
    tested. A system where the tail dominates, the opposite pole from mouse fibroblasts, but it compares whole
    3'' UTRs against promoters and does not resolve near against far isoforms of one gene, so it does not answer
    the chapter''s question as posed.

    '
  why: the only non-vertebrate system found where the tail is the primary regulator
- note: 'Sandberg and colleagues, "Proliferating Cells Express mRNAs with Shortened 3'' Untranslated Regions
    and Fewer MicroRNA Target Sites" (doc 111491179, Science 2008), abstract-only in the corpus. This is the
    mouse primary lymphocyte study that PRO-257 reports Spies and colleagues disagreeing with for four of five
    shared genes. Not recorded as a claim because the activation-state comparison is chapter 8''s territory
    and because an abstract will not support an effect size.

    '
  why: the other side of a documented disagreement the chapter now reports
- note: 'Weingarten-Gabbay and colleagues, "Systematic discovery of cap-independent translation sequences in
    human and viral genomes" (doc 61692496, Science 2016), abstract-only. A bicistronic high-throughput assay
    over tens of thousands of human and viral fragments. Left as a lead because the assay scores fragments
    rather than transcript isoforms, so there is no isoform-specific claim in it; the chapter''s cap-independent
    material rests instead on bastide2008vegfuorf.

    '
  why: would give a genome-scale denominator for cap-independent initiation if an isoform-resolved cut of it
    exists
- note: 'Not located by keyword search, and worth one more attempt with better terms: a genome-wide measurement
    of near-against-far poly(A) consequence under heat shock or hypoxia with an effect size. Searched "stress-induced
    alternative polyadenylation heat shock transcriptome-wide 3'' UTR lengthening" and boolean greps combining
    "3''UTR shortening" with "heat shock" or "hypoxia" and with "translation efficiency" or "protein level";
    the hits were reviews, cancer-cohort association studies, or plant and worm systems. Semantic search printed
    the keyword-only warning throughout this session, so this is a negative for keyword search and not an absence.
    Nutrient signalling and inflammation were found and are recorded (chang2018intmap, bergant2023iavapa, serpina12025stressapa,
    shortening2014tcells); heat and hypoxia are the two remaining gaps.

    '
  why: the chapter's condition-dependence argument would be stronger with a thermal or hypoxic case
- note: 'Wang and colleagues, "Alternative 3'' UTRs contributes to post-transcriptional gene expression regulation
    under high salt stress" (bio_439c1a466c71, published 10.1093/plphys/kiad030) would add a plant system under
    osmotic stress. Not opened, so nothing about it should be asserted.

    '
  why: one more kingdom, if it measures a consequence rather than only the site shift
- note: 'Urso and colleagues, "Regulation of the hypertonic stress response by the 3'' mRNA cleavage and polyadenylation
    complex" (bio_91d5ff6a6cc7, published 10.1093/genetics/iyad051) concerns the machinery that chooses the
    end under osmotic stress, which is chapter 1''s territory. Chapter 1 may also want the CPSF4 half of bergant2023iavapa
    (PMC10427651, L43 to L48), where influenza NS1 perturbs CPSF4 and thereby causes the host tail lengthening;
    PRO-278 records only the consequence.

    '
  why: two mechanism-of-end-choice findings that belong to chapter 1, surfaced here so they are not lost
- note: 'Ly and colleagues cite their own earlier work, given as Ly et al, 2025, for the claim that start-site
    ribosome profiling identified hundreds of human genes encoding dual protein products with distinct subcellular
    localizations. That number would be the best genome-scale estimate of how many genes make two N-terminal
    forms with different destinations, and it is not in the record file because the source paper was not located
    in the corpus. It is quoted in PMC13219423 at L15.

    '
  why: a sourced count of dual-localised N-terminal pairs would replace a qualitative statement
- note: 'Boundary flags on four records written here, so the one-home rule is adjudicated by a person rather
    than silently. PRO-243 (leader-length transcript ratios across nine ENCODE cell lines) sits next to chapter
    8, which owns alternative polyadenylation across cell types; it is kept here because the measurement is
    start-site choice and the consequence claimed is which protein is made. PRO-244 (988 ClinVar alleles across
    519 genes predicted to change leader length) sits next to chapter 7, which owns inherited disease; it is
    kept here only because it bounds the mechanism the chapter already asserts through its VHL case. The three
    TP53 records (PRO-262 to PRO-264) concern a tumour suppressor, which is chapter 6''s subject, but the finding
    is about whether a three-prime untranslated region does anything, not about cancer. PRO-278 (influenza)
    is an infection model, which no chapter claims, and is here for the tail-length consequence.

    '
  why: four one-home decisions a person should confirm rather than inherit
- note: 'Re-check against the journal version before the chapter is marked done. Five records (PRO-268 to PRO-272)
    and their numbers, including the 1.24-fold, 2.62-fold, 1.18-fold and 1.32-fold interleukin 6 figures and
    the 11-of-14 acute-phase count, were read from the bioRxiv preprint bio_c51805ef7131. A journal version
    exists at doi 10.1038/s41598-025-07569-3 and the numbers may have moved in review.

    '
  why: the preprint-against-journal case that research/ALLOCATION.md exists to track
- note: 'The SERPINA1 preprint rests its tissue claim on an earlier paper, its reference 16, reporting that
    the long 3'' UTR isoform predominates in liver and is increased in lung from patients with chronic obstructive
    pulmonary disease. That paper was not opened. The disease association would be chapter 7''s and the liver-against-lung
    isoform ratio chapter 8''s.

    '
  why: would give the SERPINA1 case a tissue denominator instead of one hepatoma line
- note: 'Provenance note for the metadata resolver, not a claim. The SERPINA1 preprint (bio_c51805ef7131) carries
    an author list in its corpus metadata whose first entry reads "FNU Jiamutai", where FNU is a registry placeholder
    rather than a given name. Rather than invent an initial, the authors and journal fields on those records
    are RESOLVE_FROM_DOI and the bibkey is title-derived (serpina12025stressapa). Two further bibkeys use RESOLVE_FROM_DOI
    because their corpus entries are abstract-only and carry no author or journal field at all: birc32019utrcomplex
    (doc 33834255) and shortening2014tcells (doc 69159365).

    '
  why: so resolve_metadata.py fills these rather than a later pass trusting an invented byline
- note: 'THE ISOFORM MAPPING THE SEQUENCES DO GIVE, which could not be recorded as a claim because it is not
    in any document''s content.lines. The reviewed human entry P62847 and the mouse entry P62849 each carry
    one displayed sequence of 133 residues ending ...GAGKKPKE, and each describes further isoforms by an alternative-sequence
    feature spanning residues 131-133 only. Queries run and outputs obtained, 2026-11-23: (a) paperclip sql
    -s proteins "SELECT accession, feature_type, start_pos, end_pos, description, feature_id FROM uniprot_v.features
    WHERE accession=''P62847''" returns three Alternative sequence features, all 131-133, for isoforms 2, 3
    and 4, plus a Cross-link at 37 described as "Glycyl lysine isopeptide (Lys-Gly) (interchain with G-Cter
    in SUMO2)" and a Region 92-133 described as Disordered. (b) the same query on P62849 returns two, for isoforms
    2 and 3, both 131-133, plus the same SUMO2 cross-link at 37. (c) paperclip sql -s proteins on uniprot.proteins_raw,
    jsonb_array_elements(record->''features''), gives the replacements: human isoform 2 deletes PKE, human
    isoform 3 replaces PKE with KK, human isoform 4 replaces PKE with a long peptide beginning MRELGLGVQALGRISQEERCTDVKNSK;
    mouse isoform 2 deletes PKE and mouse isoform 3 replaces PKE with a single K. So the mouse entry''s three
    isoforms are exactly the three C-termini the 2025 scheme names: 133 residues ending -PKE, 130 ending -KK,
    131 ending -KKK. The human entry''s third isoform ends in four lysines at 132 residues, which no paper
    names, and the human entry has no 131-residue -KKK isoform at all.

    '
  why: 'This is the answer to the chapter''s "settling it would take the annotated sequences" sentence, and
    it half settles it. The protein ends and their lengths are fixed per species; the mouse annotation matches
    the published scheme exactly; the human annotation does not contain the three-lysine form that scheme names,
    which is a concrete reason a single cross-species table should still not be asserted. None of it is quotable
    from content.lines, so a human must either accept a SQL-anchored record type or leave the chapter''s refusal
    in place with this as its stated reason.

    '
- note: 'THE TRANSCRIPT ACCESSIONS FOR EACH PROTEIN END, same status: SQL only. paperclip sql -s proteins over
    uniprot.proteins_raw, jsonb_array_elements(record->''uniProtKBCrossReferences''), filtered to Ensembl,
    RefSeq and CCDS and reading the isoformId field, gives for P62847: isoform 1 (-PKE) ENST00000613865.5 and
    NM_001026.5/NP_001017.1; isoform 2 (-KK) ENST00000372360.9 and NM_033022.4/NP_148982.1 and CCDS7356.1,
    plus four further ENST00000913xxx transcripts; isoform 3 (-KKKK) ENST00000464716.6 and NM_001142283.2/NP_001135755.1
    and CCDS86122.1; isoform 4 ENST00000440692.6 and NM_001142285.2/NP_001135757.1 and CCDS44443.1. The MANE-Select
    cross-reference is ENST00000372360.9 with NM_033022.4, i.e. the 130-residue -KK form, so the reference
    transcript and the displayed reference protein encode different ends of this protein.

    '
  why: 'The MANE-Select mismatch is a cleaner explanation of why the databases confuse this gene than the exon-numbering
    point the chapter currently makes, and it is checkable by anyone with a browser. It would need a citable
    source or an agreed SQL-anchored record type.

    '
- note: 'NO PAPER TIES ITS OWN EXON LABELS TO A DATABASE TRANSCRIPT. paperclip grep -n "ENST0|NM_0|NP_0|ENSMUST|P62847|P62849"
    returned no matches in any of PMC11162997 (park2024rps24), PMC12207440 (nam2025rps24kras), bio_0dd5ca6372bc
    (kerry2024rps24hypoxia), bio_ea2f2a326e66 (magadi2025rps24), PMC12686416 (park2025rps24breast), PMC7025504
    (brumwell2020rps12splicing) or PMC4114680 (gupta2014ribosomeomics). That is all seven papers on this gene
    read in this pass. Scoped by the grep-index quirk noted below, but these were within-document greps, which
    are the reliable kind.

    '
  why: 'This is the missing link. The sequences give protein end to transcript accession; the papers give exon
    label to protein end; nothing found here joins a paper''s exon label to a database transcript, so a reader
    cannot walk from either direction to the other. The chapter''s refusal to publish a single table should
    name this as the reason rather than the exon-numbering inconsistency alone.

    '
- note: 'DEPOSITED STRUCTURES CARRY AT LEAST FOUR DIFFERENT C-TERMINI FOR THIS PROTEIN, but the corpus exposes
    the deposited sequence rather than which residues are modelled, so none of it can be turned into a statement
    about resolution. paperclip sql -s proteins joining pdb_v.uniprot_alignment_ranges, pdb_v.entries and pdb_v.polymer_entities
    on accession P62847 gives, grouped by the entity''s last residues: 148 entries with a 133-residue chain
    ending GKKPKE, best resolution 1.67 angstroms (8GLP); 45 with a 131-residue chain ending AGKKPK, i.e. the
    same sequence minus its last residue; 12 with a 130-residue chain ending VGAGKK, best 2.65 angstroms, among
    them 6ZOK and 6ZOJ from the SARS-CoV-2 Nsp1 work and 5A2Q from the hepatitis C IRES work; 2 with a 132-residue
    chain ending AGKKKK, best 2.0 angstroms (9C3H); and 1 with a 131-residue chain ending GAGKKK at 3.55 angstroms
    (9SYR). The residues_resolved column equals the entity length in every row, so it cannot be used to claim
    the terminus is modelled.

    '
  why: 'PRO-303 is the only line in the corpus on whether a structure resolves this terminus and it is from
    2014. If a later structural paper can be found, or if coordinates can be checked outside this corpus, the
    chapter could say something much stronger than "no structure then available included it". The variety of
    deposited sequences is itself interesting, because it means structural biologists have not agreed which
    end this protein has.

    '
- note: 'NOTHING IN THE CORPUS MEASURES A MODIFICATION ON THIS PROTEIN''S ALTERNATIVE TERMINUS, in either direction.
    Searches run: paperclip grep --exhaustive "(RPS24|eS24)[^.]{0,100}(ubiquit|acetylat|SUMO|diGly|K-GG|GlyGly)|(ubiquit|acetylat|SUMOylat)
    [a-z]*[^.]{0,100}(RPS24|eS24)" over /papers/, 29 paragraphs, all of them gene lists, pathway tables or
    string collisions on "ubiquitously" and "24"; paperclip grep --exhaustive "RPS24[^.]{0,80}(K37|Lys37|K129|K130|K132|Lys129|Lys130)|eS24[^.]{0,60}(K37|K129|K130)",
    one hit and it was an unrelated token sequence; paperclip grep --exhaustive "(S24|eS24|RPS24)[^.]{0,60}C-termin[a-z]*[^.]{0,80}(ubiquit|acetyl|modif)",
    two hits, neither about this protein. The one curated lysine modification is the SUMO2 isopeptide cross-link
    at residue 37 in both the human and mouse entries, which is a hundred residues from the variable end.

    '
  why: 'The chapter asserts that lysines are where cells attach the tags controlling a protein''s fate and
    reports that those authors demonstrate neither modification. That is now bounded in both directions: the
    proposal is older and comes from one laboratory twice (PRO-302 and PRO-051), and no measurement of a modification
    at that terminus was found. The negative is scoped to corpus-wide keyword grep, which the quirk recorded
    below shows to be unreliable for this gene''s isoform tokens, and semantic search printed its failure notice
    on every call this session. Read it as "none found by the available searches", not as "none exists".

    '
- note: 'The structure that PMC7025504 L37 cites for the carboxy terminus being "accessible at the surface"
    was found and is recorded as PRO-318: Khatter et al., Structure of the human 80S ribosome, Nature 2015,
    doi 10.1038/nature14427, held here as abstract-only doc 66160739. Its abstract names no individual ribosomal
    protein, so whether it shows this terminus cannot be decided in this corpus.

    '
  why: 'If that structure does show the terminus at the surface, the chapter can say the variable end is solvent-exposed,
    which is the real reason a modification there would be plausible. If it does not, the claim is a citation
    that drifted. Either way it needs the paper itself, from outside this corpus.

    '
- note: 'A CORPUS QUIRK THAT SCOPES EVERY NEGATIVE IN THIS FILE, and that should go into SCHEMA.md. Corpus-wide
    "paperclip grep" silently misses tokens that are present in documents it covers. Demonstrated: "paperclip
    grep --exhaustive \"S24-PKE\" /papers/" returns "No matches ... across corpus", and "paperclip grep --exhaustive
    --source biorxiv \"RPS24L\" /papers/" likewise, while "paperclip grep -c \"S24-PKE\" /papers/bio_ea2f2a326e66/content.lines"
    returns 25 and "paperclip grep -c \"RPS24L\" /papers/bio_0dd5ca6372bc/content.lines" returns 30. Both documents
    are in the corpus and both were read in this pass.

    '
  why: 'This is worse than the known lookup failures, because a corpus grep that returns nothing looks like
    a clean negative. Every "not found" in this file is scoped to the grep index and to keyword search, and
    semantic search printed its failure notice on every search call this session, so nothing here should be
    read as absence from the literature.

    '
- note: 'One unopened candidate for the entry-channel question. PMC6735954, a yeast eIF3 cross-linking study,
    lists this ribosomal protein among proteins cross-linked to eIF3 subunits in a passage at L94 that distinguishes
    the messenger RNA exit channel from the entry channel; the list that matters is truncated in the grep output
    and the line was not read in full.

    '
  why: 'If eS24 appears in the entry-channel list rather than the exit-channel one, it would be the first non-proximity-labelling
    evidence for the position the chapter asserts, albeit in yeast.

    '
- note: 'Both abstract-only records for the proximity-labelling paper were found (29785618 and 36357199) but
    the full text was not. The PMC identifier its citing papers give, PMC6834362, is not resolvable: "paperclip
    ls /papers/PMC6834362/" returns "PMC paper not found".

    '
  why: 'Whether that paper''s own text claims a position at the messenger RNA entry channel, or whether that
    reading was added by the groups citing it, cannot be settled from this corpus. It matters because two papers
    and one book chapter now rest on it.

    '
- note: 'PMC7025504 has its own text-versus-legend count discrepancy, of the same kind as the Alzheimer one.
    The results text at L32 gives ninety-six prostate cDNA samples broken down as seventeen normal, forty stage
    II, thirty stage III, four stage IV and five not reported; the figure legend at L33 reports the Spearman
    correlation "for 94 samples: normal tissue (n = 16)".

    '
  why: 'The chapter''s aside says the text and the legend disagree in one source. They disagree in two, which
    is a stronger and more general point about how counts reach readers, and this one is partly explicable
    as samples measured versus samples correlated.

    '
- note: 'Further microexon cases found by keyword search but not read: DAAM1, where the purified carboxy-terminal
    part of the human protein was compared with and without a microexon and actin polymerisation measured (PMC12056172)
    - but the microexon extends an interior linker, not a terminus; TAF1, where a six-nucleotide microexon
    near the carboxy-terminal region is spliced during neuronal maturation (PMC11701043); and a survey noting
    that a microexon in GRK6 sits in the second-to-last exon and produces a carboxy-terminal variant (PMC9929638).

    '
  why: 'GRK6 is the closest unexamined candidate for a third terminus-changing microexon case. DAAM1 is the
    best-evidenced microexon-to-function case found and would belong wherever the book discusses interior microexons.

    '
- note: 'General microexon figures stated at PMC13676984 L17 but attributed there to other papers, so not recordable
    from it: microexon definitions vary between 51 nucleotides or fewer, 3 to 27, and 3 to 30; 15,688 human
    microexons identified; more than sixty per cent highly conserved; about eighty per cent of alternatively
    spliced microexons have coding potential; and microexon-encoded peptides tend to fall in intrinsically
    disordered regions.

    '
  why: 'The last of these bounds both worked cases: the variable end of RPS24 is annotated as disordered from
    residue 92 onward in its reference entry. Each would need its primary found before use.

    '
- note: 'The 2026 journal version of the hypoxia follow-up (1000508174) reports that an allosteric AMPK activator
    induces the long form in normal oxygen through ULK1 and independently of mTORC1, and that the splicing
    factor SRSF1 binds this transcript and its autophagy-dependent loss shifts splicing toward the long form.
    Not recorded: mechanism of end choice is chapter 1''s.

    '
  why: 'Chapter 1 should have it, and it is the first mechanism proposed for why this particular splicing decision
    responds to stress.

    '
- note: 'What a drug developer needs evidentially is already recorded, in chapter 12 rather than

    here, and I added no records for it to avoid a second home. DRG-099 and DRG-100 carry

    the case where an approved isoform-selective antibody is paired with a companion test

    that cannot see the isoform distinction, and the bioinformatic argument used to make

    that test adequate; DRG-107 and DRG-108 carry an isoform prevalence estimate from

    confirmatory-trial prescreening and the fact that published estimates of the same

    isoform''s prevalence differ by about an order of magnitude. DRG-057 and DRG-058 carry

    how rarely two isoforms of one gene can be seen at once in a bottom-up proteome.'
  why: The chapter's closing question has answers in the book already, and the writer should cite across rather
    than ask for new research.
- note: 'No independent repeat of the chapter''s mechanism-to-region partition exists that I could

    find: keyword search for the term ragged codon returns only the Biosurfer preprint and

    its published version, and I found no paper that partitions amino-terminal,

    carboxy-terminal and internal isoform differences by causal mechanism over a different

    annotation release or species. The nearest substitutes are recorded as PRO-359

    (phosphorylation sites by region in mammals), PRO-360 and PRO-361 (carboxy-terminal

    variation over 21,784 human genes) and PRO-383 (annotated against unannotated events in

    Arabidopsis). Semantic search failed on every call this session, so this is a negative

    result from keyword search, not an absence.'
  why: The chapter's three opening figures still rest on one analysis by one group, and should say so.
- note: 'A per-isoform measurement of protein output across many tissues at once does not appear

    to exist in this corpus. The two deep tissue atlases found (PRO-355 to PRO-357) are

    gene-level; the isoform-level correlation work (PRO-345 to PRO-351) is one brain region;

    the absolute isoform quantification (PRO-341 to PRO-344) is one gene across tissues. The

    combination the chapter''s closing paragraph asks for, many isoforms and many tissues

    quantified in protein, was not found.'
  why: If it exists it is the single record this chapter most needs, and its absence is itself worth stating
    in the chapter.
- note: 'PMC12976096 cites Ghosh et al. as the survey of disease-relevant nonstop mutations whose

    control it corrects, and cites earlier work on SRY, MAX and SMN2 where an

    isoform-specific carboxy-terminus is already known to set protein stability. None of

    those primaries were read.'
  why: SMN2 in particular would connect this chapter's stability argument to a gene the book already covers.
- note: 'The three-base NAGNAG mechanism has a mechanistic literature that chapter 1 owns and I

    did not record: work in the corpus on how the branch-point-to-NAGNAG region and the

    nucleotide preceding the AG determine which acceptor is used, including a report that

    wobble splicing is mostly tissue- and developmental-stage-independent, which sits against

    PRO-377. One such paper is in the corpus at doc id 117089529.'
  why: It bears on whether the single-residue differences of PRO-374 to PRO-381 are regulated, which is the
    point the chapter would make.
- note: 'Floor and Doudna was read as its bioRxiv abstract only. The eLife version has the

    polysome-fraction data, the untranslated-region panel and any correlation statistics

    behind the hundred-fold range, none of which the abstract carries.'
  why: PRO-354 is the chapter's best transfer-between-cell-types record and it currently rests on an abstract.
- note: 'The dominant-isoform paper (PRO-352) and the ENCODE protein complement paper (PRO-385)

    are both abstract-only here, so neither carries an author list in the corpus and neither

    abstract carries the counts behind its headline. Reference lists elsewhere in the corpus

    give the former''s authors as Ezkurdia, Rodriguez, Carrillo-de Santa Pau, Vazquez,

    Valencia and Tress; whether the latter shares authors with it I could not establish, and

    it needs checking, because PRO-352 and PRO-385 reach opposite conclusions and the

    chapter would otherwise present them as two independent readings.'
  why: A disagreement between two papers is worth much less if they share a laboratory, and the corpus cannot
    tell me here.
