- id: CAN-416
  claim: 'The innate arm of the same story is mis-spliced RNA read as a virus. In MYC-driven triple-negative
    breast cancer, spliceosome-targeted drugs caused mis-spliced messenger RNAs to accumulate in the cytoplasm,
    many of them forming double-stranded structures that double-stranded-RNA-binding proteins recognised, triggering
    antiviral signalling and extrinsic apoptosis; in immunocompetent mouse breast cancer models the same drugs
    produced tumour-cell-intrinsic antiviral signalling, downstream adaptive immune signalling and tumour cell
    death.

    '
