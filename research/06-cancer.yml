leads:
- note: 'The EZH2 antisense paper (CAN-033) exists in the corpus only as the bioRxiv version; meta.json
    carries the preprint DOI 10.64898/2026.01.07.697981 while the search index reports a journal version
    at 10.1101/gad.353628.126. Confirm the journal citation and re-check the motif counts against the
    published text before use.

    '
  why: The chapter cites it as a journal paper; the lines read were the preprint's.
- note: 'CAN-035''s source record has no author list in meta.json. The author list must be resolved from
    PubMed (PMID 40651101) before this appears in references.bib.

    '
  why: A clinical-trial citation without authors is not publishable.
- note: 'CAN-034''s source record (doc_id 27477961) is a 2016 Blood meeting abstract with no author list
    in meta.json. The surnames recorded in the source field come from the abstract''s own disclosure block,
    not from a byline, so the ordered author list must be resolved before this enters references.bib.

    '
  why: Conference-abstract bylines are easy to get wrong and this is the primary preclinical citation
    for H3B-8800.
- note: 'No full-text primary source was located in the time available for several classic oncogenic isoform
    switches named in the brief - MDM2, BCL2L1 (Bcl-xL/xS), PKM1/PKM2, CD44 variable exons, FGFR2 IIIb/IIIc,
    RAC1b, CCND1, EGFRvIII, and BRAF splice variants in vemurafenib resistance. Each is believed to exist
    in the literature but none is anchored here, so none may be asserted.

    '
  why: The chapter will look thin on solid-tumour isoform switches unless a second pass anchors two or
    three of these.
- note: 'The original phase 1 dose-escalation report for H3B-8800 in advanced myeloid malignancies (Steensma
    et al., 2021) was not found as a full-text record; the corpus holds only a 2019 EHA meeting abstract
    (doc_id 31126380) and a 2017 trial-design abstract (doc_id 38139041). The EZH2 preprint cites Steensma
    et al. 2021 as having "appeared ineffective".

    '
  why: The dose-escalation paper is the canonical citation for H3B-8800's clinical outcome and should
    be cited directly, not secondhand.
- note: 'E7107, the earlier SF3B1-targeting compound, and the reported reason its trials were terminated
    (off-target toxicity) were not anchored in this pass.

    '
  why: The therapeutics section needs the full arc of SF3b-modulator clinical attempts, not only H3B-8800.
