- note: 'Nicholas et al. 2026 (PMC13601597, L17) set out the arithmetic of the prediction-detection gap: they
    take from an earlier study the estimate that perhaps 0.5 per cent of non-silent mutations are presented,
    work it into about three presented neoantigens in a lung tumour against a lung immunopeptidome of roughly
    60,000 peptides of which a typical experiment sees 3,000, and compute an 86 per cent chance of seeing no
    neoantigen at all in one mass-spectrometry run. Not recorded as a claim because the 0.5 per cent is attributed
    to someone else and the rest is the authors'' own calculation rather than a measurement.'
  why: It is the clearest single statement of the gap the chapter is trying to describe, and a human may judge
    an authors'-own-calculation citation acceptable where I did not.
- note: Smart et al. (PMC6226333 L13) report a mean of 1,515 predicted retained-intron neoepitopes against
    a mean of 2,218 somatic neoepitopes across 48 melanomas, roughly doubling the predicted load once one outlier
    is excluded, with no correlation between the two loads. Not recorded as a claim because it is entirely
    a prediction pipeline with no detection step, which is the distinction CAN-409 to CAN-413 exist to draw.
  why: If the chapter wants a number for how much splicing enlarges the predicted antigen space, this is it,
    and it must be labelled as predicted.
