- id: CAN-031
  claim: 'MET exon 14 skipping is an isoform-defined drug target: in the phase 1 expansion cohort, crizotinib
    produced a confirmed objective response in 32 per cent of 65 evaluable patients, the underlying DNA lesions
    sat mostly at the splice donor (57 per cent) or acceptor (25 per cent) side of exon 14, and the response
    rate nonetheless fell short of the 60 to 80 per cent seen with matched therapy for other lung cancer drivers.

    '
