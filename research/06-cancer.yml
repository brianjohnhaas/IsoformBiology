- id: CAN-007
  claim: 'The ring-sideroblast phenotype of SF3B1-mutant MDS is traced to a single splicing lesion: a cryptic
    3-prime splice site inserts 21 intronic bases into the iron transporter ABCB7 transcript, creating a premature
    stop codon, and the aberrant transcript was detected in every SF3B1-mutant patient sample tested and in
    none of the wild-type or healthy controls.

    '
