- id: CAN-412
  claim: 'The authors of the largest such analysis state the limit of their own evidence: the tandem mass spectrometry
    they used was whole-proteome and tryptic, so it can show that a peptide exists in the cell but cannot show
    that it was processed and loaded onto MHC, and they name immunopeptidomics as the step their study did
    not take. They also note that junction-spanning peptides are under-represented in protein mass-spectrometry
    data because of where trypsin cuts.

    '
