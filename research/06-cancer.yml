- id: CAN-410
  claim: 'The same study''s negative result is the honest counterweight. Across 48 melanomas from two cohorts
    treated with checkpoint inhibitors, predicted retained-intron neoepitope load showed no association with
    clinical benefit and no correlation with CD8A, GZMA or PRF1 expression; the non-significant trend ran toward
    high load in the patients who did not benefit, at Mann-Whitney p = 0.29 in one cohort and 0.61 in the other.

    '
