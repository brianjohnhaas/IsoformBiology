    '
- id: CAN-411
  claim: 'The gap between predicted and detected is about five orders of magnitude. From a median of 539,925
    junction-spanning polypeptides generated per donor, requiring both mass-spectrometry confirmation in proteomics
    data and predicted MHC-I binding left on average 1.7 splicing-derived candidates per tumour across 63 breast
    and ovarian samples, against 0.6 from point mutations; at least one splicing-derived candidate was found
    in 43 of 63 samples against 19 of 63 for point mutations, and the authors attribute the small numbers to
    mass spectrometry retaining only about 1 per cent of otherwise viable peptides.

    '
