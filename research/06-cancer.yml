- id: CAN-413
  claim: 'The attrition from recurrent junction to tested antigen is steep. Of 789 recurrent tumour junctions
    characterised, 302 (38.3 per cent) yielded peptides detectable in public glioma mass-spectrometry data
    from 447 patients, and 315 (39.9 per cent) were predicted to produce strong HLA class I binders; the intersection
    of transcriptomic, proteomic and binding evidence was 81 junctions, of which 32 predicted to bind HLA-A*02:01
    were carried forward, four were tested for T cell reactivity and two gave a response.

    '
