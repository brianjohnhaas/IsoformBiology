- id: CAN-422
  claim: 'The nearest thing to a clinical test of a junction neoantigen failed. Rindopepimut, a peptide vaccine
    against the novel exon junction of EGFRvIII, was assigned with temozolomide to 371 of 745 randomised patients
    with newly diagnosed EGFRvIII-positive glioblastoma, 369 of whom were treated, in a randomised double-blind
    phase 3 trial across 165 hospitals in 22 countries; in the 405 patients with minimal residual disease,
    median overall survival was 20.1 months on the vaccine against 20.0 months on control, hazard ratio 1.01,
    and the trial was terminated for futility at a preplanned interim analysis. EGFRvIII arises from a genomic
    deletion of exons 2 to 7, not from a change in splicing, so this bounds the junction-neoantigen argument
    by analogy and not directly.

    '
