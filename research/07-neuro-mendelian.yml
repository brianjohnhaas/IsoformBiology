- note: 'None of the three non-Japanese registry records names its sponsor anywhere in its lines or its meta.json,
    and the ISRCTN records carry no date field either. The sponsor in `authors` is therefore sourced rather
    than assumed: for the EU CTIS entry from the EUDRACT number appearing as a secondary identifier on NCT06872125,
    whose organisation field names Stoke Therapeutics, Inc, and for ADMIRAL and LONGWING from the trial publication''s
    funding statement, which names the company and pairs each acronym with its ISRCTN number (the line read
    at NEU-355). Only jRCT2071250035 states the sponsor itself, at its L12. The `year: 2026` on all four is
    the year the records were read, not a publication year they carry; LONGWING is the only one with an internal
    date, 1 August 2023, marking its current revision.

    '
  why: 'scripts/resolve_metadata.py cannot resolve a registry record from a DOI, so these four byline fields
    will not be checked by anything downstream and a reviewer should know where each came from.

