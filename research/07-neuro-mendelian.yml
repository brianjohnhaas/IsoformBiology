    knocked-down SH-SY5Y cells with cycloheximide, which stalls translation and so blocks nonsense-mediated
    decay, made the UNC13A cryptic exon detectable where it had not been before, so the cryptic transcript
    is present below the nominal threshold and is being degraded rather than not made.

    '
