- id: NEU-012
  claim: 'The long-unexplained UNC13A GWAS association resolves into a splicing effect: patient tissues homozygous
    for the risk alleles showed significantly more UNC13A cryptic exon inclusion even after normalising to
    STMN2 cryptic splicing, which controls for how much TDP-43 function each sample had already lost.

    '
