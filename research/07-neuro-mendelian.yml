    decay factor UPF1, or inhibiting translation with cycloheximide, raised the levels of the UNC13A cryptic
    exon transcript and the UNC13B frameshift exon transcript but left the aberrant STMN2 transcript unchanged,
    which has no predicted premature termination codon.

    '
