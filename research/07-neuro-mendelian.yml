- note: 'NIO752 FAILS THIS CHAPTER''S INCLUSION TEST AND IS DELIBERATELY NOT A CLAIM. The registry facts, read
    from /trials/NCT07868328 (Novartis, CNIO752A12201): phase 2, randomised, quadruple-masked, placebo-controlled,
    parallel-group basket study in primary tauopathies, estimated enrolment 48 in three cohorts of 16, each
    cohort randomised between NIO752 and placebo. Cohort 1 is progressive supranuclear palsy non-Richardson
    syndrome, cohort 2 corticobasal syndrome without Alzheimer pathology, cohort 3 MAPT-FTLD mutation carriers.
    Outcome measures are adverse events to week 48 double-blind and week 96 open-label extension, laboratory,
    vital-sign and ECG abnormalities, Columbia Suicide Severity Rating Scale, change from baseline in a target-engagement
    biomarker and in a neurodegeneration biomarker at weeks 24, 48 and 84, pharmacokinetic concentrations and
    anti-drug antibodies. A separate phase 3 in PSP-Richardson syndrome is registered as EU CTIS 2025-523481-24-00
    with change from baseline at week 72 in the PSPRS-28 among its endpoints. The reason it is not a claim:
    NIO752 is a MAPT-targeting gapmer that lowers total tau expression, not an isoform-specific intervention.
    Anchor for that mechanism statement if the chapter ever needs it: /papers/PMC13645932, which calls it "Novartis''
    MAPT-targeting gapmer ASO NIO752", and /papers/PMC13569406, which gives its action as reduction of tau
    expression. Earlier NIO752 registrations seen in the corpus but not opened: NCT04539041, NCT05469360, NCT06372821,
    NCT07498426.

    '
  why: 'The chapter''s section on splicing-directed drugs would be wrong to list a tau-lowering gapmer beside
    nusinersen, risdiplam and zorevunersen, and a later agent asked to chase NIO752 should not spend the calls
    again.

    '
- note: 'Ezerskiy 2022 IS IN THE CORPUS as /papers/PMC8765054, full text, "Astrocytic 4R tau expression drives
    astrocyte reactivity and dysfunction", JCI Insight 2022, doi 10.1172/jci.insight.152012, PMID 34874917.
    How it was found matters for the next agent: "lookup title" with the exact published title returned no
    documents, while both "lookup pmc PMC8765054" and "lookup doi 10.1172/jci.insight.152012" returned it immediately.
    Content beyond NEU-379 that a tau agent would want, all read: endogenous tau protein was detectable in
    hTau mouse astrocytes by mass spectrometry at roughly 100-fold lower levels than in neurons (L19); the
    3R-to-4R oligonucleotide raised 4R and the 4R-to-3R oligonucleotide lowered 4R at the protein level in
    primary astrocytes by targeted mass spectrometry of 4R-specific peptides, and the 3R-to-4R oligonucleotide
    made the astrocytes retract their processes toward the soma with brighter GFAP (L21); human iPSC-derived
    astrocytes carrying a mutation that produces more 4R tau showed the same profile, and healthy neurons cultured
    with them fired faster and more synchronously, which lowering tau expression prevented (L8).

    '
  why: 'Agent A''s note says this paper is what would make the bound on "ratio, not isoform" independent. It
    is reachable, and the lines above are where the rest of it sits.

    '
- note: 'No FDA, EMA or PMDA document for zorevunersen or STK-001 exists in the corpus. A grep of /fda/ returned
    only four Freedom of Information logs recording a third party''s 2024 request for Stoke Therapeutics''
    STK-001 investigational new drug dossier (request 2024-5145), which establishes that an IND exists and
    nothing more. There is no approval package, no review memo and no label. Anything the chapter says about
    regulatory status must therefore come from the trial records or be left out; the 2026 critical review (NEU-358)
    states that no approved disease-modifying therapy addresses the underlying channelopathy, which is the
    closest anchored statement available.

    '
  why: 'This is the one place the chapter could overstate by analogy with nusinersen and the DMD drugs, which
    do have approval packages. Zorevunersen is investigational.

    '
- note: 'Two reviews in the corpus give incompatible magnitudes for the transcript increase, and neither is
    a primary source. /papers/PMC12326748 states that ASO-84 prevents inclusion of poison exon 20N, "increasing
    SCN1A transcripts 1.5-fold and restoring Nav1.1 protein to wild-type levels", while the commentary at NEU-351
    gives up to 25-fold for productive Scn1a transcript and about 30 per cent for NaV1.1 protein in wild-type
    mice. Different oligonucleotide, different animals and probably a different denominator (total against
    productive-only transcript), but the numbers cannot both describe the same quantity. The primary papers
    are Han 2020, abstract-only here, and the Brain 2024 ASO-84 paper, also abstract-only here. Do not use
    either figure without the primary.

    '
  why: 'A chapter sentence giving a fold change for this drug class would currently be resting on a review
    and could be off by more than an order of magnitude.

    '
- note: 'Voskobiynyk 2021 restates a human developmental trajectory for SCN1A exon 20N at its L56, inclusion
    "declining from 60-80% during embryonic development to 5-10% by 6 months of age", attributing it to its
    own reference 37 rather than measuring it. The same L56 gives the SCN8A exon 18N switch as happening at
    9 to 12 months of age in human. Not recorded as a claim because it is secondhand in the source; the primary
    was not chased. Tang 2025 (NEU-373) measured a human trajectory directly but reported it as percent spliced
    in from one brain per time point rather than as these bands.

    '
  why: 'If the chapter wants a human number for how much of SCN1A''s output the poison exon diverts in infancy,
    this is the figure most reviews use, and it needs its own primary source first.

    '
- note: 'Purely mechanistic material read in Lim 2020 that belongs to CHAPTER 1, not here: nonsense-mediated
    decay efficiency differs across non-productive events, with abundance rising roughly 1.1-fold to 9-fold
    after cycloheximide across fourteen validated events (its L19); the pipeline found decay-inducing alternative
    splicing events in about one third of all protein-coding genes (its L48); the three event classes used
    were cassette exon, alternative splice site and alternative intron or exitron (its L21 to L26); and about
    16 per cent of non-productive exon-inclusion events are as conserved as coding exons (its L44, the genome-wide
    part of NEU-343). Tang 2025 adds that 1N and 20N but not 22N rose when the SMG1 inhibitor 11J was applied
    to control neurons (its L24), so poison exons in one gene are not uniformly decay-sensitive.

    '
  why: 'Chapter 1 is recording AS-NMD and poison exons as mechanism concurrently and these lines are already
    located, so they need not be searched again.

    '
- note: 'Adjacent strategies seen but not pursued, each a different mechanism from poison-exon removal and
    so out of scope for this assignment: /papers/bio_441a72816c10, "Modulating splicing in 5'' untranslated
    regions to treat rare haploinsufficient disease", a preprint with a 2026 Genome Medicine DOI (10.1186/s13073-026-01773-0),
    which raises protein by skipping an exon in the 5'' untranslated region rather than a poison exon; /papers/PMC4972487
    and /papers/bio_c2e380dc6c2c, which raise SCN1A by targeting the natural antisense transcript SCN1ANAT
    with AntagoNATs or AAV9; and /papers/PMC13413088, which raises NaV1.1 by targeting a conserved upstream
    open reading frame. None is a splicing intervention of this class except the first, which acts on translation
    rather than on decay.

    '
  why: 'A later agent asked for "other ways to raise a haploinsufficient gene" would find these, and they should
    not be folded into the poison-exon class.

    '
