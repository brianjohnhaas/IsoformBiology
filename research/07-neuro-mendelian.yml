- id: NEU-103
  claim: 'Tau exon 10 is unusual in having two weak splice sites rather than one and in being flanked by a
    13.6 kb intron 9 and a 3.8 kb intron 10, and seven short cis-elements have been identified and been characterised
    in and around it: an SC35-like enhancer, a polypurine enhancer and an A/C-rich enhancer at the exon''s
    5'' end, a silencer after them, a further enhancer at the 3'' end, and in intron 10 a bipartite intronic
    silencer at E10+11 to E10+18 with an intronic splicing modulator at E10+19 to E10+26; fourteen tauopathy
    mutations fall inside six of those seven elements.'
