    only in motor cortex and spinal cord from ALS-TDP and in frontal and temporal cortex from FTLD-TDP, and
    was absent from cerebellum in both disease and control tissue, while the STMN2 cryptic event was the more
    abundant of the two in spinal cord, with the two comparable in cortex.

    '
