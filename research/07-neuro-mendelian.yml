- note: 'NEU-031 and NEU-221 were removed on 2026-11-23. Both read the PREPRINT abstract (doc 55237691) of
    the muscle RNA-sequencing study, and NEU-261 and NEU-262 record the same two findings from the PUBLISHED
    abstract (doc 50091604), which a later agent located after lookup by doi, pmid and title had all failed.
    The published cohort and yield are unchanged from the preprint, so nothing is lost. NEU-221 was additionally
