  confidence: high
- id: NEU-003
  claim: 'The FTDP-17 mutations N279K and delta-280K sit in the same polypurine enhancer of MAPT exon 10 and
    add or delete an AAG copy respectively, raising or lowering SF2/ASF binding, so two neighbouring changes
    push exon 10 inclusion in opposite directions.

    '
