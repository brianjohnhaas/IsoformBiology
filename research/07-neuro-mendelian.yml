    quote: In the adult human brain, the ratio of 3R-tau and 4R-tau isoforms is ~1.
  confidence: high
  figure_idea: 'One axis showing 3R:4R ratio, with a vertical band marking the normal adult range near 1, and
    markers for the direction each disease or mutation class pushes the ratio - so the reader sees that both
    directions are pathogenic.

    '
  note: 'Review, cited as a review. tier: ratio of two isoforms in normal adult tissue, as stated by a review.
    The ratio is the review''s summary of earlier work rather than a measurement made in it. The same review''s
    N-terminal isoform percentages, one line away from this anchor, assign 54 per cent to a class that long
    reads put under 3 per cent and look transposed; this record''s claim carries only the 3R:4R sentence, so
    it is unaffected, but anyone opening the anchor will find those figures beside it. Note added 2026-11-23:
    the NEU-001 to NEU-038 block carried no note field at all, so none of these records declared a tier.

    '
- id: NEU-002
  claim: 'Eleven FTDP-17 mutations fall inside a single self-complementary stem loop spanning the exon 10 /
    intron 10 boundary of MAPT, and each disrupts the complementarity and destabilises the structure; the same
    position is already destabilised in rodents, which is offered as the reason adult mice and rats are predominantly
    4R.

    '
