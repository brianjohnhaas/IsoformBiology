    '
- id: NEU-006
  claim: 'In STMN2 the pathogenic event is a change in RNA processing rather than a mutation: when TDP-43 levels
    fall, its binding to sites within the first intron is reduced, a cryptic polyadenylation site there is
    used, and the gene produces a truncated transcript that is not functional.

    '
