- note: 'The EU Clinical Trials Information System entry for EMPEROR, 2024-519555-28-00, read at /trials/tri_0dafb76e2f13
    line L3, states the endpoint in quantified form that the ClinicalTrials.gov record does not: "Percent change
    from baseline in major motor seizure frequency (number per 28 days) in patients receiving zorevunersen
    as compared with sham at each visit from Week 16 to Week 52 (consisting of nine 4 week intervals)", followed
    by net treatment benefit across multiple Vineland-3 outcomes and change in Vineland-3 subdomain scores,
    both against sham at Week 52. SUPERSEDED: this was a lead only because scripts/verify_claims.py did not
    map the "tri_" prefix to /trials. That has been fixed, and the CTIS endpoint wording is now recorded as
    NEU-381 in claims-trials.yml, alongside the ISRCTN records for ADMIRAL (tri_38bd136803ad) and LONGWING
    (tri_26fa4417684d) and the Japanese jRCT entry jRCT2071250035 (tri_6f267a56f74d), as NEU-382 to NEU-389.
    Cite those records, not this lead.

    '
  why: 'The unit, the comparator and the nine intervals are exactly the provenance the chapter''s clinical
    sentences are supposed to carry, and they are anchored and readable; one line in the verifier''s prefix
