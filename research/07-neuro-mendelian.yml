- id: NEU-004
  claim: 'Because some FTDP-17 mutations are silent or intronic and disrupt only MAPT exon 10 splicing without
    altering tau''s primary sequence, an altered 3R:4R ratio is by itself sufficient to cause neurodegeneration
    and dementia; most such mutations push toward 4R, a minority toward 3R.

    '
