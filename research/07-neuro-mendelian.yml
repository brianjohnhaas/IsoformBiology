- id: NEU-005
  claim: 'TDP-43''s role here is negative: it suppresses the splicing of non-conserved cryptic exons and so
    preserves intron integrity, and when it is depleted those exons enter mRNAs, frequently disrupting translation
    and triggering nonsense-mediated decay - a repression already impaired in ALS-FTD cases.

    '
