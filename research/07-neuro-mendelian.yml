- id: NEU-224
  claim: 'The mechanism of the COL6A1 intron 11 variant is that c.930+189C>T creates a splice donor which,
    with a cryptic acceptor upstream of it, inserts an in-frame 72-nucleotide pseudoexon into the mature transcript.
    A humanized knock-in mouse carrying that human sequence includes the pseudoexon in 7.6 to 10.6 per cent
    of transcripts when heterozygous and 15.0 to 20.8 per cent when homozygous, across quadriceps, tibialis
    anterior, gastrocnemius and diaphragm, against a mean of 24.7 per cent in biopsies from three heterozygous
    patients, so only the homozygous mouse reproduces the human inclusion level.

    '
