- id: NEU-297
  claim: 'In that same 50-individual cohort one case turned on read length and on manual work: a neonate with
    a de novo 69-kilobase duplication of the ATAD3 gene cluster whose breakpoints DNA sequencing could not
    resolve because of homology across the cluster, where short-read RNA sequencing of fibroblasts was uninformative
    and gave no fusion-supporting reads. The long-read pipeline discarded the fusion transcript on internal
    polyadenylation priming and its gene fusion caller missed it as well; it was found only by reading the
    unfiltered alignments by hand against a purpose-built genome, and the transcript then proved to be a complete
    in-frame fusion of ATAD3A to ATAD3C whose exon-level breakpoints established the molecular diagnosis.

    '
