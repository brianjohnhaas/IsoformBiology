leads:
- note: 'The same muscle RNA-seq abstract read for NEU-031 also reports a recurrent de novo deep-intronic COL6A1
    variant creating a dominantly acting splice-gain event, identified in 27 further genetically unsolved patients
    and said to explain roughly a quarter of a collagen VI-like dystrophy cohort. It has no record of its own
    here.

    '
  why: It is the single best Mendelian example of one deep-intronic splice variant accounting for a large slice
    of a phenotype-defined cohort, and would strengthen any deep-intronic section.
- note: 'Brown et al. report that the UNC13A cryptic exon becomes detectable only after more than 50 per cent
    of TDP-43 is lost, whereas the analogous UNC13B event needed more than 90 per cent loss. Read but not recorded
    as a claim.

    '
  why: A dose threshold is what licenses or forbids using a cryptic exon as an early biomarker, and the chapter
    will want it if it argues for cryptic exons as biomarkers.
- note: 'Ma et al. show by minigene dissection that rs12973192, inside the UNC13A cryptic exon itself, has
    the largest single effect on cryptic exon inclusion in TDP-43-null cells, with the other haplotype variants
    contributing non-additively. Read at that paper''s L39 but dropped for want of a slot.

    '
  why: This is the direct causal step from variant to splicing change; the records kept here establish location
    and association but not causation by a single allele.
- note: 'The muscle RNA-seq study cited here as a 2016 bioRxiv preprint (35 per cent diagnosis rate in 50 patients)
    was published in Science Translational Medicine in 2017 as article eaal5209, per the reference list of
    Gonorazky et al. The published version is not in the corpus and the claim is anchored on the preprint abstract.

    '
  why: The published version may report a revised cohort or yield, and the book should cite the journal version
    rather than the preprint.
- note: 'The developmental neocortex isoform counts in NEU-024 were read from the bioRxiv preprint; the corpus
    search listing records a 2024 Science DOI (10.1126/science.adh7688) for the published version.

    '
  why: Preprint and published counts can differ, and any figure built on 214,516 / 72.6 per cent must be re-checked
    against the published paper.
- note: 'NEU-017 is anchored on the ENDEAR trial abstract itself, but the FIREFISH numbers in NEU-018 and the
    EMA approval date in NEU-019 still come from a 2025 review that restates them. The FIREFISH Part 2 record
    found in the corpus is a conference abstract that states the endpoint but reports no efficacy figures.

    '
  why: Approval dates and trial efficacy figures are where a secondhand restatement is most likely to have
    drifted; both should be re-anchored to the trial publications or to a regulatory document before publication.
- note: 'No records exist for three examples named in the chapter brief: CFTR splice variants (the intron 9
    poly-T tract modifying R117H severity was located as a paper but not read), MECP2 isoform-specific variants,
    and the retinitis pigmentosa splicing-factor genes such as PRPF3, PRPF8 and PRPF31.

    '
  why: These are supporting examples in the brief and currently have no anchored support at all.
- note: 'Two tauopathy facts were read in the tau review but not recorded as claims. Its L89 reports that Pick
    disease brains carry predominantly 3R-tau inclusions while 4R-tau is up-regulated in most progressive supranuclear
    palsy and corticobasal degeneration cases; its L90 reports that published findings on the 3R:4R ratio in
    Alzheimer brain contradict one another, possibly because distinct AD subtypes are differentially deregulated.

    '
  why: A 3R/4R table in the chapter needs the Pick/PSP/CBD assignments, and if it asserts any direction for
    Alzheimer disease it will likely be wrong unless the conflict is stated.
- note: 'The chapter brief describes the STMN2 defect as one that was ''invisible at gene level''. Melamed
    et al. as read does not support that framing: total STMN2 mRNA was significantly reduced in sporadic ALS
    motor neurons (mean 423 versus 971 TPM in controls).

    '
  why: The honest version of the point is that the defect is invisible in the annotation and in rodent models,
    not that gene-level expression looked normal; writing the stronger claim would misstate the source.
