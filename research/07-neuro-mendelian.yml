- id: NEU-005
  claim: 'TDP-43''s role here is negative: in mouse embryonic stem cells depleted of it, non-conserved cryptic
    exons that it normally suppresses entered mRNAs, frequently disrupting translation and triggering nonsense-mediated
    decay, and enforcing repression prevented the cell death that followed. Those authors suggest that this
    repression is already impaired in ALS and frontotemporal dementia cases.

    '
  topic: TDP-43 cryptic exons as a disease mechanism
