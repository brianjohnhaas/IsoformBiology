- id: NEU-001
  claim: 'Adult human brain holds 3R- and 4R-tau at roughly a one-to-one ratio, so the inclusion or skipping
    of a single MAPT exon - exon 10, which encodes the second microtubule-binding repeat - is what sets the
    balance between the two halves of the tau isoform pool.

    '
  topic: MAPT exon 10 and the 3R/4R balance
  source:
