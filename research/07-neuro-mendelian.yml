    in either. That is consistent with both SMA splicing drugs having full approvals on clinical endpoints,
    unlike the four DMD drugs, but absence of the phrase in one document is not proof and no claim asserts
    it.
  why: The chapter's contrast between the SMA and DMD programmes turns on exactly this, and it needs an approval
    letter rather than an inference from a grep.
- note: The Spinraza clinical pharmacology review (fda_703d8d9466c1) states at L99 that SMN protein detected
    in autopsy thoracic spinal cord motor neurons was only semi-quantitative because of the immunohistochemistry
    method, that direct measurement of SMN protein within the neuron was not feasible, and that no control
    samples were available, so the actual change in SMN protein could not be assessed. Its L101 states that
    SMA infants treated with nusinersen had higher levels of SMN2 mRNA containing exon 7 than untreated infants,
    from three autopsies.
  why: 'This is the honest bound on target engagement for nusinersen: the RNA change was seen in human tissue
    and the protein change was not measurable. It was dropped for slots, not for quality.'
- note: 'The eteplirsen summary review (fda_269d14f43e60) holds the Study 301 western blot analysis at L445
    and L818, which is a paired baseline-against-week-48 comparison in an externally controlled open-label
    study and not a placebo comparison: across imputation methods for values below the limit of quantification
    the mean treatment effect was 0.22 to 0.32 per cent of normal, 8 of 12 patients had a change of 0.25 per
    cent or less and 1 of 12 had a change greater than 1 per cent. Its L830 records that a blinded re-read
    of the Study 201/202 immunohistochemistry with proper controls showed no evidence of dystrophin production
    through 48 weeks of treatment.'
  why: These are the numbers the dissenting reviewer argued from, and the blinded re-read is the strongest
    single result against the immunohistochemistry evidence. Both were read and line-verified but dropped at
    the 39-record limit.
- note: PROMOVI (PMC8673535, read and line-verified at L21, L29 and L32) is the open-label non-randomised 96-week
    eteplirsen trial NCT02255552, run at 40 US sites between November 2017 and June 2019 with an intended control
    group of patients not amenable to exon 51 skipping. 78 of 79 treated patients completed 96 weeks and 15
    of 30 untreated patients completed the study, and that untreated cohort was set aside as an inappropriate
    control because of genotype-driven differences in clinical trajectory, so the 6-minute walk and vital-capacity
    comparisons (minus 68.9 metres on eteplirsen, minus 67.3 in the earlier phase 2 studies, minus 133.8 in
    external controls) are post-hoc comparisons against historical data. Exon skipping rose 18.7-fold and dystrophin
    7-fold against baseline at week 96, both relative measures with no percentage of normal in the abstract.
    Nothing read identifies PROMOVI as the required confirmatory trial of NEU-215, and the eteplirsen review's
    Study 301 is described as externally controlled and still accruing in 2016, so the two should not be equated
    without a linking line.
  why: A trial that lost its concurrent control arm is a strong, anchored addition to the dystrophin-surrogate
    section, and it was dropped only because the record range ran out. Reusable without re-reading.
- note: STR1VE (doc 11576282) and STR1VE-EU (doc 6285604) hold the open-label single-arm phase 3 onasemnogene
    results in symptomatic type 1 patients, and were located but not read beyond the search listing.
  why: The chapter records onasemnogene only as a mechanistic contrast, so START and SPR1NT suffice; if it
    ever compares effect sizes across the three drugs it will need the phase 3 figures.
- note: 'Cost-effectiveness is a live disagreement in this field and the corpus holds both kinds of analysis:
    PMC6508058 is a cost-effectiveness analysis of onasemnogene in type 1 SMA and doc 34555458 is a cost-effectiveness
    analysis of nusinersen in infantile- and later-onset SMA in Sweden. Neither was read.'
  why: The brief names cost-effectiveness as one of the chapter's live disagreements, and it has no anchored
    record on either side.
- note: The SUNFISH Part 2 primary publication was not found. A lookup by its exact Lancet Neurology title
    returned no documents, and searches returned only conference abstracts plus the trial group's own 24-month
    paper, PMC9897618. The SUNFISH figures in NEU-191 and NEU-192 therefore come from the FDA summary review.
  why: So that nobody searches for it again, and so the chapter attributes the SUNFISH numbers to the regulator
    rather than to the trial paper.
- note: FIREFISH Part 2 and the long-term extensions exist in the corpus as doc 173279123 (secondary analyses
    of Part 2) and doc 186431088 (a three-year open-label extension), both abstract-only, and doc 15594381
    is a five-year conference abstract. None was read.
  why: NEU-189 and NEU-190 cover Part 1 only, and Part 2 is the part that was designed as an efficacy study
    with the 5-of-40 threshold.
- note: Aartsma-Rus and colleagues' theoretic-applicability analysis (doc 108120103, 'Theoretic applicability
    of antisense-mediated exon skipping for Duchenne muscular dystrophy mutations') would give per-exon amenability
    percentages across the whole gene rather than the single-drug figures recorded here. It was located but
    not read.
  why: The chapter would benefit from one source for all skippable exons instead of three regulatory documents
    each giving the fraction for its own drug.
- note: No branaplam efficacy publication for spinal muscular atrophy was found. The phase 1/2 SMA trial NCT02268552
    is referenced in the branaplam HTT paper (PMC8894458 L14) as ongoing with good tolerability and efficacy,
    but that is the HTT paper's characterisation of it, not a result.
  why: NEU-199 and NEU-200 give branaplam's HTT history; its SMA history is unanchored, and the chapter should
    not say branaplam 'worked in SMA' without it.
- note: PMC11015039 and bio_eaa6d6be6c2a report that splice modulators of this class act on PMS1 to reduce
    somatic CAG repeat expansion in Huntington disease, which is a third target for the same chemistry. Located,
    not read.
  why: If the chapter argues that a small molecule's selectivity is intrinsically limited, a third unintended
    target in the same programme is the strongest form of that argument.
- note: 'Every `paperclip search` run in this session reported "semantic search was too slow or failed; results
    are from keyword search only", so every topic below was reached by keyword matching, not semantic retrieval,
    and a semantic pass may find different papers.

    '
  why: It changes what "not found" means for every negative result in this file.
- note: 'The medRxiv preprint read for NEU-222 and NEU-223 (COL6A1 intron 11 cohort of 44 patients) has its
    author list truncated mid-name in meta.json, so authors is RESOLVE_FROM_DOI, and no published version was
    found in the corpus by lookup on its preprint DOI. The bioRxiv humanized-mouse preprint read for NEU-224
    and NEU-225 likewise shows no published version in the corpus.

    '
  why: Both records would be cited from preprints, and the author lists need resolving from the DOI.
- note: 'The paper that established the COL6A1 intron 11 pseudoexon mechanism and showed that splice-correction
    therapies target it, Bolduc et al., "A recurrent COL6A1 pseudoexon insertion causes muscular dystrophy
    and is effectively targeted by splice-correction therapies", JCI Insight 2019, 4:e124403, doi 10.1172/jci.insight.124403,
    is cited in the reference lists of at least eleven corpus papers but is not itself in the corpus: lookup
    by title and by DOI both returned nothing, and a corpus-wide grep for "COL6A1 pseudoexon" returned only
    reference-list hits.

    '
  why: It is the primary for the mechanism and for the antisense rescue, and this file has only the cohort
    papers and the mouse model, which cite it rather than show it. Until it is read, the words pseudoexon and
    splice donor for the human variant rest on NEU-224 and NEU-225.
- note: 'Published versions exist for three preprints recorded here and were not read: the pseudoexon genome-sequencing
    study at 10.1016/j.gim.2025.101574 (Genetics in Medicine 2025), the CFTR polyT/TG cohort at 10.1002/humu.24250
    (2021), and the PRPF8 organoid study at 10.1038/s41598-026-40376-y (2026).

    '
  why: Cohort sizes and odds ratios can change between preprint and journal version, and every number in NEU-226,
    NEU-230 and NEU-236 rests on the preprint text.
- note: 'A third finding from the ClinVar/HGMD paper was written as a record and then withdrawn to leads, because
    it is about database accuracy rather than splicing fractions: at that paper''s L15, individuals of African
    ancestry were significantly more likely to be wrongly indicated as affected by a screened inborn error
    of metabolism when HGMD variants were used, and that bias was no longer significant once common variants
    were removed in line with current guidelines. No effect size is given, only the significance statement.

    '
  why: If chapter 7 says the published fractions are ordered by ascertainment, it may want to say whom the
    ascertainment misses; but the finding is not about splicing, and chapter 10 owns variant classification,
    so it should be placed deliberately rather than by default.
- note: 'Chapter 10 material found while searching and deliberately not recorded: the ClinVar/HGMD paper reports
    at its L15 that ClinVar variants classified pathogenic or likely pathogenic are reclassified sixfold more
    often than HGMD disease-causing variants; the construct-based splicing audit calibrates minigene results
    into ACMG evidence strength, finding that variant-induced loss-of-function transcripts expressed at 80
    per cent or more, or 20 per cent or less, give strong evidence towards or against pathogenicity (its L13);
    and ParSE-seq (med_da5c080f6ecf, published 10.1038/s41467-024-52474-4) is a multiplexed minigene assay
    explicitly calibrated for clinical classification, which is the assay that performs best in NEU-258 and
    NEU-259.

    '
  why: Reclassification counts, PS3/BS3 weighting and reporting policy are chapter 10's by the one-home rule,
    but chapter 10 will want the anchors and they are already located.
- note: 'Cancer-gene material found and left for chapter 6: a study of 34,188 benign or likely benign ClinVar
    variants that nominated 18 as frame-disrupting and confirmed abnormal splice products in 8 of them (DICER1,
    CDH1, PALB2), mean 66 per cent aberrant product, range 6 to 100 per cent (PMC11613871); long-read DNA and
    cDNA sequencing finding deep-intronic pseudoexon-creating variants in BRCA1, PALB2 and ATM (PMC11610570);
    and germline TP53 exonic variants annotated as missense that act by splicing (PMC13424335).

    '
  why: Each is an instance of a class chapter 7 is arguing about - a benign reclassified by RNA, a deep-intronic
    pseudoexon, a missense acting by splicing - but in hereditary cancer genes, which chapter 6 owns.
- note: 'Two sources that bear on the coding-annotation question are already in the book under chapter 6''s
    bibkeys and were not duplicated: soukarieh2016exonic (PMC4711968, exonic splicing mutations more prevalent
    than currently estimated) and rhine2018hereditary (PMC5854443, hereditary cancer genes highly susceptible
    to splicing mutations). Of the two, only rhine2018hereditary shares an author with the massively parallel
    assay paper behind NEU-026 and NEU-254 to NEU-257: its own record in research/06-cancer.yml notes it shares
    the senior author Fairbrother. The soukarieh2016exonic author list in that file carries no shared author,
    so it is an independent source.

    '
  why: If the chapter wants a second measurement of how often a coding-annotated variant acts by splicing,
    those are the closest, and the bibkeys must be reused rather than minted again - but one of the two is
    not independent of the figure it would be compared against and the other is.
- note: 'A held review of MECP2 isoform regulation (PMC7530521) names, at its L37, a mouse model with specific
    disruption of the MeCP2-E1 protein made by altering the exon 1 start codon, which recapitulated Rett-like
    neurological phenotypes despite an unexpected rise in MeCP2-E2 protein; and at its L34, Mecp2-mutant mice
    engineered to re-express MeCP2-E2 in neurons that were phenotypically indistinguishable from wild type.
    Both are the review''s reference numbers 50 and 46 and neither primary was located; one search was run
    for isoform-specific Mecp2 knockouts and it returned neither.

    '
  why: Those two results pull in opposite directions about which MECP2 isoform carries the phenotype, which
    is the heart of the e1/e2 question, and the chapter should not rest that on NEU-231 and NEU-232 alone.
    A review cannot be cited for a primary finding, so the primaries need chasing.
- note: 'No variant-by-variant concordance between two massively parallel splicing assays was found. What the
    corpus holds instead is NEU-258, a class-level comparison of three assays on canonical dinucleotide variants,
    and NEU-240 and NEU-249, which audit seven datasets for whether their own scores separate aberrant from
    natural splicing. The query run was a keyword search for benchmarking splice variant prediction algorithms
    using massively parallel splicing assays and concordance between assays; no query was run for the specific
    phrase of a reanalysis of overlapping variant sets. A 2025 bioRxiv assay measuring human splice variants
    across five cell lines (bio_9859f7056efa) was located and not read, and is where to look for cell-line
    dependence of a reporter measurement.

    '
  why: The assignment named such a comparison as the most valuable possible record. The chapter can say the
    assays differ on a class where they should agree; it should not imply they have been cross-validated variant
    by variant, nor that no such study exists anywhere.
- note: 'No single source was found that recomputes two of the four published fractions of inherited disease
    attributable to splicing on one common denominator across all four. NEU-250 does it for two of them, the
    trio-based 27 per cent against ClinVar''s 16.5 to 17.5 per cent on matched splice positions, and NEU-251
    states why the HGMD-derived and other-curation figures are not comparable with those. Queries run, all
    keyword-only: ascertainment bias HGMD ClinVar variant databases not comparable estimates proportion splicing
    variants denominator. No query was run against the primaries behind the 30 and 43 per cent figures, Krawczak
    et al. 2007 and Caminsky et al. 2014, which are named at the trio paper''s L55 and were not looked up.

    '
  why: Reading those two primaries would complete the reconciliation, because their denominators are the two
    the chapter cannot currently describe; everything else the argument needs is now anchored in NEU-250 to
    NEU-252.
- note: 'The existing NEU-026 gives the comparison figure as "3 per cent of the common SNPs tested the same
    way" without its denominator. That denominator is at the same paper''s L31: only 3 per cent, 7 of 228,
    of common SNPs altered splicing in both assays. With 228 SNPs the 3 per cent carries a wide interval, which
    matters because the chapter uses that figure as the background rate against which 10 per cent of disease
    alleles is read.

    '
  why: The chapter's argument is that every fraction needs its denominator, and one of its own fractions is
    missing one; the fix is a one-line amendment to an existing record, not a new source.
- note: 'A benchmark of four splice-disruption predictors on the 27,733 MFASS variants reporting a shared exon-interior
    blind spot exists in the corpus as a 2026 bioRxiv preprint, bio_40991ed86c25 (published 10.64898/2026.07.21.739871),
    and was not read.

    '
  why: It would pair with NEU-242 on an independent variant set; it was left alone because the chapter's prediction
    section already has NEU-035 and NEU-036.
- note: 'The ABCA4 midigene work recorded in NEU-238 comes from a group that includes a therapeutics company,
    ProQR, alongside an academic centre, per the affiliations at that paper''s L5 to L9, and ABCA4 is a target
    of antisense programmes.

    '
  why: The book's reviewers look hardest at sentences about independence.
- note: 'All CFTR records here use HGVS numbering, in which the skipped exon is exon 10 and the poly-T and
    TG tract sits in intron 9; per the Sterrantino paper''s L26 the legacy names for the same two features
    are exon 9 and intron 8. The chapter brief''s phrase "intron 9 poly-T tract" is therefore the HGVS name
    and is correct as written, but any source quoted as saying "exon 9 skipping" means the same exon these
    records call 10.

    '
  why: A chapter that mixes the two numbering systems in one paragraph will read as an error, and the older
    CFTR literature uses the legacy names throughout.
- note: 'Located in the corpus but not recorded for want of a record id in the assigned range: OUTRIDER, the
    autoencoder-based expression-outlier caller that NEU-281 and NEU-290 both run, is held as abstract-only
    doc 35885259 (10.1016/j.ajhg.2018.10.025); LeafCutterMD, one of the two competing splicing callers benchmarked
    in NEU-278 and NEU-279, is at PMC7750945 (10.1093/bioinformatics/btaa259); and ANEVA, which quantifies
    how much regulatory variation a gene tolerates before an allelic-expression outlier means anything, is
    at bio_0ef1aa716c0f (published 10.1126/science.aay0256).'
  why: The chapter currently has the per-sample burden and the false-positive trade for splicing callers but
    no anchored description of the expression-outlier method that every clinical pipeline here uses, and no
    anchored statement of what an allelic-expression outlier has to beat.
- note: 'The Yepez 2022 clinical fibroblast study partitions the 46 causative variants in its 32 solved cases:
    13 (28 per cent) were already classified pathogenic or likely pathogenic, 10 (22 per cent) required functional
    validation, 11 (24 per cent) had not been prioritised during exome analysis, and 12 (26 per cent) were
    not captured by exome sequencing at all, of which 9 were found by calling variants from the RNA reads and
    3 needed a genome. Read at PMC8981716 L99 but not recorded: the first two categories are variant classification
    and belong to chapter 10.'
  why: The 12 of 46 not captured by the exome is the cleanest statement of what the assay adds that DNA sequencing
    could not, and chapter 7 could record that part alone if chapter 10 takes the classification split.
- note: The Solve-RD manuscript states that the added value of RNA sequencing has been shown as uplifts of
    3 to 36 per cent across centres, tissues and diseases, citing thirteen studies (med_f576f2f76edc L63).
    This is a restatement, not a measurement, and was not recorded as a claim.
  why: If the chapter wants a single range for the spread of reported yields it should anchor each end on the
    primary study or attribute the range to these authors; the top of the range is Cummings 2017 and the bottom
    is not identified on the line.
- note: PMC12105386 reports that SpliceAI predictions matched what the RNA actually showed exactly in only
    40 per cent of the splicing variants of uncertain significance tested, and that 2 of its 16 diagnosed cases
    would have been missed by a purely RNA-driven approach without the prior DNA candidate (that paper's L11).
    Both were read but left in the yield record's note rather than given claims of their own.
  why: The 40 per cent figure bears directly on the chapter's existing section on prediction-tool performance,
    which holds ranking metrics rather than agreement with observed RNA; it deserves its own record in whichever
    agent owns that section.
- note: 'Searched for and not found in the corpus searched: any paper that computes the fraction of OMIM or
    ClinGen disease genes assayable in induced-pluripotent-stem-cell-derived tissue with a stated denominator
    and threshold. The closest held result is PMC11339655, which brings 193 of 516 neurological silent genes
    into expression by direct fibroblast-to-neuron transdifferentiation and uses iPSC-derived neurons only
    as a comparator for PAK3 isoform diversity.'
  why: The chapter will want to say what an iPSC-derived model buys over a fibroblast and there is no anchored
    number for it; searches on disease-gene fractions by accessible tissue, on MRSD and on transdifferentiation
    all returned the same three papers.
- note: 'Searched for and not found: any measurement of how many diagnostic transcriptomes are solved later
    by reanalysis against a newer transcript annotation. Four phrasings of reanalysis plus newer annotation
    plus additional diagnoses returned only method-driven reanalysis (NEU-273, NEU-280), DNA-data reanalysis
    within one cohort (NEU-286''s 12.9 per cent), automated DNA reanalysis at scale (PMC13472938, med_7bd300e78aaa)
    and Wright et al. 2018 (PMC5912505), which lifted yield from 27 to 40 per cent in 1,133 developmental-disorder
    families by reanalysing genome-wide DNA data, not RNA.'
  why: Chapter 9 owns annotation growth; chapter 7 would need an RNA-specific reanalysis yield to state the
    diagnostic consequence, and the corpus does not appear to hold one. Wright et al. is available if the chapter
    wants the DNA figure as a comparator, stated as such.
- note: 'Not searched, for want of record ids rather than for want of relevance: Lee et al. 2020 Genetic Medicine
    on the diagnostic utility of transcriptome sequencing (cited in arx_2301.07363''s reference list), Murdock
    et al. 2021 on the Undiagnosed Diseases Network cohort (cited in med_f576f2f76edc L63), and the minigene
    literature on confirming a candidate splicing variant. Three further cohorts were located but not read:
    PMC9613860 (transcriptome-based variant calling in a Korean muscle cohort), med_5ff065b17607 (ultra-deep
    RNA sequencing across four tissue types) and PMC13394364 (RNA sequencing resolving cryptic variants in
    mitochondrial disease).'
  why: med_5ff065b17607 is the only source found that varies sequencing depth across tissues systematically,
    which is the other half of the tissue-choice argument; a minigene record is needed before the chapter can
    say what confirms a candidate when the patient's tissue cannot be assayed at all.
- note: Smith and Kitzman report that at a score threshold where each tool calls 10 per cent of a 500,000-variant
    simulated background set disruptive, median transcriptome-normalised sensitivity was 87.3 per cent for
    SpliceAI, 85.8 per cent for ConSpliceML and 79.9 per cent for Pangolin, and that exonic sensitivity was
    lower than intronic by an average of 36.9 percentage points. Read at PMC10187268 L30 but not given a record
    of its own.
  why: It is the only figure in this corpus that normalises tools against each other by their genome-wide call
    rate, which is the quantity a diagnostic laboratory actually cares about, and it would let the chapter
    state the exon penalty as a sensitivity loss rather than as an area under a curve.
- note: Smith and Kitzman describe SpliceAI and Pangolin as sharing training sets (PMC10187268 L25) and describe
    the best-performing deep-learning predictors as trained on gene model annotations (its L9), whereas Pangolin's
    own paper states that it was trained on RNA splicing measurements from four species while SpliceAI was
    trained on human sequences only (PMC9022248 L13). All three lines were read. NEU-302 follows the primary
    and NEU-304 and NEU-321 attribute the other description to its authors.
  why: 'A sentence saying the two best tools are nearly the same tool has to rest on the right reason: shared
    architecture and near-identical scores, which both sources support, rather than shared training data, which
    the primary contradicts.'
- note: No primary description of SpliceAI's own training labels exists in this corpus, because the SpliceAI
    paper is held as an abstract only (doc 34980441, cited at NEU-028) and the abstract does not describe the
    training set. The SpliceAI2 preprint says only that SpliceAI established sequence-based splice site prediction
    and that Pangolin and DeltaSplice later extended the framework to quantitative prediction of splice site
    usage (bio_6f0a212282bb L3).
  why: The chapter's argument that a tool trained on annotation predicts annotation rests on SpliceAI, and
    at present it can only be supported at second hand; the published paper should be read directly before
    the sentence is written.
- note: Pangolin's training labels were splice-site usage estimated with SpliSER 1.3 from RNA-seq in heart,
    liver, brain and testis in four species, with every position in a gene body labelled spliced or not and
    usage expressed as the proportion of a gene's transcripts using that site (PMC9022248 L31, L32). Read and
    cited at NEU-301 and NEU-302 but recorded only in summary.
  why: If the chapter wants to say precisely what a tool is trained to predict, this is the sentence that says
    it for the one tool in the comparison whose target is a measured quantity.
- note: 'Pangolin''s accuracy depends strongly on variant class in one gene: on BRCA1 saturation genome editing
    data, using predicted splicing effects to separate loss-of-function from functional variants gave area
    under the precision-recall curve 0.31 for missense variants, 0.95 for the 1,591 variants remaining after
    missense and nonsense were excluded, and 0.90 for the 861 variants in the extended splice region (PMC9022248
    L23).'
  why: It is a clean demonstration that one reported area under the curve for a tool is meaningless without
    the variant class, which is the methodological point the chapter's prediction section is making.
- note: SpliceVault's authors warn explicitly against generalising the delta 0.011 threshold they used for
    the matched comparison, saying their experimentally confirmed splice-neutral variants indicate it would
    yield a false-positive rate above 50 per cent (PMC9925382 L45). Read but not recorded as a claim.
  why: Any sentence quoting a SpliceAI threshold needs this caveat attached, and it is the sharpest available
    statement that a threshold tuned for one purpose is not a clinical cut-off.
- note: 'Tissue-matched empirical prediction did not help in the one place it was tested: GTEx muscle Top-4
    gave no improvement in sensitivity over the all-tissue 300K-RNA Top-4 for the 19 of 88 variants associated
    with muscle disorders and assayed on muscle samples, and the authors advise caution for genes with known
    tissue-specific or developmental alternative splicing (PMC9925382 L31).'
  why: The chapter will be tempted to say tissue-specific reference data fix tissue-specific prediction; this
    is the result that says they did not, at the sample sizes available.
- note: 'A pooled safety base now exists for oligonucleotides generally: a meta-analysis of adverse events
    across 101 clinical studies reports injection site reactions at 51.7 per cent pooled incidence (33 studies,
    95 per cent confidence interval 36.5 to 66.5), nausea and vomiting symptoms at 22.4 per cent (60 studies)
    and headaches at 19.2 per cent (46 studies), and the authors frame it as the safety information available
    to n-of-1 programmes that cannot run a randomised trial (PMC13315839 L155, doi 10.1016/j.omtn.2026.102976).
    Read but not recorded, because a platform-level adverse event rate across all oligonucleotide classes is
    closer to chapter 12''s remit than to this chapter''s named Mendelian drugs.'
  why: It is a quantitative harm figure for the modality as a whole, which would bound the single-patient harms
    recorded at NEU-323 and NEU-329.
- note: Corpus documents disagree about what the milasen target variant does. The 2024 review read here calls
    it a 2 kilobase intron 6 insertion promoting inclusion of intron 6 (PMC11275492 L22); a 2022 perspective
    calls it a unique cryptic splicing variant (PMC9058873 L16); the medRxiv version of the N1C VARIANT guidelines
    calls it a deep intronic MFSD8 variant resulting in cryptic splicing (med_e5749dd76fa2, body); another
    medRxiv document says milasen blocked pathogenic pseudoexon inclusion in MFSD8 (med_27967a636dd9, Discussion).
    The primary (Kim et al. 2019) is in this corpus as an abstract only and the abstract does not name the
    event. A corpus-wide grep for 'milasen' (30 full-text hits, 13 abstracts) and for 'MFSD8' found no fuller
    description; a boolean grep for MFSD8 together with SVA could not run.
  why: The chapter cannot call the lesion a pseudoexon, a cryptic exon or an intron retention until the primary
    is read; four secondhand sources give three answers, and the majority favour cryptic splicing rather than
    the intron retention recorded at NEU-322.
- note: Chapter 10 owns what follows from these numbers for variant classification, and two findings read here
    belong there rather than in chapter 7. Kim et al. report that only 22 per cent (8 of 36) of the oligonucleotide-amenable
    ATM variants had previously been classified pathogenic or likely pathogenic in ClinVar, while 50 per cent
    (18 of 36) had been called likely benign, uncertain or conflicting (PMC10371869 L50). Drost et al. report
    that experimental splicing evidence led to reclassification for 54 per cent (96 of 177) of the variants
    of uncertain significance tested (PMC12547740 L12, L71).
  why: Both are strong results and both are reclassification findings, so they should be offered to chapter
    10 rather than recorded twice.
- note: 'Dropped for want of a record id, already line-verified: individualised does not have to mean one drug
    per patient. Because several different amenable ATM variants produced the same mis-splicing event, 24 of
    the 35 amenable individuals (around 70 per cent) were predicted to be treatable with five splice-switching
    oligonucleotides between them, while covering all 35 would need 15 distinct drugs; the commonest amenable
    variant, c.5763-1050A>G, was present in 13 of the 235 (PMC10371869 L55, L57).'
  why: It is the economic argument for the whole approach and reusable without re-reading; it was cut to make
    room for the serious adverse events at NEU-329.
- note: Journal versions exist for four preprints cited here. The CAGI6 splicing challenge preprint (10.1101/2023.06.20.545093)
    has a journal DOI recorded in the corpus listing as 10.1007/s00439-023-02624-3; the amenability screening
    cohort preprint (10.1101/2025.02.10.25321921) one recorded as 10.1016/j.gim.2025.101597; the n-Lorem applicant
    cohort (10.1101/2024.08.05.24310862) and the Smith and Kitzman benchmark (10.1101/2023.05.04.539398, held
    in PMC with journal recorded as bioRxiv) show none in the corpus. Every record here keeps the preprint
    DOI, because the preprint is what was read and the journal DOIs were not independently confirmed; SCHEMA.md
    asks for the journal DOI where one exists, so these four need resolving.
  why: Every number taken from these four records should be re-checked against the published version before
    the chapter goes out, since benchmark figures and cohort counts are exactly what peer review changes.
- note: 'Synofzik et al. tabulate a priority order for splice-modulating oligonucleotide targets, with activation
    of an intronic cryptic splice site as the most favourable case (mode of action: prevent cryptic exon inclusion;
    essential criterion: target more than 50 base pairs from the exon-intron boundary), then exonic cryptic
    site activation, then frame-restoring exon exclusion, which they note requires a protein tolerant of an
    internal deletion such as dystrophin or a collagen (PMC9058873 L36 to L40).'
  why: It is a published, ordered set of tractability criteria that complements the two-step taxonomy at NEU-327,
    and a table in the chapter comparing the two schemes would show that the field agrees on the direction
    of the splicing error as the first question.
- note: 'Located in the corpus but not read in this pass, so neither present nor absent: SQUIRLS as a tool
    description (bio_31944a446d71, the 2021 bioRxiv preprint of the AJHG paper); ParSE-seq as a calibrated
    reporter assay (PMC11437130); the MFASS exon-interior benchmark preprint (bio_40991ed86c25, which reports
    four predictors against 27,733 MFASS variants and names a shared exon-interior blind spot); and the Rowlands,
    Baralle and Ellingford review comparing seven splice predictors (PMC6953098, a review, so not citable for
    a primary finding).'
  why: Each is a plausible additional source for the prediction section and each is located, so none needs
    searching for again.
- note: 'Not searched for in this pass: AbSplice and tissue-specific predictors by name; the OpenSplice assay
