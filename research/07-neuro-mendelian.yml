- id: NEU-003
  claim: 'The FTDP-17 mutations N279K and delta-280K sit in the same polypurine enhancer of MAPT exon 10 and
    add or delete an AAG copy respectively, raising or lowering SF2/ASF binding, so that in cultured cells
    two neighbouring changes push exon 10 inclusion in opposite directions. The review restricts the SR-protein
    work it is summarising to cultured cells and reports that some of those observations contradict each other,
    which it attributes to minigene size, cell type and endogenous splicing-factor levels.

    '
