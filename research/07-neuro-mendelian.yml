- id: NEU-144
  claim: 'The second UNC13-family event failed the test that UNC13A passed: across the New York Genome Center
    post-mortem RNA sequencing cohort the authors saw no increase in the UNC13B frameshift exon in ALS-TDP
    or FTLD-TDP tissue, and attribute the null to a shorter UNC13B isoform that contains the same exon and
    is present in control as well as disease brains, which their cell experiments had not shown.

    '
