  confidence: high
  note: 'tier: targeted single-cell measurement of selected exons chosen to differ in one sequence property.
    The anchored support the file''s leads say the gene-dependent reading lacks, and it names three predictors
    rather than one: flanking intron conservation, inclusion level and expression level. Two of the three are
    the same properties SCS-289 reports for bimodal exons and SCS-293 for cell-state exons, reached by three
    laboratories that share no authors. The assay is RT-qPCR on 44 chosen exons, so it measures precision for
    a hand-picked set and not transcriptome-wide, the number of cells per type is not stated in the lines read,
    and it yields no molecule count. The exons were selected on conservation, which is one of the properties
    under test.

    '
leads:
- note: 'Direct conflict the chapter must present as such: SCS-001 (Olivieri 2021) reports a monocyte subpopulation
    found only by splicing, while SCS-007 (Benegas 2022) reports that in their hands splicing clustering never
    surfaced a subpopulation expression clustering had missed. Note also how thin the SAT1 evidence is: the
    artefact control on Olivieri L314 rests on 16 cells that had exactly two reads at the splice site. Attribute
    both and do not pick a winner.

    '
  why: The single most load-bearing claim of this chapter has a published counter-result.
- note: 'Unresolved conflict that the chapter must present as a conflict, not a settled fact: does a single
    cell express one isoform or a mixture? SCS-011/SCS-012 (Velten, poly(A) sites, 2015) and the bimodality
    reports the review in SCS-014 summarises say cells have distinct per-cell preferences; SCS-013 (Buen Abad
    Najar 2020) says the appearance is a coverage artefact; SCS-009 (Longcell 2025, long reads, UMI-deduplicated)
    says same-cell co-expression is common for well-expressed genes; SCS-010 shows exclusive per-cell choice
    for one gene in the same dataset. The honest reading is that the answer is gene-dependent and still measurement-limited.

    '
  why: This is the chapter's central open question; picking a side would misrepresent the literature.
- note: 'Second conflict, on whether 3-prime-end protocols are structurally blind to internal splicing. SCS-031
    (Olivieri, 10x Chromium) and SCS-032 (IDEIS, 10x 3-prime) say yes in practice; SCS-034 (Saferali, ScaleBio
    combinatorial indexing) measured no decay in junction recall towards the 5-prime end. These are different
    chemistries with different gene-body coverage profiles, so any table or statement in the book must name
    the chemistry rather than say "3-prime protocols".

    '
  why: A blanket claim about 3-prime blindness would be wrong for at least one widely used platform.
- note: 'Fansler et al. state in their discussion (L65) that the dominant isoform switches in 60 per cent of
    human genes, but the figure that result points to is captioned as a fraction of multi-UTR genes, and the
    same paper classifies only about 50 per cent of human genes as multi-UTR (L32). The 60 per cent figure
    is therefore most likely a fraction of multi-UTR genes, not of all genes. Record it as the authors phrase
    it and flag the denominator rather than silently rescaling.

    '
  why: A book table that prints 60% of all human genes would propagate the paper's own looseness.
- note: 'Four of the records here are preprints whose figures and numbers should be re-checked against a published
    version before the chapter goes out: SCS-020/SCS-021 (Cohen et al., read as bioRxiv 2025, corpus lists
    a 2026 Cell DOI which is what source.doi records), SCS-022/SCS-023 (Su et al., SPLISOSM, bioRxiv 2025),
    SCS-005/SCS-006 (Mantri et al. 2026) and SCS-033/SCS-034 (Saferali et al. 2026). The Mantri and Saferali
    records also carry placeholder pub_date values in the corpus metadata (2026-01-01); the real posting dates
    are 2026-09-11 and 2026-09-22 per their DOIs. For SCS-020/SCS-021 the orchestrator must decide a convention:
    source.doi carries the journal (Cell) DOI taken from the corpus search listing, while journal/year/bibkey
    still describe the bioRxiv version whose lines were actually read.

    '
  why: Numbers move between preprint and journal version; two of these carry anchored quantities.
- note: 'The PTPRC/CD45 story is usually told as "T-cell subsets are indistinguishable at gene level but separable
    by isoform". The corpus supports the second half precisely (SCS-003, SCS-004) but no line read here states
    that the subsets are indistinguishable by PTPRC gene expression - in fact these subsets are separable by
    other marker genes. The chapter should say that PTPRC isoform usage adds subset information that PTPRC
    gene counts do not carry, not that the cells are otherwise identical.

    '
  why: The stronger phrasing would be unanchored and is probably false as written.
- note: 'Not found in the corpus searches run here: a single-cell isoform study of the Dscam-style mutually
    exclusive exon clusters in a vertebrate (protocadherin alpha choice in individual neurons). If such a paper
    exists it would be the cleanest possible case of stochastic exclusive isoform choice per cell.

    '
  why: Would anchor the stochastic-choice section on a system where exclusivity is the known mechanism.
- note: 'Also absent from these searches: a study that puts a number on how much of the isoform variance between
    single cells of one annotated type is technical versus biological, after UMI deduplication, on a long-read
    platform. SCS-009 and SCS-010 come closest but report direction, not a variance partition.

    '
  why: The chapter's honest-limits section would be stronger with one such decomposition.
- note: 'The gap the file''s standing lead names is narrower than the lead states, and the correction matters.
    A decomposition of isoform-ratio variance into technical capture noise, random assortment of a cell''s
    molecules between isoforms, and genuine per-cell preference does exist on UMI-counted data, and it is in
    the paper this file already cites at SCS-011 and SCS-012: Velten et al. 2015, now recorded at SCS-136 with
    its test statistics. It is a 3-prime short-read protocol resolving polyadenylation sites, so what remains
    genuinely absent is the same decomposition on a long-read platform resolving whole isoforms. Nothing of
    that kind is in the corpus. Searched: multi-phrasing keyword searches on "decompose technical and biological
    variance splicing single cells long-read UMI", "variance decomposition isoform usage within cell type technical
    noise", "intrinsic noise in alternative splicing single cell variability partition", "proportion of splicing
    variability attributable to technical sampling versus cell-to-cell biological variation", and "how much
    of the cell-to-cell variation in isoform ratios is technical sampling noise after UMI deduplication long-read
    single cell"; corpus-wide greps for "variance components", "variance partition", "technical and biological
    variance", and for technical-or-biological noise within 80 characters of splicing, isoform or PSI; and
    `paperclip evidence` on the claim itself, which judged 264 passages and returned neither support nor refutation,
    then `evidence --deep` on the weaker claim that technical noise accounts for most apparent single-cell
    isoform variability, which judged 780 passages and returned 19 supporting and 16 refuting. Search condition
    worth recording: every `search` call in this pass printed "semantic search was too slow or failed; results
    are from keyword search only", and one `grep --bool` call failed with a corpus search error, so the searches
    above were keyword and `evidence` only. The `evidence --deep` call is what surfaced the Velten decomposition
    and SingleSplice, both of which the keyword searches had missed or buried, which is why the negative here
    is scoped to the long-read case and not asserted more widely. The other near misses, all now recorded:
    SCS-130 and SCS-131 (SingleSplice, a spike-in-trained technical-noise model for exon-level isoform ratios,
    short-read, no UMIs, a per-gene significance call rather than a partition); SCS-132 (Marinov 2014, a pool/split
    technical control at isoform level, short-read, no UMIs, a gene count rather than a partition); and SCS-133
    (Longcell, a within-cell against between-cell beta-binomial decomposition on UMI-deduplicated long reads,
    the right platform but the wrong partition, since its within-cell term absorbs molecule sampling as well
    as genuine mixing, and which yields a confident estimate for only 57 genes).

    '
  why: 'The chapter''s limits section can now state the absence in its true scope, and name the decomposition
    that does exist, instead of repeating the file''s over-broad lead.

    '
- note: 'Read and not recorded for want of a record slot, each with its anchor so it need not be found again.
    Hamraoui et al. 2026 PMC13335474 L121 gives the independent isoform-level quantification accuracy against
    a simulated truth: normalised error of 0.48 for wf-single-cell alone and 0.53 coupled with Isosceles on
    R9.4.1, 0.35 and 0.43 on R10.4.1, against 0.92 for scNanoGPS and 1.2 for FLAMES on R9.4.1; this is the
    isoform counterpart of SCS-120 and the best available external benchmark for the chapter''s item on isoform
    assignment. The same paper''s L119 gives real-data isoform assignment against single-isoform control genes,
    with the best tool at 100 per cent precision and F1 0.96, and one quantifier''s precision at 79 per cent
    on consensus-corrected reads against 60 per cent on reads prepared without that correction. Nilsen-style
    permutation evidence on how much single-cell isoform patterning survives a null is in Bioinformatics 2018,
    PMC6041805 L59, which reports 4,309 of its isoform-pair patterns, 26.0 per cent, as non-random by permutation
    test, the complement being consistent with sparsity; it is short-read and the chemistry and cell counts
    were not read here. Benegas et al. PMC8975553 L23, the paper already cited at SCS-007, states that coverage-driven
    batch effects can account for a significant proportion of observed expression variation, and the bioRxiv
    versions of the same work report that some junction-usage quantifications cluster cells by plate more strongly
    than by cell type, which is the sharpest batch-dominance statement found; the published-version wording
    is weaker than the preprint''s and would need checking before use.

    '
  why: 'Three of these bear directly on the chapter''s limits section and two are better evidence than records
    already here, so a later pass should promote them rather than re-search.

    '
- note: 'Already recorded elsewhere in the book, so not duplicated here. The finding that ten published differential-transcript-usage
    methods disagree on the same data - median pairwise overlap of the top ten ranked transcripts between zero
    and 0.05 on long-read bulk, about 0.24 at the top five hundred, below 0.1 on single-cell and spatial data,
    with nine of the ten methods holding a mean empirical false discovery rate under 5 per cent - is in research/01-foundations.yml
    under bibkey zhang2026dtuframework, anchored on PMC13586480 L22,L23. Two records drafted here were dropped
    on finding it, because a second bibkey for one work fails a gate and the same two lines cannot carry claims
    in two files. The chapter 8 relevant half is that agreement is lowest on exactly the long-read single-cell
    and spatial data this chapter is about; the writer should cite the existing record for it rather than a
    new one.

    '
  why: 'The limits section needs this number and would otherwise create a duplicate bibkey for a work the book
    already cites.

    '
- note: 'Three sources here were read as preprints while source.doi carries a journal version taken from the
    corpus search listing: SCS-108 (Smart-seq3, bioRxiv 2019, journal DOI 10.1038/s41587-020-0497-0), SCS-110
    (Svensson, bioRxiv 2019, journal DOI 10.1038/s41587-019-0379-5) and SCS-115/SCS-138/SCS-139 (Dai et al.,
    bioRxiv 2024, journal DOI 10.1093/gpbjnl/qzaf077). In each case journal and year in the record describe
    the preprint actually read, because meta.json for these documents carries no journal name and SCHEMA forbids
    supplying one from memory; resolve_metadata.py should fill journal and year from the DOI, and the quoted
    numbers should be re-checked against the published version. SCS-106 and SCS-107 (Scoones et al.) are bioRxiv
    with no journal version in the corpus, so no flag is set. ALLOCATION.md should gain all four.

    '
  why: Numbers move between preprint and journal version, and five records carry anchored quantities.
- note: 'Scope warning for the writing pass. Six records here measure gene-level rather than isoform-level
    quantities and must not be written as isoform results: SCS-113 and SCS-114 (zeros per cell and zero inflation),
    SCS-115, SCS-120 (gene count error against UMI duplication), SCS-134 and SCS-135 (differential expression
    method comparison), SCS-138 and SCS-139 (coefficient of variation and cell number). Each is included because
    the isoform question inherits the bound, not because the source made an isoform claim. The isoform-level
    counterparts that do exist are SCS-117, SCS-119, SCS-122, SCS-127 and SCS-130.

    '
  why: 'A gene-level number presented as an isoform-level one is the defect this chapter''s reviewers find
    most often.

    '
- note: 'Two sources state a cell count nowhere in the lines read, so no record here carries one for them:
    SCS-101 to SCS-103 and SCS-132 (Marinov 2014, number of single-cell libraries not given in the body text;
    the abstract gives the transcript range per cell but not the number of cells) and SCS-130 and SCS-131 (Welch
    2016, which reanalyses a published mouse embryonic stem cell dataset without restating its size or depth
    in the lines read). If the chapter needs those numbers, they must be read from the methods sections or
    from the datasets the two papers reanalyse, not supplied from memory.

    '
  why: The dispatch requires a cell count with every number, and two sources do not provide one.
- note: 'Two searches that came back empty, with the caveat that both ran under the degraded search conditions
    described above and neither was retried with `evidence`, so these are weaker negatives than the one on
    variance partition. First, a power analysis computing the number of cells needed to detect an isoform usage
    difference of a stated size: one keyword search for it returned nothing isoform-specific. The closest found
    is scPower (Schmid et al., "Design and power analysis for multi-sample single cell genomics experiments",
    doc_id bio_f9483fb46ecb), which concludes that for a fixed budget the number of cells per individual rather
    than depth per cell determines power, at gene level; a `scan` of that document returned only abstract-level
    lines, L1 to L25, so it may be an abstract-only record or may simply not have been read far enough, and
    that should be checked before the chapter relies on it. SCS-139 is the other gene-level anchor. Second,
    a true technical replication of one single-cell isoform library preparation run twice on the same sample:
    not found. Every reproducibility measurement recorded here is something weaker - a split of one cDNA library
    across platforms (SCS-106, SCS-107, SCS-119), a split of one pool of cells into groups (SCS-138), or a
    pool/split of RNA from pooled cells before library construction (SCS-102, SCS-132) - and the chapter should
    name which design it means rather than saying "technical replicates".

    '
  why: 'A reviewer will ask for a power figure and for replicate agreement, and the honest answer is that the
    gene-level versions exist, the isoform-level ones were not found, and these two negatives are less thoroughly
    searched than the variance-partition one.

    '
- note: 'Further material read and deliberately not recorded, with reasons. Svensson 2017 (PMC5376499) L37
    to L39 and L165 give the depths at which accuracy and sensitivity saturate, 270,000 and 4.6 million reads
    per cell: that belongs to chapter 5''s chemistry comparison rather than here. L47 and L48 of the same paper
    report that quantification accuracy measured on SIRV spike-ins, which mimic isoform structures, is systematically
    lower than on ERCC spike-ins and that a 5-prime-tag protocol was very poor on them, which is the only isoform-aware
    spike-in result found in the corpus, but the paper gives no number for it in the text, only a figure. Fu
    et al. 2025 PMC12276307 L77 state that a mean PCR amplification fold of five already allows most truncation
    and mapping errors to be corrected, so PCR duplicates are useful as well as a nuisance; it is a design
    recommendation rather than a measurement.

    '
  why: Each was considered and rejected for a stated reason, which saves the next pass the reading.
- note: 'The conflict in the file''s first lead now has four laboratories on the positive side (SCS-001, SCS-156,
    SCS-169 with SCS-171, and SCS-176, the last on its authors'' own patients and replicated in a second cohort)
    against one on the negative side (SCS-007). The count does not settle it, and two corrections matter more
    than the count. First, in every positive case the splicing-defined population also differs in gene expression
    - 174 genes in SCS-156, a differentiation score and mutation count in SCS-169, 371 and 134 genes in SCS-176
    - so what is established is that expression clustering as those authors ran it did not draw the boundary,
    not that the boundary is invisible to expression. This is the same correction the file already makes for
    PTPRC and it should be made in the same words. Second, the one independent benchmark read here (SCS-141,
    SCS-142) scores splicing clustering by agreement with expression-derived labels and its authors say so
    themselves, which means it cannot adjudicate; whether SCS-007 has the same property was not checked, because
    its source was not opened on this pass. No source found here tests the claim the other way round, by isolating
    a splicing-defined population and showing it behaves as a population.

    '
  why: The chapter's most load-bearing claim can now be attributed to four groups, which makes the asymmetry
    in how it is tested more important rather than less.
- note: 'What "independent" means for these records, checked against the dataset citations rather than assumed.
    SCS-156 and SCS-157 reanalyse Zheng et al. 2017 liver cancer T cells; SCS-141 to SCS-144 and SCS-172 use
    eight public Smart-seq2 studies including Zhang et al. 2019 hepatocellular carcinoma lymphocytes; SCS-169
    uses a published triple-negative breast cancer dataset and SCS-170 and SCS-171 a published mouse embryonic
    liver dataset; the SCASL paper also analyses the Zhang et al. 2019 data elsewhere, in sections not recorded
    here. So the laboratories are independent of each other, but several are reanalysing published Smart-seq2
    data from overlapping sources - Jiang''s reference 31 and the SCASL paper''s reference 61 are the same
    Zhang et al. 2019 hepatocellular carcinoma paper, checked in both reference lists - so the chapter should
    say "four independent analyses" rather than "four independent experiments". Who produced each dataset was
    not checked. SCS-176 is the partial exception: a six-patient training cohort its authors describe as their
    own, plus a seven-patient validation dataset whose origin the lines read do not state.

    '
  why: The reviewers find more defects in sentences about independence than in sentences about biology, and
    this is the sentence this pass most invites.
- note: 'Searched for and not found: any source measuring what CD45 isoform state adds over a standard surface-marker
    panel, in bits, in classification accuracy, or in any other information measure. Searches run were a semantic
    search on PTPRC isoform quantification improving T cell subset annotation beyond marker genes, a corpus-wide
    grep for CD45RA or CD45RO near CITE-seq, antibody-derived-tag and accuracy or AUC terms, and a re-grep
    of the IDEIS paper itself for ADT, CITE, accuracy and AUC. What exists instead is SCS-164, which compares
    two ways of reading the same isoform and finds the antibody better per cell, and SCS-165, where the isoform
    appears alongside effector gene expression in the authors'' reasoning. The file''s existing correction
    therefore stands unchanged and must not be strengthened.

    '
  why: The usual telling of the PTPRC story still has no quantitative support in this corpus, and a writer
    reaching for one will find only measurements that do not answer the question.
- note: 'There are now five numbers in this project for isoform change without gene change and they measure
    four different things, so a table printing them as one spread must carry, per row, the axis measured, the
    unit counted, the denominator and both statistical thresholds. SCS-005 counts gene-and-cell-class pairs
    with differing isoform proportions and no significant expression change, about a third, denominator 250,159
    pairs tested; SCS-017 counts genes whose isoform variation is unexplained by expression variation, about
    seven in ten; LR-035 counts differentially expressed isoforms whose genes were also differentially expressed,
    about half; SCS-157 reports an overlap of 11 to 37 per cent between differentially spliced and differentially
    expressed gene sets, with the direction of that ratio ambiguous in its source, so no complement should
    be derived from it; SCS-161 counts genes switching dominant transcription start region that were expressed
    at similar levels, 79 of 120. SCS-149 is a fifth quantity again, how often isoform features add age information
    expression features lack.

    '
  why: Printing these as one spread without their units would be the chapter's worst available error, and the
    numbers are close enough to each other to make it tempting.
- note: 'Cross-species conservation now has evidence on both sides and the two sides are not opposites. For
    transfer: SCS-018; SCS-148, where 49 per cent of mouse marker junctions replicate in human endothelial
    cells with 83 per cent directional agreement; SCS-174, where 10 of 170 pseudotime-correlated human genes
    are also developmentally regulated in mouse and mouse lemur; and SCS-175, where one MYL6 event keeps its
    compartment pattern in all three species. Against: SCS-145 and SCS-146, where 62 to 67 per cent of testable
    orthologous events differ in absolute usage ratio between species in a given immune cell type, with SCS-147
    showing the divergence smaller in fibroblasts. The reconciliation these records permit is that a contrast
    between cell types can transfer while the absolute level does not, but no source read here states that,
    so the chapter must present it as the shape of the disagreement rather than its resolution. SCS-145 is
    also bulk sequencing of sorted populations, not single cells, whereas SCS-174 and SCS-175 are single-cell;
    and SCS-174 and SCS-175 come from the same group and paper as the chapter''s central positive result on
    populations.

    '
  why: Records that look like a contradiction are probably measuring transfer of a difference against transfer
    of a level, and saying so is better than averaging them.
- note: 'Records kept despite not carrying everything the chapter''s number rule asks for, listed so the orchestrator
    can rule on them rather than discover them: SCS-144 (percentages with no per-cell-type cell count; the
    100-cell floor in the source applies to a different panel), SCS-156 and SCS-157 (sequencing protocol not
    named in the lines read, only "full-length" and the source dataset accession), SCS-161 to SCS-163 (nucleus
    count not given, donor count recorded instead), SCS-167 (denominator of genes passing the variability threshold
    not stated), SCS-168 (cells loaded into library construction rather than cells analysed), SCS-173 (testis
    cell count not given, only the per-gene coverage floor and the whole-donor total). Two papers were rejected
    outright for the same reason and are described in a later lead, so the file is currently inconsistent on
    this point and that is a decision rather than an oversight.

    '
  why: A reviewer who finds the rule applied unevenly will not be able to tell which records were judged and
    which were missed.
- note: 'PMC13596200 is a second copy of the preprint behind SCS-005 and SCS-006 (bio_6d51f05a6e54), deposited
    in PMC under the same DOI, 10.64898/2026.09.11.748700, with journal recorded as bioRxiv, so it is not a
    published version and those two records need no source amendment. Both numbers hold in that copy. What
    SCS-005 should gain is its denominator: at L29 of PMC13596200 the same result reads 250,159 gene-and-cell-class
    pairs tested, 81,939 called differentially used, 28,469 of those without significant differential expression
    and 12,138 with no detectable expression change at all, at thresholds of isoform-fraction change above
    0.1 with adjusted p below 0.01 for usage and absolute log fold change above 0.5 with adjusted p below 0.05
    for expression. The authors also state that this analysis is not depth-matched and is therefore an upper
    bound.

    '
  why: SCS-005's claim currently carries a fraction with no denominator, and the denominator is in the lines
    its own quote comes from.
- note: 'The file''s lead on a vertebrate mutually exclusive exon cluster in single cells is already answered
    inside this project: DSC-026 in research/02-animals.yml records monoallelic Pcdh-beta expression in 17
    of 18 single mouse neurons, from PMC3431597. That is single-neuron and allele-discriminating, which is
    what the lead asks for, so chapter 8''s lead should cross-reference it rather than describe it as absent;
    the record lives in chapter 2 and chapter 2 owns the case. What is still not found is an equivalent measurement
    made with a modern single-cell isoform assay rather than single-neuron RT-PCR.

    '
  why: A lead that says a thing was not found, when the project already holds it under another chapter, will
    send the next agent on the same search.
- note: 'On allele-resolved isoform use, the honest summary of SCS-151, SCS-166 and SCS-167 is that none of
    them measures whether the two alleles of a gene in one single cell use the same isoform. All three measure
    cis-allelic effects pooled within a cell type or a cell population: SCS-151 aggregates over 369 F1 fibroblasts,
    SCS-166 and SCS-167 aggregate within cell type. They also border the isoform-QTL material chapters 5 and
    10 own, and SCS-166 names a candidate causal splice-site variant, which makes its exclusivity cis-genetic
    rather than stochastic. The per-cell concordance measurement the chapter''s central question wants was
    not found.

    '
  why: The three records look like an answer to the chapter's open question and are not, and a writer will
    read them as one.
- note: 'Still not found, after searches on isoform variance partition, technical against biological variance
    in single-cell splicing, and UMI-deduplicated long-read isoform heterogeneity: a study that partitions
    isoform variance between single cells of one annotated type into technical and biological components on
    a long-read platform. SCS-150 comes closest from a different direction - it partitions splicing-programme
    activity across cell types and reports that batch explains under one per cent - but it is Smart-seq2, not
    long reads, and the partition is across cell types rather than within one.

    '
  why: Confirms the file's existing gap and narrows what would close it.
- note: 'Rejected for the number rule, both worth a second look if the orchestrator relaxes it. DOLPHIN (PMC12227669)
    reports that exon-and-junction-graph embeddings beat gene counts by 0.11 adjusted Rand index and 0.09 normalised
    mutual information on a 10x rectum dataset, and 896 exon-level differential genes undetected at gene level
    in a pancreatic tumour cluster, but gives no cell counts anywhere in its body text. ISOP (PMC6041805) reports
    that 31.5 per cent of its 54 significant isoform-pattern genes involved isoforms that were not differentially
    expressed, but the comparison is a drug treatment in one cell line rather than between cell types, and
    the chemistry of its primary dataset is not named in the text.

    '
  why: Neither should be re-searched from scratch, and the inconsistency with the records kept under the exceptions
    lead needs a ruling.
- note: 'The 2026 correction to the IDEIS paper, PMC13508597, changes only a Czech Science Foundation grant
    number in the funding statement. SCS-003, SCS-004, SCS-032, SCS-164 and SCS-165 are unaffected.

    '
  why: A correction notice on a paper five records rest on should be checked once and then recorded as checked.
- note: 'Two findings touch sections another agent owns on this pass and were left to them. The DESJ paper
    behind SCS-156 and SCS-157 describes ARHGAP15-205 as having a bimodal distribution within the naive T cell
    cluster, which is the bimodality dispute; and the olfactory sensory neuron paper behind SCS-168 reports
    co-expression of several isoforms of one olfactory receptor gene inside individual neurons, which is within-cell
    heterogeneity and, given that receptor choice is the canonical case of exclusive choice, probably the more
    interesting of the two.

    '
  why: Both sit in the chapter's central open question and would otherwise be found twice or not at all.
- note: 'Rejected as out of scope but noted because it will come up: bio_e6a9174e6c5c is a deep PacBio long-read
    and proteomic time course of human iPSC-derived cortical neurons which reports that two isoform switches
    make a novel isoform over 60 per cent of AGO1 expression by day 30 while total AGO1 mRNA expression stays
    constant across timepoints, together with a biphasic microexon programme, 114 genes including against 24
    excluding early and 50 skipping against 24 including later. The flat-gene-total statement was read in full
    at L58. It is bulk, not single cell, so it belongs to chapter 5 or 11, but it is the cleanest isoform-switch-with-flat-gene-total
    case found in these searches, and no single-cell study found here reports that control alongside a named
    switch.

    '
  why: The exact case chapter 8's trajectory section wants exists, in bulk, and the chapter should say so rather
    than imply the single-cell literature has it.
- note: 'Identified in searches and not opened, so not searched rather than absent: PMC10903961 (single-cell
    isoform switching in mouse preimplantation embryos), bio_804587e04f53 (long-read single-cell isoform preferences
    in developing human retina), bio_9ae303af6c26 (cell-type specificity of isoform diversity in developing
    human neocortex, already bibkeyed patowary2024neocortexisoforms), bio_34869dff6d61 (the CD8 T cell long-read
    atlas behind LR-035, which is the obvious place for further PTPRC and trajectory results), bio_87b65b7c7b02
    (a platform reporting an ARHGAP5-mutated urothelial subpopulation with distinct splicing), PMC13589402
    (long-read single-cell isoform changes in monkey corneal wound healing), the Psix and MARVEL method papers,
    and a title lookup for an isoform cell-type-specificity study of mouse primary motor cortex, which was
    never run.

    '
  why: Each is a plausible source for assignments 3 to 6 and listing them stops the next pass re-deriving the
    same shortlist.
- note: 'Demoted from a claim record on review and kept here because the finding is real but its attribution
    is not in the lines read. In the LR-Split-seq data (bio_374c7f3a6fe2, L46) Prox1 and Vgll4 carry transcription
    start sites the authors call cell-type specific and describe as potentially interesting although the genes
    were not differentially expressed in the companion short-read data, which came from a 36,869-cell pool
    rather than the 464 cells with long reads. Which of the two 72-hour populations the start sites belong
    to appears only in the neighbouring sentence, so a record would have had to infer it. If a writer wants
    named instances of isoform change without gene change, this is the pair, and L46 should be re-read whole
    first.

    '
  why: Named instances are more useful to the chapter than fractions, and this pair was within one sentence
    of being recordable.
- note: 'Two of this pass''s preprint sources have published versions whose numbers should be re-checked before
    the chapter goes out, in addition to the four the file already lists. bio_c92559d26c1b (SCS-151 to SCS-153)
    was read as the 2019 bioRxiv preprint; the corpus lists a 2020 Nature Biotechnology version at 10.1038/s41587-020-0497-0,
    which is what source.doi records, while meta.json carries the preprint DOI 10.1101/817924. bio_374c7f3a6fe2
    (SCS-158 and SCS-159) was read as the 2021 bioRxiv preprint, with a Genome Biology version at 10.1186/s13059-021-02505-w.
    Neither published version is held in the corpus, so the re-check needs an outside copy.

    '
  why: Both carry anchored counts, and the orchestrator needs the same convention it adopted for the Cohen
    and Su records.
- note: 'Assignment 7, whether single-cell and spatial 3-prime end calls agree where the same tissue was measured
    both ways, has no answer in the corpus. Four searches were run for it: spatial alternative polyadenylation
    against single-cell concordance, stAPAminer by name, spatially resolved polyadenylation atlases, and spatial
    against single-cell comparison in the same tissue. What the corpus holds instead is three designs that
    assume or sidestep the comparison. SCS-197 records one of them. bio_802472217144 benchmarks the same tools
    on one 10x Chromium dataset and three 10x Visium datasets against nanopore data sharing barcodes, but does
    not cross-compare the single-cell and the spatial calls. bio_2b5540eb6c78 at L40, L44 and L68 uses single-cell
    data to deconvolve Visium spots and validates one gene''s subtype-specific site, TSPAN8 at chr12:71125071,
    in both assays, but that is one gene in a tumour and the disease case belongs to chapters 6 and 7. SCS-023
    already records the one quantitative cross-assay contrast the file holds, between short-read and long-read
    spatial data of the same tissue.

    '
  why: A negative result worth recording so it is not searched a fifth time, and so the chapter does not imply
    a cross-assay agreement that nobody has measured.
- note: 'For whichever agent owns spatial methods: stAPAminer (PMC10787175) analyses a spatially barcoded mouse
    olfactory bulb section, 11,274 genes on 260 spots, extracting 47,886 poly(A) sites with scAPAtrap at an
    average of 14,436 per spot (L20), and reports 905 differential polyadenylation events in 403 non-redundant
    genes between pairs of morphological layers against 1146 differentially expressed genes (L27), 784 layer-specific
    events of which 69 per cent fell in two layers (L29), and, most usefully, 133 spatially variable polyadenylation
    genes against 772 spatially variable expression genes with only 16 genes in both (L30). spvAPA (PMC11724721)
    is a further supervised method for single-cell and spatial polyadenylation that was found but not opened
    here.

    '
  why: The 133 against 772 with 16 shared is a sharper isoform-against-expression independence figure than
    anything in the chapter, and it is spatial, so it is not mine to record.
- note: 'Two 3-prime end findings read and anchored here that did not fit the record range, so they need no
    re-reading. Kang et al. (PMC10691540 L36) report that during mouse dorsal excitatory and ventral inhibitory
    neurogenesis the 3-prime UTR events largely overlapped between the two lineages and lengthened in neurons,
    while the intronic polyadenylation events in the same analysis showed no preference for the proximal or
    distal site between progenitors and neurons, with Klc1''s proximal site predominant in both neuron classes;
    that is a second instance in one dataset of the two classes behaving unlike each other and belongs with
    SCS-205, SCS-207 and SCS-219. Wen et al. (PMC12401049 L48) compare a proximal-site usage index across pig,
    mouse and human cell types and put brain tissues and neuronal cell types at the long-3-prime-UTR end in
    all three, but the human and mouse values are reused from the scAPAdb database rather than re-derived,
    so it compares pipelines as much as species.

    '
  why: Both bear on assignments the dispatch asked for and both are line-anchored already, so a later pass
    can record them without opening the papers again.
- note: 'Qiang et al. (PMC11736434 L19, L68) report that the peripheral conversion of naive to memory T cells
    was accompanied by a shift toward the proximal 3-prime UTR poly(A) site in named functional genes, among
    them TCF7, NFATC2IP, BCL2, CD5, CD28, GOLT1B and TMEM59. The source gives the direction and the gene names
    but no event count for that transition, which is why it is here rather than in a claim.

    '
  why: It would be a third system in which the chapter could show maturation-associated shortening, if a count
    can be found.
- note: 'Burri and Zavolan (PMC8594477 L5, L16) report, with the same method as SCS-199 and SCS-200, that in
    human lung adenocarcinoma 3-prime UTRs trended shorter not only in the cancer cells against their cell
    type of origin but also in other cell types compared between the tumour and the control tissue environment,
    with high variability in the individual target genes between patients. They also note that T cells, although
    the most numerous cell type in those tumours, contribute less of the total RNA than the less numerous myeloid
    cells, so bulk tumour 3-prime UTR shortening is not simply infiltrating activated T cells.

    '
  why: The second half is a measurement the chapter could use about what a bulk average hides, but the case
    itself is a tumour dataset and so belongs to chapters 6 and 7.
- note: 'Not found: a single-cell study reporting the error rate of its own poly(A) site calls against an experimental
    ground truth. Every evaluation read here uses a proxy, and the proxies disagree. The proxies are a reference
    annotation built from bulk 3-prime end sequencing (SCS-181, SCS-183, SCS-201), a deep-learning sequence
    classifier that reads the same upstream signal the first proxy was selected on (SCS-194), long-read data
    from the same barcodes, whose authors say at bio_802472217144 L33 and L98 that it had to be depth-filtered
    and therefore underestimates precision, and bulk RNA-seq of sorted cell types, which gave the 104 of 581
    confirmation rate in SCS-189. The chapter should not describe any of them as a measured error rate.

    '
  why: The chapter's framing of these numbers turns on which proxy stood in for truth, and SCS-194 against
    SCS-201 shows the proxies give opposite verdicts on the same tool.
- note: 'Jiang et al. (bio_2b5540eb6c78 L18, L56) report a spatially resolved alternative polyadenylation atlas
    of 346,932 events across 52,175 genes, from 363 spatial transcriptomic datasets across 18 human tissues
    and 76 disease states, and state that alternative polyadenylation showed stronger organ specificity than
    gene expression. The gene count exceeds the number of annotated human protein-coding genes, so the denominator
    includes non-coding genes and must be stated as the authors do; the atlas also mixes healthy and diseased
    tissue, and the preprint''s figures should be re-checked against a published version.

    '
  why: A number this large will be tempting and it needs its denominator and its health status stated before
    the chapter can use it at all.
- note: 'Metadata to amend elsewhere in the file, found while checking the Fansler denominator. SCS-025 cites
    PMC11094166 L65, the discussion, for a figure the same paper''s results at L34, figure legend at L29 and
    methods at L117 scope to multi-UTR genes over 234 human and 82 mouse cell types. SCS-025''s claim sentence
    attributes it to an analysis of 474 human and mouse cell types, which is the paper''s overall scope rather
    than that figure''s cohort. SCS-202 records the results-and-methods version, so the orchestrator should
    decide whether SCS-025 is amended or kept as the discussion''s phrasing with SCS-202 as its corrective.
    Separately, SCS-026''s 868 shifts and SCS-199''s 14 terminal exons come from the same Pace et al. dataset,
    which the chapter must say if it prints both.

    '
  why: Two records in one file carrying the same percentage against different denominators, and two carrying
    wildly different counts from one dataset, will read as errors unless the relationship is stated.
- note: 'New preprint sources added here that need re-checking against a published version: bio_802472217144
    (Zhao and Rattray, bioRxiv 2024, SCS-188, SCS-196) and bio_2b5540eb6c78 (Jiang et al., bioRxiv 2025, SCS-201).
    Neither carries a journal DOI in the corpus metadata, unlike the Cohen and Su cases the file''s existing
    leads describe, so for these two the bioRxiv DOI is the only one available and source.doi records it.

    '
  why: Three of the method-disagreement records rest on these two preprints, so their numbers are the ones
    most worth confirming.
- note: 'Agarwal et al. (PMC8385098), the source of SCS-024, was not re-opened on this pass beyond the line
    SCS-024 already cites. It should be grepped for a trajectory or maturity analysis before the chapter leans
    on SCS-218, a neuroblastoma line in vitro, for the relationship between 3-prime UTR length and neuronal
    maturity. If Agarwal carries that relationship in real neurons across developmental stages, it is the better
    source and SCS-218 becomes the in vitro corroboration rather than the evidence.

    '
  why: The chapter would be asserting a developmental relationship from a cancer cell line when a two-million-nucleus
    developmental atlas it already cites may contain it.
- note: 'Spot size is the binding constraint on every spatial isoform claim in this chapter, and the records
    now carry the figures: 55 micrometres per Visium spot with a median of 1,917 UMIs and 974 isoforms in it
    (SCS-221), larger than the average mouse brain cell (SCS-222), against 2 micrometres nominal for Visium
    HD, binned to 8 in practice (SCS-224), and 500 nanometres for Stereo-seq, still with doublets (SCS-223).
    SCS-019 and SCS-022 are spot-level measurements and should be stated as such.'
  why: The chapter states the per-spot caveat once, about one gene; it applies to all of its spatial results.
- note: 'No source found in the searches listed below tests a cell-type deconvolution method on isoform rather
    than gene measurements. The nearest things are SCS-228, which asks instead whether a spatial isoform signal
    survives a composition-matched permutation, and SCS-230, where an isoform''s cell-type origin is inferred
    by correlating gene-level deconvolved proportions with isoform counts across spots. The queries actually
    run were two: ''isoform level deconvolution spatial transcriptomics cell type specific isoform spot'' and
    ''Visium spot diameter 55 micrometers cells per spot resolution limitation spatial transcriptomics''. Both
    fell back to keyword-only matching, as the corpus reported that semantic search was too slow. Named deconvolution
    tools were not searched one by one; SpatialDWLS, STIE, DeSpaST, SWOT and CoexpressDeconvolve surfaced in
    those listings and were not opened, and cell2location and RCTD were never queried by name.'
  why: If the book says a spatial isoform belongs to a cell type, the reader should know the attribution is
    a gene-level model's output, and should know how hard that was looked for.
- note: A probe set's ability to separate two isoforms is bounded by how much private sequence they have. SCS-231
    gives the general limit, SCS-235 the specific charge that a MERFISH-based panel needing 120 nucleotides
    of private sequence cannot reach cassette, mutually exclusive or cryptic exons, and SCS-237 the price of
    the alternative, a single junction probe per isoform, at 27 of 96 probes unusable. SCS-235 is a rival group's
    assessment of SCS-232's method and not independent of their interest; note also that the rival group's
    senior and first authors overlap with the authors of SCS-221, the Visium method whose resolution SCS-222
    criticises.
  why: The chapter should not state imaging as isoform-resolved without saying which kinds of isoform difference
    it resolves, nor present these groups as independent of each other.
- note: 'Preprint and version problems in the sources behind these records. SCS-242 rests on the SPLISOSM preprint,
    the same document as the existing SCS-022 and SCS-023, and the corpus search listing shows a journal version
    at doi 10.1038/s41587-025-02965-6 dated 2026, so SCS-022 and SCS-023 should gain preprint: true and have
    their 61, 150 and 815 counts re-checked against that version. SCS-235, SCS-236, SCS-237 and SCS-259 rest
    on a bioRxiv preprint whose corpus pub_date is the placeholder 2026-01-01 while its doi 10.64898/2026.09.22.753429
    implies posting on 2026-09-22. SCS-253, SCS-254 and SCS-255 were read as the bioRxiv version of the Cdc42
    paper; a published version exists in the corpus as an abstract-only record under a different title, ''Selective
    axonal translation of the mRNA isoform encoding prenylated Cdc42 supports axon growth'', doi 10.1242/jcs.251967,
    2021, which is what source.doi records, and its journal field is RESOLVE_FROM_DOI because the abstract-only
    record carries none. SCS-231 through SCS-234 inherit the preprint-versus-journal problem of the existing
    SCS-020 and SCS-021.'
  why: Numbers move between preprint and journal version, and nine of these records carry anchored quantities.
- note: 'Not found: a spatial isoform measurement of a human tumour section at isoform resolution. The nearest
    holdings are a tumour section used as a test case for gene-level spatially variable gene calling (SCS-243)
    and a mouse heart injury section (SCS-257). Two queries were run, both keyword-only: ''spatial transcriptomics
    tumour section alternative splicing isoform switching spatially variable tumor microenvironment long read''
    and ''spatially resolved isoform switching cancer tissue section 3 prime UTR shortening spatial domains
    tumor''. Neither returned a tumour-section isoform study. Human tumour cell lines were measured at isoform
    level in subcellular fractions, which is a different thing; see the LAFITE entry below.'
  why: Chapters 6 and 7 own the disease cases, but chapter 8 would want to say whether the measurement has
    been made in human tumour tissue at all.
- note: 'Not found: an isoform-resolved measurement of mRNA localisation to the endoplasmic reticulum, and
    an isoform-resolved apical-basal measurement in a mammalian epithelium. The apical case in the corpus is
    Drosophila follicle cells (SCS-247); the mammalian apical-basal and nuclear-retention maps are per gene
    (SCS-249). One query was run for this whole area, keyword-only: ''isoform specific mRNA localization protrusions
    apical basal endoplasmic reticulum epithelial cells subcellular fractionation''. The endoplasmic reticulum
    was not queried on its own, and signal-peptide or proximity-labelling framings were not tried at all, so
    this absence is weak evidence and should be searched again before the chapter asserts it.'
  why: The chapter should scope its statement about non-neuronal isoform localisation to protrusions, ribosome
    fractions, the nucleus and the fly epithelium, which is what the evidence here covers.
- note: 'Surfaced in these searches and not opened, so neither rejected nor absent: PMC9875686 (LAFITE, nuclear
    and cytoplasmic full-length isoforms by direct RNA sequencing in four human lung cancer cell lines) and
    bio_a0c3de8c6eb1 (LABRAT, alternative polyadenylation against transcript localisation) were read only at
    abstract level and would both bear on subcellular isoform localisation; PMC13112436 (benchmarking cell-type-specific
    spatially variable gene detection) and PMC12445034 (systematic benchmarking of spatially variable gene
    methods) would strengthen SCS-243; PMC13725926 (IsoPrism, predicting isoform usage from short-read spatial
    data) bears on SCS-243 and SCS-242; PMC13454440 (mRNA delivery to protrusions) and bio_8c0526bb71f0 (single-cell
    heterogeneity in subcellular localisation) were not checked for isoform resolution. bio_9fdfc98f6da8, on
    Pumilio binding 3'' UTR isoforms to place synaptic proteins, was opened at title level and deliberately
    not recorded because what a UTR difference does belongs to chapter 11. The Tushev and Taliaferro primaries
    that SCS-251 and SCS-255 lean on secondhand were never looked up by title and should be.'
  why: An item-6 synaptic-compartment measurement and a second subcellular-fraction source are both probably
    reachable in one more pass.
- note: 'A platform-sensitivity comparison sits on bio_c5d1158a6fe7 line L12 that is deliberately not recorded
    here because chapter 5 owns platform comparison: junction-probe imaging returned about 37-fold more isoform-level
    molecules per gene than long-read Visium HD over the 45 genes on its panel, from 1.6 million isoform-resolved
    transcripts against 36 million isoform-assigned UMIs from 456 million Nanopore reads. If chapter 5 wants
    it, the anchor is bio_c5d1158a6fe7#L12.'
  why: It is the strongest sensitivity comparison between imaging and sequencing for isoforms in the corpus
    and it should not be lost for being out of this chapter's scope.
- note: 'Four counts of spatially variable isoform use in mouse brain now sit in the research file and are
    not comparable: 61 and 150 from SCS-022 (long-read Visium spots, SPLISOSM), 815 from SCS-023 (short-read
    spatial, 3'' end usage), roughly 1,400 genes from SCS-021 (MERFISH single cells) and 282 isoforms in 161
    genes from SCS-239 (Stereo-seq segmented cells, Moran''s I). Any table putting them side by side must state
    the platform, the unit and the test for each, as SCHEMA.md requires for counts from different projects.'
  why: Four numbers for apparently the same quantity will read as an error unless the chapter says what each
    one counts.
- note: 'The gap the file''s leads record as not found is in the corpus after all. A single-cell isoform study
    of mutually exclusive exon clusters in a vertebrate exists as two abstract-only records, now SCS-281 (protocadherin
    alpha variable exons in single mouse Purkinje cells, allele-resolved, 2005) and SCS-282 (the same cluster
    plus the gamma cluster, with C-type exons biallelic and the alternate exons monoallelic, 2006), plus a
    reanalysis of published single-cell data in SCS-283 and SCS-284. What they report is monoallelic and combinatorial
    choice of several variable exons per cell, not one exon per cell, and SCS-283 puts the number at about
    three of fourteen. The two primaries are not independent: the reference list of PMC4151104 gives their
    first authors as Esumi and Kaneko at L106 and L107 and, at L138, lists the split single-cell RT-PCR protocol
    they both use under Esumi, Kaneko, Kawamura and Yagi, so both come from the Yagi laboratory. Neither abstract
    holds an author list or journal in the corpus, so both carry RESOLVE_FROM_DOI. What is still genuinely
    absent is a UMI-counted, molecule-resolved single-cell measurement of protocadherin alpha variable-exon
    choice; SCS-283 is the closest and reads transcripts per million.

    '
  why: Turns a reported negative into a positive with a known weakness, settles the independence question for
    both records, and keeps the real gap visible.
- note: 'The second gap is half closed and should be restated. SCS-275 is an explicit partition of single-cell
    isoform-ratio variance into technical noise, random partitioning of molecules and a per-cell preference,
    with simulation controls, and it is in the source already cited as SCS-011. It is UMI-counted 3-prime end
    sequencing, not a long-read platform, it concerns poly(A) choice rather than internal splicing, and it
    reports a non-zero variance parameter rather than a share of total variance. SCS-291 reaches the nearest
    thing on the splicing axis using spike-in calibration but reports a count of genes. SCS-295 is a UMI-corrected
    long-read decomposition of within-cell against between-cell heterogeneity that does not separate technical
    from biological variance at all. So the lead should now read: no study was found that expresses the biological
    component of single-cell isoform variance as a share of the total.

    '
  why: The old wording would make the chapter assert an absence that three records contradict.
- note: 'No published rebuttal to the coverage-artefact argument of SCS-013 was found, and here is exactly
    how far the search went. A corpus-wide grep for that paper''s title matched 45 documents; the roughly thirteen
    inspected were all reference-list entries, and a title grep can only find reference lists. A separate body-text
    grep for "binary splicing" across 85 documents surfaced no passage disputing the argument. An LLM pass
    over the 45 citing documents asking which test or dispute the claim was NOT run, so the negative is a grep-level
    negative, not an exhaustive one. What exists instead is the depth control inside the study whose conclusion
    the model argues against (SCS-266), which predates it; one result pointing the other way (SCS-268, where
    per-cell dominance is defended as real at 50 copies per cell); and three molecule-counted results that
    agree with it (SCS-280, SCS-290 and SCS-009 already in the file).

    '
  why: An unscoped "no rebuttal exists" would fail review; this is the scope the searches actually cover.
- note: 'The two-camps framing of the chapter''s central dispute needs a correction that SCS-278 supplies.
    The authors of SCS-011 state in their own discussion that the single-molecule imaging study now recorded
    as SCS-271 found an excess over random partitioning that was modest and quantitatively similar to their
    own, and that it was the transcriptomic study now recorded as SCS-266 that reported much more widespread
    bimodality. So the quantitative studies broadly agree on a small real per-cell preference, and the contested
    claim is the all-or-nothing appearance, which is what SCS-013 attacked and what SCS-280, SCS-290 and SCS-295
    explain in three different ways. A chapter that sets SCS-011 against SCS-271 as opposing camps would be
    contradicted by SCS-011''s own text.

    '
  why: This is the single most load-bearing framing correction in this return.
- note: 'Independence problems inside the dispute, to be stated rather than smoothed. Nir Yosef is an author
    both of the 2013 report of bimodal single-cell splicing (SCS-266, SCS-267) and of the 2020 argument that
    the appearance is a coverage artefact (SCS-013), which cites that report at L16 as one of the studies it
    argues against, though not as one of the datasets it reanalyses. Three of the four authors of SCS-293 wrote
    SCS-013. The bursting parameters used to rule bursting out in SCS-265 come from a 2019 dataset that paper
    names at L135 and lists at L237 with Sandberg as last author, the laboratory of SCS-286. SCS-274 to SCS-278
    are the same document as SCS-011 and SCS-012, SCS-295 and SCS-296 the same as SCS-009 and SCS-010, SCS-297
    the same as SCS-030, and SCS-281 and SCS-282 share the Yagi laboratory. The mutually independent measurements
    are SCS-268 and SCS-269 (Marinov), SCS-270 to SCS-273 (Waks), SCS-279 (Yap), SCS-280 (Tian), SCS-283 and
    SCS-284 (Iakovlev), SCS-287 (nascent-RNA imaging), SCS-290 to SCS-292 (Welch), SCS-294 (Horn) and SCS-299
    (Faigenbloom).

    '
  why: Brief 3 records that claims about the evidence, not about the biology, are where this book's defects
    are found.
- note: 'Two sources rest on preprints whose numbers should be rechecked against a published version. SCS-280
    (Tian et al.) was read as bioRxiv 2020 and the corpus holds only the preprint DOI although a journal version
    exists; the binomial-null result and the downsampling fraction are at risk. SCS-283 and SCS-284 (Iakovlev
    et al.) were read as the bioRxiv version while source.doi records the 2021 Frontiers in Cell and Developmental
    Biology DOI that the corpus search listing supplies, following the convention already used for SCS-020;
    the 3.2-of-14 and 3.0-of-12 figures are the ones to recheck.

    '
  why: Numbers move between preprint and journal version, and both carry anchored quantities.
- note: 'Depth is the whole argument here and the literature does not report it in one unit. Molecules per
    cell per gene exist only in SCS-270 and SCS-277 (imaging), SCS-274 (UMI 3-prime sequencing) and SCS-268
    (spike-in-calibrated copies). SCS-286 and SCS-298 give molecules per cell summed over all genes. SCS-266
    gives transcripts per million and reads per cell, SCS-292 and SCS-297 reads per cell, SCS-291 an RPKM threshold,
    SCS-295 the number of sites that kept a confident estimate, and SCS-281, SCS-282, SCS-285, SCS-287, SCS-288,
    SCS-289 and SCS-299 give nothing. SCS-263 and SCS-293 estimate molecules from transcripts per million rather
    than counting them. Any table that lines these up must print the unit, because molecules in the cell, molecules
    captured, reads per cell and transcripts per million are four different claims. The three molecule figures
    that do exist are also three different quantities and must not be presented as one threshold: 44 molecules
    in the cell is the detection odds of seeing both isoforms (SCS-262), about 100 copies per cell is an empirical
    crossover the authors read as biological (SCS-268), and 200 molecules per cell is where a model''s intrinsic
    noise becomes negligible (SCS-294).

    '
  why: A table that mixes those units would read as a comparison when it is not one.
- note: 'The persistence question is now answered, and the earlier lead saying otherwise should be replaced.
    SCS-287 is real-time single-molecule imaging of nascent RNA at endogenous human genes reporting that the
    same intron in the same cell is removed with widely varying kinetics from one transcript to the next, which
    the authors call inconsistent with deterministic splice site selection. With SCS-285 in Drosophila and
    SCS-265 statistically, three independent lines now point away from the persistence suggested in SCS-012,
    and no measurement supporting persistence beyond SCS-012''s own nuclear transcription-site observation
    was found. Still not found: an imaging measurement of successive rounds of poly(A) site choice at one mammalian
    locus, which is what SCS-012 specifically proposes. Searched by exact-title abstract lookup as well as
    by keyword: live-cell splicing reporters with memory, kinetic competition in the transcription cycle, single-molecule
    tracking of the transcription cycle, and transcriptional bursting with isoform choice.

    '
  why: The chapter can now report a measured answer where it previously had only a hypothesis.
- note: 'Bibliographic metadata in this file was read from each document''s meta.json and from the corpus search
    listings, never from crossref, so metadata_source is omitted on the thirteen newly introduced sources and
    left as crossref only on the four whose fields were copied from records already in the file (SCS-013, SCS-011,
    SCS-009 and SCS-030). Five sources are abstract-only records that carry no author list and no journal,
    and they take RESOLVE_FROM_DOI with title-derived bibkeys: SCS-281, SCS-282, SCS-285, SCS-288 with SCS-289,
    SCS-287 and SCS-298. The orchestrator should run scripts/resolve_metadata.py over this file before the
    chapter is written.

    '
  why: A byline supplied from memory looks authoritative and can credit the wrong people, which is the one
    metadata error nothing downstream can detect.
- note: 'Dropped for want of a record id rather than for want of evidence, and worth adding if the range is
    extended. Larsson et al. (PMC7978379) at L37 and L38 simulate 4,905 autosomal genes with identical kinetics
    on both alleles and find that pooling few cells produces frequent false calls of allelic imbalance, concentrated
    in the lowly expressed genes; the scope is a pooled population rather than a single cell, which is why
    it lost its place to SCS-287, but it belongs in the chapter''s limits section as a bound on reading ratios
    off small numbers of cells.

    '
  why: So a judgement made under an id budget is visible to the orchestrator rather than looking like an oversight.
- note: 'Neighbouring work seen but not opened, and not claimed as absent. PMC6371455 (Linker et al. 2019)
    profiles expression and DNA methylation in the same single cells and is the study SCS-013 cites as the
    methylation explanation for stochastic splicing variability; it is the obvious next source for whether
    a per-cell epigenetic covariate explains any of the variance, and nothing here speaks to it. MARVEL (PMC10018366)
    was quoted by a corpus evidence call as defending the bimodality of the lowly expressed PKM gene on the
    strength of published smFISH, which bears directly on SCS-295, where PKM is the gene that looks exclusive;
    it was not opened.

    '
  why: Two specific, named follow-ups, so the next agent does not rediscover them.
- note: 'Rejected on the one-home rule rather than on evidence. ISSAC (med_a56541e36ff0) maps cell-state-dependent
    splicing QTLs in human prefrontal cortex and reports 369 cell-state-dependent cis-sQTLs along eight expression
    components, the closest thing found to separating a regulated from a stochastic component with a named
    covariate, but isoform-level QTLs belong to chapters 5 and 10. SpliceRCA (PMC6026782) images CD45 splice
    variants in situ in single cells and would have suited the designed-measurement item, but the finding in
    its abstract is that CD45RO and CD45RB are coregulated on T-cell activation, which is a cell-state programme
    another agent owns, and no per-cell molecule count or detection efficiency was found there. BRIE2 (PMC8393734)
    and ISOP were read only at abstract level and are methods without a per-cell depth claim.

    '
  why: So none is searched again, and so the orchestrator can reassign them if the boundaries move.
