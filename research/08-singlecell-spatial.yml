leads:
- note: 'Direct conflict the chapter must present as such: SCS-001 (Olivieri 2021) reports a monocyte
    subpopulation found only by splicing, while SCS-007 (Benegas 2022) reports that in their hands splicing
    clustering never surfaced a subpopulation expression clustering had missed. Note also how thin the
    SAT1 evidence is: the artefact control on Olivieri L314 rests on 16 cells that had exactly two reads
    at the splice site. Attribute both and do not pick a winner.

    '
  why: The single most load-bearing claim of this chapter has a published counter-result.
- note: 'Unresolved conflict that the chapter must present as a conflict, not a settled fact: does a single
    cell express one isoform or a mixture? SCS-011/SCS-012 (Velten, poly(A) sites, 2015) and the bimodality
    reports the review in SCS-014 summarises say cells have distinct per-cell preferences; SCS-013 (Buen
    Abad Najar 2020) says the appearance is a coverage artefact; SCS-009 (Longcell 2025, long reads, UMI-deduplicated)
    says same-cell co-expression is common for well-expressed genes; SCS-010 shows exclusive per-cell
    choice for one gene in the same dataset. The honest reading is that the answer is gene-dependent and
    still measurement-limited.

    '
  why: This is the chapter's central open question; picking a side would misrepresent the literature.
- note: 'Second conflict, on whether 3-prime-end protocols are structurally blind to internal splicing.
    SCS-031 (Olivieri, 10x Chromium) and SCS-032 (IDEIS, 10x 3-prime) say yes in practice; SCS-034 (Saferali,
    ScaleBio combinatorial indexing) measured no decay in junction recall towards the 5-prime end. These
    are different chemistries with different gene-body coverage profiles, so any table or statement in
    the book must name the chemistry rather than say "3-prime protocols".

    '
  why: A blanket claim about 3-prime blindness would be wrong for at least one widely used platform.
- note: 'Fansler et al. state in their discussion (L65) that the dominant isoform switches in 60 per cent
    of human genes, but the figure that result points to is captioned as a fraction of multi-UTR genes,
    and the same paper classifies only about 50 per cent of human genes as multi-UTR (L32). The 60 per
    cent figure is therefore most likely a fraction of multi-UTR genes, not of all genes. Record it as
    the authors phrase it and flag the denominator rather than silently rescaling.

    '
  why: A book table that prints 60% of all human genes would propagate the paper's own looseness.
- note: 'Four of the records here are preprints whose figures and numbers should be re-checked against
    a published version before the chapter goes out: SCS-020/SCS-021 (Cohen et al., read as bioRxiv 2025,
    corpus lists a 2026 Cell DOI which is what source.doi records), SCS-022/SCS-023 (Su et al., SPLISOSM,
    bioRxiv 2025), SCS-005/SCS-006 (Mantri et al. 2026) and SCS-033/SCS-034 (Saferali et al. 2026). The
    Mantri and Saferali records also carry placeholder pub_date values in the corpus metadata (2026-01-01);
    the real posting dates are 2026-09-11 and 2026-09-22 per their DOIs. For SCS-020/SCS-021 the orchestrator
    must decide a convention: source.doi carries the journal (Cell) DOI taken from the corpus search listing,
    while journal/year/bibkey still describe the bioRxiv version whose lines were actually read.

    '
  why: Numbers move between preprint and journal version; two of these carry anchored quantities.
- note: 'The PTPRC/CD45 story is usually told as "T-cell subsets are indistinguishable at gene level but
    separable by isoform". The corpus supports the second half precisely (SCS-003, SCS-004) but no line
    read here states that the subsets are indistinguishable by PTPRC gene expression - in fact these subsets
    are separable by other marker genes. The chapter should say that PTPRC isoform usage adds subset information
    that PTPRC gene counts do not carry, not that the cells are otherwise identical.

    '
  why: The stronger phrasing would be unanchored and is probably false as written.
- note: 'Not found in the corpus searches run here: a single-cell isoform study of the Dscam-style mutually
    exclusive exon clusters in a vertebrate (protocadherin alpha choice in individual neurons). If such
    a paper exists it would be the cleanest possible case of stochastic exclusive isoform choice per cell.

    '
  why: Would anchor the stochastic-choice section on a system where exclusivity is the known mechanism.
- note: 'Also absent from these searches: a study that puts a number on how much of the isoform variance
    between single cells of one annotated type is technical versus biological, after UMI deduplication,
    on a long-read platform. SCS-009 and SCS-010 come closest but report direction, not a variance partition.

    '
  why: The chapter's honest-limits section would be stronger with one such decomposition.
