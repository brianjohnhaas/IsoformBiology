- id: VAR-291
  claim: Evidence strength for a minigene splicing result has been derived rather than assigned, and the two
    ends of the scale are where it can be derived. In the panel of that calibration that excludes canonical
    splice-site dinucleotide variants, built from 83 benign or likely benign and 28 pathogenic or likely pathogenic
    ClinVar-classified variants (111 in all), 27 of the 28 pathogenic variants expressed 80 per cent or more
    predicted loss-of-function transcript, a likelihood ratio of 80.04 (confidence interval 11.39 to 562.24),
    pathogenic strong, plus 4 points, while 76 of the 83 benign variants expressed 20 per cent or less, likelihood
    ratio 0.02 (0.00 to 0.30), benign strong, minus 4 points; including the dinucleotide variants, which raises
    the set to 249, moves neither strength, giving 78.00 (11.11 to 547.44) and 0.01 (0.00 to 0.05). Observed
    and retrospective, against ClinVar classifications of October 2025.
