      quote: >
        revealing 17,119 ieQTLs, of which 70.6% (12,094/17,119) were undetected by a gene-level analysis
    confidence: high
    figure_idea: >
      Two genotype-stratified panels for one gene: on the left, gene-level
      expression flat across the three genotypes; on the right, two isoforms of
      that gene moving in opposite directions. Same data, one analysis calls
      the variant silent.

  - id: VAR-019
    claim: >
      Within the B-cell isoform QTL set, 1,135 variants had significantly
      different effect sizes on different isoforms of the same gene and 153
      pushed two isoforms in opposite directions - the configuration that
      cancels out exactly when isoform counts are summed into a gene total.
    topic: differential and opposite-direction isoform QTLs
    source:
