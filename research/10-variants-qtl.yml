- id: VAR-005
  claim: 'The 2016 study that named splicing as a primary link between genetic variation and disease, in Yoruba
    lymphoblastoid cell lines, reported 2,893 splicing QTLs, most of them changing gene-level expression little
    or not at all, and judged their aggregate contribution to complex traits roughly equal to that of variants
    acting on expression levels - an early and influential statement of this chapter''s central argument.

    '
