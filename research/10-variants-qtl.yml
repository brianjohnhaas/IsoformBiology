    evidence:
      text_access: full_text
      lines: L67
      anchor: https://paperclip.gxl.ai/citations/papers/PMC9842386#L67
      quote: >
        Splice QTLs are consistently found to explain less phenotypic variance than eQTLs
    confidence: high

  # ---------------------------------------------------------------- isoQTLs
  - id: VAR-017
    claim: >
      Nanopore full-length transcript sequencing of 67 immortalised B cell
      lines from healthy Japanese donors found 17,119 isoform-level expression
      QTLs, of which 12,094 - 70.6 per cent - were invisible to the gene-level
      analysis run on exactly the same reads.
    topic: long-read isoform eQTLs undetectable at gene level (human B cells)
    source:
      doc_id: PMC12060498
      title: "Long-read sequencing reveals novel isoform-specific eQTLs and regulatory mechanisms of isoform expression in human B cells"
      authors: "Nagura, Y., Shimada, M., Kuribayashi, R., Ikemoto, K., Kiyose, H., Igarashi, A., Kaname, T., Unoki, M., Fujimoto, A."
      journal: "Genome Biology"
