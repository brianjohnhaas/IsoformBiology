leads:
  - note: >
      Li, Knowles & Pritchard's 2016 Science paper arguing that RNA splicing is
      a primary link between genetic variation and disease could not be located
      in the corpus by title lookup or by search; only the 2018 LeafCutter
      methods paper is present. The chapter's keystone splicing-heritability
      claim is therefore anchored here on Qi 2022, GTEx v8 and LeafCutter
      rather than on that paper.
    why: >
      It is the most-cited single statement of the chapter's central argument
      and a human should cite it directly, with its own numbers, rather than
      inherit them secondhand.
  - note: >
      GTEx v8 exists in the corpus only as the 2019 bioRxiv preprint
      (doi 10.1101/787903); meta.json carries no journal DOI. Every v8 number
      recorded here was read from the preprint lines cited.
    why: >
      Counts and percentages shifted between preprint and the published
      consortium paper in other GTEx releases; each v8 figure must be
      re-checked against the journal version before it enters the book, and the
      reference replaced.
  - note: >
      VAR-015 (molecular-QTL share of SNP heritability) and VAR-034/VAR-035
      (ClinGen SVI splicing recommendations) are anchored on medRxiv preprints.
      Both have published journal versions in the wider literature.
    why: >
      Heritability fractions and guideline wording are exactly the kind of
      number that changes in peer review; the book should cite the journal
      versions.
  - note: >
      Three different quantities are circulating under the loose heading of
      "how much splicing explains": the fraction of GWAS loci that colocalize
      with an sQTL (23 per cent in GTEx v8), the fraction of sQTLs that are
      distinct from eQTLs (61 per cent in brain by COLOC PP3, versus 52 per
      cent overlap at the gene level in GTEx v7 by transcript-ratio mapping),
      and the fraction of SNP heritability captured by QTL annotations (about
      20 per cent for all molecular QTLs jointly in blood).
    why: >
      Any table in the chapter that lines these up without naming the metric
      and the method will read as a contradiction. Connally et al. explicitly
      judge splicing QTLs to explain less variance than expression QTLs
      (VAR-016), which is a real disagreement and not a rounding difference.
  - note: >
      The B-cell isoform-QTL study also reported that minigene assays validated
      splice-altering ieQTLs to which splicing-prediction software had assigned
      low scores. That comparison was deliberately not recorded as a claim
      because splice-prediction tool performance belongs to the
      neuro/Mendelian chapter.
    why: >
      If that chapter wants an independent, QTL-derived check on prediction
      tools, the data is at PMC12060498 lines L41 and the following minigene
      sections.
  - note: >
      Not found in this pass: a primary long-read isoform-QTL study in primary
      (non-immortalised) human immune cells, and a clinical isoform-level
      biomarker deployed as a validated assay rather than as a research
      finding. Single-cell long-read lung and cattle isoform-QTL preprints
      surfaced in search but were not read.
    why: >
      The chapter's clinical half would be stronger with one isoform-level
      biomarker that is actually an assay; the B-cell study's use of
      immortalised lines is a caveat a reader will raise.
