  # ---------------------------------------------------------------- sQTLs
  - id: VAR-006
    claim: >
      GWAS catalog variants in GTEx v8 were enriched 1.46-fold among cis-eQTLs
      and 1.86-fold among cis-splicing QTLs, so a splicing QTL is the rarer
      annotation but the one more likely to be trait-associated when present.
    topic: GWAS enrichment of eQTLs versus sQTLs
    source:
