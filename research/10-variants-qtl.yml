  claim: 'When a set of 220 genes was nominated as causal for a complex trait on non-expression grounds
    - coding variants in the gene or in its Mendelian counterpart - colocalization of the GWAS signal
    with a GTEx eQTL implicated only 18 of them, 8.2 per cent, which the authors note is not clearly better
    than chance.

    '
