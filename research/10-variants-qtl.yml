      lines: L133
      anchor: https://paperclip.gxl.ai/citations/papers/bio_f292f4666c1a#L133
      quote: >
        Of the 5,385 GWAS loci, 43% and 23% were colocalized with a cis -eQTL and cis -sQTL, respectively
    confidence: high
