  # ---------------------------------------------------- heritability conflict
  - id: VAR-015
    claim: >
      In blood, variants annotated as expression, splicing or protein QTLs make
      up around one per cent of all SNPs yet capture on average a fifth of
      SNP-based heritability across 27 complex traits, with the splicing and
      protein classes carrying more weight than their numbers suggest once
      sample size and genome coverage are equalised.
    topic: share of SNP heritability captured by molecular QTL annotations (SBayesRC)
    source:
      doc_id: med_c1a89028787d
      title: "Transcriptional and translational genetic control in blood contributes significantly to complex trait heritability and polygenic prediction"
      authors: "Liu, S., Qian, X., Wu, Y., Zheng, Z., Goddard, M. E., Yang, J., Visscher, P. M., Zeng, J."
      journal: "medRxiv"
      year: 2025
      doi: 10.1101/2025.05.24.25328265
      bibkey: liu2025transcriptional
    evidence:
      text_access: full_text
      lines: L18
      anchor: https://paperclip.gxl.ai/citations/papers/med_c1a89028787d#L18
      quote: >
        capture on average 20% of SNP-based heritability and 34% of prediction accuracy, with particularly strong contributions for blood-related traits
    confidence: medium

  - id: VAR-016
    claim: >
      The literature does not agree on how much trait variance splicing
      explains: the authors of the colocalization audit dismissed splicing QTLs
      as a candidate explanation for their negative result on the grounds that
      splicing QTLs consistently explain less phenotypic variance than
      expression QTLs - the opposite emphasis from the brain sQTL and
      blood molQTL analyses.
    topic: CONFLICT - relative trait variance explained by splicing versus expression
    source:
      doc_id: PMC9842386
      title: "The missing link between genetic association and regulatory function"
      authors: "Connally, N. J., Nazeen, S., Lee, D., Shi, H., Stamatoyannopoulos, J., Chun, S., Cotsapas, C., Cassa, C. A., Sunyaev, S. R."
