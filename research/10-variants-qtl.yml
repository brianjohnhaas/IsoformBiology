- id: VAR-293
  claim: 'Those authors also state why a calibration of RNA evidence against database classifications can mislead
    in four specific ways: a spliceogenic variant is not necessarily pathogenic, a non-spliceogenic variant
    is not necessarily benign, ClinVar pathogenic and likely pathogenic controls may themselves have been classified
    using splicing data, which makes a retrospective calibration circular, and ClinVar likely benign controls
    can reach that class with no clinical data at all, from variant type, position and prediction alone.'
