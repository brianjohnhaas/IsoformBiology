  claim: 'How much decay inhibition changes the number a threshold would be applied to has been measured: in
    fibroblasts from a patient with the deep-intronic POLR3A c.1909+22G>A variant, targeted long-read sequencing
    put partial retention of intron 14 at about 1.1 per cent of coverage at that locus against 0.4 per cent
