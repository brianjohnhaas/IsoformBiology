- id: VAR-312
  claim: 'One laboratory states plainly that it applies no quantitative threshold: although thresholds for
    abnormal splicing have been suggested within the ACMG criteria, that series set no criterion of its own
    for how much abnormal splicing was required, judged each case on all available evidence, upgrading several
    variants to likely pathogenic on a small aberrant fraction - for one BLTP1 variant because complete loss
    of function is not compatible with life, for a MIB1 variant at about 50 per cent abnormal splicing because
    the missense change itself was likely to perturb the protein, and for seven NF1 variants on the strength
    of a recognisable phenotype.'
