    confidence: high

  - id: VAR-011
    claim: >
      Splicing QTLs and expression QTLs sit in different places in the gene:
      the splicing set was preferentially enriched at splice acceptor and donor
      sites and at RNA-binding-protein footprints, while the expression set was
      enriched at transcription start sites and lay closer to them.
    topic: positional and functional contrast between sQTLs and eQTLs
    source:
      doc_id: PMC9470536
      title: "Genetic control of RNA splicing and its distinct role in complex trait variation"
