  claim: The same calibration leaves a hole in the middle of the scale. Excluding canonical dinucleotide variants,
    the band above 20 and below 50 per cent held 5 benign and no pathogenic reference variants, likelihood
    ratio 0.26 (0.02 to 4.62), and the band from 50 to below 80 per cent held one of each, likelihood ratio
    2.96 (0.19 to 45.84); including the dinucleotide variants the two bands held 5 against 2 and 1 against
    7 variants, likelihood ratios 0.20 and 3.50. Those authors judge the confidence in all four estimates too
    low and suggest applying no evidence for both bands rather than the supporting or moderate strength the
    point estimates would give.
