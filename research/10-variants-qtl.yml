- id: VAR-311
  claim: 'The reasons a patient-RNA assay has to be abandoned are enumerable: in the 202-variant diagnostic
    series, exon trapping was used in 23 cases because no tissue with sufficient detectable expression could
    be obtained, the GTEx median transcripts-per-million being too low or too variable for genes such as ALK,
    RYR1, MYH6, MYH8 and SLC6A1; because an RNA-sequencing finding needed independent support; or because the
    effect was uncertain in tissue RNA, often for want of a heterozygous single-nucleotide polymorphism to
    phase it.'
  topic: how often an RNA result settles nothing
