    confidence: high

  - id: VAR-025
    claim: >
      Grouping transcripts by shared coding sequence before testing turns a
      splicing QTL into a statement about protein structure: in six human
      immune cell subsets this yielded 369 to 601 protein-altering
      isoform-ratio QTLs per subset, and targeted long-read capture sequencing
      then resolved 29 full-length isoforms with previously unannotated coding
      sequence that were linked to GWAS traits.
