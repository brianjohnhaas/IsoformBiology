leads:
- note: 'Li et al. 2016 (Science) IS in the corpus, as an abstract-only record with the numeric doc_id
    59002764 (pmid 27126046, pmcid PMC5182069, which does not itself resolve). VAR-005 cites it as abstract_only.
    Its meta.json has no author list; the author and page details in VAR-005 were taken from reference
    17 of PMC5742080 (L104), not from the paper''s own record.

    '
  why: 'This is the chapter''s keystone citation and must appear in references.bib with a correct full
    author list. A human should fill that in from the DOI. Anything in the paper beyond the abstract -
    how the 2,893 sQTLs were called, the heritability comparison with eQTLs - cannot be asserted from
    this record.

    '
- note: 'GTEx v8 exists in the corpus only as the 2019 bioRxiv preprint (doi 10.1101/787903); its meta.json
    carries no journal DOI. Every v8 figure recorded here (VAR-004, VAR-006, VAR-007, VAR-008, VAR-024)
    was read from the preprint lines cited.

    '
  why: 'Counts and percentages shifted between preprint and published consortium papers in other GTEx
    releases. Each v8 figure must be re-checked against the journal version before it enters the book,
    and the reference replaced. The orchestrator should resolve the journal DOI centrally so siblings
    citing the same preprint use one bibkey.

    '
- note: 'Five claims rest on preprints: VAR-014 (per-class SNP heritability, medRxiv), VAR-027 and VAR-028
    (ClinGen SVI splicing recommendations, medRxiv), and VAR-020/VAR-021 (isoform-level cancer TWAS, medRxiv).
    All are marked confidence: medium.

    '
  why: 'Heritability fractions, guideline wording and TWAS association counts are exactly the quantities
    that change in peer review. Published versions exist in the wider literature for at least the guideline
    paper.

    '
- note: 'Four different quantities circulate under the loose heading of "how much splicing explains",
    and the chapter must not line them up without naming the metric: the fraction of GWAS loci colocalizing
    with an sQTL (23 per cent, GTEx v8, enloc); the fraction of sQTLs distinct from eQTLs (61 per cent
    in brain by COLOC PP3 > 0.8, versus 52 per cent gene-level overlap in GTEx v7 by multivariate transcript-ratio
    mapping); the share of SNP heritability captured by a QTL annotation (13.9 per cent eQTL, 2.8 per
    cent sQTL in blood, SBayesRC); and the share of heritability mediated by assayed expression (11 per
    cent, MESC).

    '
  why: 'Connally et al. explicitly judge splicing QTLs to explain less variance than expression QTLs (VAR-015)
    while Li 2016 (VAR-005) puts them on a par and GTEx reads its own enrichments as favouring eQTLs in
    aggregate (VAR-007). This is a real disagreement about different estimands, not a rounding difference,
    and must be recorded as such.

    '
- note: 'The "gene-level-invisible fraction" also differs by design and must not be averaged: 70.6 per
    cent of isoform-abundance QTLs in 67 long-read B-cell samples (VAR-016) against 20 per cent of isoform-ratio
    QTLs in 2,622 short-read blood samples (VAR-019). Abundance QTLs and ratio QTLs are different phenotypes,
    and the two studies differ by a factor of forty in sample size.

    '
  why: 'This is the single number a reader will quote from the chapter. Presenting either figure alone,
    or a blend, would misrepresent both studies.

    '
- note: 'The B-cell isoform-QTL study also reported that minigene assays validated splice-altering ieQTLs
    to which splicing-prediction software assigned low scores (PMC12060498, L41 and the following minigene
    sections). Not recorded as a claim because splice-prediction tool performance belongs to the neuro/Mendelian
    chapter.

    '
  why: 'That chapter may want an independent, QTL-derived check on prediction tools; this is where the
    data is.

    '
- note: 'Searched but not recorded as claims. (a) Cost and turnaround for clinical RNA-seq: the clearest
