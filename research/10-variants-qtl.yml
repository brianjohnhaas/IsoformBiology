- id: VAR-308
  claim: 'The eligibility funnel bounds what RNA evidence can ever reach: of 1,987 unique variants reported
    from clinical exome sequencing at one laboratory, 7.6 per cent (152) met all four criteria for RNA analysis
    at once - a putative splicing effect, sufficient expression in blood, a loss-of-function disease mechanism
    and a characterised gene - and 54 of those 152 were variants of uncertain significance, which is 5.2 per
    cent of the 1,035 uncertain variants reported. Of the nine cases actually recruited for RNA testing, 5
    of 7 uncertain variants were upgraded and 2 remained uncertain. Observed retrospective audit.'
  topic: how often an RNA result settles nothing
