  claim: 'Where a classification matters most, the system had often not reached it: among 36 oligonucleotide-amenable
    mutational events found in a 235-patient ataxia-telangiectasia cohort, only 22 per cent (8 of 36) had previously
    been classified pathogenic or likely pathogenic in ClinVar as that study read it, 50 per cent (18 of 36)
    stood as likely benign, uncertain or conflicting, and 28 per cent (10 of 36) were absent from ClinVar altogether,
    against about 17 per cent absent among non-amenable variants. Observed database status, not a reclassification.'
