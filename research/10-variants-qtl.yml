claims:
  # ---------------------------------------------------------------- eQTL gap
  - id: VAR-001
    claim: >
      When a set of 220 genes was nominated as causal for a complex trait on
      non-expression grounds - coding variants in the gene or in its Mendelian
      counterpart - colocalization of the GWAS signal with a GTEx eQTL
      implicated only 18 of them, 8.2 per cent, which the authors note is not
      clearly better than chance.
    topic: eQTL-GWAS colocalization gap (gene-based test, coloc/JLIM/eCAVIAR)
    source:
      doc_id: PMC9842386
      title: "The missing link between genetic association and regulatory function"
      authors: "Connally, N. J., Nazeen, S., Lee, D., Shi, H., Stamatoyannopoulos, J., Chun, S., Cotsapas, C., Cassa, C. A., Sunyaev, S. R."
      journal: "eLife"
      year: 2022
      doi: 10.7554/eLife.74970
      bibkey: connally2022missing
    evidence:
      text_access: full_text
      lines: L41
      anchor: https://paperclip.gxl.ai/citations/papers/PMC9842386#L41
      quote: >
        Accounting for overlap, this represents only 18/220 putatively causative genes (8.2%) or 18/147 (12.2%) putatively causative genes near GWAS peaks
    confidence: high
    figure_idea: >
      A funnel: all nominated causal genes, then those with a nearby GWAS peak,
      then those with an eQTL in a relevant tissue, then those whose GWAS and
      eQTL signals actually colocalize. The collapse happens at the last step,
      not the earlier ones.

  - id: VAR-003
    claim: >
      The failure to link GWAS signals to expression is not a shortage of
      eQTLs: more than nine in ten of the candidate causal genes had a
      detectable eQTL in at least one trait-relevant tissue, so the eQTL and
      the GWAS peak sit in the same locus yet point at different variants.
    topic: eQTL availability versus colocalization
    source:
      doc_id: PMC9842386
      title: "The missing link between genetic association and regulatory function"
      authors: "Connally, N. J., Nazeen, S., Lee, D., Shi, H., Stamatoyannopoulos, J., Chun, S., Cotsapas, C., Cassa, C. A., Sunyaev, S. R."
      journal: "eLife"
      year: 2022
      doi: 10.7554/eLife.74970
      bibkey: connally2022missing
    evidence:
      text_access: full_text
      lines: L41
      anchor: https://paperclip.gxl.ai/citations/papers/PMC9842386#L41
      quote: >
        134 (91.1%) of these genes had an eQTL in at least one relevant tissue at a false discovery rate (FDR) of Q < 0.05
    confidence: high

  - id: VAR-004
    claim: >
      Among loci where a fine-mapped GWAS variant fell inside a candidate
      regulatory element in a trait-relevant tissue, only one in five could be
      shown to act through gene expression in the matched eQTL data - the
      regulatory evidence and the expression evidence disagree about the same
      variants.
    topic: regulatory annotation versus measured expression effect
    source:
      doc_id: PMC9842386
      title: "The missing link between genetic association and regulatory function"
      authors: "Connally, N. J., Nazeen, S., Lee, D., Shi, H., Stamatoyannopoulos, J., Chun, S., Cotsapas, C., Cassa, C. A., Sunyaev, S. R."
