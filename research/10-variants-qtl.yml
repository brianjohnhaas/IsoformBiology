      quote: >
        we highlight cis -eQTL and cis -sQTL effects on the same gene, typically driven by distinct causal variants
    confidence: high

  - id: VAR-009
    claim: >
      In 2,865 human brain transcriptomes, 12,794 genes carried a cis-splicing
      QTL, and for 4,377 of the genes that also had an expression QTL the two
      signals were statistically incompatible - COLOC posterior probability for
      two distinct causal variants above 0.8 - which with splicing-only genes
      put roughly 61 per cent of sQTLs outside the eQTL map.
    topic: sQTL-eQTL distinctness in brain (THISTLE; COLOC PP3 > 0.8)
    source:
      doc_id: PMC9470536
      title: "Genetic control of RNA splicing and its distinct role in complex trait variation"
      authors: "Qi, T., Wu, Y., Fang, H., Zhang, F., Liu, S., Zeng, J., Yang, J."
