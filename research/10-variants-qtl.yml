    confidence: high

  - id: VAR-008
    claim: >
      GTEx v8's own summary of its results states that where a gene carries
      both an expression QTL and a splicing QTL, the two effects are usually
      driven by different causal variants - so finding one tells you little
      about the other at the same gene.
    topic: distinct causal variants for eQTL and sQTL at one gene
    source:
      doc_id: bio_f292f4666c1a
      title: "The GTEx Consortium atlas of genetic regulatory effects across human tissues"
      authors: "Aguet, F., Barbeira, A. N., Bonazzola, R., Brown, A., Castel, S. E., Jo, B., et al. (Ardlie, K. G., Lappalainen, T.)"
