      quote: >
        only 5/25 loci (20%) demonstrably correspond to expression effects in our eQTL analysis
    confidence: high

  - id: VAR-005
    claim: >
      Across 5,385 GWAS associations in 1,167 independent LD blocks from 87
      complex traits, GTEx v8 colocalized 43 per cent with a cis-eQTL and 23
      per cent with a cis-splicing QTL, leaving a majority of loci with no
      expression explanation even in the best-powered multi-tissue resource.
    topic: GTEx v8 locus-level colocalization (enloc)
    source:
      doc_id: bio_f292f4666c1a
      title: "The GTEx Consortium atlas of genetic regulatory effects across human tissues"
      authors: "Aguet, F., Barbeira, A. N., Bonazzola, R., Brown, A., Castel, S. E., Jo, B., et al. (Ardlie, K. G., Lappalainen, T.)"
      journal: "bioRxiv"
