    confidence: high
    figure_idea: >
      A Venn of sGenes and eGenes in which the intersection is further split by
      whether the two signals colocalize - making visible that overlap at the
      gene level is not overlap at the variant level.

  - id: VAR-010
    claim: >
      Integrating the same brain splicing QTLs with GWAS for twelve
      brain-related traits implicated 244 genes through splicing, about 61 per
      cent of which the matched expression QTL data could not have found: the
      keystone demonstration that splicing variation carries disease risk that
      expression variation does not.
    topic: trait genes discoverable through sQTLs but not eQTLs
    source:
