    claim: >
      How separate splicing QTLs are from expression QTLs depends on how the
      question is asked: a multivariate transcript-ratio analysis of GTEx v7
      found 52 per cent of its splicing QTLs were also expression QTLs for the
      same gene and tissue, yet the lead splicing variant and the lead
      expression variant were the same SNP in only 3 per cent of cases.
    topic: sQTL/eQTL overlap - gene level versus variant level (sQTLseekeR2)
    source:
