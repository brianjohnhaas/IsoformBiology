    '
  why: 'The chapter quotes one sentence saying clinical adoption remains limited (VAR-033) and the honest position
    is that the corpus supports that sentence with no denominator. A human with access to CAP, AMP or EMQN
    survey data could put a number on it; the 46-document boolean result set is the place to look next.

    '
- note: 'NOT FOUND: a reimbursement rate, tariff, coverage decision or payer policy for clinical RNA sequencing.
    The only anchor located is an assumption inside a costing study (VAR-439): 300 cases a year is roughly
    what a German university medical centre is reimbursed for under the genomDE model project. I did NOT search
    the health-economics or payer literature, and did not search for coverage determinations, so this is an
    unsearched gap rather than an absence.

    '
  why: 'Reimbursement is one of the three things the dispatch asked for and the weakest of the three in the
    corpus. Cost (VAR-439, VAR-440) and turnaround (VAR-427, VAR-436, VAR-441) are anchored; reimbursement
    is not.

    '
- note: 'NOT FOUND: any clinical assay reporting an isoform ratio, or percent-spliced-in, as a result. Searched:
    search -s papers "clinical assay reporting isoform ratio percent spliced in as a diagnostic result validated
    splice isoform biomarker", which returns research biomarkers (a PI3K-delta splice isoform, HPV16 E6*I,
    CFH isoform resolution) and two method reviews (PMC13717799 on biosensor assays for spliced isoforms, PMC8364947
    on long-read isoform profiling), and no assay; also searched AR-V7, MET exon 14 skipping and EGFRvIII by
    name. The closest things to a positive are in this file: an approved panel reporting splice variants in
    one gene on a binary score (VAR-430, VAR-431, VAR-452) and an RT-PCR assay returning positive or negative
    for one transcript form (VAR-435, VAR-455). PMC13717799, a 2026 review of biosensor assays for spliced
    isoforms in diagnostics, is where to look for anything newer.

    '
  why: 'This is the chapter''s forward argument, and the precise negative is stronger than a vague one: isoform-level
    clinical reporting exists, it is binary, it covers single pre-specified junctions, and nothing reports
    a ratio.

    '
- note: 'Read but not recorded, because it is a review restating primary studies: PMC13736422 (Current Oncology
    Reports, 2026) gives fresh-frozen reference values for RNA quality (RNA integrity number around 8.0 to
    8.1, DV200 around 96 to 97 per cent) at L67 and a matched glioblastoma comparison where formalin-fixed
    samples had two- to three-fold lower RNA quality than frozen tissue regardless of storage time at L69,
    attributed to its reference 53.

    '
  why: 'If the chapter wants a formalin-versus-frozen RNA quality number, that reference 53 is the primary
    to chase. The contract forbids citing a review for a primary finding, so I left it here rather than in
    a claim.

    '
- note: 'Read but not recorded: PMC13729477 (RIFTT, BMC Bioinformatics 2026) reports a true-positive rate of
    0.76 at a false-positive rate of 0.010 at its high-confidence evidence level (L40) and states that fusion
    transcript expression correlates with partner gene expression (L38), which is the assumption behind its
    score.

    '
  why: 'It is a tool benchmark rather than a clinical measurement, and chapter 10 is not a methods chapter.
    If the chapter wants a second, independent statement that fusion detection depends on partner expression,
    L38 is it; the measured version is VAR-416.

    '
- note: 'NOT FOUND, searched: no FDA clearance or approval document for the 21-gene recurrence score. search
    -s fda "Oncotype DX 21-gene recurrence score breast cancer assay" returns the two Prosigna clearances,
    a MammaPrint review report and unrelated documents; a corpus grep for "oncotype" across /fda returns 14
    paragraphs, all of them inside advisory-committee transcripts, curricula vitae or other devices'' submissions.
    This is consistent with VAR-449''s review-sourced statement that the test was marketed as a laboratory-developed
    test, and is the closest thing to independent support for it available here.

    '
  why: 'The chapter''s regulatory section should be able to say that the most-ordered expression test in breast
    cancer has no device clearance, and this is the strongest form that statement can take from this corpus:
    a scoped negative plus a review.

    '
- note: 'Precise negative on one document''s content: the MammaPrint FFPE clearance (fda_6b5d9d4183dc) reports
    its analytical performance only as being "within the pre-defined acceptance criteria" for scanner-to-scanner
    concordance, negative and positive percent agreement (L58 to L64), with no numbers. Nothing quantitative
    about that assay''s precision can be cited from it.

    '
  why: 'Saves a later agent the search. The quantitative counterpart for the other cleared test is VAR-450.

    '
- note: 'A second RNA-based clinical test surfaced only in a review and is therefore not recorded: doc 7535674
    (abstract-only) describes a urine-exosome assay measuring TMPRSS2:ERG fusion and PCA3 transcripts to inform
    the decision to biopsy the prostate, and states that clinical studies showed it can reduce unnecessary
    biopsies while missing only a minimal proportion of clinically significant cancers.

    '
  why: 'It would widen the chapter''s regulatory section beyond breast cancer and beyond tissue, and it is
    an RNA fusion measured for a diagnostic rather than a therapeutic decision. A primary validation study,
    or a regulatory document if the assay has one, has to be found before it can be cited.

    '
