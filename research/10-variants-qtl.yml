  - id: VAR-021
    claim: >
      Of 372 variants in the B-cell study that coincided with a published GWAS
      association, 242 - about two-thirds - were found only by the
      isoform-level analysis, which is the sharpest available statement that
      gene-level eQTL mapping would have called those disease-associated
