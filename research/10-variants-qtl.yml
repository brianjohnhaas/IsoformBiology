  - id: VAR-029
    claim: >
      Gene-level allelic expression is a good proxy for expression QTLs but a
      poor one for splicing QTLs - in GTEx v8 the correlation between allelic
      imbalance and splicing-QTL genotype was essentially nil - which means an
      allelic-imbalance screen will systematically miss splice-altering
      variants.
    topic: what allele-specific expression does and does not capture
    source:
