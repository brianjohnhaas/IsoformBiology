claims:
- id: NEU-341
  note: >
    tier: variant-to-isoform measurement, no organismal phenotype measured. The only outcome
    measured against the variant is exon inclusion and the amount of full-length protein;
    developmental and epileptic encephalopathy is how the patients were ascertained rather than an
    outcome measured as a consequence, and an earlier version of this note claimed it as the
    phenotype. NEU-346 is the record in this chapter that does carry a measured organismal
    phenotype. Abstract-only in the corpus, so the assay used to measure inclusion and the
    per-variant effect sizes cannot be read here and must not be asserted. This is the paper the
    exon's therapeutic programme cites as its origin (Lim 2020 reference 35, Voskobiynyk 2021
    reference 11, Tang 2025 reference 4).
- id: NEU-343
  claim: >
    The SCN1A poison exon is old enough to be shared with mice: the non-coding exon and its
    flanking intronic sequence are 96 per cent conserved between human and mouse by conservation
    score, human exon 20x corresponding to mouse exon 21x, and about 16 per cent of non-productive
    exon-inclusion events across the genome were found to be as conserved as coding exons.
  note: >
    An earlier version of this claim said 96 per cent identical. The source says conserved, and the
    figure comes from a conservation-score analysis rather than a percent-identity alignment; the
    sibling NEU-348 writes identical correctly because its own source does. tier:
    sequence-conservation measurement, plus a splicing assay in mouse N2a cells confirming the
    mouse exon is used. Practical consequence recorded because it is the reason the programme had a
    mouse model at all: the human-targeting oligonucleotides could be tested in mice without a
    sequence mismatch. The 16 per cent genome-wide figure is a transcriptome-wide count and is
    recorded here only because it bounds this named case. Same company authorship as NEU-342.
- id: NEU-346
  claim: >
    A group with no connection to the sponsor built the human lesion into a mouse and measured what
    the exon normally costs: heterozygous knock-in mice carrying the orthologue of a patient intron
    20 variant lost about half their brain Scn1a mRNA and Nav1.1 protein and showed premature
    mortality, seizures and hyperactivity, while quantitative RT-PCR put exon 20N inclusion at
    about 1 per cent of Scn1a mRNA in adult wild-type brain and about five-fold higher in the
    knock-in.
  note: >
    An earlier version of this claim called the group independent without qualification, and this
    note attributed the 2018 discovery recorded at NEU-341 to a third group. Both are wrong in the
    same place: the cited line describes that discovery as these authors' own earlier work, and
    recomputing from the two records' bylines they share four name strings, Cochran, Myers, Cooper
    and Barsh. NEU-341 is abstract-only with no authors field in the corpus, so a shared name
    string is weaker evidence than a verified laboratory. This group is independent of Lim 2020 and
    of the trial sponsor, which is what the claim now says, and not independent of the paper that
    discovered the mechanism. tier: isoform-specific perturbation with phenotype. The variant is
    NM_006920.4(SCN1A):c.3969+2451G>C, introduced by gene editing as the mouse orthologue. The ~1
    per cent figure is steady state in adult brain with decay running and is not comparable to the
    89 per cent in NEU-342.
- id: NEU-349
  note: >
    tier: isoform-specific perturbation with phenotype. THIS IS THE PRIMARY PAPER FOR THE
    PRECLINICAL CASE AND IT IS ABSTRACT-ONLY IN THE CORPUS; its abstract contains no survival
    percentage, no seizure count and no fold change, so none may be taken from here. The figures in
    NEU-350 and NEU-351 are a commentary's restatement of this paper and are flagged as such. The
    mouse model name is recorded verbatim because the strain background changes survival in this
    model. Independence, recomputed from the bylines: this paper shares four name strings with
    NEU-342, the sponsor's own paper, and a commentary in the corpus says outright that the
    academic group teamed up with the company, so the decisive animal result is sponsor
    co-authored. An earlier version of this record carried no independence statement at all while
    the records either side of it did.
- id: NEU-354
  claim: >
    A group that shares no author with the programme's other papers reproduced the target
    engagement as an incidental control: injecting the splice-switching oligonucleotide STK-135
    intracerebroventricularly into mouse brain at postnatal day 2 and harvesting five days later
    improved productive Scn1a splicing and raised Scn1a expression, with no effect on Syngap1
    splicing or mRNA.
  note: >
    An earlier version of this claim said the laboratory has no connection to the sponsor. That
    does not follow from the absence of a shared author and the document does not support it: the
    paper uses two of the sponsor's proprietary oligonucleotides, one as this positive control and
    one as a comparator, the corpus text carries no competing-interests or funding declaration, and
    a within-document grep for the company name returns no matches, so the question is unanswered
    rather than answered in the negative. This block's own NEU-370 note already says the same paper
    is not a blind convergence. tier: isoform-specific perturbation with a molecular readout, run
    as a positive control rather than as the paper's own experiment. The result is qualitative,
    with no fold change in the text and the data in a supplementary figure, so the chapter may say
    an unrelated group reproduced target engagement but may not attach a number. Group is
    Pennsylvania and Children's Hospital of Philadelphia; no shared author with Lim 2020 or with
    the mouse study in NEU-349.
- id: NEU-360
  note: >
    tier: registered outcome measures. An earlier version of this note said the record never labels
    an endpoint primary and so the chapter must not call the seizure endpoint primary on this
    source. The outcome section carries no labels, but the record's Detailed Description states in
    its own words that the primary endpoint is the change from baseline in major motor seizure
    frequency and that the secondary endpoints are behaviour and cognition, clinical status and
    health-related quality of life. So this record does settle it, the review that calls the
    seizure endpoint primary is reproducing the registry almost verbatim rather than restating it
    at a remove, and the same registry also carries the eight-week baseline period that NEU-383's
    note says it lacks. NEU-381 carries the EU register's fuller wording of the same endpoint, with
    its unit and interval structure, and NEU-382 carries the structural primary and secondary
    labelling from the Japanese registration.
- id: NEU-361
  claim: >
    The registration of the first-in-patient study, MONARCH (NCT04442295, sponsor study
    STK-001-DS-101), records it as a non-randomised, sequential, open-label phase 1 to 2 study with
    an actual enrolment of 62 patients that completed on 14 November 2023, and its outcome measures
    scored STK-001 given as single and multiple doses for safety and tolerability by adverse
    events, vital signs, examination, electrocardiogram and laboratory parameters from screening at
    day minus 28, seizure frequency by paper diary over the same window, plasma pharmacokinetics
    and cerebrospinal fluid exposure from day 1, and a caregiver global impression of change from
    baseline at day minus 1, each running to six months after dosing.
  note: >
    An earlier version of this claim put all five measures on one window running from screening,
    which is right for two of them: the registered time frames differ by measure, with
    pharmacokinetics and cerebrospinal fluid exposure starting at day 1 and the caregiver global
    impression at day minus 1. tier: trial design and outcome measures as registered. READ FROM THE
    REGISTRATION RECORD; NO RESULTS ARE POSTED ON IT. This is the actual enrolment denominator, 62,
    behind the 81 that the trial publication reports for MONARCH and ADMIRAL together (NEU-355),
    and it is the anchored proof that the programme's primary measures were safety and
    pharmacokinetics rather than seizure frequency, which is what bounds NEU-356. Status verified
    May 2025, overall status completed. Claim restated 2026-11-23 to remove an 8-word span shared
    with its own audit quote; content unchanged.
- id: NEU-368
  note: >
    tier: isoform-specific perturbation with a molecular outcome in a non-human primate. Note the
    protein response is not monotonic across doses while the splicing response is, so the splicing
    effect saturates the protein effect. Group sizes: four animals per dose at week 4 but only two
    per dose at week 8 and NO CONTROL ANIMALS AT WEEK 8, so the paper reports the week 8 levels as
    comparable to week 4 rather than as a percentage increase, and the chapter must not state an
    eight-week percentage. Fourteen of the twenty-one authors are at Stoke Therapeutics, sharing
    five authors with NEU-342 rather than the four an earlier version of this note gave, so this is
    the same programme and not an independent replication of it. ALLOCATION QUESTION: an ophthalmic
    indication may belong to chapter 12.
- id: NEU-372
  note: >
    tier: isoform-resolving measurement in a named cell system. Three control stem cell lines, six
    biological replicate wells, hundreds to thousands of SCN1A reads per sample. The therapeutic
    point is that a recently arisen, lineage-restricted poison exon is a real drug target but is
    invisible to any mouse model, which connects this record to NEU-371. 1N has multiple
    alternative splice sites and so is polymorphic in length while 20N and 22N are fixed.
    Independence, recomputed from the bylines: this paper and NEU-341's share name strings, so the
    discovery of the first exon and of the other two are not independent, but an earlier version of
    this note identified the shared name as the senior author of both, which the bylines do not
    support, and it named one shared name where there are three.
- id: NEU-375
  claim: >
    The intron 22 exon was tested the same way in a reporter: a minigene carrying SCN1A exons 22
    and 23 with the whole intervening intron showed significantly increased inclusion of the 22N
    exon when it carried the patient variant, across five transfections per construct in HEK293T
    cells, and one of two oligonucleotides tested against the exon, at 1 micromolar, significantly
    reduced the 22N-containing products relative to the canonical isoform.
  note: >
    An earlier version of this claim named the oligonucleotide's target as the exon's 5-prime
    splice junction, which the cited line supports but which the paper's own figure caption
    contradicts, placing it at the acceptor site with the 3-prime end of the upstream intron. The
    derived point, that only one of the two oligonucleotides worked, is safe either way and is what
    the claim now carries; which junction it hit must not be stated. tier: minigene splicing assay
    with an oligonucleotide rescue, no cellular or organismal phenotype. HEK293T cells are not
    neurons, and the construct is flanked by rat insulin exons as a splicing control. The one-of-two
    hit rate is the same reality as the 144-oligonucleotide screen in NEU-364.
- id: NEU-381
  note: >
    tier: registered endpoint in the protocol's own wording. READ FROM A REGISTRATION RECORD; NO
    RESULTS EXIST ON IT. This is the only place in the corpus that gives the unit, the comparator
    and the interval structure, which the ClinicalTrials.gov record for the same trial (NEU-360)
    does not; the two agree on the week 28 and week 52 structure. The entry is three lines long and
    lists the endpoints together without separating primary from secondary, so this record does NOT
    establish which is primary; NEU-382 does so structurally from the Japanese registration, and
    the ClinicalTrials.gov record states it in prose in its Detailed Description, which an earlier
    version of this note said it does not. The record carries no sponsor field: the attribution to
    Stoke Therapeutics comes from the EUDRACT number 2024-519555-28 appearing as a secondary
    identifier on NCT06872125, whose organisation field names that company, and is not written from
    memory. Claim restated 2026-11-23 to remove an 8-word span shared with its own audit quote;
    content unchanged.
- id: NEU-382
  claim: >
    The Japanese registration of the same phase 3 trial separates the endpoints structurally: it
    lists seizure reduction at week 28, assessed by seizure diary, in its primary outcome section,
    and seizure reduction at week 52, the multi-component Vineland-3 outcome score as a change from
    baseline at week 52, and Vineland-3 subdomain scores as a change from baseline at week 52 in
    its secondary outcome section.
  note: >
    An earlier version of this claim called this the one record that separates the endpoints, which
    is false: the ClinicalTrials.gov record for the same trial states in its Detailed Description,
    in its own words, which endpoint is primary and which are secondary. What is particular to this
    registration is that the separation is structural, line L5 sitting in its primary_outcome
    section and line L6 in its secondary_outcome section, confirmed by listing the record's own
    sections. tier: registered outcome measures, labelled. READ FROM A REGISTRATION RECORD. A
    chapter sentence may call seizure reduction at week 28 the primary endpoint and must call the
    Vineland-3 measures secondary. This registration does name the sponsor, at its L12, as Stoke
    Therapeutics, Inc. The record is bilingual, each line giving the Japanese and then the English;
    the quote is from the English half.
- id: NEU-383
  note: >
    tier: intervention description as registered. READ FROM A REGISTRATION RECORD. This is more
    specific than the ClinicalTrials.gov record for the same trial about the sham procedure, which
    says only that the sham group will have a procedure intended to mimic the drug administration,
    and it matters twice over: it is what makes the quadruple masking in NEU-359 credible, and it
    means the control arm is itself exposed to the procedure that produced post-lumbar-puncture
    syndrome in 25 per cent of patients in the earlier studies (NEU-357), so that adverse event
    will not separate the arms. An earlier version of this note said the eight-week baseline period
    is absent from the ClinicalTrials.gov record; it is there, in the same sentence as the dosing
    schedule, word for word as the Japanese record has it.
- id: NEU-385
  claim: >
    The registration settles what the trials were powered to measure: ADMIRAL's primary outcome
    measures score STK-001 given as multiple doses for safety and tolerability, from screening at
    day minus 28 until six months after multiple dosing, by adverse events, abnormal vital signs,
    physical examination findings, 12-lead electrocardiogram and laboratory parameters, together
    with plasma pharmacokinetics and cerebrospinal fluid exposure of STK-001 by hybridisation
    ELISA, both of those running from day 1 to six months after multiple dosing, while seizure
    frequency measured on a paper diary, caregiver and clinician global impression of change and
    quality of life on the EQ-5D-Y are all secondary outcome measures.
  note: >
    An earlier version of this claim put pharmacokinetics and cerebrospinal fluid exposure on the
    same window as safety; the registration gives both as running from day 1, not from screening at
    day minus 28. tier: registered outcome measures, labelled. READ FROM A REGISTRATION RECORD. As
    with NEU-382 the labelling is structural: L5 is the record's primary_outcome section and L6 its
    secondary_outcome section. THIS IS THE ANCHORED PROOF BEHIND THE CAVEAT IN NEU-356: the seizure
    reduction the programme is known for was a secondary measure in an open-label study with no
    control arm, and the chapter can now say so from a primary source rather than from the review
    at NEU-358. The windows given are also much shorter than the 20 and 36 months over which the
    extension figures are quoted. Claim restated 2026-11-23 to remove an 8-word span shared with
    its own audit quote; content unchanged.
- id: NEU-389
  note: >
    tier: registered outcome measures, labelled, with an amendment visible. READ FROM A
    REGISTRATION RECORD. The labelling is structural, L5 being the primary_outcome section and L6
    the secondary_outcome section. Two things worth the chapter's attention. The locomotor
    questionnaire and the immunogenicity measure appear in the current primary set and NOT in the
    superseded block printed below it on the same line, so the primary outcomes were widened after
    the study opened; the superseded block was not read on an earlier pass, and an absence asserted
    from it would have been wrong. And neither the Vineland-3 nor any cognitive measure is a
    registered outcome of this extension, although the adaptive-behaviour and cognition figures
    quoted for the extensions at NEU-358 come from it, which the chapter should state rather than
    smooth. Claim restated 2026-11-23 to remove an 8-word span shared with its own audit quote;
    content unchanged.
