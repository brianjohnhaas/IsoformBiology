    '
  why: 'It is the measured version of the Dscam combinatorics that TECH-009 only gestures at, and it is a per-cell
    rather than per-molecule measurement, which is a distinction the chapter should make. Chapter 2 owns it.

    '
- note: 'Not recorded, no DOI in the corpus record: doc 180333781, "[Reverse transcriptase PCR (RT-PCR) and
    quantitative-competitive PCR (QC-PCR)]" (2001, pmid 11708328), states at L1 that quantitation is unreliable
    because product increases exponentially per cycle so minute differences in amplification efficiency dramatically
    alter yield, that the internal standard used was a defined deletion fragment of the target cDNA co-amplified
    with the same primers so that its amplification efficiency is identical to the target''s, and that quantitative-competitive
    PCR needs about 1 mg of total RNA against at least 10 mg for a Northern blot. Also not recorded: doc 38830861
    (" Reproducibility in the Quantification of mRNA Levels by RT-PCR-ELISA and RT Competitive-PCR-ELISA",
    BioTechniques 1998, doi 10.2144/98244rr02), which measured standard deviations across ten replicates of
    under 10 per cent for the whole RT-PCR plus ELISA process, under 13 per cent for PCR plus ELISA, under
    11 per cent for ELISA alone and about 15 per cent for competitive RT-PCR, on a housekeeping gene from isolated
    renal glomeruli.

    '
  why: '180333781 is the most explicit statement found that the internal standard in a competitive PCR is itself
    a length variant of the target, which is the exact geometry of a two-isoform measurement; it cannot be
    cited because verify_claims.py and build_bib.py require a DOI. 38830861 is a measured reproducibility budget
    for the competitive assay, but on gene-level quantitation of one housekeeping gene, which is why it was
    left out rather than recorded.

    '
- note: 'Not recorded, review: doc 103245202 (Calarco, Saltzman, Ip and Blencowe, "Technologies for the Global
    Discovery and Analysis of Alternative Splicing", Adv Exp Med Biol 2007, doi 10.1007/978-0-387-77374-2_5)
    states at L1 that for roughly twenty years work on alternative splicing was directed mainly at splice-site
    selection "using model substrates and on a case by case basis", that relatively little was known about
    global regulatory properties, and that one of the open questions was how alternative splicing events are
    controlled and coordinated with each other.

    '
  why: 'It is the era''s own account of the constraint the chapter''s low-throughput section argues, and it
    names model substrates, which is the minigene. It was dropped from the claim set because CONTRIBUTING forbids
    citing a review for a primary finding and because it carries no number; if the chapter wants it, it must
    be cited as a review and the sentence must be about the literature.

    '
- note: 'Not recorded, outside this agent''s assignment: PMC3154906 L45 and L47 (Zhou et al. 2011) report that
    c-myb splice variants made 5 to 15 per cent of total c-myb transcripts in three normal CD34+ donor samples
    against 25 to 60 per cent in 13 paediatric leukaemia samples, and that the single-molecule assay detected
