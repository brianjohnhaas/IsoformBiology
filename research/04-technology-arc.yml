- note: 'Already recorded elsewhere in the book, so not duplicated here, but it is the primer-placement failure
    mode this agent was asked for: CAN-110 in research/06-cancer.yml (Harris et al. 2012, PMC3342274, doi 10.1371/journal.pone.0035231)
