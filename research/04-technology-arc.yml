    '
- note: 'Not recorded, one-home rule: Nogués, Kadener, Cramer, Bentley and Kornblihtt 2002 ("Transcriptional
    Activators Differ in Their Abilities to Control Alternative Splicing", doi 10.1074/jbc.m208418200, abstract-only
