- note: 'Three sources were read and verified but cut because the TECH-101 to TECH-139 range ran out; each
    is reusable without re-reading. Doc 135790854 L1 (Cell 1984, doi 10.1016/0092-8674(84)90496-3): two adjacent
    miniexons of the rat fast skeletal troponin T gene are spliced mutually exclusively, which the authors
    say argues persuasively against a processive scanning model of RNA splice-site selection. Doc 25057273
    L1 (J Virol 1981, doi 10.1128/jvi.37.1.244-247.1981): cDNA cloning and sequencing of polyoma VP1 fixed
    an 897-nucleotide excision with the distal splice site 48 nucleotides upstream of the initiator codon,
    and the same abstract notes possible alternative splice sites that would give the same spliced product,
    an independent instance of the ambiguity TECH-110 records. Doc 133298029 L1 (Nature 1981, doi 10.1038/292420a0,
    Akusjarvi and Persson): the adenovirus major late promoter active early in infection selectively produces
    three polypeptides, which the authors say suggests a differential splicing pattern at the early-to-late
    transition - a hedged inference, and any record must keep ''suggests''.'
  why: 'Each closes a gap: the scanning-model argument is the only candidate record of what the era''s assays
    could rule out about the order of events, the polyoma case is a second laboratory on sequencing''s residual
    ambiguity, and the adenovirus early-to-late switch is the only viral case of a regulated choice found in
    this pass.'
- note: 'Two abstract-only works are duplicated in the corpus under two doc ids each and must not both be cited:
    9658489 and 63697077 are both the rat alpha-tropomyosin paper (Mol Cell Biol 1988, dois 10.1128/mcb.8.2.679-694.1988
    and 10.1128/mcb.8.2.679), and 9181511 and 63693070 are both the Drosophila muscle myosin heavy chain paper
    (dois 10.1128/mcb.9.7.2957-2974.1989 and 10.1128/mcb.9.7.2957). Neither work is cited in this file. Both
