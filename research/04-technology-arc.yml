- note: 'No contemporaneous published account of resistance to the 1977 splicing result was found in this corpus.
    Searched: `search -s papers` for the discovery''s reception, scepticism and historical accounts; `lookup
    title` and `grep --source abstracts` for the 1977 Nature news report ''Adenovirus amazes at Cold Spring
    Harbor'' (Nature 268:101-104, 1977), which appears in arx_0807.0892''s reference list but is itself absent;
    `grep --source abstracts` for ''colinearity'', which returns only statistics papers about multicolinearity;
    and `grep "genes in pieces" /papers/`, which capped at 100 matching paragraphs, all of them reference-list
    citations of Gilbert 1978. Every `search` call in this pass printed ''semantic search was too slow or failed;
    results are from keyword search only'', so all of these were keyword matches and a later semantic pass
    may find more.'
  why: The chapter may want to say the 1977 result met resistance. Nothing read here supports it; the nearest
    anchored statement is TECH-109, that the result displaced the colinearity assumption. PMC10965645 documents
