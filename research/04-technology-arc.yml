leads:
- note: 'Abstract-only records in this corpus expose no `authors` or `journal` field: meta.json carries
    only title, doi, pmid, pmcid, pub_year and the abstract, and `paperclip sql "SELECT id, authors, journal_title
    FROM documents WHERE id IN (...)"` returns zero rows for their numeric ids because that table covers
    only PMC and the preprint servers. Every `authors` and `journal` string on an `abstract_only` claim
    above was supplied by the researcher from general knowledge, not read from a source. Authors and journal
    for the nine PMC sources WERE read from the corpus via that sql query and are reliable.

    '
  why: 'references.bib would silently inherit an unverified author list for the 17 abstract-only citations.
    Each should be regenerated from the DOI. One entry (TECH-008, doi 10.1093/nar/15.5.1995) carries an
    explicit RESOLVE FROM DOI placeholder because the researcher does not know its author list at all.

    '
- note: 'Early, P., Rogers, J., Davis, M., Calame, K., Bond, M., Wall, R., Hood, L. "Two mRNAs can be
    produced from a single immunoglobulin mu gene by alternative RNA processing pathways" (Cell, 1980)
    is not in the corpus under any search run here. Searches run: `lookup title` with the exact title;
    `search -s abstracts` with the exact title; `search -s papers` with the exact title; and two paraphrase
    searches on `-s abstracts` ("immunoglobulin heavy chain mu gene two mRNAs membrane secreted forms
    differential processing" and "mRNA for surface immunoglobulin mu chain is sequence of two separate
    segments remote from each other"). `lookup` returned nothing; the two exact-title searches returned
    unrelated mu-locus papers; only the two paraphrase searches surfaced the companion Rogers et al. 1980
    Cell paper (doc 135795311), which is what TECH-004 cites.

    '
  why: 'That is the paper that supplied the phrase "alternative RNA processing pathways" and is usually
    cited beside Rogers for the mu switch. If the chapter names both, the Early citation must be added
    by hand.

    '
- note: 'Three papers the chapter may want are in the corpus but were cut for the 35-claim cap, each verified
    present by an exact-title `-s abstracts` search. Clark, T. A. et al. "Genomewide Analysis of mRNA
    Processing in Yeast Using Splicing-Specific Microarrays" (Science 2002, doi 10.1126/science.1069415)
    is abstract-only record 175452550; its abstract states the arrays were designed to distinguish spliced
    from unspliced RNA for every intron-containing yeast gene. Engstrom, P. G. et al. "Systematic evaluation
    of spliced alignment programs for RNA-seq data" (2013) is full-text PMC4018468, the alignment companion
    to the RGASP transcript assessment cited in TECH-030 and TECH-031; its content was NOT read here,
    only its presence confirmed. Katz, Y. et al. "Analysis and design of RNA sequencing experiments for
    identifying isoform regulation" (Nature Methods 2010, doi 10.1038/nmeth.1528) is abstract-only record
    97989760 - the canonical MISO citation, citable at abstract level only.

    '
  why: 'Clark 2002 is the first splicing-sensitive array and the natural opening for the array section;
    Engstrom covers the multi-mapping half of the short-read limitation at full text; MISO is where PSI-with-uncertainty
    enters the field. All three are one `cat` away if the chapter needs them.

    '
- note: 'Two headline numbers for the same claim sit side by side in late 2008 and are not the same measurement.
    Pan et al. (doc 111901595) report approximately 95 per cent of multi-exon genes, explicitly from mRNA-Seq
    combined with EST and cDNA data (TECH-023). Wang et al. (PMC2593745) give one estimate over two denominators:
    a sigmoid asymptote near 98 to 100 per cent of multi-exon genes, which is the 92 to 94 per cent of
    all genes quoted in their abstract once multiplied by the 94 per cent of genes that are multi-exon
    (TECH-025); and, under a 15 per cent minor-isoform threshold, 92 per cent of multi-exon genes or about
    86 per cent of all genes (TECH-026). The 98-100 to 92-94 rescaling is the researcher''s arithmetic,
    mirroring the paper''s own 0.92 x 0.94 step; the paper states it only for the threshold-bound pair.

    '
  why: '"92-94%", "95%", "98-100%" and "86%" are all in circulation for what reads as one fact. Any sentence
    or table using them must state the denominator and the abundance threshold, or it will read as an
    error. Per SCHEMA, all are recorded and none is picked.

    '
- note: 'EST library-construction bias is documented in the corpus but is not claimed above. PMC1431573,
    "Quantitative comparison of EST libraries requires compensation for systematic biases in cDNA generation"
    (BMC Bioinformatics 2006, doi 10.1186/1471-2105-7-77), states at L10 that transcript-sampling biases
    in EST libraries are an under-appreciated source of false positive tissue-specific candidates. It
    was cut because it analyses mouse libraries and frames the result around 3''-UTR length rather than
    splice variants.

    '
  why: 'The brief asks for library depth, 5''/3'' bias and clone artifacts. Depth is covered by TECH-013
    and artifacts by TECH-014; library bias is the one leg with no first-rate source. A paper measuring
    that effect directly on splice-variant calls would close the gap.

    '
- note: 'No claim above anchors the assertion that low-throughput methods biased the field toward believing
    anything in particular. Nothing read in this corpus states it. The nearest anchored facts are that
    RT-PCR was the conventional assay (TECH-007), that a standard S1 configuration was non-diagnostic
    for splicing (TECH-008), and that combinatorial linkage remained out of reach into 2010 (TECH-009).

    '
  why: 'The chapter can argue the bias, but it must be argued from the method facts, not cited to a source.
    Flagging so the writing pass does not attach a reference to it. Northern blotting is now covered indirectly
    by TECH-036, which records nuclease protection being argued as preferable to RNA blot analysis; no
    primary Northern-blot splicing paper is cited.

    '
