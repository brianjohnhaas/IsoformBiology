    '
  why: 'Chapters 6 and 7 own disease cases. The 61-variant count is the strongest single illustration of a
    combination space actually enumerated at one locus, so if chapter 4 wants it the claim should be scoped
    to the assay''s output rather than to leukaemia biology.

    '
- note: 'sim4 (Florea et al. 1998, ''A computer program for aligning a cDNA sequence with a genomic DNA sequence'')
    and the original est2genome (Mott 1997) are not in this corpus under the searches run here: `lookup title`
    with sim4''s exact title returned nothing; `grep "sim4" /papers/ --source abstracts` returned 97 paragraphs,
