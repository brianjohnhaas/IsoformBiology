- note: 'Three further anchored lines in PMC1347394 ("ASD: a bioinformatics resource on alternative splicing",
    NAR 2005, doi 10.1093/nar/gkj031) were read and not given records, for the id range rather than for any
    doubt about them. L20: AEdb-Sequence is a literature-based manually curated database of alternative exons,
    built by searching PubMed on the keyword "alternative splicing" and extracting organism, splicing mechanism,
    tissue-specificity, developmental regulation, disease association and the exon sequence from the resulting
    articles; roughly 10 per cent of entries report events introducing premature stop codons and roughly 10
    per cent are exons in non-coding regions. L15: computational sets such as EST comparisons are large but
    lack biological information about the events, while literature-derived sets carry that information and
    are smaller. L31: UniProt reports curated isoform peptide sequences and Ensembl reports alternative transcripts,
    which is how the two kinds of record were joined.

    '
  why: 'L20 is the most literal available answer to how the field kept track of variants before the EST era,
    and L15 is the curators'' own statement of the trade-off the chapter''s EST section already argues. Both
    are one `cat` away.

    '
- note: 'PMC1785386 L19 (Emerick, Parmigiani and Agnew 2007) states that single-gene transcriptome data are
    very sparsely spread over the configuration space, because several alternative loci typically carry low-frequency
    variation, which leaves a substantial fraction of combinations simply improbable; the same line names high-order
    splicing correlations as correlations within single molecules. Not recorded for the id range.

    '
  why: 'It is the statistical reason a joint distribution over many loci cannot be estimated from a library
    of a few thousand clones, which bounds TECH-157 and TECH-159 from the other direction.

    '
- note: 'Crossref returns a single author for doi 10.1093/nar/29.13.e68 (TECH-141), "Vandenbroucke, I. I.".
    The reference list of PMC4793508 at L84 gives four authors for the same paper: Vandenbroucke II, Vandesompele
    J, Paepe AD, Messiaen L. The recorded byline is therefore known to be incomplete rather than wrong.

    '
  why: 'build_bib.py would emit a single-author entry for a four-author NAR paper. Resolve from PubMed (pmid
    11433044) before the bibliography is built.

    '
- note: 'scripts/resolve_metadata.py sends a User-Agent string containing the maintainer''s personal GitHub
    URL. It was therefore NOT run in this pass. All `metadata_source: crossref` fields above were resolved
    with a throwaway script at <output dir>/xref.py that queries api.crossref.org with a generic User-Agent
    and sends no personal information. All `metadata_source: paperclip sql` fields were read from the corpus
    `documents` table.

    '
  why: 'The brief for this agent forbids personal names in outbound requests. If the orchestrator runs resolve_metadata.py
    over the merged file it will send that name; the UA string should be changed first.

    '
- note: 'Searched for and not found: a source measuring preferential amplification of the shorter product in
    a splicing-specific PCR. Searches run: `search -s abstracts` on "preferential amplification of shorter
    product PCR quantification splice variant ratio bias"; `grep "shorter (amplicon|product|isoform|fragment)s?
    (is|are|was|were) (preferentially|more efficiently)" /papers/`, which returned ten paragraphs, all of them
    about DNA fragment libraries, ancient DNA, bisulphite templates or single-cell whole-genome amplification
    and none about splice isoforms; `grep "preferential(ly)? amplif" /papers/` filtered for exon/splice/isoform,
    which returned nothing; `grep --bool ''"heteroduplex" AND ("splice variant" OR "alternatively spliced")''
    /papers/`, which returned 100 untitled documents and nothing usable; and `search -s abstracts` on "competitive
    RT-PCR internal standard coamplification plateau cycle number quantitation of mRNA", which returned only
    gene-level competitive RT-PCR method papers with no splice-variant content. 118983705 ("Preferential PCR
    amplification of alleles: mechanisms and solutions", 1992, doi 10.1101/gr.1.4.241) is in the corpus as
    an abstract and is about allele dropout in genotyping, not isoform ratios.

    '
  why: 'The length-bias and heteroduplex failure modes of a splice-variant RT-PCR are real and widely taught,
    and nothing read in this corpus measures them on isoforms. The chapter must either argue the length bias
    from the allele-dropout literature, saying so, or leave it out; the measured bias it can cite is TECH-143,
    which is an efficiency-estimator bias rather than a length bias.

    '
- note: 'Searched for and not found: a source stating how many assays would be needed to survey splicing genome-wide
    one locus at a time. Searches run: `grep "one (gene|locus|exon|transcript|event) at a time" /papers/` filtered
    for splicing terms, which returned only quantifier-model and unrelated hits; `grep "low[- ]throughput"
    /papers/` filtered for splicing terms, which returned nothing; `grep "gene.by.gene|gene by gene basis|case-by-case|individual
    genes have been" /papers/` filtered for splicing, nothing; and `search -s abstracts` on "alternative splicing
    studied gene by gene low throughput cannot scale thousands of events", whose best hits were reviews.

    '
  why: 'The scaling arithmetic in this file is therefore assembled from assay-side numbers - TECH-156 (82 minigenes
    in the whole literature by 2005), TECH-158 (512 structures at one gene), TECH-168 (hundreds to thousands
    of theoretical alternatives per gene) and TECH-170 (a designed ceiling of nine exons in 324 genes) - rather
    than from one source doing the multiplication. If the chapter multiplies them it is doing its own arithmetic
    and must say so.

    '
- note: 'Emerick, Parmigiani and Agnew 2007 (PMC1785386) is the statistical companion to Emerick et al. 2006
    (125267454); Regan, Emerick and Agnew 2000 (143275462) is the library method both rest on. All three are
    the Agnew group. The independent molecule-level measurement is Zhou, O''Rourke, Edwards and Ness 2011 (PMC3154906),
    and the independent assay-design papers are Zhu, Shendure, Mitra and Church 2003 (139029849) and Conze
    et al. 2010 (PMC2938221). Within this file, then, the molecule-level measurements come from two laboratories
    and the assay-design papers from two more; that is a statement about this file''s sources, not a census
    of the literature, and nothing read here establishes how many groups had done such measurements by 2010.

    '
  why: 'The chapter''s reviewers find more defects in sentences about independence than in sentences about
    biology, and six of this file''s combinatorial records (TECH-157 to TECH-161, TECH-167, TECH-168) rest
    on one laboratory''s work.

    '
- note: 'Full text was NOT recovered for any of the abstract-only sources already cited in research/04-technology-arc.yml,
