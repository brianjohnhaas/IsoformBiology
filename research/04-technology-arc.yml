  why: The chapter can now name Sim4 and Spidey through PMC2440734, which benchmarks both (TECH-192) and measures
    Sim4's false-terminal-exon rate (TECH-202), and can name the est2genome model through a study that used
    it (TECH-209). What it still cannot do is cite either method paper. If a sentence needs sim4's or est2genome's
    own reference, it must be added by hand.
- note: 'No source read here measures 5''-against-3'' EST bias on splice-variant calls. The nearest anchored
    facts are that EST sequencing starts in the vector and reads one end only (TECH-181), that reversed clones
    at about 5 per cent and internal priming at about 2.5 per cent mis-assign which end a read came from (TECH-185),
    and that transcript-sampling bias distorts 3'' untranslated region length comparisons between libraries
    (TECH-183, TECH-184). Searches run: `search -s abstracts` on ''EST sequence error rate single-pass reads
    base calling quality'' with two `--also` phrasings, and on ''chimeric cDNA clones artifacts EST libraries
    contamination genomic DNA''.'
  why: The chapter's 1999 figure (TECH-010) reports most detected variation in 5' untranslated regions. Whether
    that is biology or a consequence of 5'-end read sampling is exactly the question this chapter is for, and
    nothing in the corpus read here settles it. The chapter must not assert either reading.
- note: No per-base error rate for a single-pass Sanger EST read was found in the corpus. 118983835 (TECH-185)
    reports error rates by class - reversed clone, internal priming, lane tracking, insert size - against a
    curated transcript reference, and 130030008, an encyclopedia entry on the UniGene, STACK and TIGR indices,
    describes ESTs as 'fragmented, single-pass reads' but is a review and was not recorded.
  why: The chapter would like to say what fraction of bases in an EST were wrong, because that is what sets
    whether a one-nucleotide splice-site shift is real. TECH-196 gives the window within which such a shift
    is ambiguous, and TECH-195 gives the outcome of the ambiguity at non-canonical sites, but the per-base
    rate itself is unanchored.
- note: 'Three related items were found and not recorded, each verified present. PMC2882375, ''A study of alternative
    splicing in the pig'', reports about 30 per cent of pig genes alternatively spliced from over a million
    ESTs - left out because chapter 3 owns cross-taxa prevalence and TECH-209 already carries the methodological
    point from a second non-human EST survey. 109392732, ''Detecting Alternative Gene Structures from Spliced
    ESTs: A Computational Approach'' (2009, doi 10.1089/cmb.2008.0028), is an EST-era splice-graph method whose
    abstract was not read. PMC538278 (DEDB) and PMC1538904 (ASGS) are Drosophila and general splicing-graph
    resources that would extend item 3 but add no number the chapter lacks.'
  why: Each is one `cat` away if the splice-graph section needs a third source or if the pig figure is wanted
    for a cross-species row.
- note: 'The full text of the chapter''s five existing EST-era sources could not be recovered. All five are
    abstract-only records in this corpus: 9633645 (Mironov 1999, pmcid PMC310997), 159241185 (Brett 2000, no
    pmcid), 156730331 (Modrek 2001, pmcid PMC55780), 141190147 (Kan 2002, pmcid PMC187565) and 136587406 (Sorek
    2004, no pmcid). `paperclip ls` on each numeric id reports ''Abstract-only paper'', and `ls /papers/PMC310997/`,
    `/papers/PMC55780/` and `/papers/PMC187565/` all return ''PMC paper not found'', so the PMC identifiers
    in meta.json do not resolve to full-text records.'
  why: BRIEF-CH4 says recovering full text for an abstract-only source already cited is as valuable as a new
    record. For these five it is not available through this corpus, so the thresholds and denominators behind
    the 35, 38 and 42 per cent figures cannot be deepened beyond their abstracts. What was recoverable from
    Kan 2002's abstract is now TECH-204 and TECH-212.
- note: 'Every `authors` and `journal` field written as the literal string RESOLVE_FROM_DOI in this file belongs
    to an abstract-only record whose meta.json carries no author list and no journal name, and `paperclip sql`
    returns no row for numeric ids. The PMC sources (PMC1431573, PMC3424822, PMC2440734, PMC2711938, PMC1669709,
    PMC1347394) have authors and journal read from `paperclip sql`, and PMC1347394''s full author list was
    read from L3 of the document because the sql row truncates it. 141190147 reuses the existing record''s
    Crossref-resolved metadata and the existing bibkey kan2002selecting. Count the placeholders from the built
    file rather than from this note: `grep -c ''metadata_source: unresolved'' claims.yml` is the count of records
    needing it; the placeholder string itself also appears in notes and in this leads block, so a plain grep
    for it overcounts.'
  why: 'The metadata must be resolved before merge, but NOT by running scripts/resolve_metadata.py as it stands:
    its User-Agent string embeds a personal GitHub account name, and this pass is under an instruction to put
    no personal name in an outbound request. Either send a generic User-Agent or resolve by hand. Every bibkey
    on an unresolved record is title-derived rather than author-derived, per SCHEMA, so resolving the metadata
    will not invalidate the keys.'
- note: 'None of the three evidence tiers in AGENT-BRIEFS.md section 1 describes a record in this file, because
    every record here is about an assay, an algorithm or a count rather than about an isoform doing a job.
    research/04-technology-arc.yml contains no `tier:` string at all for the same reason. The wording used
    in every note below follows the two precedents that do exist in the repository: ''tier: none of the three
    tiers applies'' (twice in research/06) and ''Measurement claim, not a case, so no evidence tier applies''
    (research/03, PFO-310 and PFO-311).'
  why: So that the records review does not read the absent tier as an omission, and so that a later pass settles
    on one phrasing for method records across the book rather than three.
- note: 'The strongest version of the chapter''s threshold argument in this file is TECH-218, because it is
    within one paper and one dataset: 53 per cent of 22,220 multi-exon genes against 75 per cent of 13,690
    genes required to have at least one mRNA sequence, in one release of ASAP II. The between-paper spread
    is wider but is not controlled: 81 per cent of 4,322 genes under a one-splice-site-difference rule (TECH-206),
    28 per cent of 2,793 transcript-confirmed genes (TECH-205), and 17 to 28 per cent of 6,400 RefSeq genes
    under a 5-per-cent-frequency, 95-per-cent-confidence rule (TECH-013). The gene sets, the years and in some
    cases the EST source differ between those three, and only TECH-013 and TECH-206 are both screened against
    RefSeq, so the chapter must attribute the spread to definitions without claiming the datasets were identical.'
  why: 'The chapter currently makes the threshold argument from Kan 2002 alone, which is one dataset supporting
    two numbers. TECH-218 is a second within-study pair, from a different group and a different kind of threshold
    (coverage rather than frequency), which is what makes the argument general rather than one paper''s quirk.
    TECH-210 is the third leg: a catalogue built at the loose end measured at 5.9 per cent specificity against
    known patterns.'
- note: Nothing read here states that EST-era methods biased the field toward believing anything in particular,
    which is the standing gap recorded in research/04-technology-arc.yml. The nearest anchored facts added
    by this pass are that a one-splice-site difference rule yields 81 per cent (TECH-206), that the resulting
    catalogues were measured at low specificity against known patterns (TECH-210), and that discarding exons
    seen in only one genome removes almost nothing real while demanding conservation outside the rodent lineage
    removes a class carrying a signature of exon birth (TECH-215).
  why: The chapter may argue the direction of the bias from these method facts. It still must not cite a source
    for the assertion itself.
- note: 'Findings read and verified in this pass but cut because the assigned id range ran out, each reusable
    without re-reading. (a) 136528481, the 2004 ASD release: its abstract states that the resource holds a
    computationally delineated event set from EST/cDNA-to-genome alignments plus a separately held literature-collected
    exon set, over nine organisms, annotated for expression state and cross-species conservation; quote span
    available at L1. (b) 132274425, AIR: splice-graph transcripts enumerated, scored by sequence-evidence strength
    and promoted selectively, retaining 98 per cent of high-quality mRNA evidence in well-formed transcripts,
    at L1. (c) 131598655, GMAP: all splice sites correct in over 99.3 per cent of human mRNAs carrying random
    mutations at 1 and 3 per cent, reported as one tenth the error rate of existing programs, plus microexon
    identification with a significance test, at L1 - a self-benchmark, now partly superseded by TECH-192 and
    TECH-202. (d) 115561455 L1 also carries the conserved-event spectrum: 1,037 (38.4 per cent) exon skipping,
    497 (18.4 per cent) alternative 3'' sites, 214 (7.9 per cent) alternative 5'' sites, 75 (2.8 per cent)
    intron retention, 875 (32.4 per cent) complex. (e) 164183617 L1 also carries the EST-era event spectrum:
    cassette events outnumber other classes, exon-isoform events involve truncation about twice as often as
    extension and occur at acceptor sites about twice as often as at donor sites. (f) 128659259 L1 also reports
    that about 50 per cent (46 of 91) of chromosome-1-mapped clones had coding potential above 100 amino acids
    and that the libraries hold many 5''-truncated, unprocessed clones. (g) PMC3424822 L19 lists the diagnostic
    cDNA-terminus elements in full: adapter and linker sequences, insert-flanking restriction sites, poly(A)/poly(T)
    tails and adjacent vector fragments.'
  why: Items (d) and (e) are two event spectra over the same event classes, one EST-derived and one conservation-filtered,
    and putting them side by side is the single best paragraph available for the conservation section. They
    currently sit only in notes, which are not citable, so they need records before any sentence uses them.
- note: A date conflict between two chapters' sources. PMC2711938 L28, the basis of TECH-213, puts the mouse-rat
    divergence at about 16 million years ago; research/03-plants-fungi-other.yml PFO-310 records PMC1802581
    putting it at about 23 million years ago. Both are cited for arguments that depend on how much residual
    conservation to expect between the two rodents.
  why: Any sentence that uses the pseudoexon chance-pass rate of TECH-213 alongside chapter 3's mouse-rat coverage
    argument will state one of the two dates, and a reader comparing chapters will see the other. The chapter
    should either give the date with its source or give neither.
- note: 'Chapter 3 already owns the sampling-depth correction that this chapter''s threshold section keeps
    arriving at. PFO-311 in research/03-plants-fungi-other.yml records the protocol: take only genes with at
    least ten sequenced transcripts, draw ten at random, count the splicing events, repeat a hundred times
    and average. PFO-310 records that mouse and rat differ in measured splicing in proportion to their EST
    coverage, and PFO-031 records the authors'' conclusion that the exact level cannot be stated.'
  why: TECH-218, TECH-208 and TECH-209 in this file are three different answers to the same problem - require
    coverage, publish the support counts, or admit the sampling sets the answer - and the cleanest existing
    statement of the fix is in chapter 3. The chapter 4 section should point at it rather than restate it,
    per the one-home rule.
- note: 'Searches and reads not run, listed so they are not assumed done. The TIGR Gene Indices and the TIGR
    assembler have no record here: 130030008, an encyclopedia entry covering UniGene, STACK and the TIGR gene
    index together, was read and rejected as a review, and no TIGR-specific primary paper was searched for.
    Engstrom et al. 2013, the spliced-alignment assessment at PMC4018468 that the chapter 4 leads block names
    as present and unread, was again not read; it is RNA-seq era rather than EST era, so it was out of scope
    for this assignment, but it is the natural companion to TECH-192. No search was rerun on `-s pmc`: every
    search in this pass used `-s abstracts`, and every search reported that semantic search had failed and
    results were keyword-only.'
  why: A later pass should not re-run the abstract searches believing the corpus has been swept. The two specific
    gaps are TIGR, which is the third of the three gene-indexing projects and is the only one with no primary
    source in the book, and a `-s pmc` sweep, which is the most likely way to find full text for the 2000-to-2008
    tool papers that are abstract-only here.
- note: The probe layout of Clark, Sugnet and Ares 2002 is not readable at first hand in this corpus. Record
    175452550 is abstract-only and its abstract gives the design goal and the gene-specific indexes but no
    probe classes and no formula; TECH-223 therefore takes the exon, intron and splice-junction probe design
    and the splice-junction and intron-accumulation indexes from PMC2760813 L9, a 2009 paper describing it.
    The Srinivasan et al. 2005 Methods paper, which is the design and analysis protocol for the vertebrate
    version, is also abstract-only (127072260), so the chapter cannot quote probe counts, spacing rules or
    normalisation details for either platform.
  why: Chapter 4 wants the assay in enough detail that a reader can see the inference. For the first splicing
    array that detail currently has to come from a third party, and the chapter should say so rather than imply
    the 2002 authors described it this way.
- note: 'Four array-era statistics have no primary document in this corpus. Cline et al. 2005 (ANOSVA, Bioinformatics
    21:i107-i115), Shai et al. 2006 (GenASAP, Bioinformatics 22:606-613), Xing et al. 2008 (MADS, RNA 14:1470-1479,
    whose PMC id PMC2491471 returns no metadata) and Affymetrix''s MIDAS whitepaper are each described only
    inside other papers: ANOSVA and MADS and FIRMA at PMC2760813 L10, MIDAS and ANOSVA and GeneASAP and PAC
    at PMC2728531 L11, ANOSVA and GenASAP at arx_1104.3016 L17. Searches run: `lookup title` on the exact titles
    of the Srinivasan, Cline, FIRMA and MADS papers (only FIRMA resolved, as PMC2638867); `search -s abstracts`
    on the Srinivasan title; corpus `grep` for FIRMA and for the phrase splicing index.'
  why: TECH-239, TECH-240 and TECH-245 are all secondhand descriptions of these methods. CONTRIBUTING.md forbids
    citing a review for a primary finding, and a chapter sentence saying what MIDAS or ANOSVA assumed is in
    that category unless it is attributed to the describing paper.
- note: 'Nothing read here quantifies the fraction of real splicing events that a given array design could
    not have detected. The nearest anchored facts are all in PMC1896007: splice sites shifted by less than
    17 nucleotides were excluded by construction (L18, TECH-252), junction probes were omitted because the
    available enumeration of variants was substantially incomplete (L19, TECH-253), and 287 of 2,161 brain-enriched
    probesets rested on gene prediction alone (L39, TECH-258). A corpus-wide grep for the phrase ''not represented
    on the array'' returned only copy-number and SNP-array papers.'
  why: The chapter's claim that array coverage is fixed before the experiment begins would be strongest with
    a measured proportion of missed events. It does not exist in this corpus and must be argued from the design
    facts instead.
- note: 'Three measured numbers in PMC1896007 were read and not recorded, for want of record ids. L30: the
    robustness of the gene-level denominator to simulated exon skipping, where for transcript clusters with
    five or more probesets 80 per cent of measurements deviated by 26 per cent or less, with medians of 18
    per cent at ten or more probesets and 11 per cent at twenty or more. L45: the frequency with which RT-PCR-validated
    brain-enriched probesets were re-identified in single-tissue pairwise comparisons, median 62.7 per cent
    for brain against non-brain, 11.1 per cent for non-brain against non-brain and 0 per cent for brain against
    brain. L46: 277,838 exon clusters, 26.9 per cent of them, carry more than one probeset, within-cluster
    probeset correlation across 16 tissues has median 0.83 against -0.01 for probesets from different clusters,
    and about 21 per cent of exon clusters fall below 0.5, which those authors offer as an indirect sense of
    how often alternative splice-site usage occurs.'
  why: L46 is the closest thing in the corpus to an array-based estimate of alternative 5' and 3' splice-site
    usage, which is the event class TECH-019 and TECH-252 say the platform struggles with. L30 measures the
    denominator of the splicing index directly. Both are one `cat` away if the chapter wants them.
- note: 'PMC2760813 L43 was read and not recorded: the first and simplest of the four remedies those authors
    propose is to filter differentially expressed genes out of the splicing analysis altogether, on the ground
    that the splicing-index bias is flat for genes changing less than two-fold, and they note this is undesirable
    precisely when alternative exons in differentially expressed genes are what is wanted. They also release
    a correction package, COSIE.'
  why: 'That remedy is the sharpest statement of what the platform cost: to trust a splicing call you declined
    to make it in the genes whose expression had changed. It would make a strong chapter sentence and needs
    its own record.'
- note: 'Two further head-to-head results were read and not recorded. PMC2728531 L42 and L43: the colon-cancer
    ROC comparison rests on 10 RT-PCR-confirmed and 8 non-confirmed exon probesets after low-intensity filtering,
    and 17 confirmed and 14 non-confirmed without it, with filtering reducing the validated set to about 60
    per cent of the original, so every ROC statement about these eight methods rests on fewer than twenty exons.
    arx_1104.3016 L52 and L53: against eight glioblastoma genes with splicing events previously reported in
    the literature, the ANOSVA enrichment ratio peaked at 3.17 at a local false discovery rate of 10^-14, giving
    36 significant events in those genes, while the rank-based method plateaued at 13 at a posterior probability
    of 99.99 per cent, giving 18, and at the cutoff matching 36 events the rank-based method reached 6.7 against
    3.17.'
  why: TECH-243 and TECH-244 would be overstated if the chapter did not know how small the confirmed sets behind
    them are. The enrichment comparison is a second kind of head-to-head, against literature rather than against
    RT-PCR.
- note: Li et al. 2006, 'Cell Type and Culture Condition-Dependent Alternative Splicing in Human Breast Cancer
    Cells Revealed by Splicing-Sensitive Microarrays' (doi 10.1158/0008-5472.can-05-2593), is in the corpus
    as abstract-only record 126719733, with a duplicate crossref record 167743293 for the same work. Its abstract
    reports array-detected splicing differences between MCF7, MDA-MB-231 and cultured human mammary epithelial
    cells verified by RT-PCR at CD44, FAS, RBM9, hnRNPA/B, APLP2 and MYL6, and reports that only a subset of
    the two-dimensional differences was retained in Matrigel. It was not recorded here because it gives no
    validation fraction and the chapter does not need another application of the same platform.
  why: It is the Ares laboratory's own vertebrate application of the platform at TECH-224, so it is the natural
    second source for that record, and it names the genes. The duplicate record means a bibkey collision is
    possible if another chapter cites it.
- note: Neither Johnson et al. 2003 (136878314, cited at TECH-015) nor Pan et al. 2004 (132322124, cited at
    TECH-016) states an RT-PCR validation fraction in the abstract that is all the corpus holds of either,
    so the two array surveys the chapter already cites cannot supply the era's validation rate. TECH-248 and
    TECH-250 are the only validation rates found.
  why: Saves the next pass from searching those two records again for a number that is not there.
- note: Metadata that should be amended on the records added here, and on the file's existing abstract-only
    leads. Authors and journal for Clark et al. 2002 (175452550) were read from the reference list of PMC1896007
    at L102; for Srinivasan et al. 2005 (127072260) from arx_1104.3016 L63; for Katz et al. 2010 (97989760)
    from bio_7f6a8ea76d24. Each is corpus-read rather than crossref-resolved and each carries metadata_source
    saying so. arx_1104.3016 prints its own DOI at L1 as 10.1214/10-AOS389 while meta.json gives 10.1214/10-AOAS389;
    the meta.json form is what is recorded, and resolve_metadata.py should be allowed to settle it.
  why: The file's first lead says every abstract-only byline in it was supplied from general knowledge. These
    three were not, and the distinction should survive the next metadata pass rather than being overwritten.
- note: Independence, for the records added here. TECH-221 and TECH-222 (Clark et al. 2002) share their first
    author, Tyson A. Clark, with TECH-236 and TECH-248 to TECH-258 (Clark et al. 2007), and the 2007 paper
    is written entirely by Affymetrix employees about Affymetrix's own prototype array, so it is the vendor
    evaluating its own platform. TECH-224 (Srinivasan et al. 2005) is the same Ares laboratory as TECH-221.
    TECH-234 (Kapur), TECH-235 (Xing) and TECH-238 (MADS+, Shen and Xing) share authors. TECH-243, TECH-244
    and TECH-247's winning methods are in each case the evaluating authors' own. The independent treatments
    of the probe-level artefact are TECH-225 to TECH-232 (Gaidatzis et al., Friedrich Miescher Institute) and
    TECH-245 to TECH-247 (Gelfond et al., UT Health Science Center), on different platforms.
  why: 'The reviewers find more defects in sentences about independence than in sentences about biology, and
    the array section is unusually exposed: its design facts and its validation rate come from the platform''s
    manufacturer.'
- note: TECH-245, TECH-246 and TECH-247 were read as an arXiv preprint, arx_1104.3016, while the DOI recorded
    on them is the journal version, The Annals of Applied Statistics 5:364-380 (2011), doi 10.1214/10-AOAS389,
    so preprint is set true on that source. Every number in those three records, including the false-positive
    rates 0.063, 0.057, 0.165 and 0.194 in Table 1 at L41, should be re-checked against the published version
    before the chapter prints them; the preprint's own header at L1 even disagrees with its meta.json about
    its own DOI.
  why: SCHEMA requires it for every source where the lines read and the DOI cited are different versions, and
    a table of simulated error rates is exactly the kind of content that moves between a preprint and a journal
    copy.
- note: Metadata for two abstract-only sources the chapter already cites can now be resolved from the corpus
    rather than from memory, which the file's first lead flags as outstanding. TECH-015 cites Johnson et al.
    2003 (136878314); PMC1896007 L96 gives the full byline as Johnson JM, Castle J, Garrett-Engele P, Kan Z,
    Loerch PM, Armour CD, Santos R, Schadt EE, Stoughton R, Shoemaker DD, Science 302:2141-2144 (2003). TECH-016
    cites Pan et al. 2004 (132322124); PMC1896007 L103 gives Pan Q, Shai O, Misquitta C, Zhang W, Saltzman
    AL, Mohammad N, Babak T, Siu H, Hughes TR, Morris QD, Molecular Cell 16:929-941 (2004). Neither abstract
    contains an RT-PCR validation fraction.
  why: The brief asks which existing records to amend if an assignment touches their sources. These two are
    the chapter's array survey citations, and their bylines were previously supplied from general knowledge.
- note: Insert-size choice is the one leg of the library-preparation assignment with no measured source recorded
    above. Searched `-s papers` for "effect of fragment length insert size paired-end on isoform quantification
    accuracy RNA-seq"; the best returns were TIGAR2 (PMC4304212) and an effective-length normalisation paper
    (PMC3025570), both of which are estimator papers that chapter 1 owns rather than measurements of what changing
    the insert size does to isoform calls. TECH-034 (Cho 2014, 75 against 262 bases) is the nearest anchored
    fact and it varies total fragment length, not insert size at fixed read length.
  why: The chapter asserts that library choices change the answer; insert size is the one choice it would have
    to assert without a citation.
- note: Mortazavi et al. 2008 is in the corpus only as the abstract-only record 112287926 cited by TECH-020.
    `paperclip search -s papers "Mapping and quantifying mammalian transcriptomes by RNA-Seq mouse tissues
    25-mer"` returned no copy of it, so no full-text statement of that dataset's own limits is available. The
    equivalent statement for the companion human dataset is recorded as TECH-299 from Wang et al., whose full
    text is held.
  why: Item 6 of the assignment wanted the designers' own account of what their data could not support, for
    both 2008 datasets. Only one of the two can be sourced.
- note: Hayer et al. 2015 report at L66 that in a survey of 315 random PubMed papers performing RNA-seq with
    any feature quantification, transcript-level inference was done more than half the time, with Cufflinks
    cited 123 times and Trinity 24 times. Not recorded as a claim because it counts papers rather than measuring
    an assay, and because the survey's sampling frame is described only as random.
  why: It is the only anchored number in this corpus for how widely full-length reconstruction was actually
    used while it was known to be inaccurate, which is the behavioural half of the chapter's closing argument.
- note: 'Three structures the assignment named as unresolvable were not found measured individually. Nested
    isoforms, where one transcript''s intron chain is a subset of another''s, and a short first exon are both
    covered only indirectly: by the non-uniqueness of the chain decomposition (TECH-288), by the all-possible-ways
    assembly behaviour (TECH-289), and by the boundary-relaxation rule (TECH-293). Two genes overlapping on
    opposite strands is covered by the strand-tag problem (TECH-274) and by Levin''s argument (TECH-281), neither
    of which counts loci lost. Searches run on `-s papers`: "nested isoform containment short-read assembly"
    phrasings were not attempted; this is an open lead rather than a negative result.'
  why: The chapter would be stronger naming a locus class with a count than naming three structures and citing
    mechanism records.
- note: Engström et al. 2013 (PMC4018468) is now read at full text and recorded as TECH-261 to TECH-274, which
    closes the lead in research/04-technology-arc.yml that recorded it as present but unread. The other two
    papers named in that lead, Clark et al. 2002 (record 175452550) and Katz et al. 2010 (record 97989760),
    were not touched by this assignment and remain uncited.
  why: So a later pass does not re-read Engström and does assume the other two are still open.
- note: Robert and Watson's figure of 27.8 to 43.9 per cent of reads unassignable to a single gene (TECH-285)
    comes from real mouse lung-cancer RNA-seq whose read length is not stated in the lines read. Every other
    assignment or recovery percentage in these records carries its read length.
  why: The chapter's rule is that a percentage without a read length is not usable; this one needs either the
    read length recovered from the cited mouse study or the number dropped.
