    '
- note: 'Also already recorded elsewhere and bearing on the combinatorial section: ANM-005-adjacent record
    in research/02-animals.yml with bibkey dscam2004stochasticbiased (Neves, Zucker, Daly and Chess 2004, doc
    136901354, doi 10.1038/ng1299) states that each R3/R4 photoreceptor expresses 14 to 50 distinct Dscam mRNAs
