claims:
- id: FND-001
  claim: The machine that removes an intron is not a single enzyme but five small nuclear ribonucleoproteins - U1,
    U2, U4, U5 and U6 - plus hundreds of further proteins, and it is assembled fresh on each pre-mRNA through an
    ordered series of intermediates named on the same line as E, A, B and C, with only the E complex forming without
    ATP.
  topic: spliceosome composition
  source:
    doc_id: PMC8624252
