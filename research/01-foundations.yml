    of the E, A, B and C intermediates showing which snRNP joins at each step and where ATP is required - the
    figure a reader should be able to return to for the whole book.
- id: FND-002
  claim: 'The two ends of an intron are recognised by different machinery and in a definite order: U1 snRNP
    engages the 5'' splice site while SF1 and U2AF together recognise the 3'' splice site, and U2 snRNP only
    arrives later by displacing SF1.'
  topic: splice site recognition
