- id: FND-007
  claim: 'Constitutive and alternative splicing are not two mechanisms but two regimes of one mechanism: where splice
    signals match consensus the outcome is fixed, and the degeneracy of splice signals together with a larger set
    of splicing factors is what makes a choice possible at all - budding yeast sits at the constitutive end of that
    axis and humans at the regulated end.'
