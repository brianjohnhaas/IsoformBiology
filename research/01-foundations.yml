    3; the SF3B1 branchpoint pocket and splicing-modulator structures (PMC5458519, PMC9894173) belong to chapter
    6; SpliceAI''s variant-interpretation figures belong to chapter 7; the prevalence figure on PMC4248296
    L10 belongs to chapters 2 and 4 and was read but not recorded. No prevalence figure, no catalogue count
    and no disease case is recorded here.'
  why: Recording any of these again would produce the same fact stated twice with two different numbers, which
    is what the one-home rule exists to prevent.
- note: Anchored and read but not recorded as a claim because the assigned id range FND-141 to FND-179 was
    full; each is reusable without re-reading. (1) Doc PMC7410833 L56 (Van Nostrand et al., Nature 2020) states
    that for non-spliceosomal factors 'the upstream 5′ splice site showed even greater enrichment than the
    intronic regions directly flanking the alternative exon', which those authors call an underappreciated
    region for splicing regulation. (2) Doc PMC7410833 L184, an Extended Data figure caption, states that of
    the 203 eCLIP and knockdown pairings, '92 pairings (72 RBPs) with at least 100 significantly included or
    excluded events are shown', which bounds how many factors a splicing map can be drawn for. (3) Doc PMC514884
    L18 (Fairbrother et al., PLoS Biology 2004) states 'SNP density was approximately 20–30% lower near both
    the 3′ splice site' than in the exon interior, a confirmation of an earlier observation by others. (4)
    Doc 101832694 L1 (abstract_only, 'Integrative Modeling Defines the Nova Splicing-Regulatory Network and
    Its Combinatorial Controls', doi 10.1126/science.1191150, 2010, no author list in corpus metadata) states
    'approximately 700 alternative splicing events directly regulated by the neuron-specific factor Nova in
    the mouse brain' were identified by a Bayesian network over binding data, splicing microarrays, motifs
    and conservation, and that the resulting network showed combinatorial regulation by Nova together with
    the Fox factors.
  why: 'Each is line-verified and would strengthen a section that is currently one record thin: (1) and (2)
    belong beside FND-147 to FND-151, (3) beside FND-161, and (4) beside FND-179 as a second, independent style
    of combinatorial-control evidence.'
- note: Anchored and read but not recorded because the id range was full. Doc 69527579 (abstract_only, L1,
    'The human splicing code reveals new insights into the genetic determinants of disease', doi 10.1126/science.1254806,
    2015; no author list or journal in corpus metadata) reports a machine-learning model scored over more than
    650,000 intronic and exonic variants, with intronic disease mutations more than 30 nucleotides from any
    splice site altering splicing nine times as often as common variants, and missense disease mutations having
    the least impact on protein function being five times as likely as others to alter splicing.
  why: The successor to FND-154 and FND-155 and the strongest in-corpus statement of what a splicing code could
    predict rather than what it could not. Its variant framing overlaps chapter 7, so if promoted the claim
    must be about prediction from sequence and not about the share of pathogenic variants acting through splicing,
    which chapter 7 already owns through PMC6679692 and doc 34980441.
- note: 'Read but not recorded because it is a review and CONTRIBUTING forbids citing a review for a primary
    finding. PMC3165201 (Witten, J. T.; Ule, J., Trends in Genetics 2011, doi 10.1016/j.tig.2010.12.001, full
    text) surveys the RNA splicing map approach. Line L13 states that the early SR-enhances / hnRNP-silences
    conclusion was supported by minigene reporter studies of a small number of exons, that exceptions to the
    rule were found, and it names three: SR proteins repressing the adenovirus L1 unit when bound to an upstream
    intron, hnRNP L silencing near a 5'' splice site but enhancing further downstream, and Nova silencing from
    within an exon but enhancing from downstream. Lines L19 and L20 are the strongest located statement that
    the positional rule is not uniform: hnRNP C is described as exclusively silencing when bound near the alternative
    exon, and TIA proteins as binding only downstream of exons and only enhancing, ''with no evidence for silencing
    when binding to other sites near the alternative exons''. L18 reports position-dependent effects shared
    between mouse Nova and the Drosophila orthologue Pasilla, L22 that hnRNP A1 and hnRNP H must bind both
    ends of an intron to stimulate its splicing, and L25 that factors sharing positional principles are not
    homologous to one another.'
  why: The chapter wants a source saying the positional rule fails for a given factor. FND-151, FND-152 and
    FND-153 bound it from inside the data, but the explicit per-factor exceptions live here. Either cite this
    in the review voice, or chase its references 27, 28, 29, 41 and 51 for the primaries on the adenovirus
    L1 unit, hnRNP L, Nova, the TIA proteins and the two-end requirement.
- note: 'Not resolved: the effect of the distance between a regulatory element and the splice site it controls.
    Searched ''intron length distance between splicing regulatory element and splice site effect on regulation''
    over -s papers. FND-175 covers intron length against signal strength and FND-176 covers structural occlusion,
    but neither is a distance-to-element measurement. The nearest source located and not read is PMC2018619,
    ''Does distance matter? Variations in alternative 3-prime splicing regulation'' (Akerman, M.; Mandel-Gutfreund,
    Y., 2007). Everything else the search returned was a single-gene case.'
  why: The brief asks for distance explicitly and the chapter will otherwise have to assert it in its own voice.
    One read of PMC2018619 would settle whether a general distance result exists in this corpus.
- note: 'Not found as citable text: a transcriptome-wide count of how many distinct RNA-binding proteins bind
    one alternative exon. The ENCODE survey reports exactly this quantity, but only inside a figure: PMC7410833
    L57 is the Fig. 5 caption and describes ''the average number of RBPs with eCLIP peaks at skipped (green)
    versus constitutive (grey) exons and flanking introns'' without giving any number in the body text. The
    figure was deliberately not used. FND-179 is the nearest citable substitute, that more than half of the
    events one study detected respond to more than one hnRNP protein.'
  why: '''How many factors bear on one exon'' is the most quotable number in the combinatorial-control section
    and the chapter must not invent one. Only the ENCODE supplementary tables, or a figure-licence route, would
    give it.'
- note: 'Not found in a form that can be quoted: a fraction of variance in exon inclusion explained by cis
    sequence alone, stated with its denominator. Docs 102170988 (FND-154) and 63761222 (FND-157) are abstract-only
    in the corpus and their abstracts carry no accuracy or variance figure; PMC4058935 (FND-155, FND-156) reports
    area under the curve rather than variance explained. PMC10576025, ''Deciphering RNA splicing logic with
    interpretable machine learning'' (Liao, S. E.; Sudarshan, M.; Regev, O., 2023), was located and not read
    and may carry such a figure.'
  why: The brief asks how much of a splicing outcome is predictable from cis sequence alone. The chapter can
    state the area-under-curve figures in FND-155 but must not convert them into a share of variance explained.
- note: 'Independence cannot be checked for thirteen of the sources recorded here, because they are abstract-only
    records whose meta.json carries no author list and no journal: docs 121361128, 84458598, 90239050, 102170988,
    63761222, 142715658, 132327446, 113410676, 38636021, 9381834, 122168749, 80168537 and 89601190. Their authors
    and journals are written as RESOLVE_FROM_DOI and their bibkeys are title-derived, and the notes on FND-141,
    FND-159, FND-166, FND-171 and FND-179 say so rather than asserting independence. The overlaps that were
    confirmed from corpus metadata or from a cited line are: five shared authors across FND-147 to FND-151
    (Van Nostrand, Pratt, Yee, Graveley and Yeo, from the two author lists); the RESCUE-ESE group testing its
    own motifs across FND-159 and FND-161, from line L11 of PMC514884; the identity of the FND-166 document
    as the Ke et al. 2008 paper FND-165 contradicts, from the reference at line L121 of PMC6169883; one laboratory
    behind FND-162 to FND-165 (Savisaar and Hurst); and a shared exon-set lineage between FND-154 and FND-155,
    from line L27 and reference line L174 of PMC4058935, which is a data dependency and not a confirmed author
    overlap.'
  why: scripts/resolve_metadata.py --write will fill these bylines from Crossref, after which several of the
    disclaiming notes should be revisited. Until then the chapter must not assert that any two of those thirteen
    sources are independent, and must not assert that any two share a laboratory either.
- note: 'Not measured by anything read: what fraction of cis elements identified in a reporter are active at
    their native locus. Every enumeration recorded here is a reporter result - FND-159 and FND-160 from exonic
    reporter screens, FND-167 from a GFP-SMN1 minigene, FND-153 from synthetic designer exons - and FND-168
    records four of sixteen selected silencers reversing direction between two cell lines in the same reporter.
    No source read bridges reporter activity to endogenous activity.'
  why: The chapter's standing promise is that no measure is introduced without what it cannot express. For
    cis elements that limit is the reporter, and it will have to be argued in the book's own voice.
- note: 'Not found: a partition of one splicing decision between cis sequence and trans factor concentration,
    measured on the same exons. FND-157 bounds the cis side on synthetic sequence and FND-171 to FND-174 give
    the trans side as titrations and phosphorylation, but nothing read apportions an exon''s inclusion between
    the two. Also not found: an SRPK or CLK perturbation linked to a measured change in a named exon''s inclusion
    outside a cancer or plant setting; chapter 6 holds the SRSF1 / SRPK1 / PD-1 case and the CLK inhibitor
    trials, and chapter 3 holds the plant SRPKII / SR45 / HAB1 case, so FND-174 carries the kinase layer as
    biochemistry only.'
  why: A reader told that a tissue sets a splicing choice will ask how much of the choice the sequence fixes
    and how much the cell's factor levels fix. The honest answer from this corpus is that the question has
    not been posed that way, and the chapter should say so rather than imply a split.
- note: 'None of the open questions in the existing leads of research/01-foundations.yml fall inside this assignment,
    so none were resolved: the coining paper for ''intron chain'', a defining source for isoform fraction and
    dIF, the conflicting minor-intron percentages, and what an event-level metric cannot express. Nor was the
    AS-NMD preprint behind FND-025 re-checked. The regulation searches did not incidentally turn any of them
    up.'
  why: So that a later pass does not assume a regulation agent covered them.
- note: Anchored and read but cut for want of a record id, reusable without re-reading. (1) PMC5740500 L34
    also reports that 91 of the 122 previously annotated human mutually exclusive exons, 75 per cent, are of
    the frame-breaking type against only 25 of the 615 newly predicted ones, and that a docker-site and selector-sequence
    arrangement was identified in the CD55 gene; the rest of that line is claimed at FND-213. (2) PMC5740500
    L17 records the prior human estimates the 1,399 replaced, 118 from Suyama 2013 and at most 167 from Wang
    et al. 2008, and the belief it overturned, that vertebrate mutually exclusive exons occur only in pairs.
    (3) PMC5740500 L37 reports that of 1,399 mutually exclusive exons, 273 from 233 clusters could be mapped
    onto human or mammalian protein structures and 87 per cent of those have at least one exon terminus embedded
    in a secondary structural element, which the authors use as structural evidence that the exons are genuinely
    mutually exclusive rather than misclassified neighbouring cassette exons. (4) PMC2394768 L85 reports that
    exon pairs with Spearman correlation at or above 0.6 sit a median of two intervening exons apart while
    uncorrelated and negatively correlated pairs sit a median of four apart, p = 0.021, and L86 that about
    50 per cent of the genes with significantly correlated pairs have known neural-specific functions. (5)
    PMC2923625 L21 reports that only 19 per cent of the genes with non-overlapping alternative first exons
    have three or more of them, and that 45 per cent of the distinct alternative first exons matched CAGE evidence
    in K562 at the same position. (6) PMC4281565 L23 reports that 19.4 per cent of constitutively spliced mouse
    introns with an identifiable human ortholog are detained introns against 6.3 per cent of those without
    one. (7) bio_ff2b1b477f35 L2 states that the average internal exon in mammals is roughly 150 nucleotides,
    which is the comparison that makes a 3-to-27-nucleotide exon legible to a reader. (8) bio_fb0078676e4e
    L269 states that only two kinds of read bear on intron retention, reads spliced across the intron and reads
    lying inside it, and that the IRratio uses only those; everything else mapping to the gene is discarded.
    (9) PMC7145568 L57 states that intron retention is a low-frequency event whose detection needs adequate
    read depth, so accurate detection from single-cell sequencing is limited. (10) PMC4216919 L8 carries the
    mechanism of the tuning claimed at FND-189, nonsense-mediated decay together with nuclear sequestration
    and turnover, which that record's own line does not.
  why: Each is line-verified at the stated anchor, so a later pass can promote any of them without new reading.
- note: 'The open question in research/01-foundations.yml about what an event-level metric cannot express is
    only partly closed by this pass, and not for percent spliced-in. What was found is a source that names
    the equivalent gap for exon position rather than for splicing level: bio_61f3e4aa6d09 L17 calls the impossibility
    of assigning an exon uniquely to first, internal or last the unsolved "exon type problem", recorded at
    FND-208. Nothing read in this pass states what a single percent-spliced-in value cannot express. Searches
    covered intron-centric and event-centric quantification, event-based against transcript-based differential
    analysis, and the limits of local splicing variation; the nearest anchored statement remains 04-technology-arc
    TECH-035. The chapter''s sentence about what PSI cannot express should still be the book''s own framing,
    now able to cite FND-208 for the analogous problem one level up.'
  why: The distinction between an event metric and a transcript metric is load-bearing for the whole book and
    must not be attributed to a paper that does not make it.
- note: 'The open question about a defining source for "cassette exon" as distinct from "skipped exon" is now
    closed in the negative, with evidence. A corpus-wide regex for declarations of synonymy returned twenty
    papers, every one of which asserts the equivalence in passing inside an introduction or a methods paragraph
    and none of which defines or deprecates either term: among them PMC3642047 L28 ("Skipped exons are also
    referred to as cassette exons in the literature", recorded at FND-219), PMC3531206, PMC6633195, PMC7410833,
    PMC7772363 and PMC8567453. The direction of the gloss is not even consistent: some treat cassette exon
    as the explanation of skipped exon and others the reverse. The glossary should therefore declare the two
    synonymous on the book''s own authority.'
  why: The lead asked for the question to be resolved or for a reason it cannot be; this is the reason, with
    the search recorded so it need not be repeated.
- note: 'Not found: any source that gives a count or a percentage of alternative last exon events in a named
    human annotation release, comparable to the alternative-first-exon counts recorded at FND-205. Searches
    covered alternative last exon event types and classification, terminal exon choice, tandem poly(A) sites
    against alternative terminal exons, and the composite-terminal-exon vocabulary. What exists in the corpus
    instead is the exon-position classification of bio_61f3e4aa6d09 (FND-207 to FND-209), which counts terminal
    and hybrid exons in cell lines and tissues rather than in an annotation, and PMC10767918, a database reporting
    12,063 unannotated terminal exons found in human single-cell transcriptomes, which was not read and which
    belongs to chapter 8 or 9 if it is used at all. A chapter sentence giving the frequency of alternative
    last exons in an annotation has no source here.'
  why: The brief asked for how often each of the terminal-exon classes occurs in an annotation; the first-exon
    half is answered and the last-exon half is not, and the chapter should not fill the gap by symmetry.
- note: The quantitative comparison behind FND-190 was deliberately not claimed. bio_fb0078676e4e reports Spearman
    correlations against simulated truth of 0.421 for percent spliced-in, 0.541 for the IRratio and 0.822 for
    its own SIRratio, but these appear only at L86 to L88, where L86 is a supplementary figure caption and
    L87 and L88 are machine-generated descriptions of the figure image rather than author text. If the chapter
    wants those three numbers it should take them from the published version of this work, not from these lines.
  why: A number whose only anchor is an auto-generated image description is not safely citable, and the project
    has already lost one figure's denominator.
- note: 'Intron retention measurement is recorded here as a live dispute rather than as a solved problem, and
    the records that carry it are FND-187 and FND-190 to FND-194, with FND-186. Two things are contested and
    should not be smoothed together. First, whether short-read calls are trustworthy at all: FND-191 and FND-192
    say largely not, FND-190 says the estimators are biased and offers a replacement, FND-193 names the specific
    confounders and FND-194 records that no benchmark existed when the tools were adopted; FND-187 gives the
    metric and the prevalence figure those criticisms are about. Second, whether two landmark surveys of unspliced
    introns in polyadenylated RNA were even looking at the same molecules: FND-186 carries the detained-intron
    authors'' argument that they were not, against the survey recorded at FND-187 and FND-189. The independence
    relations are not what they look like and the separate IRFinder lead in this file sets them out: FND-190,
    FND-193 and FND-194 all trace back to the IRFinder collaboration, and only FND-186, FND-187, FND-189, FND-191
    and FND-192 stand outside it.'
  why: The chapter would rather report this dispute than assert a resolution, and the independence relations
    are where reviewers find defects.
- note: The microexon size definition is recorded as a three-way disagreement at FND-195 (3 to 15 nucleotides),
    FND-197 (30 or fewer) and FND-200 (3 to 27), and the count is recorded as rising at FND-198 and FND-201.
    Neither is a disagreement between independent fields. FND-195, FND-200, FND-201 and FND-203 share the author
    Irimia; FND-200 and FND-201 also share Braunschweig and Blencowe with FND-195 and with FND-187; FND-197,
    FND-198 and FND-201 share Parada and Hemberg. Only FND-202, from Gordon, Cruz and Neugebauer, is outside
    that set. A chapter sentence that presents the widening of the size range or the growth of the count as
    independent confirmation would be wrong.
  why: The book's reviewers find more defects in sentences about independence than in sentences about biology,
    and this topic is the clearest case of it in chapter 1.
- note: 'Not recorded although relevant, because another chapter owns it: Dscam1 and the arthropod mutually
    exclusive exon clusters, which are the real extreme of the class and are held in 02-animals under the Dscam1
    architecture and Dscam1 splicing mechanism topics, including the exon-cluster sizes and the competing RNA
    structure mechanism. PMC5740500 L16 relays the arthropod figures and PMC8042237 covers Coleoptera Dscam1
    RNA structures; neither is anchored here. FND-214 and FND-215 record the human extreme instead, and the
    chapter should cross-reference chapter 2 rather than restate the arthropod numbers.'
  why: Recording the arthropod clusters again would produce the same fact stated twice with two different numbers.
- note: 'Not recorded although read, because another chapter owns it: the cancer results of PMC7935315 (that
    SRRM4 is the most consistently silenced splicing factor across the tumour types analysed, and that restoring
    it slows proliferation in cell lines and in a mouse xenograft) belong to chapter 6; the autism results
    of PMC13781783 and of the Irimia abstract belong to chapter 7; the zebrafish srrm4 mutant with only minor
    splicing changes and no overt developmental defect, bio_f7b4cd926e7d, belongs to chapter 2 and would be
    the bounding negative for the regulator; and the plant microexon misannotation survey PMC8831610, which
    reports thousands of conserved plant microexons mostly absent from annotation, belongs to chapter 3. All
    four were located and none is anchored here.'
  why: Each would pass the inclusion test somewhere in the book, and leaving a pointer stops the next pass
    searching for them again.
- note: 'Not recorded: a source stating the frequency of alternative first or last exons in the GENCODE or
    Ensembl releases the rest of the book uses. FND-205 is computed on UCSC Known Genes over NCBI36 as of 2010,
    which is two assemblies behind anything else in chapter 1, so any table placing it beside a current GENCODE
    figure must state both releases or it will read as an error.'
  why: The project's own rule is that counts from different annotations must carry their inclusion rules; this
    one also carries a fifteen-year gap.
- note: 'IRFinder itself is in the corpus and was not recorded for want of a record id: PMC5353968, "IRFinder:
    assessing the impact of intron retention on mammalian gene expression", Genome Biology 2017, doi 10.1186/s13059-017-1184-4,
    whose meta.json byline is Robert Middleton; Dadi Gao; Aubin Thomas; Babita Singh; Amy Au; Justin J-L Wong;
    Alexandra Bomane; Bertrand Cosson; Eduardo Eyras; John E. J. Rasko; William Ritchie. It is the obvious
    primary for the definition of the IRratio and for the contamination and mappability routines that FND-193
    describes at second hand. It also settles the independence question that runs through FND-190, FND-193
    and FND-194: Ritchie co-authored IRFinder and then co-authored the replacement metric at FND-190, while
    Wong and Rasko co-authored IRFinder and then the review at FND-193 and FND-194. A chapter paragraph that
    sets these sources against one another as rival camps would be wrong; they are one collaboration revisiting
    its own tool, with only the benchmark at FND-191 and FND-192 standing outside it.'
  why: The independence relations here are exactly the kind of sentence the book's reviewers find defects in,
    and the primary is available if a later pass wants the metric defined from its own source.
- note: 'Three claim records in this file rest on documents read as preprints and should be re-checked against
    their published versions before the chapter asserts their numbers: FND-190 on bio_fb0078676e4e, for which
    no journal version was located; FND-202 on bio_ff2b1b477f35, likewise; and FND-207 to FND-210 on bio_61f3e4aa6d09,
    whose journal version exists at doi 10.1126/sciadv.abk1752 and whose journal name was not read anywhere,
    so that field is RESOLVE_FROM_DOI. The last matters most, because the preprint itself is internally inconsistent:
    its abstract says more than 100,000 inter-tissue hybrid exons and its results text says more than 130,000,
    which FND-209 records as a discrepancy. Whichever figure the published version carries should replace both.'
  why: SCHEMA requires a lead saying a preprint figure must be re-checked, and this file has one figure that
    moves within the preprint itself.
- note: A scope caveat found while verifying FND-182 that bears on records already in research/01-foundations.yml.
    PMC2467475 L81 states that the GENCODE input to that analysis was built by mapping expressed sequences
    onto the ENCODE pilot regions of the genome, not the whole genome, and L51 reports that it clustered into
    381 loci holding 1,352 coding transcripts. Every GENCODE figure from that paper is therefore a pilot-region
    figure, while its RefSeq and Ensembl figures are genome-wide. FND-012 states a rank order over three annotations
    including GENCODE, and the complex-event and mutually-exclusive-exon shares in FND-013 and FND-014 are
    quoted as RefSeq-to-Ensembl ranges whose GENCODE values sit inside them. None of those records is wrong,
    but a chapter table that prints the three annotations side by side needs to say that one of the three covers
    a small part of the genome.
  why: The project's rule is that counts from different annotations must carry their inclusion rules, and this
    one's inclusion rule is a genomic subset rather than a filtering threshold.
- note: 'Located and not read, so not recorded: PMC6071210, Ivanov and Pervouchine, "An Evolutionary Mechanism
    for the Generation of Competing RNA Structures Associated with Mutually Exclusive Exons", which proposes
    that duplication of adjacent introns carrying stem-loops creates the competing selector sequences that
    enforce mutual exclusivity after tandem exon duplication. That is the RNA-structure mechanism FND-213 names
    as the residual explanation without evidence for it, and it would be the record that closes the mechanism
    list. Also located and not read: PMC3228551, Pillmann and colleagues, which predicts mutually exclusive
    exons from length, splice site, reading-frame conservation and sequence homology, and bio_05e9f5c0720c,
    a preprint on ancestral intronic regulatory elements in the SCNalpha family. Pervouchine is already in
    the book as pervouchine2013introncentric at FND-027, so the bibkey would need to be a second one for the
    same author.'
  why: FND-213 leaves RNA secondary structure as a named but unevidenced mechanism, and the source that would
    evidence it is in the corpus and was not opened.
- note: 'The two Vitting-Seerup papers that the chapter''s existing leads record as "not in the corpus" ARE
    in the corpus, as abstract-only records with numeric doc_ids: the 2017 isoform-switch landscape paper is
    49332250 (doi 10.1158/1541-7786.mcr-16-0459) and the 2018 IsoformSwitchAnalyzeR paper is 37927225 (doi
    10.1101/399642). Both abstracts were read. NEITHER defines isoform fraction or its differential form; the
    2017 abstract reports that switches with predicted functional consequences affected approximately 19 per
    cent of multiple-transcript genes across more than 5,500 patients in 12 solid cancer types and that 31
    switches predicted survival, and the 2018 abstract describes only the extension to genome-wide splicing-type
    analysis. The v2 paper PMC13504270 mentions dIF once, at L60, as "isoform switch effect size (dIF)" with
    a citation to another work, and does not define it. An exhaustive corpus grep for "differential isoform
    fraction" or "dIF)" returns 51 papers; the first ten were inspected and each applies a threshold without
    defining the quantity, while the other 41 were not opened. Conclusion for the chapter: there is NO defining
    source for isoform fraction or dIF in this corpus, and the two candidate methods papers are present but
    abstract-only and silent on the definition. The glossary entry must either be written on the book''s own
    authority or cite FND-252 and FND-253 explicitly as operational definitions from application papers.

    '
  why: Corrects a standing lead that said the papers were absent; the conclusion is the same but the reason
    is different, and a reviewer told the papers are absent would find them.
- note: 'One further in-corpus definition of isoform fraction exists and was deliberately NOT recorded as a
    claim: PMC11014633 L93 (also its preprint bio_7cac5b7e6d18) defines isoform fraction as "the expression
    level of an isoform normalized to the total expression level of its host gene". It sits inside a figure
    caption, and CONTRIBUTING forbids copying figure captions out of papers, so a claim anchored there would
    be awkward even though the line is ordinary text in content.lines. It is also a preprint and an application
    paper, so it is no better authority than FND-252. Line verified; reusable without re-reading if the chapter
    decides a caption anchor is acceptable.

    '
  why: A later pass should not spend time re-finding it, and should know why it was left out rather than assume
    it was missed.
- note: 'Anchored and read but not claimed, reusable without re-reading. (1) PMC9984406 L86: the point estimate
    of the inclusion index is reported as the mean of the averaged posterior distribution, and a discretised
    version of the distribution is saved for display. (2) PMC9984406 L146: these authors state that failing
    to disable a tool''s default thresholds has "previously led to severe misrepresentation of MAJIQ''s performance"
    in two published benchmarks, which is a direct dispute about how benchmarks are run. (3) PMC5600148 L15:
    on GEUVADIS samples, dominant isoform switching called at p below 1e-6 under kallisto or eXpress estimates
    disappears under Salmon''s GC-bias-aware estimates, i.e. two quantifiers disagree about which isoform dominates
    in the same real samples. (4) PMC5600148 L15 also states that on idealised simulations without realistic
    bias the accuracy of different quantifiers converges, which is the mechanism by which two simulation benchmarks
    of the same tools can reach opposite conclusions. (5) PMC5200948 L22: testing each transcript or exon ratio
    independently ignores the correlated structure of quantities that must sum to one, and the authors say
    the effect of this on false discovery control is not known. (6) PMC5200948 L25: feature ratios do not record
    whether they came from high or low expression. (7) PMC6178912 L63: using raw transcript counts rather than
    abundance-scaled counts lets a usage change between isoforms of different length alter the gene''s total
    count and so bias the proportions a usage test is computed from. (8) PMC13547381 L57: isoform quantification
    was poorest for short isoforms, short constituent exons, many isoforms per gene, high GC content and low
    expression. (9) PMC13547381 L36: differential isoform calls had precision 0.81 but recall only 0.38 against
    the Quartet reference, with false negatives characterised by low coverage and high between-replicate coefficient
    of variation. (10) PMC8145802 L88: in real data, one read decided a 137-count-to-zero disagreement between
    two quantifiers at a highly expressed two-isoform gene, because only two reads were unambiguous. (11) PMC4321899
    L38: the 782-gene, 5,691-transcript test set, introduced there for the comparison of RNA-seq against transcript-level
    microarrays; whether the composite transcript-level scores at L37 were computed on that same set was NOT
    established, which is why FND-256 omits the denominator.

    '
  why: Each is line-verified and several are better claims than some of what fitted in the FND-221 to FND-259
    range; the range was the binding constraint, not the evidence.
- note: 'Not found, searched specifically: a paper that compares the three estimators now recorded for the
    same name (read densities over the event at FND-026, a junction-count posterior at FND-222, and transcript
    abundances at FND-224) on one dataset and reports how far they disagree. Searches covered junction-only
    against exon-body inclusion reads, both exonic and junction reads, and inclusion-read density; an exhaustive
    corpus grep on "only junction reads", "junction reads only", "junction-only", "exon body reads" and "exonic
    reads and junction reads" returned 88 papers of which none was about this. The chapter will have to say
    that the three estimators share a name and state in its own voice that no head-to-head comparison was located.

    '
  why: It is the obvious question a reader asks once the three estimators are side by side, and the absence
    should be stated as scoped rather than implied.
- note: 'Not found, searched specifically: a source measuring technical replication of isoform-level quantification
    from the SAME library preparation sequenced twice, as distinct from biological replicates or different
    laboratories. FND-256 and FND-257 are both inter-site and inter-protocol; FND-251 and FND-233 treat only
    inferential and biological variance. Searches covered reproducibility of isoform-level quantification between
    laboratories, protocols and replicates, and RNA-seq reproducibility assessment. PMC7241209 (a reproducibility
    reassessment of the SEQC project) was found but not read.

    '
  why: The chapter's reproducibility sentence should not be allowed to imply that technical replication has
    been measured when what has been measured is inter-site agreement.
- note: 'The non-identifiability work exists in this corpus in three records and the trap is real: bio_3bb4a0137146
    (preprint, title "Finding ranges of optimal transcript expression quantification in cases of non-identifiability",
    author order Ma, Zheng, Kingsford), bio_39515ab0703f (preprint, the published title, author order Zheng,
    Ma, Kingsford) and PMC8892959 (the published Journal of Computational Biology version, full text). FND-241
    and FND-242 were first drafted against bio_3bb4a0137146 and then moved to PMC8892959, because research/04-technology-arc.yml
    TECH-032 and TECH-033 already cite PMC8892959 under bibkey zheng2022nonidentifiability; citing a preprint
    of the same work would have produced two bibkeys for one work and failed a gate. Any later pass that finds
    either preprint should use PMC8892959 instead. Chapter 4 owns the plain statement that the maximum-likelihood
    answer is not unique (TECH-032, L6) and that depth does not fix it (TECH-033, L15), so chapter 1 must not
    restate either.

    '
  why: The same work appears three times under two titles and two author orders, which is exactly how a duplicate
    bibkey and a double-counted result get into the book.
- note: 'FND-243 and FND-244 are abstract-only identifiability analyses and their percentages are properties
    of annotation plus an assumed library, not measurements on sequencing data. FND-244''s abstract also assumes
    coverage sufficient to interrogate every junction read, which is the assumption real data violates. Neither
    abstract states the criterion for calling a gene identifiable, so a table placing their percentages beside
    one another would be misleading; FND-243 varies the platform at fixed criteria and FND-244 varies the library.

    '
  why: The chapter's identifiability section is the one most likely to quote a percentage as if it were an
    observed quantity.
- note: 'Independence map for the measurement records, because the chapter''s reviewers find more defects in
    sentences about independence than about biology. Love and Patro are authors of FND-232 (Salmon), FND-235,
    FND-236, FND-248, FND-249 and FND-251; Soneson is an author of FND-236, FND-238, FND-248 and FND-249 and
    of the already-recorded FND-028; Robinson is an author of FND-237, FND-238 and FND-245. The benchmarks
    that are NOT from that circle are FND-239 and FND-240 (Grant laboratory), FND-228, FND-246 and FND-257
    (Quartet and MAQC consortium), FND-256 (SEQC consortium) and FND-259. Any sentence in the chapter that
    presents two of these as independent confirmations needs checking against this list.

    '
  why: Three of the records that look like independent confirmations of one another come from overlapping author
    groups, and the chapter 6 pass built a false "irreconcilable explanations" claim out of exactly this.
- note: 'How far the intron chain search actually went, so the chapter does not overstate the absence. An exhaustive
    corpus grep for "intron chain" reported "Matched 100 paragraphs across 100 papers" and listed only the
    first few; that is a capped result, not a complete one, and it was not date-sorted, so the EARLIEST use
    of the two-word phrase in this corpus has NOT been established. What has been established is that "chain
    of introns" occurs in five papers and that the earliest of those is AceView 2006 (FND-254). Two further
    links in the attribution chain were checked: PMC5720828 L23 states that Cuffcompare defines a correct transcript
    as the chain of introns matching the reference, leaving variance in the first and last exon, and cites
    its reference [24] for the underlying weakness in transcript boundary determination; [24] resolves at L144
    of that document to Steijger et al. 2013, Assessment of transcript reconstruction methods for RNA-seq,
    PMC3851240, which is cited for the boundary problem and not for the intron-chain definition. PMC3851240
    was not opened. The chapter''s sentence should say that the earliest operational definition located is
    AceView''s and that no coining paper for the phrase was found, scoped to that search.

    '
  why: The existing lead says flatly that no paper in the corpus introduces the term, and the search behind
    that cannot carry an unscoped absence.
- note: 'Two further line-verified items from PMC8892959, reusable without re-reading, both stronger than some
    of what fitted in the assigned id range. L14 distinguishes two kinds of uncertainty in a transcript abundance:
    the error from small sample size, which bootstrapping and Gibbs sampling estimate and which more sequencing
    reduces, and the error from non-identifiability, which these authors call more fundamental because it persists
    under infinite sample size. That is the sharpest statement in the corpus of why a point estimate from four
    reads and a point estimate from four hundred are different measurements for two independent reasons, and
    it ties FND-233, FND-250 and FND-241 together. L23 also reports that most differential calls were robust
    once the reference transcriptome was assumed to contribute more than 40 per cent of expression, which is
    a swept model parameter rather than a measured annotation property.

    '
  why: The FND-221 to FND-259 range was the binding constraint; a later pass should promote L14 before adding
    anything new.
- note: 'Adjacent records already in the book that the writer must not merge with these. research/01-foundations.yml
    FND-029 already cites the limma and edgeR treatment of quantification uncertainty for differential usage
    (PMC12684397); FND-235 and FND-251 here are the general statement that uncertainty is feature-specific
    and one team''s benchmark of the competing propagation methods, and the three should be held against each
    other inside a paragraph rather than cited one per sentence. research/05-long-reads.yml LR-090 reports
    an over-dispersion comparison between matched nanopore and Illumina libraries that bears on the same quantity
    as FND-235 but belongs to chapter 5, and LR-120 records expectation-maximisation inside a long-read framework,
    which is not the same claim as FND-229.

    '
  why: Two of the three remaining defects on the chapter 5 pass were a record cited for a claim it does not
    make and two sources presented as agreeing when they measure different things.
- note: 'Searched and not pursued because another chapter owns them: LRGASP and long-read benchmark design
    (chapter 9), long-read isoform identification tools (chapter 5), the historical statement that short reads
    cannot reconstruct a molecule (chapter 4, TECH-028 and TECH-029 on PMC3146043 L13, which FND-255 deliberately
    does not re-anchor). PMC13547381 L84 compares short-read against long-read splicing analysis and belongs
    to chapter 5 or 9 rather than here.

    '
  why: Keeps the one-home rule and records where the adjacent material sits so a later pass does not re-search
    it.
- note: 'RESOLVED, and the open lead in research/01-foundations.yml about FND-025 can be closed. There is no
    published journal version of French et al. 2020 to re-check the 19 and 22 per cent denominators against.
    Searched: lookup title (returns only bio_5eb258456cf7); lookup author on two spellings of the first author
    (no documents); a keyword search -s papers on the full title and topic; search -s abstracts with --author
    Brenner; a boolean corpus grep for the two counts together, which matched 66 documents dominated by unrelated
    arXiv numerics and nothing relevant, and the same grep against --source abstracts, which matched none.
    Outside the corpus, the Crossref record for 10.1101/2020.07.01.183327 is of type posted-content and carries
    an empty relation object with no is-preprint-of link; a Crossref bibliographic query on the title and authors
    returns the preprint and no journal article; and the bioRxiv published-version endpoint answers "no articles
    found for published version" for that DOI. The same endpoint answers the same for the companion preprint
    10.1101/2020.03.08.981811, cited here as FND-278, FND-280, FND-292 and FND-294. Both should stay flagged
    preprint: true unless a later check finds otherwise; as of 2026-11-23 no journal version is indexed by
    Crossref or acknowledged by bioRxiv for either DOI, which is the strongest statement these two sources
    support and is not the same as the paper never appearing. The same two checks were run on the Cortazar
    preprint cited at FND-275 to FND-277: its DOI is not a bioRxiv 10.1101 identifier so the bioRxiv endpoint
    cannot answer for it, and a Crossref bibliographic query on its title returns only the posted-content record,
    so it too has no located journal version.

    '
  why: The chapter's only AS-NMD prevalence figure rests on a preprint, and the file has been carrying an instruction
    to re-check it against a published version that was never published.
- note: 'The preprint abstract of bio_5eb258456cf7 at L13 states the headline set as 9.2 per cent of expressed
    transcripts and more than 20 per cent of alternatively spliced genes, while FND-025 records 19 per cent
    of expressed protein-coding genes and 22 per cent from L28. These are three different denominators of the
    same 2,793 transcripts from 2,116 genes, and the abstract''s own pair is looser than the body''s. Any sentence
    in the chapter must take the pair from one line and say which denominator it is using.

    '
  why: A reader checking the abstract against the chapter would otherwise see a number mismatch that is really
    a denominator mismatch.
- note: 'Read and line-verified but not promoted to a claim for want of record ids, and reusable without re-reading.
    Lloyd, French and Brenner (bio_5128ad0c6c10 L35) report that among ribosome-associated transcripts annotated
    as non-coding, the share whose peak abundance is in the single-ribosome fraction is 60 per cent for pseudogenes,
    52 per cent for long intergenic non-coding RNAs, 61 per cent for antisense transcripts and 57 per cent
    for the processed-transcript class, against 15 and 35 per cent for protein-coding transcripts without and
    with a decay-triggering stop; and that the known decay target GADD45A rises on decay inhibition yet carries
    multiple ribosomes (L29), so ribosome load and decay sensitivity come apart in both directions. Lindeboom
    and colleagues (PMC6858879 L22) give 55 per cent of all possible stops as seen by decay, against the 51
    per cent at L19, on a different threshold. Lindeboom and colleagues (PMC5045715 L41) report nonsense mutations
    depleted 2.2-fold in decay-sensitive regions of oncogenes and 1.8-fold in essential genes, which is selection
    acting through the rules rather than on them. French and colleagues (bio_5eb258456cf7 L46) break their
    2,793 decay targets down by what introduced the premature stop: at least 365, or 13 per cent, by a stop-containing
    cassette exon, 54 by a stop-containing retained intron, and 257, or 9 per cent, by an intron placed downstream
    of the productive stop; the same document at L54 reports that almost 30 per cent of transcripts with a
    normal stop rose on decay inhibition while almost as many fell, which those authors read as secondary effects
    of the knockdown.

    '
  why: Each is already anchored, so a later pass can promote any of them without new reading; the French L46
    breakdown is the only located figure for what share of a decay-target set is produced by a poison exon
    as against other routes, and the Lloyd non-coding percentages are the cleanest located answer to what share
    of a non-coding catalogue is ribosome-associated and decay-sensitive.
- note: 'Not found: any source stating what fraction of an annotation release carries the NMD, retained-intron
    or processed-transcript biotype, expressed as a share of that release. Searched: a keyword search -s papers
    on GENCODE transcript biotype counts with those three biotype names, which returned the GENCODE reference
    papers, the LRGASP assessment and NMDtxDB but no biotype breakdown; and the biotype shares that were located
    are of decay-target sets rather than of annotations, namely FND-297 for a ranked top 1,000 and the Lloyd
    percentages above for ribosome-associated transcripts. FND-296 gives an assembly''s counts, not a release''s.
    The nearest thing in the book is 11-transcript-to-protein PRO-009, which records a long-read-derived proteome
    showing a higher proportion of transcripts predicted to be degraded rather than translated, with no share
    stated. If the chapter wants to say what fraction of GENCODE is annotated as unable to make a protein,
    that number will have to be computed from a release or taken from chapter 9, which owns catalogue composition.

    '
  why: So the search is not repeated, and so nobody builds the figure by dividing a decay-target count by an
    annotation total, which would mix two denominators.
- note: 'Not found as a usable case: ribosome-associated quality control bearing on isoform fate. The nearest
    located source is a ribosome rescue factor, PELOTA, modulating translation start-site choice and the ratio
    of two protein isoforms of C/EBP alpha (bio_7604c2cf6f0e), which would be quality control changing which
    isoform is made rather than deciding an isoform''s fate. That document was seen only as a search result
    summary and was never opened, so nothing about it is line-verified and it must be re-read before any use.
    Two further search results were noted and not opened either: ABCE1 depletion inhibiting decay by promoting
    stop-codon readthrough (bio_950537f26c0b) and a stop-codon-context effect on decay through termination
    kinetics (PMC12278622), both of which appear to be about termination rather than isoform fate. Likewise
    unopened: Viscardi, Sehgal and Arribere (PMC12129023), whose search summary reports endonucleolytic cleavage
    by SMG-6 as the primary decay route in Caenorhabditis elegans, a species-scoped counterpart to FND-263
    and FND-264 that chapter 1 has no use for but chapter 3 might. The chapter should either keep ribosome-associated
    quality control out or introduce it as a mechanism without an isoform case.

    '
  why: The brief asked for ribosome-associated quality control as it bears on isoform fate, and nothing located
    meets the inclusion test, so the gap should be visible rather than filled with a near miss.
- note: 'The dispute is recorded on both sides, and the two sides do not measure the same thing, which the
    chapter should say rather than presenting two equal camps. Regulation: FND-282, FND-283, FND-287 and FND-288
    on conservation of the exons, FND-289 on a direct fitness test, FND-025 and FND-298 on how many transcripts
    qualify. Noise: FND-270, which answers FND-298 on the same question with a microarray measurement across
    tissues, and FND-299, which is about the fate of cryptically spliced products rather than of annotated
    isoforms. FND-270 and FND-298 are the cleanest pair, since they address one question and share no authors.
    They are all compatible in principle: ultraconserved poison exons could be genuine regulation while the
    bulk of frame-breaking splicing is error, cleared in the nucleus. No source located states that reconciliation,
    so a chapter that offers it is speaking in its own voice.

    '
  why: Reviewers of this book find more defects in sentences about the evidence than in sentences about biology,
    and "two sides" is the shape such a defect takes here.
- note: 'Author overlap across the records in this file, built from each document''s meta.json, or from the
    Crossref record for the three abstract-only documents whose meta.json carries no byline, and never from
    recall. Lindeboom, Supek and Lehner are on PMC5045715 (FND-267 to FND-269, FND-271 to FND-273, FND-279)
    and PMC6858879 (FND-274); Lindeboom and Vermeulen are also on PMC6675935 (FND-261, FND-262). Brenner is
    on bio_5eb258456cf7 (FND-025, FND-295), bio_5128ad0c6c10 (FND-278, FND-280, FND-292, FND-294), PMC4379411
    (FND-287), 119527215 (FND-282) and 140710184 (FND-298), and PMC4379411 L6 cites 119527215, so FND-287 builds
    on FND-282. Gehring, Boehm, Britto-Borges and Dieterich overlap between PMC8233366 (FND-264) and PMC11404449
    (FND-296). Mühlemann is on PMC5238794 (FND-265, FND-281, FND-297) and PMC2689704 (FND-266). The Ares laboratory
    work at 119011295 (FND-283) is independent of the Brenner cluster, as is the Blencowe and Maquat work at
    127263064 (FND-270), which matters because those two carry the polarity result and the main contradiction
    respectively. Independent of everything above: bio_3c2d7e5570f8 (FND-275 to FND-277), PMC3091714 (FND-285,
    FND-286), PMC3850096 (FND-263), PMC6962552 (FND-288, FND-289), PMC9627664 (FND-290, FND-291), PMC5602073
    (FND-293) and bio_7f7827dd758d (FND-299), whose authorship differs between its preprint and journal versions
    and is left for resolution from the DOI.

    '
  why: Any sentence in the chapter that treats two of these results as independent confirmation needs this
    list first.
- note: 'Gap in the mechanism coverage, stated so nobody assumes it was looked for and missed. Nothing in this
    file anchors SMG1, UPF2 or UPF3 as factors. SMG1 appears only as the target of the inhibitor used at FND-275
    to FND-277 and as a phosphorylating activity implied by the UPF1-phosphorylation step named at FND-264;
    UPF2 and UPF3 are not anchored at all, and Colombo and colleagues note at PMC5238794 L18 that UPF2-independent
    and UPF3-independent decay have both been reported, which is a reason the chapter should not describe the
    three UPF proteins as an obligatory series. A core-factor review or the Gehring 2005 and Chan 2007 primaries
    that L18 cites would close this, and neither was searched for.

    '
  why: The chapter promises the mechanism, and a reader who meets UPF1 without UPF2 and UPF3 will assume the
    book does not know they exist.
- note: 'Line-verified and cut for space, reusable without re-reading. PMC1779604 L30 and L33: among 784 mouse
    single-start-site promoters carrying a predicted TATA box scoring above 75 per cent in the window 40 to
    19 bases upstream of the dominant start, the spacings 30 and 31 bases carried the highest median tissue
    specificity and the highest promoter counts, and those authors conclude 29 bases is the minimum workable
    TATA-to-start spacing. PMC3467053: reduced functional PABPN1 increases use of proximal poly(A) sites and
    shortens 3'' untranslated regions, which is the primary behind the PABPN1 direction recorded secondhand
    in FND-324. PMC4878610 L7: depleting CFIm25 shifted glutaminase to a proximal poly(A) site inside the KGA
    3'' untranslated region and also altered splicing so as to exclude the GAC 3'' untranslated region, a named-gene
    case of one factor moving an end and a splice at once. PMC7614891 L75: in telescripting, U1 snRNP swaps
    CFIm68 for CFIm59 in 3'' end processing complexes and inactivates them. PMC7614891 L49: cleavage factors
    are required to activate the endonuclease but the activation mechanism is unknown.'
  why: Each is already read and anchored, so a later pass can promote any of them without new reading; the
    PABPN1 and glutaminase items would upgrade two secondhand statements to primaries.
- note: 'Not found: any source in this corpus that states a number of transcription start sites per human gene
    together with the clustering distance that produced it. FANTOM5''s own gateway paper (PMC4310165) names
    the peak files and the annotation pipeline but states neither a count nor a merging rule in its text; the
    FANTOM5 flagship (73951182) is abstract-only; corpus-wide greps for tag-clustering distance rules returned
    only bacterial and transcription-factor-site uses of the same phrasing. FND-313 therefore records the robust-peak
    threshold as described by a downstream user of the dataset, and the per-gene count is left unstated. Chapter
    5 owns the dataset-level start-site diversity, so the gap may not need filling here at all.'
  why: The chapter's standing promise is that a count arrives with its merging rule; for start sites per gene
    this corpus cannot supply both from one source.
- note: 'PMC9892061 is a partial second opinion that was read and not recorded as a claim. In rat primary aortic
    endothelial cells, PacBio long reads gave 36,278 isoforms from 10,145 gene loci and those authors report
    that alternative polyadenylation contributed most to novel isoforms, followed by splicing and then alternative
    promoter use, yet that splicing showed more dynamic change than either end mechanism on angiotensin II
    stimulation (L6). It was not recorded because it answers two different questions in one sentence: which
    mechanism accounts for standing diversity, and which one changes under a stimulus. If the chapter wants
    to say that the ends dominate the catalogue while splicing dominates the response, this is the source,
    and it needs its own record with that distinction stated.'
  why: It is the only source located that separates standing isoform diversity from regulated change in the
    same dataset, which is the distinction the chapter's framing claim quietly elides.
- note: 'Recorded as a dispute rather than resolved, in two pairs. How many poly(A) sites a gene has: FND-318
    (28.6 per cent of messenger RNAs with two or more sites, human expressed sequence tags) against FND-330
    (about 79 per cent of mouse messenger RNA genes, 3''READS), with FND-336 showing three atlases of the same
    human genome differing from 290,168 to 569,005 clusters. How much 3'' end scatter is regulated: FND-335
    and FND-332 treat closely spaced sites and a quarter of intronic events respectively as processing noise,
    while FND-328 argues from elongation-rate mutants that the clusters are not noise. Neither pair of sources
    shares an author where author lists exist; two of the records involved are abstract-only and carry no author
    list at all.'
  why: The chapter would rather report a dispute than assert a resolution, and both disputes bear directly
    on the framing claim that most isoform difference sits at the ends.
- note: 'Not found: a measurement that separates a genuine proximal poly(A) site from a degradation intermediate,
    as opposed to from an internal priming artefact. Searches covered 3'' end sequencing artefacts, degradation
    intermediates resembling poly(A) sites, and template switching. The nearest things located are FND-332
    (spliced polyadenylated introns, which are genuine polyadenylated molecules destined for degradation and
    are counted as sites) and 05-long-reads LR-014, which argues that spurious sites usually blamed on internal
    priming come from template switching instead. The distinction between a real short isoform and a decay
    product may have no direct measurement in this corpus.'
  why: Chapter 1 promises a limit for every measure it introduces, and this is the one limit of 3' end sequencing
    for which no source was found.
- note: FND-333 cites PMC3890989, whose meta.json records doi as null. The record carries the NCBI PubMed Central
    url printed by paperclip instead, which satisfies verify_claims.py, but build_bib.py will need a DOI for
    Acta Naturae 2013, PubMed identifier 24455183, before the reference can render.
  why: A missing DOI on a record that carries the chapter's only contradicting result would stall the bibliography
    build at the worst moment.
