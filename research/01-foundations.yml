leads:
- note: 'Covered in sibling files - do not re-anchor in this chapter. Overall alternative splicing prevalence in
    human: 02-animals ANM-028 and 04-technology-arc TECH-023, TECH-025, TECH-026 (with the denominator and threshold
    caveats). Exon skipping as the commonest class in early RNA-seq: 04-technology-arc TECH-022. Cassette exons
    in animals versus intron retention in other taxa: 03-plants-fungi-other PFO-020. PSI as the event-level workaround
    that short reads forced on the field: 04-technology-arc TECH-035. Major-transcript dominance as a result: 02-animals
    ANM-033, 09-catalogs CAT-005 and CAT-023. Magnitude of unproductive splicing: 02-animals ANM-016. The start-site
    / splice-chain / end-site triplet and its diversity: 05-long-reads LR-021 and LR-022, 09-catalogs CAT-003. Catalog-level
    per-gene transcript counts: 09-catalogs CAT-011, CAT-042, CAT-051, CAT-053. EST-era concentration of variation
    in 5'' UTRs: 04-technology-arc TECH-010.'
  why: Keeps chapter 1 to vocabulary and framing and prevents a second, differently-anchored copy of a number a
    later chapter already owns.
- note: 'No citable defining source was found in the corpus for the term "isoform fraction" (IF) or its differential
    form (dIF). The originating methods papers of Vitting-Seerup and Sandelin are not in the corpus; `search -s
    papers` on the isoform-switch landscape title and on IsoformSwitchAnalyzeR returned only the 2026 v2 paper (PMC13504270),
    which uses isoform switching without defining IF, plus many application papers. The closest in-corpus operational
    definitions are user-level and were not recorded as claims: bio_3f124d4aed6f states IF is the ratio of each
    isoform''s FPKM to total gene expression, and bio_125009b06fd4 operationalises a dominance change as max absolute
    delta isoform fraction at or above 0.15. The glossary entry for isoform fraction will have to be written without
    a citation, or the Vitting-Seerup papers fetched from outside the corpus.'
  why: The chapter promises to anchor every measurement term to a defining paper; this is the one term where that
    is not possible from this corpus.
- note: The term "intron chain" is in wide current use but no paper in the corpus introduces it. `grep -i "intron
    chain" /papers/` returns matches in dozens of tool and atlas papers; SQANTI (PMC5848618 L26) attributes the
    intron-based definition to Tilgner et al. 2013, yet the words "intron chain" and "chain" do not appear in the
    body of that paper (PMC3583448). FND-030 therefore anchors the term to the GffCompare accuracy levels, which
    is the earliest operational definition located, not to a coining paper.
  why: If the book says "the intron chain, as defined by X", X needs checking against the pre-2013 transcript-assembly
    literature (Cufflinks / Cuffcompare documentation) which is not in this corpus.
- note: 'Anchored and read but cut at the 36-claim cap, reusable without re-reading: intron retention makes up about
    12 per cent of the event landscape in transcripts with no annotated reading frame against far less in coding
    sequence (PMC2467475 L68); intron retention is categorically unlike the other event classes because the retained
    RNA still contains a potentially spliceable intron (PMC5602073 L48); detained introns are defined as unspliced
    introns in otherwise fully spliced polyadenylated mRNA, with nuclear retention as the primary consequence (PMC5602073
    L42); SR and hnRNP splicing factors autoregulate through AS-NMD in opposite directions, SR proteins by including
    poison exons and hnRNPs by promoting frame-breaking exon skipping (PMC7764535 L28, L29); differential transcript
    expression can arise from a change in total gene output, from a change in relative isoform usage, or from both,
    which is the reason the Soneson authors argue DTE alone is hard to interpret (PMC4712774 L33); intron-chain-level
    accuracy is computed only over multi-exon transcripts whereas transcript-level accuracy admits single-exon models
    and allows terminal boundaries to differ by up to 100 bases (PMC7222033 L109); the optimal branchpoint-to-3''-splice-site
    distance in human introns is 16 to 25 nucleotides with a minimum of 8 (PMC8624252 L47); and the exonic last
    three nucleotides before a 5'' splice site contribute measurably to U1 binding strength and are omitted from
    most bioinformatic analyses (PMC8624252 L35).'
  why: Each is already line-verified, so a later pass can promote any of them to a claim without new reading.
- note: FND-025 rests on the bioRxiv version of the French et al. AS-NMD survey (bio_5eb258456cf7). Its meta.json
    carries only the preprint DOI and no journal field, and no journal version was located in the corpus. The 19
    per cent and 22 per cent denominators should be re-checked against the published version before the chapter
    asserts them.
  why: Preprint-only numbers can move between versions, and this one is the chapter's single prevalence figure for
    AS-NMD.
- note: 'FND-010 records a conflict rather than resolving it: El Marabti et al. say less than 0.4 per cent of human
    introns are U12 type while Akinyi and Frilander say about 0.5 per cent. Neither review states its inclusion
    rule for what counts as a confidently identified minor intron. Any table that prints a single minor-intron percentage
    will read as an error to a reader who knows the other figure.'
  why: SCHEMA requires conflicts to be recorded and attributed rather than averaged.
- note: 'Not found: a quantitative statement of how much of a given isoform catalog differs from its gene''s reference
    only in untranslated region, as opposed to in coding sequence, computed directly on transcript structures. FND-021
    and FND-022 approach the question from tissue-dependent splicing and from alternative-nucleotide density respectively,
    but neither is a straight partition of a transcript set into coding-changing and UTR-only. Searches covered
    coding versus UTR isoform differences, proteome complexity and alternative nucleotide classification.'
  why: A single clean percentage would be the most quotable number in the chapter's scale section, and the chapter
    should not invent one by combining FND-021 and FND-022.
- note: 'Not located: a defining source for the operational phrase "cassette exon" as distinct from "skipped exon".
    The nomenclature paper (PMC2467475 L10) coins exon skipping and uses skipped exon; cassette appears in the corpus
    mainly in application papers. The two terms should be declared synonymous in the glossary on the chapter''s
    own authority rather than attributed.'
  why: Both terms are used interchangeably by the sibling research files, so the glossary must say so explicitly.
