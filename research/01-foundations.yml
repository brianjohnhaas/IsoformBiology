- id: FND-004
  claim: The branchpoint supplies the acceptor nucleotide for the first chemical step of splicing, but in humans
    its sequence is barely a consensus at all - only YUNAY, one position of which is unconstrained - whereas budding
    yeast holds a near-invariant UACUAAC, which is why human branchpoints must be mapped experimentally rather than
    read off the sequence.
