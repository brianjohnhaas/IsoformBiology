leads:
- note: 'The ENCODE4 long-read collection (LR-021, LR-022) exists in this corpus only as the 2023 bioRxiv
    preprint. Its meta.json and a lookup by exact title both return only the preprint DOI, so no journal
    DOI was available to record; this matches the sibling catalogs file, which uses the same DOI and bibkey
    reese2023encode4. Every ENCODE4 number and figure in the book must still be re-checked against the
    peer-reviewed version.

    '
  why: A preprint number quoted as final would be an auditable error.
- note: 'The GTEx long-read paper (LR-023, LR-024) is likewise preprint-only, again with no journal DOI
    in meta.json or in a title lookup. Bibkey glinos2021transcriptome matches the sibling catalogs file.
    The DUSP13 example and the 0.67 per cent variant-reannotation figure need re-checking against the
    published version.

    '
  why: A preprint number quoted as final would be an auditable error.
- note: 'Two further sources were read as preprints although a journal version exists. For the sQTL proteogenomics
    paper (LR-027) and the cDNA-concatenation method paper (LR-002) the journal DOI came from the corpus
    search listing''s "Published" line, not from meta.json, which carries only the preprint DOI; both
    should be confirmed against the journal record. The CD8 T cell splicing atlas (LR-035) is preprint-only
    with no journal version visible in the corpus.

    '
  why: A DOI taken from a listing line should be confirmed before it reaches references.bib.
- note: 'Recorded conflict inside a single source. Workman et al. L45 (LR-007) states 44 X-linked genes
    were testable and that 23 showed allelic imbalance, which it scores as 95.7 per cent. 23/44 is 52
    per cent; 95.7 per cent corresponds to 22/23. The claim record therefore reports the counts and the
    paper''s own percentage side by side rather than reconciling them. Someone should check the published
    supplement before the book quotes either figure.

    '
  why: Quoting 95.7 per cent unqualified would propagate an internal inconsistency.
- note: 'Not located after targeted searches on splice-site accuracy and spliced alignment error: a base-level
    measurement of splice-site coordinate offsets for PacBio versus ONT against a truth set, inside a
    paper whose purpose is biological rather than tool benchmarking. Han et al. (LR-032, LR-033) report
    detection gaps and quantification bias, and their L27 notes only secondhand that PacBio/ONT splice-site
    disagreement is often small coordinate shifts, citing Mikheenko et al. 2022 - which was not retrieved
    here. The nearest primary records found were LongTron (bio_841a781f7079) and ESPRESSO (PMC9858503),
    both tool papers that the book deliberately does not catalogue.

    '
  why: 'The claim that long-read error profiles shift splice-site calls by a few bases is widely repeated;
    the chapter should anchor it to Mikheenko or drop it.

    '
- note: 'Not located: a quantified rate of internal priming at genomic A-rich tracts in a named long-read
    dataset. LR-014 is the closest - its authors argue against internal priming as the dominant explanation
    - and SQANTI (LR-020) implements an intra-priming filter without reporting how much it removes. Searches
    covered internal priming, intra-priming and off-priming.

    '
  why: 'Internal priming is the artifact most often blamed for spurious novel 3'' ends and the chapter
    will want a number for it.

    '
- note: 'Single-cell long-read records here are deliberately technology-facing (LR-002, LR-019, LR-029,
    LR-030, LR-034, LR-035) because a sibling agent covers single-cell and spatial isoform biology. Joglekar
    et al. 2024 (PMC11156538) is cited in both files on different lines - L43 here, L79 and L97 there
    - with the same bibkey, so the two should be merged at the writing stage rather than cited twice.

    '
  why: Avoids the same paper appearing as two separate references.
- note: 'Still not found: a direct measurement of what fraction of 3'' ends in a named long-read dataset
    are internal-priming products. This extends the existing lead in research/05-long-reads.yml rather
    than closing it. ENCODE4 (bio_ad940b766ccc L112) applies a filter but reports no count of what it
    removed; SQANTI (PMC5848618 L33) offers the discard option with no count. Searched: "internal priming
    oligo-dT A-rich genomic sequence spurious polyadenylation site long-read"; greps for "internal priming|intra.priming"
    over PMC5848618, bio_ad940b766ccc (one hit, L112) and bio_68a8e7ff6c37 (no hits). Unread candidates
    with line-level promise: PolyA_DB v4 PMC12807684, LAPA bio_7e8302226c98, PolyAseqTrap PMC12947541,
    APALORD PMC13601535 and bio_89fd0c8874d6, and the multi-platform single-cell artefact survey bio_15dc9115717c.'
  why: Priority 1 asks for the rate with a denominator in long-read data specifically, and the best numbers
    recorded here come from short-read 3'-end methods.
- note: 'Mikheenko et al. 2022 is still not in this corpus. `paperclip lookup title "Sequencing of individual
    barcoded cDNAs using Pacific Biosciences and Oxford Nanopore Technologies reveals platform-specific
    error patterns and transcriptome complexity"` returns No documents found. Calvo-Roitberg PMC11610588
    L29 reports it secondhand: after filtering to reads within 100 nt of an annotated poly(A) site or
    CAGE peak, 95 per cent of PacBio and ONT reads sharing a UMI had the same 3'' end but only 87 per
    cent had the same 5'' end. That is the cleanest same-molecule 5'' versus 3'' comparison in the literature
    and it cannot be cited from here.'
  why: It would give the 5'/3' asymmetry on identical cDNA molecules, which no source recorded here does,
    and CONTRIBUTING forbids citing a Perspective for it.
- note: 'Three further numbers in Calvo-Roitberg PMC11610588 L27 are secondhand and were deliberately
    not recorded: only 60 per cent of PacBio read starts and ends map to annotated first and last exons
    (Sharon et al. 2013); as few as 7 per cent of reads in a nascent dataset contain the library''s adapters
    (Reimer et al. 2021); and 80 per cent of 3'' ends but only up to 32 per cent of 5'' ends carry the
    correct adapter (Ibrahim et al. 2021). The last was retrieved from the primary and recorded as LR-047.
    Sharon et al. 2013 and Reimer et al. 2021 were not searched for.'
  why: Each is widely repeated and each needs its primary before the chapter can use it.
- note: Recorded conflict between two sources on the same platform. Hoque PMC3560312 L38 states that Helicos
    direct RNA sequencing can still be affected by internal A-rich sequences because oligo(dT) is used
    to fill the poly(A) region before sequencing. Sherstnev PMC3533403 L20 and L44 conclude from the same
    platform that internal priming there is rare or absent, and those authors filtered none of their uniquely
    aligned reads as a result. Both lines were read. LR-042 and LR-044 record Sherstnev's side; no attempt
    was made to reconcile them.
  why: A chapter paragraph that cites one of these for a general statement about direct RNA sequencing
    would be contradicted by the other.
- note: 'Read and verified but not recorded, available without re-reading: TERA-Seq PMC8599856 L65 reports
    that about 60 per cent of capped molecules reach the 5'' end for transcripts under 1 kb, falling to
    about 30 per cent for transcripts over 1.5 kb. The same paper''s L64 reports about 36 per cent of
    HeLa CAGE signals lying close to transcript 5'' ends, which is the orthogonal check on the 29 per
    cent in LR-048. Both were cut to stay inside the record budget.'
  why: Length dependence is the most useful single fact about 5' truncation for a reader deciding whether
    to trust a long transcript's start site.
- note: 'Read and verified but not recorded: SQANTI PMC5848618 L28 also describes how pipelines flag template
    switching, by locating a short direct repeat between the upstream boundary of a non-canonical intron
    and the intron region adjacent to the downstream exon boundary, and attributes the signature to Cocquet
    et al. 2006. Cocquet et al. 2006 was not located in the corpus and was not searched for by title.'
  why: Priority 3 asks how pipelines detect template switching; the detection rule is anchored and ready,
    and its primary is missing.
- note: 'Read but not recorded, on what ribodepletion costs in long reads: PMC13493894 (an rRNA-depleted
    nanopore full-length workflow in yeast) states at L43 that its full-length read N50 of 449 to 517
    bp is lower than previously published full-length studies, attributed to RNA fragmentation during
    rRNA removal, and at L51 that the resulting data are unsuitable for alternative polyadenylation analysis
    because that analysis needs every read to carry a poly(A) tail. L51 also flags off-target RNase H
    cleavage of non-rRNA transcripts as a risk of probe-based depletion.'
  why: Priority 4 asks what changes with ribodepletion, and the honest answer includes two costs that
    neither recorded poly(A)-selection claim covers.
- note: Preprint handling. bio_b5ba09836fdf (LR-052) was read as a bioRxiv preprint; its meta.json carries
