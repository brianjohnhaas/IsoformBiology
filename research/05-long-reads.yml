- note: 'Full text reached for every source in this file; nothing was abstract-only. Two sources were
    read as preprints with no journal version visible in the corpus: bio_fc171bff3556 (LR-066, LR-072),
    DOI 10.64898/2026.10.10.757893. The bioRxiv copy of PMC8997348 also exists as bio_d9ae29e76c25; the
