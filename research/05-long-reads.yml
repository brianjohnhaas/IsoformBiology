  why: Records which anchors need re-checking if a journal version appears.
- note: 'Removed from the claim list only to stay inside the record budget, and verified so it can be
    promoted in one step: TranSigner (PMC12392579) L14 states that when a read is assigned to multiple
    transcripts, tools often do not specify how the read fraction is distributed, which prevents a user
    from ignoring assignments with low read fractions; L34 adds that two of the five tools benchmarked
    record a read as belonging to several transcripts without any fractions, so the benchmarkers split
    such reads evenly themselves, and L35 that two pipelines assigned under 80 per cent of available reads
    while three exceeded 90 per cent. The 19-word span beginning ''when a read is assigned to multiple
    transcripts'' is byte-exact at L14 (paperclip grep -c -F returns 1). Metadata: Hyun Joo Ji; Mihaela
    Pertea, Genome Biology 2025, doi 10.1186/s13059-025-03723-2, suggested bibkey ji2025enhancing.'
  why: A section that explains EM has to say that what a tool reports about an ambiguous read is not standardised,
    or the reader will assume the fractions are always available.
- note: 'Read and verified but not recorded as a claim, so a later pass can lift it without re-reading:
    LongBench (bio_a4290325739b) L14 states that short-read data reported significantly more transcripts
    than long-read data at matched read depth, which those authors attribute to higher ambiguity in isoform
    assignment leading to reads being assigned to reference isoforms not actually expressed in the sample.
    The 24-word span beginning ''due to the higher ambiguity in isoform assignment'' is byte-exact at
    L14 (paperclip grep -c -F returns 1).'
  why: It is the cleanest statement that ambiguous assignment inflates a catalogue, and it is a benchmark
    observation rather than a tool paper's self-assessment.
- note: 'The corpus does not settle whether the short-read non-identifiability result survives truncated
    long reads. A formal result does exist and is recorded as LR-091: rank deficiency of the matrix relating
    abundances to expected counts leaves the maximum-likelihood solution non-unique, and read length enters
    it. What is missing is any derivation of it for reads that are long but truncated from one end, which
    is the actual long-read case; PMC13023374 parametrises its matrix by a single fixed read length (L49,
    L76, L79). Searches run: ''identifiability of transcript abundances from long reads degenerate maximum
    likelihood ambiguous assignment'' and ''minimum read count threshold for calling a novel isoform false
    positive transcripts single read support''. Surfaced but not opened: Zheng, Ma and Kingsford on ranges
    of optimal estimates under non-identifiability (bio_39515ab0703f and PMC8892959, short-read), and
    Fan, Chan and Patro on perplexity without ground truth (PMC8951746). Opened and read: DELongSeq (PMC9985341)
    L13, which uses the information matrix of the EM algorithm to put an uncertainty on each isoform estimate
    rather than to ask whether the estimate is unique; a record on per-isoform uncertainty could be built
    from it without re-reading.'
  why: This is the question the chapter most needs answered, and the honest answer is a quantitative weakening
    plus a formal result derived under an assumption long reads violate.
- note: 'Recorded conflict between two sources on the same question. Soneson et al. (PMC6668388, L40)
    find the mean number of transcripts per read equivalence class almost identical between nanopore and
    Illumina reads. Dong et al. (bio_5ad22e916d23, L31) find assignment-ambiguity over-dispersion between
    1 and 1.15 for every nanopore transcript against more than 3.56 for two-thirds of Illumina transcripts,
    and conclude nanopore far outperforms short reads at assigning reads to transcripts. The two use different
    measures (compatibility-set size versus bootstrap over-dispersion), different mappers (short-read
    quasi-mapping at k=31 versus Salmon bootstraps) and chemistries three years apart. A third source
    sides with Dong: Chen et al. (bio_6924e19b6e9e, L56) report that nanopore long reads cover significantly
    more junctions and that significantly more reads can be uniquely assigned to a transcript than with
    short reads, though the comparison is figure-based with no number on that line. The 22-word span beginning
    ''Nanopore long reads cover significantly more junctions'' is byte-exact at L56 (paperclip grep -c
    -F returns 1), so it can be promoted to a claim without re-reading; note that it was read as a preprint
    whose journal version is 10.1038/s41592-025-02623-4 per the listing line. Both of the first two are
    recorded, attributed, as LR-088 and LR-090; do not average them.'
  why: A chapter that cites only one of these will state the opposite of what the other shows.
- note: 'Further verified lines in sources already cited here, kept out of the claim list only for its
    size: bio_b55d14c66e9f L22 (a minimum read count depends on sequencing depth, so the same threshold
    gives vastly different results across samples) and L127 (the definition of a full-length read class
    as one whose splice junctions are all present in, and compatible with, the transcript); bio_d94acebf6da2
    L20 (on SIRV spike-ins, where every called transcript outside the panel of 69 known SIRV transcripts
    across seven genes is a false positive by construction, the IsoSeq cluster-and-collapse workflow produced
    582 false positives per sample on the four-fold concentration mix against two for Isocall at its default
    filters, L9 and L20); PMC11543605 L121 (mean percentage of ERCC transcripts quantified above zero
    TPM was 33.01 against 82.17 for regular SIRVs) and L117 (tools reported between 28 and 136 SIRV transcripts
    above zero TPM); PMC12346831 L44 (long-read quantification error plateaus at 20 million reads for
    both low- and high-complexity genes, while short-read error plateaus at 60 and 120 million respectively);
    PMC12392579 L35 (two pipelines assigned fewer than 80 per cent of available reads while three exceeded
    90 per cent).'
  why: Each is a number with a line anchor that a deepening pass can use without a second research pass.
- note: 'Not anchored: a transcript-count ladder showing how many transcripts survive at one, two and
    three supporting reads with a common denominator. No single source in the corpus gives it. The nearest
    are bio_e8d1d5ea6ea9 L35 (5, 10 and 20 read filters, described as a progressive reduction without
    counts on that line) and bio_d94acebf6da2 L29 (a hard default of three reads). Searches run: ''effect
    of requiring two or three supporting long reads on number of transcripts detected singleton read isoforms
    filtering''. A boolean corpus grep was attempted as paperclip grep --bool ''"at least two reads" AND
    "at least three reads"'' /papers/ --from 2015 and failed with ''results not found: 2015'', because
    --from takes a result-set id rather than a year in this build. Retried without it, the grep matched
    seven documents (result set s_1536d187); six are unrelated (duplex consensus calling, hashtag demultiplexing,
    circRNA filters, consensus pileups, structural variants, repeat genes) and the seventh is PMC13702348,
    described in the last lead.'
  why: The chapter promises read support thresholds and a ladder with one denominator is the figure that
    section wants.
- note: Conflict of interest observed. The corpus contains bio_1e10d9ed6e09, the LRAA preprint, written
    by the person directing this book. It was surfaced by two of the searches run here and deliberately
    not read, not cited and not used as an example; no claim in this file is anchored to it.
  why: The quantification section is exactly where a tool the author wrote could be given undue weight.
