leads:
- note: 'The ENCODE4 long-read collection (LR-021, LR-022) exists in this corpus only as the 2023 bioRxiv
    preprint. Its meta.json and a lookup by exact title both return only the preprint DOI, so no journal
    DOI was available to record; this matches the sibling catalogs file, which uses the same DOI and bibkey
    reese2023encode4. Every ENCODE4 number and figure in the book must still be re-checked against the
    peer-reviewed version.

    '
  why: A preprint number quoted as final would be an auditable error.
- note: 'The GTEx long-read paper (LR-023, LR-024) is likewise preprint-only, again with no journal DOI
    in meta.json or in a title lookup. Bibkey glinos2021transcriptome matches the sibling catalogs file.
    The DUSP13 example and the 0.67 per cent variant-reannotation figure need re-checking against the
    published version.

    '
  why: A preprint number quoted as final would be an auditable error.
- note: 'Two further sources were read as preprints although a journal version exists. For the sQTL proteogenomics
    paper (LR-027) and the cDNA-concatenation method paper (LR-002) the journal DOI came from the corpus
    search listing''s "Published" line, not from meta.json, which carries only the preprint DOI; both
    should be confirmed against the journal record. The CD8 T cell splicing atlas (LR-035) is preprint-only
    with no journal version visible in the corpus.

    '
  why: A DOI taken from a listing line should be confirmed before it reaches references.bib.
- note: 'Recorded conflict inside a single source. Workman et al. L45 (LR-007) states 44 X-linked genes
    were testable and that 23 showed allelic imbalance, which it scores as 95.7 per cent. 23/44 is 52
    per cent; 95.7 per cent corresponds to 22/23. The claim record therefore reports the counts and the
    paper''s own percentage side by side rather than reconciling them. Someone should check the published
    supplement before the book quotes either figure.

    '
  why: Quoting 95.7 per cent unqualified would propagate an internal inconsistency.
- note: 'Not located after targeted searches on splice-site accuracy and spliced alignment error: a base-level
    measurement of splice-site coordinate offsets for PacBio versus ONT against a truth set, inside a
    paper whose purpose is biological rather than tool benchmarking. Han et al. (LR-032, LR-033) report
    detection gaps and quantification bias, and their L27 notes only secondhand that PacBio/ONT splice-site
    disagreement is often small coordinate shifts, citing Mikheenko et al. 2022 - which was not retrieved
    here. The nearest primary records found were LongTron (bio_841a781f7079) and ESPRESSO (PMC9858503),
    both tool papers that the book deliberately does not catalogue.

    '
  why: 'The claim that long-read error profiles shift splice-site calls by a few bases is widely repeated;
    the chapter should anchor it to Mikheenko or drop it.

    '
- note: 'Not located: a quantified rate of internal priming at genomic A-rich tracts in a named long-read
    dataset. LR-014 is the closest - its authors argue against internal priming as the dominant explanation
    - and SQANTI (LR-020) implements an intra-priming filter without reporting how much it removes. Searches
    covered internal priming, intra-priming and off-priming.

    '
  why: 'Internal priming is the artifact most often blamed for spurious novel 3'' ends and the chapter
    will want a number for it.

    '
- note: 'Single-cell long-read records here are deliberately technology-facing (LR-002, LR-019, LR-029,
    LR-030, LR-034, LR-035) because a sibling agent covers single-cell and spatial isoform biology. Joglekar
    et al. 2024 (PMC11156538) is cited in both files on different lines - L43 here, L79 and L97 there
    - with the same bibkey, so the two should be merged at the writing stage rather than cited twice.

    '
  why: Avoids the same paper appearing as two separate references.
