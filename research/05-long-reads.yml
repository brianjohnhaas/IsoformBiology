    RNA reading as artefact-free.'
  why: The existing prose implies a clean control, and a reader who takes that literally will mis-trust
    a direct-RNA chimera as biology.
- note: 'No primary per-base accuracy measurement for current PacBio cDNA chemistry was found. Searched
    "Iso-Seq HiFi read accuracy transcriptome Revio median read quality Q30 full-length transcripts human"
    on -s papers, and corpus greps for "Kinnex[^.]{0,140}(accurac|identit|Q[0-9]{2}|read length|full-length)"
    and "(Iso-Seq|Kinnex|HiFi)[^.]{0,120}(median (read )?(accuracy|quality|identity) |99\.[0-9]%|Q30)".
    Also greped "LongBench" (the benchmark cohort Paniagua names at L10) and "SG-?NEx[^.]{0,140}(accurac|identit|error)",
    which returned natural-language-processing benchmarks and nothing respectively, and opened bio_3dde5de16cc0
    and bio_6d09c3676c8b, neither of which gives a per-platform cDNA accuracy figure; the first does report
    nanopore direct-RNA mean Phred rising from Q17.5 to Q31.7 between runs on a bacterium with a newer
    basecaller (L104). Every other numeric hit was genomic DNA, a review, or an arXiv false positive.
    The only PacBio cDNA accuracy figure anchored in this file is Volden 2018''s 98.9 per cent median
    on a Sequel (LR-070), which is two instrument generations old. The chapter must not present it as
    current.

    '
  why: 'A section that names RNA004 at 98.67 per cent and PacBio at 98.9 per cent from 2018 invites the
    reader to conclude the platforms have converged, which neither source supports.

    '
- note: 'No duplex yield or accuracy figure from a cDNA or direct-RNA library was located. LR-073 uses
    SARS-CoV-2 amplicon DNA on R10.4 as a stand-in, anchored on its measured 3.33 per cent duplex fraction
