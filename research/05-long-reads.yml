    one PromethION device: L106 states the design, L108 that RNA004 gave higher yields for every matched-composition
    sample, and L109 that HEK293T libraries reached about 17.3 and 21.94 Gb with more than 18 million
    reads on RNA004 while the same samples on RNA002 yielded under 35 per cent of that throughput and
    fewer than 7 million reads. That is the device-controlled version of the throughput claim and should
    replace or accompany LR-078 if the section needs a clean comparison.

    '
  why: 'PLT-019 changes device, kit and basecaller at once; this source changes only the kit.

    '
- note: 'Conflict, recorded not resolved. RNA004 direct-RNA accuracy is 93.5 per cent in PMC11134706 L89
    (synthetic curlcake RNA, Dorado 0.4.3, rna004_130bps_sup@v3.0.1) and 98.67 per cent median alignment
    identity in PMC13251006 L27 (GM12878 poly(A) RNA, Dorado v1.0, reads with 200 or more aligned bases).
    Both are anchored here as LR-080 and LR-077. A third figure, "median read accuracy 93.5%", is repeated
    secondhand in the review PMC13634186 alongside "98.67%" attributed to a different source, so the two
    numbers are already circulating as though they measured the same thing.

    '
  why: 'Any table in the chapter putting a PacBio figure beside an ONT figure has to state the sample,
    the metric and the basecaller, or it will read as an error.

    '
- note: 'Read but not anchored, available without re-reading. PMC5848618 L50 gives RT-PCR validation rates
    for the mouse neural PacBio transcriptome - 23 of 23 known-structure transcripts amplified against
    6 of 30 with novel junction combinations - and L49 describes the three PCR conditions used. This is
    the strongest single counter-evidence record on novel long-read structures in the corpus and was left
    out only because tardaguila2018sqanti already carries two lines in this chapter.

    '
  why: 'It converts "novel junctions need filtering" from an assertion into a measured validation rate.

    '
- note: 'Read but not anchored, dropped at 22 records. PMC6776680 L29 (Wenger 2019): of the residual discordances
    between PacBio circular consensus reads and the GIAB HG002 benchmark, 92.0 per cent are indels in
    homopolymers, 4.6 per cent indels outside homopolymers and 3.4 per cent mismatches, which works out
    to one mismatch every 13,048 bases. It is the cleanest statement that a consensus read''s remaining
    errors are exactly the class that moves an aligned splice junction by a base, and it is genomic DNA,
    so it needs that caveat.

    '
  why: 'Pairs with PLT-002 to say what kind of error survives each platform''s consensus step.

    '
- note: 'Read but not anchored. PMC6797730 L95 and L97 (Sessegolo 2019): on spike-ins, nanopore native-RNA
    quantification was the most accurate of the protocols tested and slightly better than Illumina TruSeq,
    while only 70 per cent of native-RNA reads could be assigned to a single transcript and 30 per cent
    remained ambiguous. Both are counter-evidence the chapter wants - a lower-accuracy platform winning
    on quantification, and read length not guaranteeing unambiguous assignment - and both sit on R9.4.1
    chemistry.

    '
  why: 'The chapter''s framing is that a long read reports a molecule; a third of these reads could not
    be attributed to one transcript.

    '
- note: 'Read but not anchored. PMC11543605 L115 (LRGASP) attributes the poor quantification performance
    of direct-RNA libraries to throughput below one million reads per replicate, and L60 states plainly
    that long-read quantification tools lag short-read tools because of throughput and error. L118 reports
    that on simulated data tools performed markedly better on PacBio than on ONT.

    '
  why: Three separate priority-5 claims from a source already in the bibliography.
- note: 'Read but not anchored. bio_fc171bff3556 L12 (Paniagua 2026, preprint): hierarchical clustering
    of per-transcript coverage shows distinct clusters of long transcripts covered only at their 5'' or
    only at their 3'' end in both PacBio and ONT cDNA, so the shortfall in full-length reads is partial
    molecules rather than uniformly thin coverage. L18 and L43 add that PacBio length bias peaks at 1.5
    to 2 kb while ONT shows monotonic length-dependent decay.

    '
  why: 'This is the mechanism behind the chapter''s existing LRGASP figure on reads not reaching median
    transcript length, and it is platform-specific in a way the chapter currently cannot say.

    '
- note: 'Read but not anchored. PMC13647511 L19 and L26 (Lane 2026): median read length about 800 bp for
    RNA004 direct RNA against about 500 bp for SQK-PCB114 PCR-cDNA across six libraries per protocol,
    with PCR-cDNA strongly skewed to isoforms under 1,000 bp. Dropped only to keep the file inside the
    record budget; it is the one current-chemistry read-length comparison of the two ONT protocols in
    this corpus.

    '
  why: Pairs with PLT-007 to give the ONT half of the read-length picture on current chemistry.
- note: 'Not located: a measurement of how often a one- or two-base splice-site shift changes a downstream
    biological conclusion, as opposed to changing a transcript model. PMC8997348 L53 and L63 evaluate
    splice-site correction by its effect on transcript discovery with StringTie2 on simulated reads, not
    by its effect on any biological readout. Searched the corpus for splice-site accuracy against truth
    sets and found only tool papers.

    '
  why: 'The chapter wants to say which of its claims depend on base-exact junctions. Nothing in the corpus
    answers that directly, so the section should state the dependency qualitatively and stop.

