- note: 'A tension the chapter will have to handle rather than a conflict between sources. Chapter 5''s
    #sec-artifacts currently uses direct RNA sequencing as the control that shows an RT-dependent event
    to be artefactual, citing schulz2021direct. LR-056 and LR-057 show that nanopore direct RNA sequencing
