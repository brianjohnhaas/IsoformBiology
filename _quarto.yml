project:
  type: book
  output-dir: _book

book:
  title: "Isoform Biology"
  date: today
  search: true
  repo-url: https://github.com/brianjohnhaas/IsoformBiology
  repo-actions: [edit, issue]
  sidebar:
    style: docked
  # Reading order is defined HERE, not by filename. Filename numbers reflect
  # the order chapters were added, so they can diverge from reading order.
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - chapters/01-foundations.qmd
    - part: "Isoform biology across the tree of life"
      chapters:
        - chapters/02-animals.qmd
        - chapters/03-plants-fungi-other.qmd
    - part: "Seeing isoforms"
      chapters:
        - chapters/04-technology-arc.qmd
        - chapters/05-long-reads.qmd
    - part: "What the catalogues contain"
      chapters:
        - chapters/09-catalogs.qmd
    - part: "Resolving cells and tissues"
      chapters:
        - chapters/08-singlecell-spatial.qmd
    - part: "From transcript to protein"
      chapters:
        - chapters/11-transcript-to-protein.qmd
    - part: "Reading function from variation"
      chapters:
        - chapters/10-variants-qtl.qmd
    - part: "Isoforms in disease"
      chapters:
        - chapters/06-cancer.qmd
        - chapters/07-neuro-mendelian.qmd
    - part: "Targeting isoforms"
      chapters:
        - chapters/12-proteoforms-drugs.qmd
    - part: "Taking stock"
      chapters:
        - chapters/13-accounting.qmd
    - chapters/99-glossary.qmd
    - part: "Walkthroughs"
      chapters:
        - walkthroughs/index.qmd
        - walkthroughs/intron-chain-comparison.qmd
    - references.qmd

bibliography: references.bib
csl: nature.csl

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    number-sections: true
    toc-depth: 3
    code-fold: true
    fig-cap-location: bottom
