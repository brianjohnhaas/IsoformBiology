name: Render and publish book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.11.9

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install figure dependencies
        run: pip install matplotlib jupyter pyyaml

      - name: Check prose against recorded source quotes
        run: python3 scripts/check_overlap.py

      - name: Check bibliography is in sync with claim records
        run: python3 scripts/build_bib.py --check

      - name: Check cited numbers against claim records
        run: python3 scripts/check_citations.py

      - name: Check every figure is recorded with its provenance
        run: python3 scripts/check_figures.py

      - name: Check prose style
        run: python3 scripts/check_style.py

      - name: Render book
        run: quarto render --to html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
