# Every figure in the book is recorded here with its provenance route.
#   generated  - produced by a script in scripts/ (ours)
#   original   - hand-authored SVG (ours); credit the concept if it came from a paper
#   reused     - openly licensed third-party; licence + attribution REQUIRED
figures:
  - path: figures/dscam-combinatorics.svg
    dark: figures/dscam-combinatorics-dark.svg
    route: generated
    script: scripts/fig_dscam_combinatorics.py
    chapter: chapters/02-animals.qmd
    data_source: research/02-animals.yml (ANM-001, ANM-005, ANM-007)
    palette: dataviz reference instance, categorical slots 1-3 + neutral
    palette_validated: "both modes pass all six checks"
    note: >
      Original. Not traced from or redrawn after any published figure. The
      transmembrane exon is deliberately neutral rather than a categorical hue,
      since it is a binary choice rather than a variable cluster.

  - path: figures/dge-dtu-dte.svg
    dark: figures/dge-dtu-dte-dark.svg
    route: generated
    script: scripts/fig_dge_dtu_dte.py
    chapter: chapters/01-foundations.qmd
    data_source: research/01-foundations.yml (FND-028, with FND-029)
    palette: dataviz reference instance, categorical slots 1-2
    palette_validated: "both modes pass all six checks under --pairs all"
    note: >
      Original. The abundances in the bars are illustrative round numbers
      chosen to make each case unambiguous, not measurements, and the chapter
      does not cite them as data.

  - path: figures/fungal-as-ladder.svg
    dark: figures/fungal-as-ladder-dark.svg
    route: generated
    script: scripts/fig_fungal_as_ladder.py
    chapter: chapters/03-plants-fungi-other.qmd
    data_source: research/03-plants-fungi-other.yml (PFO-021)
    palette: dataviz reference instance, single categorical hue (slot 1)
    palette_validated: "single series; contrast against both surfaces checked"
    note: >
      Original. All four rates come from one comparative study using one
      method, which is the only reason they share an axis; the caption says so,
      because PFO-031 is the reason it has to. Habit labels are given only for
      the groups the study itself describes.

  - path: figures/prevalence-estimates.svg
    dark: figures/prevalence-estimates-dark.svg
    route: generated
    script: scripts/fig_prevalence_estimates.py
    chapter: chapters/04-technology-arc.qmd
    data_source: >
      research/04-technology-arc.yml (TECH-010, TECH-011, TECH-012, TECH-013,
      TECH-015, TECH-023, TECH-025, TECH-026)
    palette: dataviz reference instance, categorical slots 1-3 by assay family
    palette_validated: "both modes pass all six checks under --pairs all"
    note: >
      Original. Each row carries its denominator because the values are not
      comparable without it. The spread is the subject; reading the column as a
      trend reads nine questions as one.

  - path: figures/three-axes.svg
    dark: figures/three-axes-dark.svg
    route: generated
    script: scripts/fig_three_axes.py
    chapter: chapters/05-long-reads.qmd
    data_source: research/05-long-reads.yml (LR-021, LR-022)
    palette: dataviz reference instance, slot 1 plus the neutral for the baseline
    palette_validated: "two bands, directly labelled; contrast checked in both modes"
    note: >
      Original schematic. The exon structure is illustrative and is not a real
      locus. Drawn first as a fan of end positions, which did not read, then
      redrawn as stacked transcript models with the shared intron chain shaded.

  - path: figures/neoantigen-recurrence.svg
    dark: figures/neoantigen-recurrence-dark.svg
    route: generated
    script: scripts/fig_neoantigen_recurrence.py
    chapter: chapters/06-cancer.qmd
    data_source: research/06-cancer.yml (CAN-027, CAN-030)
    palette: dataviz reference instance, slots 1-2 left, slot 1 plus neutral right
    palette_validated: "both modes pass all six checks under --pairs all"
    note: >
      Original. The left panel uses a log axis, which the script's docstring
      justifies: the quantities differ by more than three orders of magnitude,
      both bars carry direct value labels, and a linear axis would hide the 13
      entirely. The right panel is the deflation and is deliberately the same
      size as the claim.

  - path: figures/unc13a-specificity.svg
    dark: figures/unc13a-specificity-dark.svg
    route: generated
    script: scripts/fig_unc13a_specificity.py
    chapter: chapters/07-neuro-mendelian.qmd
    data_source: research/07-neuro-mendelian.yml (NEU-011)
    palette: dataviz reference instance, slot 1 plus the neutral
    palette_validated: "two bands, directly labelled; contrast checked in both modes"
    note: >
      Original. Groups with no detections are drawn as labelled zero rows
      rather than omitted, because a chart of the two positive bars would say
      the exon marks neurodegeneration when the finding is that it marks
      TDP-43 pathology specifically.

  - path: figures/within-cell-isoform.svg
    dark: figures/within-cell-isoform-dark.svg
    route: generated
    script: scripts/fig_within_cell_isoform.py
    chapter: chapters/08-singlecell-spatial.qmd
    data_source: research/08-singlecell-spatial.yml (SCS-009 through SCS-014)
    palette: dataviz reference instance, slot 1 with the neutral for the reference line
    palette_validated: "one series per panel; contrast checked in both modes"
    note: >
      Original. The three distributions are illustrative rather than measured,
      which the docstring and the caption both state. They exist to establish
      that the question is real, since all three return the same bulk value.

  - path: figures/representative-transcript.svg
    dark: figures/representative-transcript-dark.svg
    route: generated
    script: scripts/fig_representative_transcript.py
    chapter: chapters/09-catalogs.qmd
    data_source: research/09-catalogs.yml (CAT-023)
    palette: dataviz reference instance, slot 1 plus the neutral
    palette_validated: "two bands, directly labelled; contrast checked in both modes"
    note: >
      Original. The caveat that the four rates come from different gene subsets
      is on the figure itself, not only in the caption, because the chart
      otherwise invites a precision it does not have.

  - path: figures/coloc-gap.svg
    dark: figures/coloc-gap-dark.svg
    route: generated
    script: scripts/fig_coloc_gap.py
    chapter: chapters/10-variants-qtl.qmd
    data_source: research/10-variants-qtl.yml (VAR-001, VAR-002, VAR-004)
    palette: dataviz reference instance, categorical slots 1-2
    palette_validated: "both modes pass all six checks under --pairs all"
    note: >
      Original. The eQTL and sQTL bars are side by side rather than stacked
      because the overlap between them was never reported. The middle funnel
      bar is hatched because its value is a bound, "more than nine in ten",
      rather than a count.

  - path: figures/mechanism-by-region.svg
    dark: figures/mechanism-by-region-dark.svg
    route: generated
    script: scripts/fig_mechanism_by_region.py
    chapter: chapters/11-transcript-to-protein.qmd
    data_source: research/11-transcript-to-protein.yml (PRO-001, PRO-003, PRO-004)
    palette: dataviz reference instance, categorical slot 1 only
    palette_validated: "both modes pass all six checks"
    note: >
      Original. Not traced from or redrawn after any published figure. The
      denominator differs per row and is named beside each bar, because the
      three percentages are shares of three different populations. No residual
      category is drawn, since the source does not state one.

  - path: figures/translated-denominator.svg
    dark: figures/translated-denominator-dark.svg
    route: generated
    script: scripts/fig_translated_denominator.py
    chapter: chapters/11-transcript-to-protein.qmd
    data_source: research/11-transcript-to-protein.yml (PRO-035, PRO-036)
    palette: dataviz reference instance, categorical slot 1 only
    palette_validated: "both modes pass all six checks"
    note: >
      Original. Two bars and no connecting curve: the source gives two values
      and no intermediate points, so interpolating between them would invent
      data. The figure exists because the same result is quoted both ways.

  - path: figures/rps24-microexons.svg
    dark: figures/rps24-microexons-dark.svg
    route: generated
    script: scripts/fig_rps24_microexons.py
    chapter: chapters/11-transcript-to-protein.qmd
    data_source: research/11-transcript-to-protein.yml (PRO-040, PRO-041, PRO-052)
    palette: dataviz reference instance, categorical slot 1 + neutral
    palette_validated: "both modes pass all six checks"
    note: >
      Original. The microexons are at true relative scale to each other; the
      constitutive exons are drawn broken because their lengths were not read.
      Deliberately NO line connects an exon combination to a protein end: the
      sources use mutually inconsistent naming schemes and the published
      reconciliation is itself inconsistent, so asserting a mapping would be
      unsupported. Terminal residue counts come from the published isoform
      names.

  - path: figures/proteoform-scale.svg
    dark: figures/proteoform-scale-dark.svg
    route: generated
    script: scripts/fig_proteoform_scale.py
    chapter: chapters/12-proteoforms-drugs.qmd
    data_source: research/12-proteoforms-drugs.yml (DRG-001, DRG-011)
    palette: dataviz reference instance, categorical slot 1 + neutral band
    palette_validated: "both modes pass all six checks"
    note: >
      Original. The measured quantity is a band spanning one decade rather than
      a point, because the source says only "thousands". Log axis, since the
      quantities span five orders of magnitude.

  - path: figures/cldn18-isoform-target.svg
    dark: figures/cldn18-isoform-target-dark.svg
    route: generated
    script: scripts/fig_cldn18_isoform_target.py
    chapter: chapters/12-proteoforms-drugs.qmd
    data_source: research/12-proteoforms-drugs.yml (DRG-020, DRG-022)
    palette: dataviz reference instance, categorical slots 1 and 2 + neutral
    palette_validated: "both modes pass all six checks; slots 1 and 2 only, because slots 2 and 3 fall to tritan dE 4.0 against the dark surface"
    note: >
      Original schematic. Exon count, exon sizes and the proportions of the
      protein bar are illustrative. The sources give the identity of the
      differing regions, not their lengths, so nothing here should be measured.
